<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Explore cryptography through clear definitions, optimized algorithms, worked examples, and interactive labs.">
  <title>Cipher Praxis — A Dilate Cryptography Knowledge Base</title>
  <!-- Social share card (LinkedIn, X, Slack). One shell serves every route, so every link shows this card. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cipher Praxis">
  <meta property="og:title" content="Cipher Praxis — A Dilate Cryptography Knowledge Base">
  <meta property="og:description" content="Explore how ciphers protect information, how cryptanalysis tests their limits, and what the evidence supports.">
  <meta property="og:image" content="https://praxis.dilate.co.ke/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:image:alt" content="Cipher Praxis. The science of keeping secrets. A security shield connects through smaller locks to a message.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cipher Praxis — A Dilate Cryptography Knowledge Base">
  <meta name="twitter:description" content="Explore how ciphers protect information, how cryptanalysis tests their limits, and what the evidence supports.">
  <meta name="twitter:image" content="https://praxis.dilate.co.ke/og.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Adamina&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="modulepreload" href="/pkg/praxis.js">
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot-mark" aria-hidden="true"></div>
    <div class="boot-text mono">Loading Cipher Praxis…</div>
    <p class="boot-note" hidden></p>
    <button class="btn boot-retry" type="button" hidden>Try again</button>
    <noscript><p class="boot-noscript">Turn on JavaScript and WebAssembly to use Cipher Praxis.</p></noscript>
  </div>
  <script type="module">
    const boot = document.getElementById('boot');
    const text = boot.querySelector('.boot-text');
    const note = boot.querySelector('.boot-note');
    const retry = boot.querySelector('.boot-retry');
    let initialized = false;

    retry.addEventListener('click', () => window.location.reload());

    function showFailure() {
      clearTimeout(slowLoad);
      boot.classList.add('boot-failed');
      text.textContent = 'Cipher Praxis could not load';
      note.textContent = 'Check your connection and try again.';
      note.hidden = false;
      retry.hidden = false;
    }

    // Routes render asynchronously, after init() can resolve. Keep the loading screen
    // and error handlers until the first page actually mounts, including deep links.
    function finishWhenReady() {
      if (!initialized || !document.querySelector('#main h1')) return;
      clearTimeout(slowLoad);
      observer.disconnect();
      window.removeEventListener('error', showFailure);
      window.removeEventListener('unhandledrejection', showFailure);
      boot.remove();
    }

    const observer = new MutationObserver(finishWhenReady);
    observer.observe(document.body, { childList: true, subtree: true });
    window.addEventListener('error', showFailure);
    window.addEventListener('unhandledrejection', showFailure);
    const slowLoad = setTimeout(() => {
      text.textContent = 'Still loading Cipher Praxis…';
      note.textContent = 'Loading is taking longer than expected. You can wait or try again.';
      note.hidden = false;
      retry.hidden = false;
    }, 15000);

    try {
      // Dynamic import lets the same recovery UI handle a failed module download.
      // The build fingerprints both URLs, so a cached WASM file cannot cross releases.
      const { default: init } = await import('/pkg/praxis.js');
      await init({ module_or_path: '/pkg/praxis_bg.wasm' });
      initialized = true;
      finishWhenReady();
    } catch (err) {
      showFailure();
      console.error('Cipher Praxis startup failed', err);
    }
  </script>
</body>
</html>
