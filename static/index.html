  <meta property="og:description" content="Cipher systems, the math behind them, how they break, and the checks that make results trustworthy. Every entry carries a status and its evidence; the labs run in your browser.">

  <link rel="modulepreload" href="/pkg/praxis.js">
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot-mark" aria-hidden="true"></div>
    <div class="boot-text mono">Loading Cipher Praxis in your browser…</div>
    <noscript><p class="boot-noscript">Turn on JavaScript and WebAssembly to use Cipher Praxis in your browser.</p></noscript>
  </div>
  <script type="module">
    import init from '/pkg/praxis.js';
    init().then(() => {
      const b = document.getElementById('boot');
      if (b) b.remove();
    }).catch((err) => {
      const t = document.querySelector('.boot-text');
      if (t) t.textContent = 'Cipher Praxis could not load: ' + err;
      console.error(err);
    });
  </script>
</body>
