<!doctype html>
<!-- Source of static/og.png: render at 1200 × 630 CSS pixels with device scale 2.
     The illustration is shared with the overview. Use a headless browser for export. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Adamina&family=DM+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: "Geist", system-ui, sans-serif; color: #000020; background: #fff; -webkit-font-smoothing: antialiased; }
    .card { position: relative; width: 1200px; height: 630px; border-top: 3px solid #0454ff; }
    .brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; }
    .brand strong { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.03em; line-height: 1.2; }
    .brand small { display: block; margin-top: 3px; color: #626779; font-family: "DM Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .eyebrow { position: absolute; left: 64px; top: 159px; color: #0a3fbf; font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    h1 { position: absolute; left: 62px; top: 206px; margin: 0; font-size: 60px; font-weight: 600; line-height: 1.1; letter-spacing: -.04em; }
    h1 em { font-family: "Adamina", Georgia, serif; font-size: 56px; font-style: normal; font-weight: 400; color: #0a3fbf; letter-spacing: -.03em; }
    .lede { position: absolute; left: 64px; top: 364px; width: 493px; margin: 0; font-size: 19px; line-height: 1.65; color: #565b6e; }
    .url { position: absolute; left: 64px; bottom: 49px; font-family: "DM Mono", monospace; font-size: 14px; color: #626779; }
    .visual { position: absolute; right: 58px; top: 135px; width: 579px; height: auto; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../static/favicon.svg" width="38" height="38" alt=""><div><strong>Cipher Praxis</strong><small>Cryptography knowledge base</small></div></div>
    <p class="eyebrow">A field guide to cryptography</p>
    <h1>The science of<br><em>keeping secrets.</em></h1>
    <p class="lede">Explore how ciphers protect information, how cryptanalysis tests their limits, and what the mathematical evidence supports.</p>
    <p class="url">praxis.dilate.co.ke</p>
    <img class="visual" src="../static/security-hero.svg" alt="A security shield connects through smaller locks to a message.">
  </div>
</body>
</html>
