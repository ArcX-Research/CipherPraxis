id = "label-free-collision-geometry"
section = "statistics"
title = "Label-free collision geometry"
subtitle = "Rank schedules using symbol and adjacent-pair equality without fitting a substitution"
status = "VERIFIED"
status_note = "The monogram and adjacent-pair expectation identities and exhaustive score calculations are verified under their stated independence assumptions. Pair counts recover structured, uniform-marginal examples missed by monograms, but periodic nonlanguage defeats both: these are proposal statistics, not language tests."
family = "Permutation-invariant statistics"
tags = ["collision counts", "unknown substitution", "schedule recovery", "histograms", "invariants"]
related = ["index-of-coincidence", "coincidence-lag-profile", "observable-function-fingerprinting", "permutation-test", "family-wise-null", "parameter-versus-plaintext-recovery", "alternating-velocity-disk-cipher", "piecewise-constant-velocity-disk-cipher", "valid-model-nulls", "conditional-language-evidence"]
summary = "An unknown monoalphabetic substitution preserves equality of symbols and of ordered symbol pairs. Undo a candidate position schedule, then count collisions without naming the latent letters. Single-letter counts use uneven frequencies; adjacent-pair counts can also exploit order when individual letter frequencies are flat. Both need matched controls and explicit failure cases before selecting candidates for a language solver."
updated = "2026-09-06"

[[blocks]]
kind = "definition"
body = '''
Let a candidate schedule $\theta$ undo the known form of position-dependent motion but leave an unknown substitution unfitted. The resulting symbols are $U_i(\theta)$. Because a substitution is a bijection,

$$U_i=U_j$$

is unchanged by any global relabelling of the alphabet. A label-free score may therefore count collisions over all ordered pairs,

$$S_{\rm all}(\theta)=\sum_{i\ne j}[U_i(\theta)=U_j(\theta)],$$

or only over pairs connected by a declared block graph, such as positions in different quarters.
'''

[[blocks]]
kind = "equations"
title = "Why the true schedule wins in expectation"
body = '''
Assume independent plaintext symbols with one stationary probability vector $p$. Under a candidate schedule, position $i$ has marginal vector $p_i$, which is a permutation of $p$, so $\lVert p_i\rVert=\lVert p\rVert$. For two positions,

$$\Pr(U_i=U_j)=\langle p_i,p_j\rangle
=\lVert p\rVert^2-\frac12\lVert p_i-p_j\rVert^2.$$

The expected loss against the true aligned schedule is therefore

$$\mathbb E[S_{\rm true}-S(\theta)]
=\frac12\sum_{i\ne j}\lVert p_i-p_j\rVert^2\ge0.$$

For a restricted pair graph, use the same sum over its edges. If that graph is connected, equality again requires one common marginal, apart from relabellings among letters with equal probabilities.
'''

[[blocks]]
kind = "equations"
title = "Order-sensitive collisions and exact phase tables"
body = '''
Let $H_r(a,b)$ count internal adjacent pairs in peeled block $r$. The cross-block ordered-pair score is

$$J_2=\sum_{r<s}\sum_{a,b}H_r(a,b)H_s(a,b).$$

Assume independent blocks whose internal pairs have one stationary joint distribution $Q$. Position-wise bijections permute its entries, giving pair vectors $Q_i$ of equal norm. Then

$$\mathbb E[J_2(\mathrm{true})-J_2(\theta)]
=\frac12\sum_{i,j\text{ in different blocks}}\lVert Q_i-Q_j\rVert^2\ge0,$$

counting each cross-block pair once. Uniform letter marginals need not make $Q$ uniform. A noncirculant doubly-stochastic Markov chain can carry information invisible to monograms. This proof allows dependence within blocks, but does not automatically apply to consecutive dependent prose blocks.

For a continuous block-velocity schedule, let $H_{r,d}(a,b)$ be the pair histogram after local drift is removed but before the block's starting phase is subtracted. Precompute

$$E_{r,s}(u,v,\delta)=\sum_{a,b}H_{r,u}(a,b)H_{s,v}(a+\delta,b+\delta).$$

Use $\delta=\phi_s-\phi_r$, where $\phi_r=L\sum_{k<r}d_k$. Only $m/\gcd(L,m)$ phases occur over $m$ coordinates. For four blocks, six table lookups give the exact score after precomputation. Shift both pair endpoints and retain continuous phase carry; resetting a block changes the cipher model.
'''

[[blocks]]
kind = "equations"
title = "Count population-score ties exactly"
body = '''
For a stationary pair law $Q$ over $m$ coordinates, define its translation stabilizer

$$H=\{(h,k):Q(a+h,b+k)=Q(a,b)\text{ for all }a,b\},$$

and subgroups $D=\{s:(s,s)\in H\}$, $V=\{s:(0,s)\in H\}$ and $W=D\cap V$. Fix one outer coordinate order and the initial phase gauge. With $b\ge2$ independent blocks, each at least three symbols long, a velocity-error vector ties the true expected pair-collision score exactly when

$$s_0\in D,\qquad s_r-s_0\in W\quad(r>0).$$

The exact count is $|D|\,|W|^{b-1}$. Consecutive internal pairs force each $s_r$ into $D$. Every accumulated boundary phase is then in $D$, so cross-block agreement reduces to the vertical condition in $V$. Unequal block lengths do not alter this count while all lengths remain at least three.

For a permutation-plus-uniform transition law the vertical subgroup is trivial. Only common velocity offsets survive, namely translations commuting with the transition permutation. A noncirculant permutation may still commute with a proper rotation subgroup. These are equalities of population expectations, not identical finite-text scores or [latent equality patterns](/algebra/latent-label-identifiability).
'''

[[blocks]]
kind = "equations"
title = "Cross-text pair counts along coincidence diagonals"
body = '''
For strings $A,B$ and a declared period $p$, let $N_A(g,r,x,y)$ count valid starts $i$ with $i\bmod p=r$ and $(A_i,A_{i+g})=(x,y)$. Define $N_B$ similarly. A fixed weighted cross-text pair score is

$$T_d=\sum_{g\ge1}w_g\sum_{r,x,y}N_A(g,r,x,y)N_B(g,r-d,x,y).$$

Form the coincidence matrix $M(i,j)=[A_i=B_j]$. Expanding the histogram product shows that it counts $M(i,j)M(i+g,j+g)$ with $i-j=d\bmod p$. Both endpoints lie on the same diagonal $k=j-i$. If $x_k[h]$ lists that diagonal's bits, then

$$T_d=\sum_{k\equiv-d\; (\mathrm{mod}\ p)}\sum_{g\ge1}w_g\sum_h x_k[h]x_k[h+g],$$

with all sums truncated at valid endpoints. This identity needs no language or independence assumption. When each diagonal fits in one unsigned machine word $B_k$, its lag count is exactly $\operatorname{popcount}(B_k\mathbin{\&}(B_k\gg g))$. Integer-scaled rational weights preserve every score and phase tie; floating tolerances need not. The operation count must include all declared lags, and the one-word bound does not apply to arbitrarily long strings.

With equal weights over consecutive lags, rolling counts give a linear pass over each diagonal. With all positive lags equally weighted, the diagonal contributes $\binom{\sum_h x_k[h]}{2}$. Neither shortcut replaces inverse-lag weights: the bit strings `110` and `101` both contain two matches, but contribute respectively $1$ and $1/2$ under $w_g=1/g$.
'''

[[blocks]]
kind = "variants"
title = "A negative control that preserves every pair statistic"
body = '''
Represent each block as a directed multigraph: letters are vertices and each adjacent pair contributes one edge occurrence. Reorder the outgoing occurrences at each vertex, then traverse an Euler trail from the original first letter, using every edge exactly once. This preserves the block's directed-pair counts and endpoints. It also preserves monograms because

$$n_a=\operatorname{outdegree}(a)+[\text{last letter}=a].$$

Apply the original substitution and schedule to the new sequence. The planted global monogram, cross-block monogram and cross-block pair scores are exactly unchanged. Fixed block endpoints also preserve boundary pairs, hence the whole-text iid and first-order Markov [KT likelihoods](/statistics/conditional-language-evidence). Higher-order text likelihoods can change.

No statistic that is a function only of the preserved edge multigraph can distinguish this pair: this includes its degrees, spectrum and number of Euler trails. The rearranged sequence is still a valid instance of the cipher family. Distinguishing it as non-prose requires longer-range traversal order or a declared source assumption, not merely a different graph summary.

Shuffling outgoing occurrences and taking a trail does **not** establish uniform sampling over Euler trails. This construction is a matched adversarial control, not automatically an exact randomization test. Some graphs have only one trail, and some rearrangements preserve the whole equality pattern. Record those fixed points as uninformative; do not redraw until a convenient negative appears.
'''

[[blocks]]
kind = "variants"
body = '''
- **Global histogram score:** $S_{\rm all}=\sum_x n_x(n_x-1)$, computed from one histogram instead of visiting every pair.
- **Cross-block score:** count equal symbols only between distinct blocks, reducing sensitivity to repeated material within one block.
- **Weighted graph score:** assign a fixed weight to each position pair before seeing the result.
- **Ordered-pair collision:** histogram adjacent pairs $(U_i,U_{i+1})$ inside each block, then count identical ordered pairs between blocks. This keeps local order while remaining invariant under a shared alphabet relabelling.
- **Tie-expanded shortlist:** retain every schedule tied at the cutoff, together with its physical origin and outer-alphabet choice.
'''

[[blocks]]
kind = "variants"
title = "Separate order information from comparison opportunities"
body = '''
Shuffling one string's positions independently within each residue modulo $p$ preserves every residue histogram. It therefore preserves every cross-text monogram score, its selected maximum and all phase ties, while potentially changing the pair score. This is a useful matched order diagnostic. It becomes an exact permutation test only under conditional within-residue exchangeability; independently substituted ordered prose does not automatically meet that assumption. Do not silently replace a frozen alphabet-relabel null with this different null.

Phase candidates can also have different numbers of comparisons. Write $e_A(g,r)$ for the number of valid lag-$g$ starts in residue $r$. The weighted exposure is $\sum_g w_g\sum_r e_A(g,r)e_B(g,r-d)$, which need not be constant in $d$ after endpoint trimming. A same-graph, equal-opportunity expected-maximum proof cannot be transferred unchanged to this selector. Fully reselected nulls keep the declared geometry, but a population guarantee for the correct phase needs a separate argument. Normalizing by exposure changes the statistic and must be frozen before evaluating its power.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and scope"
body = '''
- The unknown outer map is a bijection, so it preserves symbol equality.
- The expectation theorem assumes independent draws from one stationary, nonuniform marginal.
- For ordered-pair collisions, replace the monogram vector by one stationary joint pair distribution. Blocks must be independent for the cross-block expectation; symbols within a block may remain dependent.
- The candidate family contains the true position schedule.
- The pair graph and score are fixed before inspecting outcomes.
- A finite-text winner is a candidate schedule, not proof of the model, plaintext, or substitution.
'''

[[blocks]]
kind = "attack"
title = "Use equality before language"
body = '''
Enumerate the finite schedule family and peel only its position-dependent component. For each candidate, update the coordinate histogram and compute the frozen collision objectives. Rank schedules exactly, retain all boundary ties, and pass only the shortlist to the more expensive substitution or language stage. Calibrate the shortlist on nonuniform sources, correlated prose, uniform sources, and structured adversaries before using it as a hard acquisition gate.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function COLLISION_GEOMETRY_SCREEN(ciphertext, schedules, pair_graph, keep):
    ranked = empty list
    for schedule in schedules in canonical order:
        latent = UNDO_POSITION_MOTION(ciphertext, schedule)
        histogram = COUNT_SYMBOLS(latent)
        score_all = SUM_X(histogram[x] * (histogram[x] - 1))
        score_graph = 0
        for edge (i, j) in pair_graph:
            score_graph += (latent[i] == latent[j])
        APPEND(ranked, schedule, score_all, score_graph)
    SORT_BY_FROZEN_OBJECTIVE_AND_CANONICAL_TIE_RULE(ranked)
    boundary = SCORE_AT_POSITION(ranked, keep)
    shortlist = ALL_ROWS_AT_LEAST_BOUNDARY(ranked)
    return shortlist with exact ranks, ties, and complete-scan flag
```
'''

[[blocks]]
kind = "complexity"
body = '''
A direct implementation costs $O(|\Theta|n+|\Theta||E|)$ for schedule family $\Theta$, text length $n$, and pair graph $E$. Histogram updates can share work between schedules that differ in one local parameter. The recorded exhaustive implementation traversed 913,952 physical schedules per large control while retaining tie-expanded shortlists.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Uniform source:** monograms have no expected discrimination when letter marginals are uniform. Pair counts also lose that argument when the joint distribution is uniform, but uniform marginals alone do not erase pair information.
- **Equal-probability aliases:** swapping letters with equal probabilities creates additional statistical ties.
- **Correlated adversary:** a wrong schedule can straighten a periodic source into an unusually concentrated stream and beat the true schedule.
- **Circulant pair law:** an order-sensitive source whose transition law is unchanged by alphabet rotation can leave additional schedule aliases even when its pair distribution is far from uniform.
- **Multiple comparisons:** the maximum over a large family can be extreme even when each individual score is noisy.
- **Post-selected objective:** choosing global or cross-block collisions after seeing which ranks better invalidates the stated control power.
- **Schedule called plaintext:** equality geometry does not name latent symbols or recover the substitution.
- **Uncharged extra objective:** adding pair-score seeds enlarges the selector. Preserve all origins and repeat the complete enlarged selection in every decision null; an earlier release gate cannot be inherited unchanged.
- **Population versus sample:** exact translation symmetries of a declared source law do not identify the unknown law from one fitted sample, and do not justify deduplicating actual plaintext candidates.
- **Blocks too short:** the subgroup tie-count shortcut needs two internal pairs per block. Two-symbol blocks can have additional ties and require the direct expectation calculation.
'''

[[blocks]]
kind = "controls"
body = '''
The exhaustive implementation was checked against a separate per-position reference on small schedule spaces and replayed every retained physical origin. In twelve 504-symbol controls with nonuniform independent marginals, both the global and cross-block objectives placed the planted schedule at rank one. In four matched uniform controls, neither objective retained the plant in the top 64. These honest failures confirm the theorem's nonuniformity boundary and motivated the correlated-source gate below.

A later frozen panel added twelve 504-letter correlated prose controls and matched transformations. The planted schedule ranked first for all twelve prose texts, but also for all twenty-four plaintext histogram-shuffle and within-block-sort transformations. Conditional ciphertext-shuffle nulls overlapped the prose score range, and periodic concentration traps could favor a wrong schedule. This confirms that strong retention measures position geometry; it does not identify prose.

An order-sensitive extension tested four public 504-symbol Markov examples with uniform population letter marginals. Pair collisions placed the plant first in all four, preserving a legitimate two-way outer-order tie, while both monogram objectives missed all four top-64 sets. Two peaked independent sources were first under every objective; two uniform independent references were not retained. Two arithmetic-progression traps preferred a wrong schedule that made the coordinates constant. A separate implementation reconstructed every score distribution and retained origin. This demonstrates additional proposal information, not fresh prose power or language/null separation.

The subgroup tie formula was separately checked against literal expectation scores for 10,319 small-alphabet schedules, matching all 224 ties. A six-symbol noncirculant permutation retains two common offsets; a six-symbol parity-block law leaves 162 velocity tuples tied across four blocks. A two-symbol-block counterexample has three ties where an out-of-domain use of the formula would predict one. Degree-26 checks cover exact stabilizers and literal witnesses only, not full expected-score enumeration.

A later public-symbol integration preserved the original class-seed identity while unioning all three tie-expanded objectives. It produced 201 endpoints from 67 classes, versus 192 endpoints from the unchanged 64-class monogram projection. A separate implementation replayed the complete geometry, every endpoint's swap stationarity and all physical forwards. Six symbolic Euler-trail tests included loops, repeated edges and fixed points. These are composition and invariant checks, not prose power or a live release gate.
'''

[[blocks]]
kind = "example"
title = "Aligned and misaligned marginals"
body = '''
Take a two-symbol source with $p=(3/4,1/4)$. Two correctly aligned positions have collision probability

$$\langle p,p\rangle=\frac{10}{16}.$$

If a wrong schedule swaps the labels at one position, its marginal is $q=(1/4,3/4)$ and the collision probability becomes

$$\langle p,q\rangle=\frac{6}{16}.$$

The loss is $4/16$, exactly $\tfrac12\lVert p-q\rVert^2$. If $p=(1/2,1/2)$ instead, the loss is zero and collision geometry cannot distinguish the schedules.
'''

[[blocks]]
kind = "notes"
body = '''
Collision probability and histogram methods are classical. The useful synthesis is to make a schedule search completely label-free, derive its expectation loss as a sum of squared marginal differences, retain exact physical ties, and state the uniform and correlated-source boundaries before combining it with a language model.

The adjacent-pair extension has its own exhaustive public-symbol implementation and separate-code replay. Its gain is information from order, not merely a larger shortlist. Those controls do not establish the cipher family or the correct latent letter names.
'''

