id = "english-gate-calibration"
section = "statistics"
title = "English gate calibration"
subtitle = "Set a safe language-score cutoff with separate real prose"
status = "VERIFIED"
status_note = "An audit found that a quadgram cutoff of mean - 0.7 rejected 11 of 1,545 genuine 153-letter English windows, or 0.71%. A cutoff set above the random-letter ceiling rejected none. Updated gates also rejected 0 of 14,277 genuine 63-letter windows and are now used."
family = "Language-model scoring"
tags = ["gate", "threshold", "calibration", "false negative", "held-out"]
related = ["quadgram-log-likelihood", "power-analysis", "permutation-test", "tautological-gate-rule", "held-out-gates", "valid-model-nulls", "estimator-standard-error", "g-held-out"]
summary = "A language gate is a score cutoff, usually based on quadgrams, that decides whether a trial decryption looks like English. A cutoff that is too strict can reject correct but unusual prose. Set it with many separate English samples of the same length and the same scoring table. Measure their mean, spread, minimum, and rejection rate. Place the cutoff safely above the best random-letter score, not just below the average prose score."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Let $r(x)$ be the quadgram rate of a candidate. A gate declares the candidate non-English when $r(x) < \theta$. Calibration draws $W$ windows of genuine prose of the target length $n$ from a corpus range disjoint from the model's training range and reports

$$\hat\mu = \operatorname{mean}\, r(w_j), \qquad \hat\sigma = \operatorname{sd}\, r(w_j), \qquad r_{\min} = \min_j r(w_j), \qquad \widehat{\mathrm{FN}}(\theta) = \frac{1}{W}\#\{j : r(w_j) < \theta\},$$

the last being the gate's false-negative rate on real English. The **anchored** gate is

$$\theta_E = r_{\text{IID}}(n) + \Delta,$$

where $r_{\text{IID}}(n)$ is the ceiling reached by the best of many independent random-letter texts of length $n$ under the same table (the "garbage level") and $\Delta$ a declared margin.
'''

[[blocks]]
kind = "equations"
title = "The two gates compared at 153 letters"
body = '''
Same table, same corpus, same 150-quadgram windows:

- prose-mean rule: $\hat\mu = -4.1324$, $\theta = \hat\mu - 0.7 = -4.8324$;
- prose-tail rule: $\hat\sigma = 0.118$, $\hat\mu - 8\hat\sigma = -5.079$, yet a genuine plant-range window read $-5.36$, ten standard deviations below the mean;
- anchored rule: $r_{\text{IID}} = -6.322$, $\Delta = 0.5$, $\theta_E = -5.822$.

On 1,545 held-out windows: $11$ ($0.71\%$) fall below $-4.832$, $0$ fall below $-5.822$, and the minimum is $-5.558$. At $n = 63$ the anchored gate with $\Delta = 0.15$ over the best of $1{,}000$ random texts gives $\theta_E = -5.5635$, with $0\%$ of $14{,}277$ genuine windows below it.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The calibration windows are prose of the same kind as the expected plaintext; orthographically atypical plaintext (deliberate misspellings, archaic text) sits further into the tail than the corpus suggests.
- The calibration range, the model's training range and the planted-control range are three disjoint corpus regions. A gate calibrated on windows that overlap the table's training data is optimistic.
- Length matters: a threshold tuned on 504-letter spans rejected a correctly recovered 152-letter prose fixture, so each admitted length gets its own calibration.
'''

[[blocks]]
kind = "attack"
title = "Use in an attack pipeline"
body = '''
1. Before a live pass, publish $\hat\mu$, $\hat\sigma$, $r_{\min}$, the chosen $\theta$ and $\widehat{\mathrm{FN}}(\theta)$ for the exact table and length in use.
2. Prefer a sub-threshold *disposition* to a terminal verdict: a candidate below $\theta$ proceeds to the [permutation nulls](/statistics/permutation-test) with a typed low-rate label instead of terminating the transaction.
3. Let the null rank carry the decision. In the audited lanes a candidate is admitted only at strict rank 1 among 99 matched nulls. The English gate is a guard against fluent nonsense, not the evidence.
4. Never re-tune the gate after seeing a live score ("gate shopping"). A lane that failed its control power must refuse its live pass rather than loosen the gate.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// r(x) = quadgram rate of x under the frozen table; the windows w[1..W] are
// genuine prose of length n from a corpus range disjoint from the table's
// training range.
function CALIBRATE(w[1..W], r):
    for j in 1..W: rate[j] = r(w[j])
    mu_hat = MEAN(rate); sigma_hat = SD(rate); r_min = MIN(rate)
    return mu_hat, sigma_hat, r_min, rate

function FALSE_NEGATIVE_RATE(rate[1..W], theta):
    // counted directly, never from a normal tail
    return #{ j : rate[j] < theta } / W

// Anchored gate: the random-letter ceiling at this length plus a declared
// margin Delta.
function ANCHORED_GATE(n, R, Delta, r, rng):
    r_IID = max over i in 1..R of r(RANDOM_LETTERS(rng, n))
    return r_IID + Delta

function PUBLISH_GATE(w, n, R, Delta, r, rng):
    mu_hat, sigma_hat, r_min, rate = CALIBRATE(w, r)
    theta_E = ANCHORED_GATE(n, R, Delta, r, rng)
    FN = FALSE_NEGATIVE_RATE(rate, theta_E)
    // before any live score is seen
    print mu_hat, sigma_hat, r_min, theta_E, FN
    // never re-tuned after a live score
    return theta_E

function GATE(x, theta_E):
    // a disposition: the candidate still meets the nulls
    if r(x) < theta_E: return LOW_RATE
    // not evidence: the null rank decides
    return PASS
```
'''

[[blocks]]
kind = "complexity"
body = '''
Scoring $10^4$ windows is seconds. The cost of the protocol is in discipline, not computation.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Gaussian intuition.** $0.7$ below the mean is $5.9\hat\sigma$. A normal tail would predict about one false rejection in $10^9$, the measured rate is $7$ in $1{,}000$. The prose tail is heavy because short windows land on names, numbers and rare words.
- **One-shot cost.** In a design where a live attempt is unique, a false negative is not a wrong conclusion about the cipher family (the terminal was correctly scoped "not a family rejection") but it destroys the only attempt.
- **Wrong length.** Thresholds do not transplant across lengths. The random-letter ceiling rises as $n$ falls.
- **Gate as evidence.** A candidate that passes the gate is not thereby correct: at $-4.87$ a bank search produced a passing candidate that eight of nine complete-pipeline nulls beat.
'''

[[blocks]]
kind = "controls"
body = '''
The blocking audit compared the proposed gate with a sibling lane's sealed calibration on the identical table and range (mean $-4.1324$ from $7{,}681$ windows versus $-4.1330$ from $653$, a difference of $6 \times 10^{-4}$), then an independent review measured the false-negative rate on $1{,}545$ disjoint windows. The anchored gate at $n = 153$ was validated in a disclosed run where the hardest positive read $-4.851$ with margin $+0.971$ over the gate and every negative was stopped either by the gate or by the null rank.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Suppose $W = 2{,}000$ held-out windows give $\hat\mu = -4.13$ and $\hat\sigma = 0.12$, and the best of $1{,}000$ random-letter texts of the same length scores $-6.32$.

- A gate at $\hat\mu - 0.7 = -4.83$ sits at $0.7/0.12 = 5.8$ standard deviations; count the windows below it directly rather than trusting the normal tail. If $14$ of $2{,}000$ fall below, $\widehat{\mathrm{FN}} = 0.7\%$.
- The anchored gate $-6.32 + 0.5 = -5.82$ is $1.7$ above the garbage level and, if no window falls below it, has an estimated false-negative rate below $1/2{,}000$ (rule of three: at most about $3/2{,}000 = 0.15\%$ at 95% confidence).

The second gate is looser on prose and still separates real English from the best random text by a declared margin; that is the design goal.
'''

[[blocks]]
kind = "notes"
body = '''
This entry records a calibration *failure* turned into a protocol. The general rule ([tautological gate rule](/validation/tautological-gate-rule)) is that a check must be shown able to fail on the wrong thing and able to pass on the right thing. A language gate must be shown to pass real English.
'''

