title = "Conditional language evidence"
subtitle = "Compare a normalized language model with simple universal and repetition models"
status = "VERIFIED"
status_note = "Exact small-alphabet checks and a separate implementation verify that all four text models are normalized and scored correctly. A disclosed, already-consumed panel separated all 12 prose cases from all 40 nonprose cases, but it does not validate a cutoff or a cipher-level decision."
family = "Normalized text-model comparison"
