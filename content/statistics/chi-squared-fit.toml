id = "chi-squared-fit"
section = "statistics"
title = "Chi-squared fit of a letter histogram"
subtitle = "Measure how far observed letter counts are from a reference pattern"
status = "VERIFIED"
status_note = "The test uses single-letter chi-squared/n against English and chooses the best of 26 rotations in two alphabet orders. Across seven solved reference ciphertexts, raw text stays far from English at 2.4–3.3. After the correct layer is removed, the score drops to 0.061–0.142. This supports the cascade solver's transposition decision."
family = "Coincidence and frequency statistics"
tags = ["chi-squared", "goodness of fit", "monogram", "transposition gate", "change point"]
related = ["index-of-coincidence", "frequency-analysis", "quadgram-log-likelihood", "bayesian-evidence-model-selection", "family-wise-null", "change-point-zone-detection", "columnar-transposition", "coset-shift-recovery"]
summary = "Chi-squared compares observed letter counts with a declared expected distribution. It can measure compatibility with a language’s single-letter frequencies or departure from uniformity. Sparse expected counts, dependent observations and selection across many keys can invalidate a textbook chi-squared reference distribution."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
With observed counts $O_x$ and a reference distribution $p_x$ over the 26 letters,

$$\chi^2 = \sum_{x} \frac{(O_x - n p_x)^2}{n p_x}, \qquad \frac{\chi^2}{n} = \sum_x \frac{(f_x - p_x)^2}{p_x},$$

where $f_x = O_x/n$. Under the hypothesis that the letters are independent draws from $p$, $\chi^2$ is approximately chi-squared distributed with $25$ degrees of freedom when every $n p_x$ is large enough. Under a fixed alternative distribution $q$, $\chi^2/n$ converges to $\sum_x(q_x-p_x)^2/p_x$. Its finite-sample expectation and spread still depend on $n$, so length-matched calibration remains necessary.

**Recorded reference levels (English $p$).** Held-out English multisets in this project read near $\chi^2/n\approx0.10$. The tested periodic substitutions gave $0.6$–$1.0$ or more, with raw values of $2.4$–$3.3$ on seven solved references. Tested imperfect peels with one or two wrong cosets gave $0.2$–$0.45$. These are empirical calibration ranges for those generators and lengths, not universal cipher constants.
'''

[[blocks]]
kind = "equations"
title = "Rotation-minimised misfit and penalised scans"
body = '''
For a text that may be a Caesar shift of a transposed plaintext, take

$$\chi^2_{\min} = \min_{r \in \mathbb{Z}_{26},\ A \in \{\text{straight},\ \text{keyed}\}} \chi^2\big(\text{rotate}_A(c, r)\big),$$

over 52 rotations. The gate used in the cascade solver is

$$\chi^2_{\min}/n \le 0.35 \quad\text{or}\quad \big(\chi^2_{\min}/n \le 0.50 \text{ and } \operatorname{IC} \ge 0.058\big).$$

For a per-coset peel of a period-$p$ layer, each coset's shift is the $\operatorname{argmin}$ over 26 shifts of the coset's $\chi^2$. The peel is scored by the $\chi^2/n$ of the reassembled text. A two-period scan over composite keys $k_i = a_{i \bmod p} + b_{i \bmod q}$ uses the penalised criterion $\chi^2 + 0.65 \ln(n)\,(p+q)$, a BIC-like charge for the $p+q$ free shifts.
'''

[[blocks]]
kind = "variants"
body = '''
- **Flatness test.** With $p_x = 1/26$: a 504-letter text with IC $0.0388$ gave a uniform-histogram $p$-value of $0.26$. This fails to reject the uniform iid histogram model; it does not establish that no monoalphabetic structure exists.
- **Two-sample change point.** The $\chi^2$ distance between the prefix and suffix histograms at split $t$, maximised over $t$, against a null that also maximises over $t$; on the 144-letter text the peak reached $z = +3.7$ at $t \approx 33$–$52$.
- **Per-coset shift recovery.** The same objective as the correlation method of [coset shift recovery](/cryptanalysis/coset-shift-recovery), but with rare letters weighted up by $1/p_x$.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Expected counts should not be tiny: at $n = 63$ the letters J, Q, X, Z expect fewer than one occurrence each, and their terms dominate $\chi^2$. Pool rare letters, or prefer the multinomial log-likelihood, when the text is short.
- The reference distribution must be the plaintext language's. A peaked non-prose plaintext (lists, spelled numbers) fails the English gate legitimately.
- The gate's thresholds were set on solved reference ciphertexts of 224–350 letters and their peels. They are not a universal constant.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Transposition decision.** If $\chi^2_{\min}/n$ is small while the text does not read, its histogram is compatible with the calibrated language reference. In a pipeline where substitution has already been ruled out, that is a reason to try order solvers next, not proof that the multiset is plaintext or that a transposition is present.
2. **Order-free peel.** When a transposition may sit *below* a periodic layer, quadgrams of the peeled text may be uninformative (see [quadgram log-likelihood](/statistics/quadgram-log-likelihood)). Per-coset $\chi^2$ is an order-free objective for this stage. Its thresholds still need controls matched to the proposed layer order and text length.
3. **Composite periods.** Scan pairs $(p,q)$ with the penalised criterion; fire only if the winning peel's monograms pass the gate.
4. **Change points.** Use the two-sample form to find where the letter set changes, then treat the segments separately.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// O[x] = observed count of letter x, n = total letters, p[x] = reference
// distribution.
function CHI2(O[0..25], p[0..25]):
    n = sum over x of O[x]
    return sum over x of (O[x] - n * p[x])^2 / (n * p[x])

// Histogram of the text after a Caesar rotation by r in alphabet order A
// (straight or keyed): the letter at A-position i moves to A-position i - r.
function ROTATE(O, A, r):
    for x in 0..25: R[A[(POS_A(x) - r) mod 26]] = O[x]
    return R

// Rotation-minimised misfit over the 52 rotations, and the transposition gate
// built on it.
function CHI2_MIN(c[0..n-1], p):
    O = HISTOGRAM(c)
    return min over A in {straight, keyed}, r in 0..25 of CHI2(ROTATE(O, A,
            r), p)

function TRANSPOSITION_GATE(c[0..n-1], p):
    m = CHI2_MIN(c, p) / n
    return m <= 0.35 or (m <= 0.50 and IC(c) >= 0.058)

// Per-coset peel of a period-q layer: each coset takes the shift that
// minimises its chi-squared; the peel is scored by the chi-squared/n of the
// reassembled text and must pass the gate.
function CHI2_PEEL(c[0..n-1], q, p):
    for b in 0..q-1:
        O_b = HISTOGRAM([c[i] for i in 0..n-1 if i mod q == b])
        s[b] = argmin over r in 0..25 of CHI2(ROTATE(O_b, straight, r), p)
    for i in 0..n-1: peeled[i] = (c[i] - s[i mod q]) mod 26
    return s, CHI2(HISTOGRAM(peeled), p) / n
```
'''

[[blocks]]
kind = "complexity"
body = '''
$O(26)$ per histogram. The 52-rotation minimisation is $O(52 \cdot 26)$. A per-coset peel is $O(26\,p \cdot 26)$. The two-period scan over $2 \le p < q \le 10$ with coordinate descent is a few thousand histogram evaluations.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Rare-letter dominance.** For a flat histogram the term for Z alone contributes about $(1/26 - 0.00074)^2 / 0.00074 \approx 1.9$ to $\chi^2/n$. A single unlucky rare letter in a 60-letter text moves the statistic by a large fraction of the gate.
- **Selection inside the gate.** The minimum over 52 rotations is itself a selection. The thresholds were calibrated on the minimised statistic, so a per-rotation critical value must not be substituted.
- **Order blindness.** Like the IC, $\chi^2$ cannot see a transposition. A low value shows histogram compatibility with the chosen English reference; it does not certify that the text is English.
- **Maximised change points.** The best split $t$ must be judged against a max-over-$t$ null. A fixed-$t$ critical value overstates significance.
'''

[[blocks]]
kind = "controls"
body = '''
On the seven solved reference ciphertexts pushed through the cascade solver, the raw texts read $\chi^2/n = 2.41$–$3.26$ (gate quiet) and the correctly peeled residues $0.061$–$0.142$ with IC $0.0567$–$0.0709$ (gate fires). The single-columnar width scans that followed read the single-transposition references at quadgram rates $-4.11$ to $-4.27$, while the double-transposition reference needed the double-columnar escalation. The gate never fired on a text that still carried a substitution layer.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
A 26-letter text has counts E 5, T 4, A 3, O 3, eleven other letters once each, and eleven letters absent. Against the uniform reference every expected count is $n p_x = 1$:

$$\chi^2 = (5-1)^2 + (4-1)^2 + 2\,(3-1)^2 + 11\,(1-1)^2 + 11\,(0-1)^2 = 16 + 9 + 8 + 0 + 11 = 44,$$

The arithmetic gives $\chi^2/n = 44/26 = 1.69$, a large departure on this scale. It is tempting to compare 44 with a chi-squared distribution on 25 degrees of freedom, but that asymptotic reference is unreliable here because every expected count is only one. An exact multinomial calculation or a Monte Carlo sample from the uniform model is needed for a calibrated $p$-value. Against English the same text may score lower because E and T are expected to be frequent, but that comparison must be calculated rather than inferred from their names alone.
'''

[[blocks]]
kind = "notes"
body = '''
The chi-squared misfit and the [Bayesian evidence](/statistics/bayesian-evidence-model-selection) answer different questions: $\chi^2$ asks "is this histogram compatible with the English reference", while the evidence asks "how much better than uniform does a rotated English model explain these counts, averaged over the rotation". The marginal likelihood is often numerically more stable for short cosets because it does not divide by tiny expected counts, but it remains model-dependent and needs matched calibration.
'''

