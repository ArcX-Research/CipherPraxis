summary = "When a cipher family has no usable likelihood formula, simulate it. Encrypt many English samples with random keys for each declared family and measure the same fixed features. These samples form a cloud for each family. Mahalanobis distance measures how far a new text is from each cloud. Fresh or cross-validated simulations are needed to estimate classification performance; distances from fitted clouds are diagnostics, not family exclusions by themselves."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
For a feature vector $x \in \mathbb{R}^k$ and a family $F$ with simulated mean $\mu_F$ and covariance $\Sigma_F$,

$$d^2_F(x) = (x - \mu_F)^{\top} \Sigma_F^{-1} (x - \mu_F), \qquad \log \mathcal{L}_F(x) = -\tfrac{1}{2}\big(d^2_F(x) + \ln \det \Sigma_F\big) + \text{const}.$$

The first expression is a distance. The second is a Gaussian synthetic log-density and includes the determinant term; when covariances differ, ranking by $d_F^2$ is not the same as ranking by $\log\mathcal L_F$. The recorded implementation ranks by distance and prints the density as a separate diagnostic. Features are standardised by the pooled standard deviation over all families before covariance estimation, and the covariance is shrunk towards its diagonal, $\Sigma_F \leftarrow 0.7\,\Sigma_F + 0.3\,\operatorname{diag}(\Sigma_F) + 10^{-6} I$. The per-feature residual shows which measurement differs from the simulated cloud.
'''

[[blocks]]
kind = "equations"
title = "The 19 invariant features"
body = '''
Raw IC; number of distinct symbols; union IC after heuristic period-7 alignment; mean within-coset IC; digram IC of the aligned text. The largest residual periodic IC of the aligned text over periods $2 \dots 30$ not divisible by 7; periodic IC at 7, 14 and 28. The smallest per-coset alignment margin. The M1, M2 and M3 [family evidences](/statistics/bayesian-evidence-model-selection) with shifts marginalised. The differences M2$-$M1 and M3$-$M2. The M2 MAP gain. The mean maximum shift posterior under M2; and the lag-1 and lag-2 autocorrelations of the M2 class posterior along the text.

These features can be computed without supplying a key, but their observed values may still vary with the generated key. Histogram-only features are invariant to reorderings that preserve the relevant residue assignments. Lag, adjacency, heuristic alignment, and posterior-correlation features need separate invariance arguments for each proposed layer order; they are not invariant to an arbitrary transposition merely because the transposition lies below another named layer.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Each family's feature cloud is approximately Gaussian at the simulated length; with 120 draws the tails are not resolved.
- The simulated plaintexts (random windows of a large English corpus) represent the source distribution being claimed. A peaked or non-prose plaintext may lie outside every fitted simulation cloud even when its cipher mechanism is present.
- The target is homogeneous. A text whose key changes part-way, or whose periodic layer covers only a zone, lies between clouds and its distances are not interpretable as family membership.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Simulate every candidate construction $N$ times on real English with random keys (plain and transposed English, periodic substitution, sandwiches at several widths and inner periods, double columnar, bifid with several periods, running key, autokey, compound keys, binary-perturbed keys, random-alphabet keyed substitution, seven independent alphabets, two alphabet orders in sequence, four rounds, segment-varied keys, 20% nulls, progressive key, Hill-then-periodic, and, for even lengths, Playfair-then-periodic).
2. Compute the feature vector for the target and for each simulation; rank families by $d^2$; print the per-feature residuals above $|2|$.
3. Estimate classification on fresh simulations or by cross-validation. Resubstitution on the same samples used to fit the clouds is optimistic and is only a development diagnostic.
4. Use the ranking to choose solvers, not to close families. Large residuals show mismatch with the simulated distribution; an exclusion needs a separately calibrated test and an explicit source model.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// FEATURES(text) returns the fixed vector of k key-independent statistics.
function BUILD_CLOUDS(families, N, prose):
    for F in families:
        for i in 1..N:
            // real English, the target's length
            P = RANDOM_WINDOW(prose)
            X_F[i] = FEATURES(ENCRYPT_F(P, RANDOM_KEY(F)))
    sigma_pool = per-feature standard deviation over the X_F of all families
    for F in families:
        // standardise every feature
        X_F = X_F / sigma_pool
        mu_F = MEAN(X_F)
        Sigma_F = COVARIANCE(X_F)
        Sigma_F = 0.7 * Sigma_F + 0.3 * DIAG(Sigma_F) + 1e-6 * I
    return mu, Sigma, sigma_pool

function D2(x, mu_F, Sigma_F):
    r = x - mu_F
    return transpose(r) * INVERSE(Sigma_F) * r

function CLASSIFY(target, mu, Sigma, sigma_pool):
    x = FEATURES(target) / sigma_pool
    for F in families:
        d2[F] = D2(x, mu_F, Sigma_F)
        loglik[F] = -0.5 * (d2[F] + ln det Sigma_F)
        for each feature j:
            residual[F][j] = (x[j] - mu_F[j]) / sqrt(Sigma_F[j][j])
    return families sorted by d2 ascending, residuals with |value| > 2

// Estimate classification on fresh simulations or by cross-validation.
// Reclassifying the fitting rows measures resubstitution performance only.
```
'''

[[blocks]]
kind = "complexity"
body = '''
$29 \times 120 = 3{,}480$ simulations, each requiring an alignment and three evidence fits; about 85 seconds per (text, alphabet order) in a vectorised implementation. The classification itself is negligible.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Plug-in optimism.** Self-classification is measured on the same simulations that estimated the clouds, so the quoted accuracies are resubstitution estimates and are usually biased upward. They are not guaranteed mathematical upper bounds.
- **Cluster degeneracy at short length.** At 153 letters bifid, keyed random alphabet, seven independent alphabets, four rounds, sandwiches and 7+3 compounds all sit within $d^2$ $10.7$–$17.1$ of the same target and classify themselves correctly only 8–40% of the time. The test places the target in the cluster and stops.
- **Feature saturation.** Several features are maxima over scans (residual periodicity, alignment margin), which are right-skewed. The Gaussian model underestimates their tails.
- **Heterogeneous targets.** A zoned text is not any single simulated family. The per-feature residuals then flag the zone-sensitive statistics (lag-based) rather than the construction.
'''

[[blocks]]
kind = "controls"
body = '''
Resubstitution at 153 letters in one alphabet order gave: plain English 100%, transposed English 78%, seven independent alphabets 82%, progressive key 57%, plain periodic substitution 52%, sandwiches 18–40%, and bifid 8–22%. For one 153-letter observation the clouds ranked by $d^2$ were bifid-7 (10.7), four rounds (13.2), random-alphabet keyed substitution (13.3), sandwiches (14.7), random letters (30.3), plain English (102.2), transposed English (109.8), and plain periodic substitution (159.2). The last three are strong mismatches to those fitted simulation clouds, not calibrated family exclusions.
'''

[[blocks]]
kind = "example"
title = "Worked example with two features"
body = '''
Suppose a family's simulations give means $\mu = (0.070, 0.070)$ and standard deviations $\sigma = (0.004, 0.008)$ for (aligned IC, coset IC), with negligible correlation. A target at $x = (0.062, 0.054)$ has

$$d^2 = \Big(\frac{0.062 - 0.070}{0.004}\Big)^2 + \Big(\frac{0.054 - 0.070}{0.008}\Big)^2 = 4 + 4 = 8.$$

If the feature vector were exactly Gaussian and $\mu$ and $\Sigma$ were known rather than estimated, $d^2$ would follow chi-squared with 2 degrees of freedom and $\Pr(d^2\ge8)=e^{-4}\approx0.018$. With fitted, shrunk covariance and selected, non-Gaussian features, that reference tail is only an approximation; calibrate the complete distance on fresh simulations. Correlated features enter through $\Sigma_F^{-1}$, not by treating their individual residuals as independent.
'''

[[blocks]]
kind = "notes"
body = '''
As implemented, this is a simulation-based feature-distance classifier. It becomes a Gaussian synthetic-likelihood method only when the full log-density, including the determinant term, is used under a declared family prior. It is not approximate Bayesian computation without a prior, discrepancy kernel or posterior approximation. Its useful output is a calibrated map of which families the chosen features can and cannot distinguish at the stated length.
'''

