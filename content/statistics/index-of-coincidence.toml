summary = "The index of coincidence (IC) is the chance that two randomly chosen letters from a text match. It is about 0.066 for English and 1/26 = 0.0385 for uniform random letters. A simple substitution or transposition does not change it. Whole-text IC is only the period-1 view: a periodic cipher can mix shifted coset histograms into an almost flat total while every coset remains language-shaped. Periodic IC and aligned union IC can expose that structure. Exact error bars and matched selection nulls keep these comparisons honest."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
For a text of $n$ letters with letter counts $n_1, \dots, n_{26}$,

$$\operatorname{IC} = \frac{\sum_{x} n_x (n_x - 1)}{n (n - 1)},$$

the fraction of the $\binom{n}{2}$ unordered pairs of positions that hold the same letter. If the letters are independent draws from a distribution $p$, the expectation is $\kappa = \sum_x p_x^2$:

- uniform letters: $\kappa = 1/26 = 0.0385$;
- English monograms: $\kappa \approx 0.066$ (the corpus table used in the evidence panel gives $0.0652$).

The IC of a text is unchanged by any permutation of its positions and by any bijective relabelling of the alphabet, so it measures only the shape of the letter histogram.

**Derived forms.** Whole-text IC is the period-1 statistic. The *periodic IC* at period $m$ is the mean IC of the $m$ cosets $\{c_i : i \equiv b \pmod m\}$. A pair-weighted version divides the total within-coset coincidence count by the total number of within-coset pairs; it is preferable when coset lengths differ. The *union IC* of an alignment is the IC of the text after each coset has been rotated by its own shift $s_b$, i.e. of the histogram $G(x) = \sum_b F_b(x + s_b)$. The *digram IC* is the same statistic on the $26^2$ ordered letter pairs.
'''

[[blocks]]
kind = "equations"
title = "Exact standard deviation of the estimator"
body = '''
Write $P = n(n-1)/2$ for the number of pairs, $I_{ij}$ for the indicator that positions $i$ and $j$ agree, $\kappa_2 = \sum_x p_x^2$ and $\kappa_3 = \sum_x p_x^3$. Each pair has variance $\kappa_2 (1 - \kappa_2)$. Two pairs that share one position are correlated, with covariance $\kappa_3 - \kappa_2^2$, and every pair has $2(n-2)$ such partners. Pairs with no common position are independent. Hence

$$\operatorname{Var}\Big(\sum_{i<j} I_{ij}\Big) = P\,\kappa_2(1-\kappa_2) + 2P(n-2)\,(\kappa_3 - \kappa_2^2), \qquad \operatorname{sd}(\operatorname{IC}) = \frac{1}{P}\sqrt{\operatorname{Var}\Big(\sum_{i<j} I_{ij}\Big)}.$$

For English letters and a 22-letter coset this gives $\operatorname{sd} = 0.0210$. The mean of seven such cosets has $\operatorname{sd} = 0.0210/\sqrt{7} = 0.0079$. The naive binomial value $\sqrt{\kappa_2(1-\kappa_2)/P} = 0.016$ understates the error by about 30% because it ignores the shared-position covariance.

**Why the period-1 view can be flat.** Suppose every coset is a rotation of one inner histogram $F$, so $F_b(x)=F(x-k_b)$. The pooled histogram is

$$H(x)=\sum_{b=0}^{m-1}F(x-k_b),$$

and its IC is computed from $H$. When the $k_b$ cover several different rotations, their peaks fill one another's troughs and $H$ can approach a uniform histogram even though each $F_b$ has the original inner IC. Periodic IC computes the coincidences before this mixing; aligned union IC first reverses the relative rotations and then pools them. This is why a sum or difference of two ciphertexts must be scanned at its candidate periods rather than rejected from raw IC alone.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The reference values assume letters drawn independently from one distribution. Real prose has word repeats, so an English window of a few dozen letters scatters more than the formula says; simulated references on real text windows are used alongside the exact formula.
- Invariance: IC is blind to order, so a transposition leaves the observed IC unchanged. Periodic substitution often moves the pooled IC toward $0.038$ while leaving each coset near the plaintext level. Fractionating or mixed inner layers often lower coset IC, but none of these directions is guaranteed for every finite text or key schedule.
- Two different keys mixed inside one coset (a key change in the middle of a text) pull the coset IC below the monoalphabetic level even though every segment is monoalphabetic on its own.
- Periodic IC is invariant under any bijective relabelling applied separately inside each coset. It detects peaked cosets, not the stronger claim that those cosets use rotations of one declared alphabet.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Is it monoalphabetic?** Compare the whole-text IC with $0.066$ and $0.0385$, using the exact standard deviation at that length.
2. **Period.** Scan the periodic IC over candidate periods. Under the periodic iid model, the true period and some multiples are expected to give cosets near the plaintext level. Finite samples, harmonics, and selected periods require a matched family-wise null. The [lag profile](/statistics/coincidence-lag-profile) reads related pairwise information.
3. **Alignment.** Choose per-coset rotations that maximise the union IC; for period 7 all $26^6$ relative shift vectors can be enumerated exactly with a closed-form pairwise objective (see [Exact period alignment](/cryptanalysis/exact-period-alignment)). The maximised union IC is then compared with the same maximisation on position-shuffled texts, because a maximum over shift vectors is biased upwards.
4. **Derived streams.** For every aligned sum or difference of two sources, treat raw IC as $m=1$ and repeat steps 2 and 3 at every declared residual period. Rerun source-pair, sign, alignment, order, period, and statistic selection inside the null.
5. **Transposition branch.** In the recorded cascade, a histogram compatible with calibrated English monograms (IC $\ge0.058$ together with a small [chi-squared misfit](/statistics/chi-squared-fit)) routes the text to order solvers. This is a pipeline decision supported by its controls, not proof that a pure transposition is present.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Letters are indices 0..25; h[x] = n_x is the count of letter x and n = sum
// of h.
function IC_OF_COUNTS(h[0..25]):
    n = sum over x of h[x]
    if n < 2: return 0
    return (sum over x of h[x] * (h[x] - 1)) / (n * (n - 1))

function IC(text):
    return IC_OF_COUNTS(HISTOGRAM(text))

// Exact standard deviation of IC for n independent letters drawn from
// distribution p.
function IC_SD(p[0..25], n):
    kappa2 = sum over x of p[x]^2
    kappa3 = sum over x of p[x]^3
    P = n * (n - 1) / 2
    var_sum = P * kappa2 * (1 - kappa2) + 2 * P * (n - 2) * (kappa3 -
            kappa2^2)
    return sqrt(var_sum) / P

// Periodic IC: the mean IC over the m cosets {c_i : i mod m == b}.
function PERIODIC_IC(c[0..n-1], m):
    for b in 0..m-1:
        F[b] = HISTOGRAM([c[i] for i in 0..n-1 if i mod m == b])
    return (sum over b of IC_OF_COUNTS(F[b])) / m

// Union IC of an alignment: each coset histogram rotated by its own shift
// s_b.
function UNION_IC(F[0..m-1], s[0..m-1]):
    for x in 0..25:
        G[x] = sum over b of F[b][(x + s[b]) mod 26]
    return IC_OF_COUNTS(G)
```
'''

[[blocks]]
kind = "complexity"
body = '''
One histogram is $O(n)$. A periodic scan over periods $2 \dots m_{\max}$ is $O(n \cdot m_{\max})$. The exact period-7 alignment enumerates $26^6 \approx 3.1 \times 10^8$ relative shift vectors with a closed-form pairwise objective in $0.4$–$0.5$ s per 144–153-letter text in a vectorised implementation, so 200 shuffled nulls of the same exact alignment take about 90 s per text.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Short cosets.** At 22 letters per coset the standard deviation ($0.021$) is a third of the gap between English and uniform. A reading such as "mean coset IC 0.0536 against 0.0652" is a $-1.5\sigma$ statement, not an exclusion of monoalphabetic cosets.
- **Raw-IC rejection.** A nearly uniform whole-stream IC does not reject a periodic substitution or a periodic residual after cross-text cancellation. It rejects only the period-1 histogram claim.
- **Maximised statistics.** The union IC after alignment, the best lag, or the best period is a maximum; its null is the distribution of the same maximum on shuffled texts, never the single-value reference.
- **Order blindness.** Because IC ignores order, it cannot see a transposition and cannot distinguish "rotations of one alphabet" from "seven unrelated alphabets" inside cosets.
- **Invariant null.** A shuffle within the tested cosets leaves periodic IC, and every alignment score built only from the coset histograms, exactly unchanged. Such a shuffle can calibrate an order-sensitive language endpoint but not the histogram gate itself.
- **Degenerate objectives.** Maximising the *decrypt's* coincidence rate over an unknown alphabet and shifts is not a solver: on a planted control it found 594–601 coincidences by collapsing letters where the true plaintext has 383.
'''

[[blocks]]
kind = "controls"
body = '''
Two planted references are audited with the same code as every target: a plain period-7 substitution of English at 153 letters (within-coset IC mean $0.0713$ against $0.0652$, $z = +0.8$; union IC after exact alignment at $z = +9.6$ against a shuffle null of $0.0535 \pm 0.0025$) and the same construction over a fractionated inner text (within-coset mean $0.0575$, $z = -1.0$ against monoalphabetic English; alignment $z = +4.0$). The targets' readings are reported on the same scale, so "at the flat-inner reference level" is a comparison with a receipt, not an impression.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Text `COINCIDENCE` ($n = 11$): counts C 3, O 1, I 2, N 2, D 1, E 2.

$$\sum_x n_x(n_x-1) = 3\cdot 2 + 0 + 2\cdot 1 + 2\cdot 1 + 0 + 2\cdot 1 = 12, \qquad n(n-1) = 110, \qquad \operatorname{IC} = 12/110 = 0.109.$$

The value is high because an eleven-letter word repeats letters; at this length the standard error is of the same order as the value, which is why the test is only used on segments of a few dozen letters or more. The [coincidence lab](/labs/coincidence-lab) computes the histogram, the IC and the periodic scan for any pasted text.
'''

[[blocks]]
kind = "notes"
body = '''
The kappa notation follows Friedman. The exact variance is the classical U-statistic variance of a degree-2 kernel. It is what the audit panel prints as "exact s.d. per coset" and "of the mean".
'''

