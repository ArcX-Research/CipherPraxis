title = "Index of coincidence"
subtitle = "Probability that two letters drawn from a text coincide, with its exact standard error"
status = "VERIFIED"
status_note = "Implemented with the exact standard deviation of the estimator and calibrated on planted references: a plain period-7 substitution of English shows within-coset IC 0.0713 against the monoalphabetic expectation 0.0652 (z +0.8), while a fractionated inner text drops to 0.0575 (z -1.0)."
family = "Coincidence and frequency statistics"
