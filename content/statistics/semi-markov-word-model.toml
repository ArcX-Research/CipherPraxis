id = "semi-markov-word-model"
section = "statistics"
title = "Semi-Markov word model"
subtitle = "Score text as whole words of different lengths and bound unfinished guesses"
status = "POWER-LIMITED"
status_note = "The project implements a dynamic program that splits text into dictionary words and a full-token decoder with an exact trie bound for unfinished words. On a separate 95-letter control aligned to word edges, the truth ranged from rank 3 to 42,571 during the first word in a beam of 8,192 and was lost at position 10. This measured power failure means the decoder is not yet used to select answers."
family = "Language priors"
tags = ["semi-Markov", "word model", "segmentation", "lexicon", "beam"]
related = ["quadgram-log-likelihood", "local-language-model-prior", "beam-search", "viterbi-decoding", "word-prefix-csp", "dictionary-attack", "shared-cycle-attack", "power-analysis", "g-quadgram"]
summary = "A semi-Markov, or segmental, language model treats text as a sequence of words with different lengths. It scores whole words instead of overlapping n-grams. This can see whether a decryption is made of real words, which quadgrams do not model directly. One version simply splits candidates for a person to inspect. Another decodes word by word and uses an exact bound for possible completions. At 63–95 letters with shared-alphabet rules, that decoder loses the planted truth too early."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A segmentation of $x_0 \dots x_{n-1}$ is a sequence of words $w_1 \dots w_k$ with lengths $L_1 + \dots + L_k = n$. The model assigns

$$\log P(x) = \max_{w_1 \dots w_k} \sum_{j=1}^{k} \phi(w_j),$$

with $\phi(w) = \log P_{\text{lex}}(w)$ for lexicon words and a fragment cost for out-of-vocabulary pieces. The maximisation is a dynamic programme over end positions,

$$\text{best}[i] = \max_{i - L_{\max} \le j < i} \big(\text{best}[j] + \phi(x_{j:i})\big),$$

$O(n L_{\max})$ for a lexicon lookup per span. The display segmenter uses $\phi(w) = -(1 - 0.15\,|w|)$ for dictionary words (long words preferred) and a cost of $3$ per unmatched letter, $L_{\max} = 16$. The frozen lattice used in the neural-control audits uses a top-100,000 word list with fragment score $-3 - 1.55L$ for fragments of length $L \le 8$.
'''

[[blocks]]
kind = "equations"
title = "Complete-token decoding with an exact completion bound"
body = '''
When the plaintext is unknown and constrained by a cipher model, the decoder extends hypotheses letter by letter through a lexicon trie. Earlier decoders pruned after every letter, so an eight-letter word competed at its four-letter prefix against complete four-letter words and was discarded. The semi-Markov decoder declares the token length at each boundary and bounds every partial word by the best completion of that exact length:

$$U(q, 0) = \text{terminal}(q), \qquad U(q, r) = \max_{q \to q'} U(q', r - 1),$$

over trie edges from node $q$ with $r$ letters remaining. A candidate is compared only with candidates of the same declared length, and every literal extension still updates the injective per-class maps and passes the cipher-model predicate (a shared-cycle rotation or reflection constraint, an all-different constraint on the alphabet) before it is retained.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The plaintext is a concatenation of lexicon words; proper names, numbers spelled out, or deliberate misspellings fall outside the model and are charged as fragments.
- The word list is generic and fixed in advance. It comes from a published frequency list and contains no puzzle-specific terms, so a hit cannot be caused by a hand-picked vocabulary.
- The beam retains enough hypotheses to keep the truth alive until the cipher constraints bite. The measurements below say when it does not.
'''

[[blocks]]
kind = "attack"
title = "Use in an attack pipeline"
body = '''
1. **Display.** Print the segmentation of every candidate that passes a score gate; fluent segments at a rate of $-5$ are common on nulls and are not evidence.
2. **Secondary scorer.** Combine with a character model, e.g. $S = S_{\text{reverse GRU}} + 0.55\,S_{\text{word lattice}}$, to re-rank shortlisted orders.
3. **Decoder.** Extend hypotheses by complete tokens under the cipher constraints; require two frozen planted controls to be recovered before a target is admitted, and run a null bank through the same decoder.
4. **Exact alternative.** Where the vocabulary is small and closed, replace the beam by an exact [word-prefix CSP](/exact/word-prefix-csp): a parse is a crib, and all-different constraints prune exactly.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Segmentation DP over end positions: best[i] = max over j of best[j] +
// phi(x[j:i]). Display scores: phi(w) = -(1 - 0.15*|w|) for a lexicon word,
// -3 per unmatched letter, L_max = 16.
function SEGMENT(x[0..n-1], lexicon, L_max):
    best[0] = 0
    for i in 1..n:
        // x[i-1] left unmatched
        best[i] = best[i-1] - 3; back[i] = i-1
        for j in max(0, i - L_max) .. i-1:
            w = x[j..i-1]
            if w in lexicon and best[j] + phi(w) > best[i]:
                best[i] = best[j] + phi(w); back[i] = j
    // the best-scoring segmentation
    return the words read back through back[] from n

// Exact completion bound for a partial token: trie node q with r letters
// still to read.
function U(q, r):
    // the word ending exactly at q
    if r == 0: return terminal(q)
    return max over trie edges q -> q' of U(q', r - 1)

// Complete-token decoder step: the token length is declared at each boundary;
// a hypothesis is bounded by the best completion of that exact length and
// compared only with equal lengths.
function EXTEND(hyp, letter, declared_length):
    q' = child of hyp.q on letter; if none: reject
    // injective per-class maps
    if not CIPHER_PREDICATE(hyp.maps updated with letter): reject
    hyp.bound = hyp.score + U(q', declared_length - hyp.read - 1)
    return hyp
```
'''

[[blocks]]
kind = "complexity"
body = '''
Segmentation is $O(n L_{\max})$ with hashed lookups. The decoder's cost is beam width times token extensions times the constraint check. A beam of 8,192 on a 95-letter control reached a resident set of about 1.08 GB before the run was stopped to avoid a multi-gigabyte widening.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Early language valley.** The first letters open free residues before any modular constraint bites, so the truth's rank collapses in the first word: ranks $3$, $1{,}068$, $1{,}212$, $29{,}892$, $27{,}125$, $42{,}571$, $26{,}415$, $11{,}761$ through the first eight letters of a 95-letter control at beam $8{,}192$, then loss at position 10 (rank above $113{,}351$ at position 9).
- **Closed-vocabulary parses.** An exact parse that admits no mismatch is voided by a single null letter, transposition or typo in the ciphertext. One-error-tolerant runs are needed before a parse negative is cited.
- **Peaked plaintext.** A small-vocabulary plaintext defeats generic-English word scores in both directions: a correct parse scores poorly and a wrong one may segment fluently.
- **Capped searches.** A search stopped at a node cap is undecided, not negative. The audit ledger lists several parse families that were reported as negative while capped.
'''

[[blocks]]
kind = "controls"
body = '''
Complete-token decoder: after fixing a corpus-boundary defect in the control generator, one real held-out 95-letter word-aligned plant produced the ranks above. This is a measured decoder-power failure, not evidence about the cipher family. A second word-lattice scorer tested 40 planted orders of nine chunks. Ranks inside the pair cap had a median of 1–2 and a worst value of 1,339. Exact parsers with closed vocabularies uniquely recovered planted strings when the search finished, including a 95-letter digit string and a case solved in 6,000 nodes.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Segment `ATTACKATDAWN` with the display costs $\phi(w) = 1 - 0.15\,|w|$ (lower is better) and $3$ per unmatched letter:

- `ATTACK AT DAWN`: $(1 - 0.9) + (1 - 0.3) + (1 - 0.6) = 0.1 + 0.7 + 0.4 = 1.2$;
- `AT TACK AT DAWN`: $0.7 + 0.4 + 0.7 + 0.4 = 2.2$;
- `A T T A C K A T D A W N` as unmatched letters: $12 \times 3 = 36$.

The DP returns the first. Under the completion bound, a hypothesis that has read `ATTA` and declared a six-letter token is bounded by the best six-letter completion of the trie node `ATTA` (`ATTACK`, `ATTAIN`, …), not compared with the complete four-letter word `ATTA` would have to be.
'''

[[blocks]]
kind = "notes"
body = '''
The semi-Markov formulation is the right one for the word-level question; its present status reflects decoder power at short lengths under cipher constraints, not a defect of the model. The successor design branches on high-information (class, cipher-letter) cells instead of text position and keeps exact cycle feasibility inside every partial assignment.
'''

