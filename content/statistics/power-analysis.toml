id = "power-analysis"
section = "statistics"
title = "Power analysis"
subtitle = "Measure how often the full pipeline finds a known answer before trusting a miss"
status = "VERIFIED"
status_note = "Frozen, target-absent pipelines were measured stage by stage. One selector recovered 98.93% across 1,024 trials and separated cells perfectly on 64 more. Another kept the truth in 99.83% of 600 shortlists and 97.5% of the 200 hardest windows. A third passed 256/256. A fourth reached 59/64 = 0.922 and correctly stopped before a live run because its gate required 0.95."
family = "Power and error control"
tags = ["power", "planted controls", "false negative", "gate", "sample size"]
related = ["power-measurement", "planted-controls", "control-first-policy", "blind-controls", "permutation-test", "english-gate-calibration", "estimator-standard-error", "throughput-fail", "held-out-gates", "g-power", "g-held-out"]
summary = "A search miss matters only if the search usually finds an answer when one exists. Power analysis measures that chance directly. Freeze the full pipeline, run it on many planted cases made from separate real prose and random keys, and record exact recovery at each stage with a confidence interval. Simple coverage can mislead. One adaptive shortlist covered only 0.026% of the key space but had 99.8% power. Another pipeline repaired weak starting points and reached 98.9% overall power."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
For a hypothesis family $\mathcal{H}$ and a pipeline $\Pi$ that returns a candidate or a refusal,

$$\text{power}(\Pi, \mathcal{H}, n) = \Pr\big[\Pi(\text{Enc}_{h}(P)) = (h, P)\big], \qquad h \sim \mathcal{H},\ P \sim \text{held-out prose of length } n,$$

estimated by $\hat\rho=k/N$ over independent planted trials, with a binomial interval. The plug-in standard error $\sqrt{\hat\rho(1-\hat\rho)/N}$ is useful away from the boundaries. "Recovers" means the exact planted plaintext and parameters, with an independent forward re-encryption reproducing the ciphertext; partial matches are reported separately. The quantity $1-\rho$ is the average miss probability under the declared fixture distribution. It is not a bound for one particular live instance and does not by itself exclude the family.
'''

[[blocks]]
kind = "equations"
title = "Stage decomposition and gates"
body = '''
A pipeline is measured in stages so that a weak step is not mistaken for a weak selector:

- $S_1$: initialisation (e.g. per-residue monogram start) — fraction of trials with every parameter right;
- $S_2$: exhaustive or exact stage given the true key (e.g. order scan) — should be 1.0;
- $S_3$: end-to-end exact recovery — the power;
- $S_4$: cross-cell discrimination — the planted cell wins against all alternative cells.

Gate rule used by the lanes: a live pass is refused unless $S_3 \ge 0.95$ on the controls. The gate is fixed before the controls are run and is not re-tuned afterwards.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The fixtures match the live problem: same length, same alphabet orders, same relation set, keys drawn uniformly, plaintext from a range disjoint from the model's training and calibration data.
- The pipeline is frozen (hashed) between the power measurement and the live run.
- The plaintext distribution of the fixtures covers the tail the live text might occupy; power measured on ordinary prose ($99.8\%$) fell to $97.5\%$ on the 200 lowest-scoring windows.
'''

[[blocks]]
kind = "attack"
title = "Use in an attack pipeline"
body = '''
1. Write the fixture generator inside the frozen engine, asserting both forward relations on every fixture.
2. Run $N \ge 256$ trials across the full grid of cells (alphabet orders, relations, boundary parameters) and several seeds; report $S_1$–$S_4$.
3. If $S_3$ is below the gate, refuse the live pass and say so in the terminal line; improve the pipeline (a multistart repair took one selector from $255/256$ to $256/256$; never pruning a beam before its score is informative took an order stage from $0.125$ to $0.875$) and re-measure.
4. Only then run the live pass; cite the miss together with the power and the scope (cells, parameter ranges, plaintext class) it was measured for.
5. For time-capped exact searches, power is the *coverage at the cap*: with 20 random plants recovered 20/20 whenever their pair was scheduled but median coverage $0.13$ of the frontier within 24 hours, the power of a capped run is about $0.13$, and a non-hit is "power-unmeasured, scoped inconclusive", not a negative.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Pi = the frozen pipeline; H = the hypothesis grid (cells); prose = held-out
// windows of length n.
function POWER(Pi, H, prose, N, seed):
    rng = RNG(seed)
    k = 0; s1 = 0; s2 = 0; s4 = 0
    for t in 1..N:
        // random key and parameters in the grid
        h = DRAW_UNIFORM(rng, H)
        P = RANDOM_WINDOW(rng, prose)
        c = ENCRYPT(h, P)
        // an independent forward re-encryption
        assert FORWARD_CHECK(h, P, c)
        // per-stage outcomes and the candidate
        result = Pi(c)
        if result.initialisation has every parameter of h right: s1 = s1 + 1
        if result.exact stage given the true h succeeds:        s2 = s2 + 1
        // exact recovery
        if result.candidate == (h, P) and FORWARD_CHECK(h, P, c): k = k + 1
        if the planted cell beats every alternative cell:       s4 = s4 + 1
    rho = k / N
    // or an exact binomial interval
    se = sqrt(rho * (1 - rho) / N)
    return S1 = s1 / N, S2 = s2 / N, S3 = rho +- se, S4 = s4 / N

// gate fixed before the controls are run
function LIVE_GATE(S3, gate):
    // improve the pipeline, then re-measure
    if S3 < gate: return LIVE_REFUSED
    // cite any later miss with S3 and its scope
    return LIVE_ALLOWED
```
'''

[[blocks]]
kind = "complexity"
body = '''
$N$ full pipeline runs: 1,024 trials at 0.09 s per cell for one selector; 64 trials at beam 32,768 for a width-17 order solver; 700 exact selections in the audited null lane. Power measurement is usually cheaper than the live run it licenses.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Coverage is not power.** $8^7/26^7 = 0.026\%$ of keys were in a shortlist that retained the true key $99.83\%$ of the time because the shortlist was chosen adaptively per residue.
- **A weak step is not a weak selector.** Initialisation right in only $41.80\%$ of trials; exhaustive order scan $100\%$; local refit rescued $585/596$ bad starts; end-to-end $98.93\%$. The earlier reading "closes little" was withdrawn once the stages were measured.
- **Small-sample optimism.** $31/32 = 0.969$ became $59/64 = 0.922$ (95% interval $[0.856, 0.988]$) with more trials, below the $0.95$ gate.
- **Detecting the class is not recovering the object.** A span selector picked the planted structural class in $12/12$ positives but recovered the exact map in only $3/6$ and $4/6$; in the failures the wrong map scored higher than the truth under the frozen model, so more restarts cannot help, and $2$ to $5{,}040$ disk completions remained ambiguous.
- **Plants sharing a model range.** Fixtures drawn from the same corpus tail used as the model's second argument are disjoint from training but not from calibration. A clean design uses a third range.
'''

[[blocks]]
kind = "controls"
body = '''
Segment-chain programme, target-absent: no-transposition lane $97.5$–$99.8\%$ (600 reachability trials, $10/10$ end-to-end); width-9 lane $98.93\%$ ($1{,}013/1{,}024$, $S_4$ $64/64$); width-3 lane $100\%$ ($256/256$); width-17 lane $0.9219$, live refused. Derived-alphabet invariant: power $47/48$, negatives $6/6$. Exact semi-Markov panel: $20/20$ recovered when scheduled, coverage at the cap $0.012$–$1.0$ (median $0.13$). Every live miss in the programme is cited with these numbers and the scope they cover, and no plaintext was produced.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
A lane recovers $59$ of $64$ planted fixtures exactly. The point estimate is $0.922$. The plug-in standard error is $\sqrt{0.922\times0.078/64}=0.034$; the Wald interval is about $[0.856,0.988]$, while an exact binomial interval is roughly $[0.83,0.98]$. The predeclared gate uses the recovery count or point estimate and requires at least $0.95$, so this panel fails it. The observed miss rate is about 8% on this fixture distribution, with substantial uncertainty; it is not the probability that a particular live text was missed.

Rule of three for perfect scores: $256/256$ recoveries bound the miss rate below about $3/256 = 1.2\%$ at 95% confidence; $20/20$ only below $15\%$.
'''

[[blocks]]
kind = "notes"
body = '''
Power is a property of the complete pipeline on the exact hypothesis grid, at the exact length, with plaintext of the exact kind. A number measured elsewhere does not transfer. The reverse error, treating a step-level success rate or a coverage fraction as power, has produced both over- and under-statements in the evidence corpus and is the reason the stage decomposition is mandatory.
'''

