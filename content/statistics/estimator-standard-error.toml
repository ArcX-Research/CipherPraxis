id = "estimator-standard-error"
section = "statistics"
title = "Estimator standard error"
subtitle = "Give every measurement an error range, from a formula or matched simulations"
status = "VERIFIED"
status_note = "Every coset reading includes the exact standard deviation of the index of coincidence: 0.0210 for one 22-letter coset and 0.0079 for the mean of seven at 153 letters. Tests without a direct formula use planted simulations or held-out windows. One audit showed that a repeated “not monoalphabetic” claim was only 1.5 standard deviations from expectation."
family = "Null distributions and calibration"
tags = ["standard error", "variance", "error bars", "U-statistic", "simulation"]
related = ["index-of-coincidence", "shuffled-null-z-score", "power-analysis", "english-gate-calibration", "chi-squared-fit", "planted-controls", "g-z-score", "g-held-out"]
summary = "A measurement needs a standard error to show how much it may vary by chance. This site uses three sources. Exact formulas work when available. Planted simulations encrypt real English with random keys under the tested cipher. Held-out calibration measures thousands of separate text windows at the target length. Comparing an observation with the right error range gives its z-score and helps separate a real pattern from normal variation."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
For an estimator $\hat\theta$ of a quantity $\theta$ with sampling standard deviation $\sigma_{\hat\theta}$, the standardised reading is

$$z = \frac{\hat\theta - \theta_0}{\sigma_{\hat\theta}},$$

where $\theta_0$ is the value predicted by the hypothesis under test. Three ways of obtaining $\sigma_{\hat\theta}$:

- **Exact.** For the [index of coincidence](/statistics/index-of-coincidence) of $n$ independent letters from distribution $p$, with $\kappa_2 = \sum p_x^2$, $\kappa_3 = \sum p_x^3$ and $P = n(n-1)/2$,
  $$\sigma^2_{\operatorname{IC}} = \frac{P\,\kappa_2(1-\kappa_2) + 2P(n-2)(\kappa_3 - \kappa_2^2)}{P^2}.$$
- **Simulated.** Encipher $R$ real text windows under the hypothesised construction with random keys, compute the statistic each time, and take the sample standard deviation (e.g. the IC of a specific key geometry on real English: $0.04326 \pm 0.00324$).
- **Held-out.** Compute the statistic on thousands of genuine windows of the target length (e.g. distinct-letter count of English: $15.19 \pm 1.56$ at 33 letters, $17.78 \pm 1.51$ at 53 letters, from 2,500 windows per length).
'''

[[blocks]]
kind = "equations"
title = "Means of cosets and proportions"
body = '''
- The mean of $m$ independent coset readings has standard error $\sigma/\sqrt{m}$: $0.0210/\sqrt{7} = 0.0079$.
- A recovery rate $\hat\rho = k/N$ from planted trials has standard error $\sqrt{\hat\rho(1-\hat\rho)/N}$: for $1013/1024$, $0.9893 \pm 0.0032$; for $59/64$, $0.922$ with a 95% interval $[0.856, 0.988]$.
- An empirical $p$ from $N$ nulls has resolution $1/(N+1)$ and, for a true $p$ near $0.5$, standard error $\approx 0.5/\sqrt{N}$: nine nulls resolve nothing finer than $0.1$.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The exact IC formula assumes independent letters; real prose (word repeats) scatters more, which is why simulated references on real text accompany it.
- Simulated standard errors are only as good as the simulated plaintext and key distributions; a peaked non-prose plaintext or a structured key is outside them.
- Held-out windows must not overlap the model's training data or the planted controls.
'''

[[blocks]]
kind = "attack"
title = "Use in an attack pipeline"
body = '''
1. Print every measurement as value, expected value under the hypothesis, standard error and $z$.
2. Treat $|z| < 2$ as "consistent", $2$–$3$ as "strained", and require $|z| \ge 3$ together with a matched null before calling anything a fact; with many readings, apply the [family-wise](/statistics/family-wise-null) correction.
3. Use the error bar to size the next experiment: to turn a $1.5\sigma$ coset reading into a $3\sigma$ one at the same effect requires four times the letters.
4. Prefer instruments with smaller standard errors for the same question: the aligned union IC and the aligned digram IC were sharper than the mean coset IC for the monoalphabetic question.
'''

[[blocks]]
kind = "complexity"
body = '''
Exact formulas are $O(26)$. Simulated errors cost $R$ encryptions and statistic evaluations (400 planted references per model in the independent recomputation; 300 planted prose zones for the pooled lag rate). Held-out calibration over 2,500 windows per length is seconds.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Ignoring correlation.** The binomial guess $\sqrt{\kappa_2(1-\kappa_2)/P}$ is $0.016$ at $n = 22$; the exact value is $0.021$, 30% larger, because pairs sharing a position are positively correlated.
- **Too few draws for a skewed maximum.** A change-point statistic reported at $z = +3.3$ rested on 60 null draws of a right-skewed maximum; the error bar of the error bar was not small.
- **Ambiguity of the hypothesis.** An IC that matches one key geometry to $z = +0.38$ also matches 134 of 373 alternative geometries within one standard deviation; a small $z$ certifies consistency, not identification.
- **Over-reading small z.** "Cosets are not monoalphabetic" was a $-1.5\sigma$ reading (mean coset IC $0.0536$ against $0.0652$ with standard error $0.0079$); several search rounds branched on it as if it were a fact.
'''

[[blocks]]
kind = "controls"
body = '''
The exact IC error bar was checked on planted references: a plain periodic substitution of English gave a mean coset IC of $0.0713$, $z = +0.8$ against the monoalphabetic expectation $0.0652$; a fractionated inner text gave $0.0575$, $z = -1.0$; both inside the error bar as they should be. The digram IC of the aligned text was compared with 60 English windows ($0.0074 \pm 0.0014$) and with 200 shuffles ($0.0059 \pm 0.0008$) at the same time, so that "English-like" and "above random" are separate statements.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
English letter frequencies give $\kappa_2 = 0.0655$ and $\kappa_3 = 0.00535$. For a coset of $n = 22$ letters, $P = 231$ pairs:

$$P\kappa_2(1-\kappa_2) = 231 \times 0.0655 \times 0.9345 = 14.14, \qquad 2P(n-2)(\kappa_3 - \kappa_2^2) = 462 \times 20 \times (0.00535 - 0.00429) = 9.79,$$

so $\sigma_{\operatorname{IC}} = \sqrt{14.14 + 9.79}/231 = 4.89/231 = 0.0212$, and for the mean of seven cosets $0.0212/\sqrt{7} = 0.0080$ (the corpus table in the receipts gives $0.0210$ and $0.0079$). A mean coset IC of $0.0536$ is then $z = (0.0536 - 0.0652)/0.0079 = -1.5$: not evidence against monoalphabetic cosets. Without the covariance term the standard error would be $\sqrt{14.14}/231 = 0.0163$ and the same reading would be misreported as $z = -1.9$.
'''

[[blocks]]
kind = "notes"
body = '''
The phrase "the facts with error bars" in the evidence corpus refers to this practice: the audit script recomputed, with exact or simulated errors, every quantity earlier search rounds had branched on, and several of them turned out to be within noise.
'''

