id = "crib-driven-alphabet-recovery"
section = "cryptanalysis"
title = "Crib-driven alphabet recovery"
subtitle = "Use likely plaintext to fix repeating shifts, then search only the mixed alphabet"
status = "VERIFIED"
status_note = "In recorded 153-letter controls with one unknown alphabet, batch annealing recovered mixed-plaintext alphabets for 3/3 seeds at every tested crib length from 7, but mixed-ciphertext alphabets in only 12/21 seed-length cases. When the same unknown alphabet acted on both sides, annealing recovered 0/21 controls; an exact solver with the planted keyword recovered 1/3 at 13 and 15 letters, 2/3 at 17, and 3/3 at 20. These are measured control rates, not fixed crib-length guarantees (logs/22, 42)."
family = "Known-plaintext methods"
tags = ["crib", "mixed alphabet", "keyed substitution", "simulated annealing", "constraint satisfaction", "polish basin"]
related = ["quagmire-i", "quagmire-ii", "quagmire-iii", "quagmire-iv", "keyword-mixed-alphabet", "crib-dragging", "simulated-annealing", "parallel-tempering", "polish-basin-measurement", "constraint-satisfaction-forward-checking", "all-different-constraints", "power-measurement", "g-crib", "g-selection-freedom"]
summary = "A repeating keyed substitution hides both its shifts and its mixed alphabet. A contiguous crib at least as long as the period supplies a value for every shift under each trial alphabet; longer cribs also impose consistency checks. The alphabet then remains the main search variable. Recorded one-sided controls were recoverable with unequal success rates, while local search failed all tested same-alphabet controls. A separate exact formulation can exploit a declared keyword, but its recovery probability still depends on crib content and length."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Families with an unknown alphabet $A$ and a known reference order $B$ (straight or a known keyed alphabet):

- **mixed plaintext alphabet** ($P = A$, $C = B$): $\operatorname{idx}_B(c) = \operatorname{idx}_A(p) + k_b$;
- **mixed ciphertext alphabet** ($P = B$, $C = A$): $\operatorname{idx}_A(c) = \operatorname{idx}_B(p) + k_b$;
- **same alphabet both sides** ($P = C = A$): $\operatorname{idx}_A(c) = \operatorname{idx}_A(p) + k_b$.

For the one-sided families the additive and reciprocal relations are equivalent after reversing the unknown alphabet, provided both orientations are admitted. A crib letter in coset $b$ implies $k_b$ for the alphabet under test. A contiguous crib of at least $m$ letters reaches every residue, so the shifts can be derived rather than searched independently. If $L>m$, repeated votes can disagree; the crib is satisfied exactly only when all those consistency constraints hold.
'''

[[blocks]]
kind = "equations"
title = "Search and exact formulation"
body = '''
Batch annealing: $N$ chains (one per crib, offset, relation and restart), each holding an alphabet. A step proposes a swap or an insertion in every chain, derives the shifts from the crib votes, scores the full decrypt with quadgrams minus $\mu$ per unsatisfied vote, and accepts per chain by the Metropolis rule on a geometric schedule ($T$ from 8 to 0.25). The best chain of each placement is polished by first-improvement over all 925 swap and insertion neighbours.

Exact formulation for the same-alphabet family with a key word $W$ under the rule $k_b = \operatorname{idx}_A(W_b)$: each crib letter gives one linear equation over $\mathbb{Z}_{26}$ in the **positions** of three letters,

$$\operatorname{idx}_A(c_i) - \operatorname{idx}_A(p_i) - \operatorname{idx}_A(W_{i \bmod m}) \equiv 0 \pmod{26},$$

with the 26 positions all different. For this tied-key equation, translating every alphabet position by the same constant changes the equation by that constant; global rotation is therefore **not** a gauge and no alphabet position may be fixed without a separate symmetry proof. (A different formulation with independent numeric key variables can have a rotation gauge.) Unit propagation and branching on the most constrained letter enumerate every consistent partial assignment within the search cap. The letters the crib does not touch form a residual substitution problem completed heuristically by a quadgram hill-climb.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The crib is present at the tested offset in the cipher's own convention. The family (which side is mixed) is one of those being tried.
- One-sided families: the known side is really the reference order.
- Same-alphabet family: the exact route needs the key-word rule and the key word itself; with the word free the seven extra unknowns multiply the assignments past any cap.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. For each family, crib and offset, run the batch annealer; compare its polished rate with matched wrong placements. The recorded implementation printed rates above $-5.0$, a local screening value rather than a universal threshold.
2. Re-anneal the top placements with more restarts and steps. Compare end-to-end language scores with controls produced by the same language table and normalisation; the recorded solved controls were near $-4.3$.
3. For the same-alphabet family, do not anneal: enumerate candidate key words and cribs of 12 letters or more at every offset with the exact solver; rank consistent assignments by the quadgrams of their pinned letters, complete the best, and polish with the key-word-aware 925-neighbour climb (planted control reads at $-4.14$).
4. Two short cribs placed jointly can supply as many raw equations as one long crib (19 from lengths 13 and 6), although repeated letters can make some constraints dependent. The recorded placement plan had about $4\times10^5$ pairs, most rejected in under a millisecond.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertext c[0..n-1], period m, crib at offset o, penalty mu per
// unsatisfied vote; the family says which side holds the unknown alphabet A
// (the other side is the known order B).
function SHIFTS_FROM_CRIB(c, crib, o, m, A, B, family):
    for j in 0..|crib|-1:
        b = (o + j) mod m
        if family == "mixed plaintext alphabet":
            ADD(vote[b], (idx_B(c[o+j]) - idx_A(crib[j])) mod 26)
        if family == "mixed ciphertext alphabet":
            ADD(vote[b], (idx_A(c[o+j]) - idx_B(crib[j])) mod 26)
        if family == "same alphabet both sides":
            ADD(vote[b], (idx_A(c[o+j]) - idx_A(crib[j])) mod 26)
    for b in 0..m-1:
        k[b] = MAJORITY(vote[b])
        nu = nu + dissenting votes in vote[b]
    // a contiguous crib of at least m letters defines every k[b] for the
    // alphabet under test
    return (k, nu)

// only the alphabet remains unknown; the crib is satisfied by construction
function SCORE(A):
    (k, nu) = SHIFTS_FROM_CRIB(c, crib, o, m, A, B, family)
    return QUADGRAM_SCORE(DECRYPT(c, A, B, k, family)) - mu * nu

function RECOVER_ALPHABET(c, cribs, m, family, B, mu):
    // one annealing chain per placement
    for each crib, offset o, relation and restart:
        A = ANNEAL(SCORE, moves = swap or insertion, Metropolis acceptance on
                a geometric schedule)
        A = FIRST_IMPROVEMENT_POLISH(A, SCORE, all 925 swap and insertion
                neighbours)
        rate[placement] = SCORE(A) / letters
    // the null level of all wrong placements
    null = { rate[placement] : placement wrong }
    re-anneal the top placements with more restarts and steps
    a real hit reads as language end to end
    return (best placement, its rate, null)

// same-alphabet family with key word W: do not anneal, enumerate
function EXACT_SAME_ALPHABET(c, crib, o, m, W):
    equations: idx_A(c[i]) - idx_A(crib[i - o]) - idx_A(W[i mod m]) = 0 (mod
            26) for every crib position i
    subject to: the 26 positions all different
    // with key letters tied to A, global alphabet rotation is not a gauge
    assignments = ENUMERATE(unit propagation, branch on the most constrained
            letter)
    rank assignments by the quadgrams of their pinned letters
    complete the best by a quadgram hill-climb
    polish
    return (best assignment, its rate, rates of the wrong placements)
```
'''

[[blocks]]
kind = "complexity"
body = '''
Annealer: chains $\times$ steps $\times$ (one $n$-letter decrypt and quadgram sum); 2,400 chains per job on one core, 6,701 placements $\times$ 16 restarts $\times$ 40k steps in about 3 h per text on 12 cores. Exact CSP: node counts from a few dozen (wrong placement) to $3 \times 10^5$ (cap); 14,336 placements for eight key words and 14 cribs on two zones in hours (logs/43).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **The alphabet acting twice.** In the same-alphabet family every swap is both a cryptogram move and a re-slotting of two ciphertext letters: a swap corrupts about 4 of 26 mapping entries in every coset. The crib widens the polish basin only to 3 swaps at 13 letters and 6 swaps at 25; annealing from random plateaus at 35 to 42% of the alphabet with 2,000 chains and does not improve with 8,000 (logs/32, 36), and 0/24 planted controls solve blind (logs/08).
- **Crib length.** In the three recorded seeds with the key word known, the exact solver recovered 1/3 at 13 and 15 letters, 2/3 at 17, and 3/3 at 20; one solved 13-letter case left 2,148 assignments before completion. This small panel does not define a generally reliable length. With the keyword free, none of the 18 tested cases pinned the alphabet.
- **Moderate power on the mixed-ciphertext side.** One planted seed failed at most crib lengths (12/21 overall), so a negative there is weaker than on the mixed-plaintext side.
- **Nothing read on the corpus texts** for the four validated families, at the wrong-placement null in every sweep (logs/23, 26, 43). The same-alphabet rows produced by the annealer are not evidence either way and were not counted.
'''

[[blocks]]
kind = "controls"
body = '''
Calibration table (logs/22; planted period-7, random alphabet and shifts, real English, true crib at its offset, 16 restarts $\times$ 40k steps, 3 seeds):

```
family                       7    9   11   13   16   20   25   (crib length)
mixed plaintext alphabet    3/3  3/3  3/3  3/3  3/3  3/3  3/3   100% match, 9-16 of 16 restarts read
mixed ciphertext alphabet   2/3  1/3  1/3  2/3  2/3  2/3  3/3   100% when solved, 0-7 of 16 restarts
same alphabet both sides    0/3  0/3  0/3  0/3  0/3  0/3  0/3   22-36% match, 8 restarts
```

Exact solver with the keyword known (logs/42): 13 letters 1/3 (2,148 assignments, completion 100%), 15 letters 1/3 (396 assignments), 17 letters 2/3 (2,028 and 96), and 20 letters 3/3 (240 and 24 assignments). One case hit its cap but still completed at 100%. With the keyword free, the result was 0/18. A sweep of eight keywords $\times$ 14 long cribs $\times$ every offset on both zones (logs/43) tested 14,336 placements, found 244 consistent cases, and reached a best score of $-5.42$ with no candidate.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Mixed plaintext alphabet $A$ = `ZEBRASCDFGHIJKLMNOPQTUVWXY` (keyword-mixed), straight ciphertext alphabet, period 2 with shifts $(3, 10)$. Encrypting `ATTACKATDAWN` by $\operatorname{idx}_B(c) = \operatorname{idx}_A(p) + k_{i \bmod 2}$ gives `HEXOJXHEKOAA` (A is at position 4 in $A$, so $c_0 = 4 + 3 = 7$ = H; T is at 20, so $c_1 = 20 + 10 \equiv 4$ = E).

Now suppose $A$ is unknown and the crib `ATTACK` is placed at offset 0. The six equations $\operatorname{idx}_A(p_j) + k_{j \bmod 2} = \operatorname{idx}_B(c_j)$ give, after eliminating the two shifts, the relative positions

$$\operatorname{idx}_A(T) - \operatorname{idx}_A(A) \equiv 16, \quad \operatorname{idx}_A(C) - \operatorname{idx}_A(A) \equiv 2, \quad \operatorname{idx}_A(K) - \operatorname{idx}_A(A) \equiv 9, \quad k_1 - k_0 \equiv 7,$$

and the two letters that occur in both cosets (A at positions 0 and 3, T at positions 1 and 2) give the same shift difference $k_1-k_0\equiv7$. Under an independent-uniform implied-value null, one such equality rejects a wrong placement with probability $25/26$; real overlapping text requires an empirical placement null. Four letters of $A$ are pinned relative to each other. The remaining 22 positions are what the annealer or exact completion must supply, using the rest of the text.
'''

