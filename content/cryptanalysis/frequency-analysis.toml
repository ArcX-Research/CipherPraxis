title = "Frequency analysis"
subtitle = "Start with letter counts, coset counts, and patterns across letter groups"
status = "VERIFIED"
status_note = "The basic tests include single-letter likelihood, chi-square, correlation, coincidence rates with exact errors, and alphabet-free count comparisons. Planted checks calibrate each one. A coset-likelihood screen ranked the planted alphabet first of 2.06 million. A chi-square fit recovered a keyed text at 100%, and segment checks reproduced the expected z-scores (logs/24, 07, 38, 01)."
family = "Period and structure recovery"
