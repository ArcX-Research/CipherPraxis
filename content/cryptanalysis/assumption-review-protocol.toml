id = "assumption-review-protocol"
section = "cryptanalysis"
title = "Assumption review protocol"
subtitle = "Check the facts behind repeated negative results before testing another cipher family"
status = "VERIFIED"
status_note = "Two independent reviews used the same brief and resolved differences with data. They listed facts with nulls, marked assumptions keep/drop/undecidable, ranked possible ciphers, chose decisive tests, and recorded corrections. One biased whole-text statistic was withdrawn, and earlier whole-text results were reclassified as zone effects. Later family reviews use this method (STEP3 notes, logs/38, 58)."
family = "Method governance"
tags = ["governance", "assumptions", "review", "selection bias", "successor review", "ciphertext-only"]
related = ["control-first-policy", "tautological-gate-rule", "valid-model-nulls", "seal-and-audit-protocol", "correction-and-retraction", "selection-overfit-check", "change-point-zone-detection", "family-identification", "segment-chain-analysis", "g-successor-review", "g-family-sweep", "g-selection-freedom", "g-zone"]
summary = "Many negative results may all depend on the same weak assumption. An assumption review pauses the search and lists every measured fact with its null test. It names each assumption, says how to test it, and marks it keep, drop, or undecidable. It then ranks the cipher families that still fit and records any corrections. A second reviewer repeats the work, and new measurements can resolve disagreements or leave them open. Before a new family is built, a shorter successor review checks overlap, algebra, equivalent cases, cost, controls, and the stop rule."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
The protocol is a fixed sequence of documents and measurements:

1. **Facts** $F_1 \dots F_k$: what is measured, model-free where possible, each with its null (shuffle type, replicate count) and $z$.
2. **Assumptions** $A_1 \dots A_j$: list what every negative result has quietly assumed, such as prose plaintext, an additive layer, noise in flat sections, an unstructured alphabet, or a literal reading of outside information.
3. **Verdicts**: KEEP, DROP or UNDECIDABLE for each assumption, with the statistic that decides it. UNDECIDABLE requires either an identifiability argument under the declared observations and model class or a clear statement that the available evidence does not decide it; it does not assert that no conceivable statistic could work.
4. **Constructions** consistent with all kept facts, ranked, each with the test that would distinguish it and what each outcome buys.
5. **Decisive tests** chosen by cost times decisiveness, then **corrections**: verdicts withdrawn, negatives reclassified, and why.

The **ciphertext-only policy** restricts the admitted inputs of any model selection to ciphertext, generic language statistics, modular algebra and prior test measurements; everything else is quarantined.
'''

[[blocks]]
kind = "equations"
title = "The bias the protocol caught"
body = '''
A statistic $T$ computed with parameters $\hat\theta$ fitted on the whole text, then evaluated on a part of it, inherits selection from the fit. The corpus's alignment decomposition counted cross-coset coincidences between a text's middle and its ends at shifts fitted on the whole text, and read $z +2.3$ / $+2.1$ as "the ends cohere with the middle". Re-fitted on the middle only, the mid-to-end coincidences fell to $z +1.9$ (one order) and $+1.5$ (the other), and a *planted* language tail under the same shifts gave $z +1.4 \pm 1.8$ and $+1.5 \pm 2.3$: the statistic cannot separate "language ends" from "random ends" at this geometry, and the earlier DROP of the noise-ends assumption was withdrawn (logs/58).
'''

[[blocks]]
kind = "assumptions"
body = '''
- Every claimed fact carries a receipt (log, replicate count, null type); facts without receipts are downgraded to conjectures.
- Two reviewers work independently on the same brief before comparing. A new measurement may resolve a disagreement; otherwise the disagreement remains recorded rather than being forced into a verdict.
- A negative binds only within the scope of its assumptions, its text length and its control power. The protocol makes that scope explicit.
'''

[[blocks]]
kind = "attack"
title = "Procedure"
body = '''
1. Write the fact table with nulls; recompute anything quoted from memory.
2. For each assumption ask what negatives depend on it and what would change if it were false; classify negatives as still binding, void, or reinterpreted.
3. Test the cheap decisive things first (a segment identity test, a windowed lag map, a coset-IC dispersion test), each with planted references at the text's own geometry.
4. Rank constructions; propose at most a few tests with their expected outcomes written down beforehand.
5. Record corrections in the same document that made the original claims; downstream documents cite the correction.
6. **Successor review** for any new family after a negative: show exactly what each earlier lane covered and why it misses the new proposal. Give the exact algebra and reduction, count which raw cells describe the same identifiable class before scoring language, rank the options by cell count and cost, and plan controls, boundary sentinels, and a stop rule. The allowed end states must not overclaim: a miss by an incomplete selector is INCOMPLETE, not a family rejection; a passed control shows test power, not that the family is present.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Admitted inputs (ciphertext-only policy): ciphertext, generic language
// statistics, modular algebra, prior test measurements; all else is
// quarantined.
function ASSUMPTION_REVIEW(ciphertext, prior_results, negatives):
    facts = []
    // nothing quoted from memory
    for each measured statistic F:
        recompute F and record (value, null type, replicate count, z)
    downgrade any fact without a receipt to a conjecture
    for each assumption A behind the negatives (prose plaintext, additive
            layer, noise in flat parts, unstructured alphabet, ...):
        dependents[A] = { negatives that rely on A }
        verdict[A] = KEEP or DROP when a declared statistic decides it, or
                UNDECIDABLE with an identifiability argument for the declared
                observations and model class, or with the evidence gap stated
        for each negative in dependents[A]:
            classify it as still binding, void, or reinterpreted
    run the cheap decisive tests first (segment identity, windowed lag map,
            coset-IC dispersion), each with planted references at the text's
            own geometry
    constructions = the families consistent with all kept facts, ranked, each
            with the test that distinguishes it and what each outcome buys
    tests = a few decisive tests chosen by cost x decisiveness, their
            expected outcomes written down beforehand
    corrections = verdicts withdrawn, negatives reclassified, and why
    recorded in the document that made the original claims
    a second reviewer fills the same sheet blind
    disagreements are tested by a new measurement and otherwise remain open
    return (facts, verdicts, constructions, tests, corrections)

function SUCCESSOR_REVIEW(new_family, earlier_lanes):
    show what each earlier lane covered and why it misses the new proposal
    give the exact algebra and reduction; count which raw cells describe the
            same identifiable class before any language scoring
    rank the options by cell count and cost
    plan controls, boundary sentinels and a stop rule
    end states: a miss by an incomplete selector is INCOMPLETE, not a family
            rejection; a passed control shows power, not presence
    return the review
```
'''

[[blocks]]
kind = "complexity"
body = '''
Cheap in machine time, expensive in thought: the corpus's two passes plus probes took about 25 minutes of computation (five probes, logs/38 to 42) and a day of writing. The successor reviews are static documents with hash-pinned inputs and small scratch known-answer tests.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Compounding.** Twenty-one whole-text key searches assumed facts estimated by heuristics at 153 letters: a period-7 outer layer, non-monoalphabetic cosets, no digram structure, and a mixed inner layer. Once the text was found to contain separate zones, the "mixed inner" pattern proved false. Every family chosen because of that pattern had been aimed at the wrong target.
- **Wrong plaintext model.** Crib attacks, key-word sweeps and annealers aimed at prose on a 144-letter zone whose plaintext is a peaked small-vocabulary text produced negatives that carry no weight.
- **Undecidable assumptions treated as decided.** Equality and count statistics computed separately within each coset cannot distinguish rotations of one alphabet from unrelated per-coset substitutions: both merely relabel each coset. The protocol records additivity as UNDECIDABLE from those observables, rather than extending that limited non-identifiability claim to every possible statistic.
- **Reading a change point as a key proof, or a peaked prefix as a Caesar proof.**
- **Family sweeps as lottery tickets.** After the enumerable structured families are exhausted, further sweeps cost machine time and buy nothing. The protocol's recommendation was to stop them and look for the missing key material outside the ciphertexts.
- **Unbacked rows.** A design note's table claimed a cross-text periodic-difference result for which no implementation or transcript existed. A later audit found it and it is not cited as evidence anywhere in this atlas.
'''

[[blocks]]
kind = "controls"
body = '''
The protocol carries its own planted controls: 100 texts per geometry for the segment-identity test (logs/38), 300 zones for the coset-IC spread and same-coset rate checks, a language tail for the alignment split (logs/58), and one control for every solver used in a decision. Two independent reviews agreed on the zone facts, the prose result for one zone, the inability to decide additivity, and the remaining construction. Data settled their differences. Constant drift fit one text's prefix but not the other text's ends. The segment-histogram test failed its own planted cases. The crib CSP needed a known keyword and a crib 15 to 17 letters long.
'''

[[blocks]]
kind = "example"
title = "Reproducible template"
body = '''
A minimal review sheet for a 150-letter ciphertext with a suspected period-7 layer:

```
FACT   statistic                      value   null (type, N)              z
F1     exact period-7 alignment IC    ...     position shuffle, 200       ...
F2     same-coset coincidence, lag 7  ...     within-coset shuffle, 200   ...
F3     letter-set change over t       ...     max-over-t shuffle, 400     ...

ASSUMPTION                                  verdict       decided by
A1  plaintext is prose                      KEEP/DROP     zone prose checks vs 300 planted zones
A2  layer is additive (one alphabet)        UNDECIDABLE   invariance of same-coset statistics
A3  flat parts are noise                    OPEN          identity test with planted references
A4  alphabet has enumerable structure       KEEP/DROP     the structured-family sweeps and their scope

CONSTRUCTIONS consistent with kept facts, ranked, each with its decisive test and cost.
CORRECTIONS: what was withdrawn, which negatives are void, which are reinterpreted.
```

Every number in the sheet points to a log. Every verdict names the statistic and its null. A second reviewer fills the same sheet blind before the two are compared.
'''

