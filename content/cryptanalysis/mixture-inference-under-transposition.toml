id = "mixture-inference-under-transposition"
section = "cryptanalysis"
title = "Mixture inference under transposition"
subtitle = "Test a short repeating inner layer through a candidate transposition and outer layer"
status = "VERIFIED"
status_note = "The likelihood fit averages over outer shifts and solved four planted layered controls from a cold start, ranking their true tested widths first at recorded z-scores from 4 to 13 and recovering every plaintext letter. Specified fractionated, plain, and double-columnar controls gave different signatures. On the two research texts it found no width passing its threshold in the scanned order and geometry combinations; this is not a result for arbitrary transpositions (logs/05)."
family = "Layered-construction inference"
tags = ["mixture", "Bayesian evidence", "sandwich", "histogram model", "class posterior", "EM"]
related = ["sandwich-construction", "vigenere", "quagmire-iii", "columnar-transposition", "bayesian-evidence-model-selection", "expectation-maximisation", "order-free-width-statistic", "transposition-width-recovery", "exact-period-alignment", "family-identification", "g-inner-and-outer-layer", "g-selection-freedom", "g-coset"]
summary = "Consider a short-period substitution, followed by a transposition, then a longer-period additive layer. The transposition preserves the inner stream's global multiset, but its allocation to later outer cosets depends on the transposition geometry. When each outer coset receives the same known or modelled mixture of inner phases, a solver can estimate that mixture while averaging over the outer shifts. Class probabilities can then expose block patterns at candidate widths. The recorded method passed four specified layered controls; it is not invariant to an arbitrary transposition."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Consider $C = Q_m\big(T(Q_k(P))\big)$: an inner additive substitution of period $k$ with shifts $g_0, \dots, g_{k-1}$, a transposition $T$, and an outer additive layer of period $m$ with shifts $u_0, \dots, u_{m-1}$. The transposition exactly preserves the **global empirical multiset** of $Q_k(P)$. Under a stationary plaintext marginal $E$, and when the inner phases occur equally often, the expected global distribution is the balanced mixture

$$f(x) = \frac{1}{k} \sum_{j=0}^{k-1} E(x - g_j).$$

That global statement does not imply the same mixture in every outer coset. Let $w_{b,j}$ be the fraction of output positions in outer coset $b$ whose preimages under $T$ have inner phase $j$. Under the same marginal model,

$$\mathbb{E}\!\left[\frac{F_b(x)}{n_b}\right]
=\sum_{j=0}^{k-1}w_{b,j}E(x-u_b-g_j).$$

The common-mixture likelihood below assumes the weights $w_{b,j}$ are equal across $b$ (or that the declared generator makes that approximation adequate). This must be checked from the candidate geometry or with matched simulations. Three restricted inner models are compared: $M_1$, one shifted language marginal; $M_2$, a common two-component mixture $wE(x-g_1)+(1-w)E(x-g_2)$; and $M_3$, three components. Within $M_2$, only the inner **spacing** $\delta=g_2-g_1$ is identified at this stage because a common rotation can be absorbed by the outer shifts.
'''

[[blocks]]
kind = "equations"
title = "Evidence with nuisance shifts integrated out"
body = '''
For a model $f$ and coset histograms $F_b$,

$$\log Z(f) = \sum_{b=0}^{m-1} \log \frac{1}{26} \sum_{u=0}^{25} \prod_x f(x-u)^{F_b(x)}.$$

A family's evidence is the mean of $Z(f)$ over its bank members, implementing a uniform prior over that declared bank. This avoids the raw-sum preference for a larger bank, but it is not an automatic universal complexity penalty: duplicate members and different prior weights change the result. The $\delta$-marginal evidence groups the $M_2$ bank by spacing. In the recorded experiment, profiling $u$ instead of marginalising added about $0.15$ nats per letter at $n=153$ and let wrong models win on shuffled texts. Under the fitted common-mixture model each letter gets a class posterior

$$P_i(\gamma) \propto w_\gamma E\big(y_i - g_\gamma\big), \qquad y_i = c_i - u_{i \bmod m},$$

which feeds the order-free width statistic; class-EM re-estimates each $u_b$ from the class-conditional likelihood once a width lays out the classes.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The outer layer is additive in a known order and the inner is additive in a known (possibly different) order; both orders are tried.
- The implemented inner bank has period $k=2$ or $3$. A mixture of many well-spread rotations often approaches uniform, but repeated or clustered shifts need not; loss of spacing information is model-dependent.
- The inner plaintext is language with a peaked distribution. A fractionated or random inner gives $M_2$ and $M_3$ evidence at the null.
- The text is homogeneous along its length. A zoned text mimics a mixture (see failure modes).
- Candidate transpositions distribute inner phases across outer cosets in the way assumed by the common-mixture model. Global histogram preservation alone is insufficient.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Coset histograms in the outer order; evidence of $M_1$, $M_2$, $M_3$ with shifts and banks marginalised; $z$ of each evidence against shuffled texts.
2. Read the best spacings $\delta$ from the $\delta$-marginal. It was correct on 7 of 8 planted seeds, and the search keeps the top three values.
3. Class posteriors, order-free width scan with class-EM refinement, nulls through the identical pipeline.
4. For widths passing the predeclared full-pipeline calibration (the recorded run used $z\ge3$ per scanned width), fix residue classes from the block phases, order the rest by quadgrams, and polish shifts against order. Correctness still requires an exact forward reconstruction and a control-qualified language gate.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertext c[0..n-1] in the outer order, outer period m, language
// distribution E, model banks for M1, M2, M3, N shuffles. outer shifts u
// integrated out under a uniform prior
function LOG_EVIDENCE(F[0..m-1], f):
    return sum over b of log( (1/26) * sum over u in 0..25 of product over x
            of f[(x - u) mod 26]^F[b][x] )

function MIXTURE_INFERENCE(c, m, E, N):
    for b in 0..m-1: F[b] = HISTOGRAM([c[i] for i in 0..n-1 if i mod m == b])
    // banks: E rotated; w E(x - g1) + (1 - w) E(x - g2); three components
    for M in {M1, M2, M3}:
        // uniform prior over the declared, deduplicated bank
        Z[M] = MEAN over members f of bank(M) of exp(LOG_EVIDENCE(F, f))
        z[M] = (log Z[M] - MEAN over shuffles) / SD over shuffles, from N
                shuffled texts through the same fit
    // the delta-marginal
    for each spacing delta:
        Zdelta[delta] = MEAN over M2 members with g2 - g1 == delta
    top_deltas = the top three spacings by Zdelta
    (w, g, u) = read from the posterior of the winning model
    // class posteriors in ciphertext order under the fitted common-mixture
    // model; a transposition rearranges their latent class sequence
    for i in 0..n-1:
        y[i] = (c[i] - u[i mod m]) mod 26
        P[i][gamma] proportional to w[gamma] * E[(y[i] - g[gamma]) mod 26]
    // see the width statistic entry
    S = ORDER_FREE_WIDTH_SCAN(P, top_deltas, class-EM refinement of u per
            width)
    z_width = z of S per width against N shuffled texts through the identical
            pipeline (fit, deltas, EM, DP)
    for width w with z_width[w] >= 3:
        fix the residue classes from the block phases
        order the remaining columns by quadgrams
        polish u against the order
        if the stripped text reads at the language rate:
            return (w, u, g, decrypt, z_width[w])
    return (no width at z >= 3, z, top_deltas)
```
'''

[[blocks]]
kind = "complexity"
body = '''
Bank sizes: $26$ ($M_1$), $325$ ($M_2$ at one weight), $2{,}600$ ($M_3$). Each member costs one $m \times 26$ log-likelihood table, so the fits are seconds. The width scan with sixty null pipelines dominates, about 30 to 40 minutes per text over all order combinations.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **False pattern from mixed zones.** Combining a 63-letter zone with monoalphabetic cosets and 90 flat letters gives a coset index of coincidence near $0.055$ and too few pair coincidences. That looks exactly like the "mixed inner" pattern. The original whole-text results for the 153-letter text had this problem and were replaced once the separate zones were found.
- **Mixture without a single width.** A double columnar shows $M_2$ at $z +5.8$ but no width. The mixture evidence alone does not identify one transposition.
- **Flat inner.** Fractionation gives weak $M_2/M_3$ and no width, the correct negative but also the end of the road for this test.
- **Selection.** Profiled shifts, uncentred posteriors and per-width maxima without a full-pipeline null all inflate $z$. The corpus's nulls repeat fit, $\delta$ candidates, EM and DP on every shuffle.
'''

[[blocks]]
kind = "controls"
body = '''
Four planted sandwiches at 153 letters, all solved from cold with the true width on top (logs/05): outer/inner in one order, width 9 exact grid, $z +12.8$; width 8 ragged, $+11.3$; outer in one order and inner in the other, width 12 with nine long columns, $+4.3$; width 9 with a period-3 inner, $+5.1$. Each read at 100% match and rate $-4.34$. Printed alongside: a fractionated inner under the outer layer (weak $M_2/M_3$, no width), a plain periodic substitution ($M_1$ wins, no width), a double columnar ($M_2$ present, no single width). On the two unsolved corpus texts: no preferred spacing for the 153-letter text and no width at $z \ge 3$ for either text in any order combination.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Inner period 2 with spacing $\delta = 13$: under equal phase weights, the expected global inner distribution is $f(x)=\tfrac12\big(E(x)+E(x-13)\big)$. Using the stated illustrative frequencies, E and R (13 apart) both have expected frequency $\tfrac12(0.127+0.060)=0.0935$. The quoted reference distribution has IC about $0.054$, below its language reference near $0.066$ and above $1/26$. Any transposition preserves the realised inner stream's global multiset, but an outer period-7 layer shows a rotated copy of this same mixture in every coset only when the transposition allocates the two phases comparably to those cosets. For a regular row-fill, column-read transposition, the latent plaintext-order classes `0101...` form constant-class columns at even width and alternating columns at odd width; ragged columns and other routes require their own phase map. A peak at $\delta=13$ is therefore an empirical recovery result for matched geometries, not a transposition-independent theorem.
'''

[[blocks]]
kind = "notes"
body = '''
The likelihood-free family classifier placed the tested mixed-inner families (sandwich, fractionation, unknown-alphabet substitution, several independent alphabets) in one poorly separated cluster at 153 letters. This mixture pipeline then tested a narrower hypothesis—a single scanned transposition of short-period language under its common-mixture model—and found no qualifying width for the research texts. That scoped nonhit does not decide every construction in the broader cluster (see [Family identification](/cryptanalysis/family-identification)).
'''

