title = "Exact period alignment"
subtitle = "Try every relative shift and line up the cosets of a repeating substitution"
status = "VERIFIED"
status_note = "The implementation exactly maximises the stated period-7 objective over all 26^6 relative shift vectors. In recorded 153-letter controls it recovered the planted shifts for a periodic substitution of English (z +9.6 against 200 position shuffles); a specified transposed-inner control reached z +4.0. These controls establish performance for those generators, not for arbitrary pre-transpositions or plaintext sources (logs/01)."
family = "Period and structure recovery"
