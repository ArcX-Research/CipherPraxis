id = "exact-period-alignment"
section = "cryptanalysis"
title = "Exact period alignment"
subtitle = "Try every relative shift and line up the cosets of a repeating substitution"
status = "VERIFIED"
status_note = "The exact period-7 solver checks all 26^6 relative shift vectors with a direct pairwise score. On a planted substitution over 153 English letters, it recovered the shift vector at z +9.6 against 200 position shuffles. A planted substitution over transposed inner text reached z +4.0 (logs/01)."
family = "Period and structure recovery"
tags = ["periodic", "coincidence", "exact", "alignment", "shift vector"]
related = ["vigenere", "quagmire-iii", "coset-shift-recovery", "index-of-coincidence", "key-cancellation", "running-key-relation-test", "shuffled-null-z-score", "within-coset-null", "family-wise-null", "exhaustive-enumeration", "conjugacy-and-gauge", "family-identification", "g-coset", "g-inner-and-outer-layer"]
summary = "In a repeating additive cipher, every coset is a shifted copy of the same inner letter distribution. Exact period alignment tries every relative shift and chooses the one that makes coset letter counts match most strongly. It needs no word order or literal key. The same test belongs on cross-text sum and difference streams, where a shared high-entropy stream may cancel and expose a periodic residual that raw IC misses. Its null must match the claim: a source-pairing null for cancellation, or a position shuffle for a fixed single stream."
updated = "2026-09-06"

[[blocks]]
kind = "definition"
body = '''
Let the ciphertext $c_0 c_1 \dots c_{n-1}$ be written as indices in a chosen alphabet order and let $m$ be the period. Coset $b$ is the set of positions $i \equiv b \pmod m$ and $F_b(x)$ is its letter histogram. If the layer is additive, $F_b$ is the inner distribution rotated by the coset's key element $k_b$, so the histograms of two cosets $a, b$ agree after a relative rotation of $k_b - k_a$.

Alignment recovers the vector of **relative** shifts $s = (0, s_1, \dots, s_{m-1})$, $s_b \equiv k_b - k_0$, that makes all $m$ histograms coincide. The absolute rotation $k_0$ is unobservable at this stage (a gauge): it is fixed later by a reference distribution, see [Coset shift recovery](/cryptanalysis/coset-shift-recovery).
'''

[[blocks]]
kind = "equations"
title = "Pairwise objective and union index of coincidence"
body = '''
Precompute the cross tables $C[a,b,d] = \sum_x F_a(x)\,F_b(x+d)$ for every ordered coset pair and every rotation $d$. The objective is the total coincidence between cosets shifted into register,

$$J(s) = \sum_{a<b} C\big[a,\,b,\,(s_b - s_a) \bmod 26\big],$$

and the index of coincidence of the aligned text follows in closed form:

$$\operatorname{IC}_{\text{union}}(s) = \frac{\sum_b \sum_x F_b(x)^2 + 2J(s) - n}{n(n-1)}.$$

Maximising $J$ is therefore the same as maximising the coincidence rate of the whole text after the layer is removed. For $m = 7$ the $26^6 \approx 3.1 \times 10^8$ relative vectors are enumerated exactly by fixing $(s_1, s_2, s_3)$ in batches and maximising the remaining three jointly from precomputed partial sums. The run takes under a second on the corpus texts. The **near-optimal set** $\{s : J(s) \ge J^* - \delta\}$ and the per-coset **margin** (best minus runner-up gain when one coset is moved alone) say which cosets are pinned and which are ambiguous.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The layer is additive in the tested index order, i.e. the cosets are rotations of one histogram. In an unknown mixed alphabet the alignment still exists but is measured in the wrong coordinates and weakens.
- The inner distribution is peaked. A flat inner (fractionation, random letters, a second substitution layer with many alphabets) gives histograms with nothing to align.
- Invariant: the statistic depends only on the coset histograms, so it is unchanged by any transposition applied *before* the periodic layer. This is what makes it usable while a transposition is still in place (see [Order-free width statistic](/cryptanalysis/order-free-width-statistic)).
- For a cross-text stream $d_i=x_i+\sigma y_{\phi(i)}$, alignment describes $d$, not the sources separately. A high score supports rotated coset histograms in the derived stream; it does not by itself prove that a latent source stream cancelled.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Choose a period (from a period scan or by trying each candidate) and an index order; build $F_b$ and the cross tables.
2. Maximise $J(s)$ exactly (or, for simulations and nulls, by multi-seed greedy assignment followed by single- and pair-move polish, which agreed with the exact optimum on every corpus text).
3. Calibrate a fixed single stream by running the identical maximisation on $N$ position-shuffles. The shuffle keeps the letter multiset and destroys the coset structure, so the $z$-score of the observed $\operatorname{IC}_{\text{union}}$ against the shuffles measures the presence of a periodic additive layer.
4. Read the near-optimal set and margins: cosets with several near-tied shifts are treated as votes, not facts, in later stages.
5. Compare the $z$ with planted references of the same length to read *what kind* of inner sits under the layer: on 153 letters a plain periodic substitution over English gave $z +9.6$ and a periodic substitution over a transposed inner gave $z +4.0$ (logs/01).
6. For a derived stream, add a source-pairing test. Permute one source inside the physical period classes, keep the other source fixed, rebuild every sum/difference cell, and repeat the complete selection. This preserves the individual source coset histograms while breaking their letterwise pairing. Apply one sampled physical permutation consistently across all algebraic cells that share that geometry.
7. Hand the aligned text to shift recovery, residual-periodicity tests (a second period surviving the alignment signals a compound key) and language scoring.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertext c[0..n-1] as indices in the tested order; period m; N position
// shuffles for the null.
function ALIGN_EXACT(c[0..n-1], m):
    for b in 0..m-1:
        // F_b(x)
        F[b] = HISTOGRAM([c[i] for i in 0..n-1 if i mod m == b])
    for a in 0..m-1, b in 0..m-1, d in 0..25:
        // cross tables
        C[a][b][d] = sum over x of F[a][x] * F[b][(x + d) mod 26]
    best = -infinity
    // 26^(m-1) vectors, exact
    for every relative vector s = (0, s_1, ..., s_{m-1}) with each s_b in
            0..25:
        J = sum over a < b of C[a][b][(s_b - s_a) mod 26]
        if J > best: best = J; s_star = s
    IC_union = (sum over b, x of F[b][x]^2 + 2 * best - n) / (n * (n - 1))
    // which cosets are pinned
    near_optimal = { s : J(s) >= best - delta }
    // best minus runner-up
    margin[b] = best - max J(s) over s that differ from s_star in coset b
            alone
    // the absolute rotation k_0 is a gauge, fixed later against a reference
    return (s_star, IC_union, near_optimal, margin)

function ALIGNMENT_Z(c[0..n-1], m, N):
    (s_star, IC_obs, near_optimal, margin) = ALIGN_EXACT(c, m)
    // the identical maximisation (exact, or the heuristic alignment for
    // nulls)
    for r in 1..N:
        // same letter multiset, coset structure destroyed
        IC_null[r] = ALIGN_EXACT(SHUFFLE_POSITIONS(c), m).IC_union
    z = (IC_obs - MEAN(IC_null)) / SD(IC_null)
    // read z against planted references of the same length (plain inner
    // versus transposed inner); cosets with several near-tied shifts are
    // votes, not facts, in later stages
    return (s_star, IC_obs, z, near_optimal, margin)
```
'''

[[blocks]]
kind = "complexity"
body = '''
Cross tables: $O(m^2 \cdot 26^2)$. Exact enumeration: $26^{m-1}$ evaluations organised so that the last three shifts are maximised by array operations; for $m = 7$ the corpus implementation reports about 0.4 s per text and 90 s for 200 shuffle nulls (logs/01). The heuristic alignment is $O(m^2 \cdot 26)$ per polish sweep.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Diluted inner.** When the inner text has index of coincidence $\kappa$ instead of the English $0.0665$, the alignment signal scales roughly as $(\kappa - 1/26)/(0.0665 - 1/26)$. An inner at $\kappa = 0.054$ keeps only about 55% of a clean signal. The 153-letter corpus text showed exactly this: a real period-7 alignment ($z +4.2$ in one order, $+3.3$ in the other) at the level of the transposed-inner reference rather than the plain reference (logs/01, logs/312).
- **Zoned text.** If the key changes inside the text, each coset mixes two keys. A constant drift of all key elements leaves the relative shifts unchanged (the alignment survives), while an unrelated re-keying dilutes it; neither case is visible from the alignment alone, see [Change-point and zone detection](/cryptanalysis/change-point-zone-detection).
- **Wrong index order.** Both candidate orders can show a significant alignment. The statistic ranks orders weakly and cannot identify an unknown mixed alphabet.
- **Selection over periods.** Scanning many periods and reporting the best $z$ needs a family-wise null. A genuine period also shows inherited peaks at its multiples (a period-7 planted layer gave $z +7.4$ at 7, $+4.9$ at 14 and $+3.1$ at 21, logs/312).
- **Wrong cross-text null.** Shuffling the derived stream within its cosets leaves every $F_b$ unchanged, hence leaves $J$ and aligned union IC unchanged. It cannot test whether the source pairing created those histograms. Break the pairing at source level and rebuild the derived family.
- **Incompatible selected geometries.** One within-group shuffle may not be exchangeable for a union of periods, zones, or indexings. Either preserve their finest common partition and prove that it still randomises the pairing, or run separate matched tests and combine them with a predeclared family-wise rule.
- **Small effect claims.** The within-coset index of coincidence of a 22-letter coset has an exact standard deviation of about $0.021$ and its 7-coset mean about $0.008$. A "cosets are not monoalphabetic" verdict on the 153-letter text was a $1.5\sigma$ statement once the error bar was computed (logs/01).
'''

[[blocks]]
kind = "controls"
body = '''
Planted references audited with the same code and 200 shuffles each (logs/01): a plain period-7 substitution over 153 letters of English aligned at union IC $0.0778$ against a shuffle null of $0.0535 \pm 0.0025$ ($z +9.6$, exact and heuristic agree). A period-7 substitution over a width-9 columnar transposition of a period-2 substituted text aligned at $0.0617$ against $0.0521 \pm 0.0024$ ($z +4.0$). The two unsolved corpus texts gave $z +4.2$ / $+3.3$ (153 letters) and $+2.9$ / $+3.4$ (144 letters) in the two orders.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Three cosets of four letters each, produced from the plaintext letters E,E,T,A by rotations $k = (0, 3, 10)$:

```
coset 0  (k=0)   E E T A     F_0 = {E:2, T:1, A:1}
coset 1  (k=3)   H H W D     F_1 = {H:2, W:1, D:1}
coset 2  (k=10)  O O D K     F_2 = {O:2, D:1, K:1}
```

Cross tables: $C[0,1,d]$ is $6$ at $d = 3$ (E$\to$H gives $2 \cdot 2$, T$\to$W and A$\to$D give $1$ each) and at most $2$ elsewhere; likewise $C[0,2,10] = 6$ and $C[1,2,7] = 6$. The maximum $J(0,3,10) = 18$ is unique. Aligning gives the union histogram $\{E:6, T:3, A:3\}$ and

$$\operatorname{IC}_{\text{union}} = \frac{18 + 2 \cdot 18 - 12}{12 \cdot 11} = \frac{42}{132} = 0.318,$$

against $8/132 = 0.061$ for the unaligned twelve letters. The absolute rotation ($k_0 = 0$ here) is not determined by this step.
'''

[[blocks]]
kind = "notes"
body = '''
Classical repeat-distance (Kasiski) analysis is the coincidence-based ancestor of this method. On the corpus's 504-letter text it had nothing to work with: 5 repeated trigrams against about 7.2 expected for random text and no repeated tetragram (logs/109), so period evidence there came from periodic coincidence scans instead. The exact alignment is the reference measurement that the mixture, width and family tests of this atlas build on.
'''

