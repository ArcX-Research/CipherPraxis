status_note = "The segment-aware chained selector (constant key before the measured breakpoint, period-7 key after it, the plaintext of one text cycled as the running key of the other) is implemented as a controls-only instrument: 16/16 hidden positives recovered exactly, 4/4 negatives rejected, 99 winner-independent nulls per fixture, independent audit; its search is exact only inside a width-8 shortlist, so a miss can never reject the family, and no target transaction has been run (logs/373, target design)."
