id = "running-key-relation-test"
section = "cryptanalysis"
title = "Running-key relation test"
subtitle = "Test a known long operand plus a periodic residual, or reuse of one long key"
status = "POWER-LIMITED"
status_note = "For the restricted model comprising a known long text plus a free period-7 operand in one unknown alphabet, the exact window solver found the planted passage with 5 assignments in 255 nodes while one wrong passage failed in 26 nodes. A separate known-plaintext cascade recovered a recorded link between two solved texts. For an unknown shared key, the difference-screen maximum stayed within its family-wide null and a language beam failed all 3 hidden controls at 144–153 letters; that endpoint is power-limited, not excluded (logs/60, 63, 03, 166)."
family = "Relations between ciphertexts"
tags = ["running key", "known text", "difference text", "periodic residual", "all-different", "CRT", "family-wise null", "constraint satisfaction"]
related = ["running-key", "book-cipher", "one-time-pad", "key-cancellation", "autokey-difference-periodicity", "exact-period-alignment", "family-wise-null", "within-coset-null", "index-of-coincidence", "all-different-constraints", "modular-inverse-and-crt", "all-different-enumeration", "constraint-satisfaction-forward-checking", "beam-search", "power-measurement", "g-key-cancellation", "g-selection-freedom"]
summary = "A running key adds a long stream to another operand. If one long operand is known and the other is restricted to a short-period stream, an unknown alphabet window can be tested by exact modular constraints. If the other operand is unrestricted language plus a periodic residual, the recorded method instead uses a heuristic shortlist and language scoring across declared sources, offsets, signs, periods, and orders. Two ciphertexts may cancel a shared unknown key, but the remainder can still be periodic, so raw IC is only a period-1 screen."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Running-key encryption: $c_i = p_i + t_{i+o}$ for a key text $t$ at offset $o$ (with a keyed-alphabet variant $c = A[\operatorname{idx}_A(p) + \operatorname{idx}_A(t) + k_{i \bmod m}]$). Two relations are testable:

- **Known long operand plus a periodic operand.** For a candidate window $t_o,\dots,t_{o+n-1}$, assume the other additive operand is $k_{i\bmod m}$ rather than arbitrary plaintext. The unknowns are the alphabet coordinate $z$ and the short periodic values, and each position gives $z(c_i)-z(t_{o+i})-k_{i\bmod m}\equiv0$. A proved translation gauge may be fixed; solve modulo 2 and 13 and retain only CRT lifts whose observed-letter coordinates are all different. Unseen letters take unused coordinates later. This exact CSP does **not** test the ordinary model “known running key plus unrestricted unknown plaintext,” because that model adds one unconstrained language symbol per position.
- **Two ciphertexts, one key.** $c_i-c'_{i+o}=p_i-p'_{i+o}$: the key cancels and the difference of two plaintexts remains. Under independent plaintext letters with common marginal $E$, the difference has circular autocorrelation $R(d)=\sum_xE(x)E(x-d)$ and $R(0)=\sum_xE(x)^2$. Real language and related plaintexts need not satisfy that independence model, so the difference IC must be calibrated with matched sources.
- **One plaintext keys another.** If $c'_j=p'_j+k_j$ and $c_i=q_i+p'_{\phi(i)}$, then $c_i-c'_{\phi(i)}=q_i-k_{\phi(i)}$. The plaintext $p'$ cancels and the remaining key structure becomes visible. This is why already recovered plaintexts should be tested as candidate running keys in both directions through a related series.
- **Known long stream plus free residual.** Let $X$ be a fixed text known before the search. For alphabet order $A$, source offset $o$, direction $d\in\{-1,+1\}$, plaintext sign $\epsilon\in\{-1,+1\}$, source sign $\beta\in\{-1,+1\}$, and residual period $q$,

$$a_A(C_i)\equiv \epsilon a_A(P_i)+\beta a_A(X_{(o+di)\bmod L})+k_{i\bmod q}\pmod{26},$$

where $L$ is the length of the known stream.

This strictly contains the direct known-running-key case $k=0$. It differs from two unknown short periodic keys because $X$ is a fixed long stream whose cyclic window is selected by the search.
'''

[[blocks]]
kind = "equations"
title = "Exact alphabet constraints and structural statistics"
body = '''
For one known-stream cell, remove the long component first:

$$y_i=a_A(C_i)-\beta a_A(X_{(o+di)\bmod L})\pmod{26},\qquad
a_A(P_i)=\epsilon\big(y_i-k_{i\bmod q}\big)\pmod{26}.$$

Once $(A,X,o,d,\epsilon,\beta,q)$ is fixed, only the $q$ residual shifts remain. Each coset supplies a monogram-MAP starting shift; complete plaintexts are then ranked and polished with an order-sensitive language score. The cell scan is finite, but retaining only fixed shortlists makes the resulting search heuristic rather than exhaustive.

For an exact known-text window, split every equation into two systems $A_2u_2=0$ over $\mathrm{GF}(2)$ and $A_{13}u_{13}=0$ over $\mathrm{GF}(13)$. Two alphabet coordinates collide modulo 26 exactly when both of their components collide. Therefore an injective lift has at most two observed letters at each modulo-13 residue, and any pair sharing that residue must have opposite parity. The explicit lift is

$$z(x)=13z_2(x)+14z_{13}(x)\pmod{26}.$$

Enumerate the modulo-13 null space, turn its required parity differences into linear conditions on the modulo-2 null-space coefficients, lift every survivor, and verify the original equations and all-different rule. A homogeneous system is always linearly consistent because it contains the zero vector; rank and consistency alone do not reject a window.

Difference-text index of coincidence over all offsets $o$, both orientations of the second text and both signs: the corpus's best values were $0.0455$ to $0.0468$ against a random-pairing level of $0.0383 \pm 0.0017$. With 324 trials, maxima around three single-trial standard deviations were expected under the recorded null, and the observed selected maximum was compatible with the family-wise null (logs/03). A per-trial comparison had instead made the same selection look like $+5.7\sigma$ across 1,296 index-space cells (logs/11).

That measurement is a period-1 test. When cancellation leaves $q_i+h_{i\bmod m}$, its whole histogram mixes $m$ rotations of the plaintext histogram and may look flat. Periodic IC keeps pairs inside $i\bmod m$; exact coset alignment tests whether those histograms are rotations of one distribution. The maximum across all source pairs, alignments, signs, orders, relations, and periods must be compared with the same maximum after a matched source-pair shuffle.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The key text is one of the candidates (for the exact test) or is shared at a fixed offset and orientation (for the difference test).
- A known-stream screen freezes the source bank and declares whether windows wrap cyclically. Direction acts on the source before the cyclic offset is applied.
- The source-bank digest binds both source names and cleaned bytes. Distinct physical sources remain distinct origins even when their windows spell the same text.
- The addition is in a common index order. A keyed alphabet on one text only breaks the cancellation (see [Key cancellation](/cryptanalysis/key-cancellation)).
- For the difference test the two plaintexts are language; for a structured second plaintext the difference statistics change.
- The translation gauge is fixed only when it is a proved symmetry of the equations. Unit and other alphabet aliases are retained or canonicalised after enumeration, not removed by an invalid linear row.
- Blind calibration reruns every score-bearing selection stage on each shuffled ciphertext. A smaller null output file is safe only when it is proved to preserve the selected maximum.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Restricted known-text test: for every candidate text and window, assume the complementary operand is period $m$, build the modular equations, project to observed letters, split them over $\mathrm{GF}(2)$ and $\mathrm{GF}(13)$, and enumerate every all-different CRT lift within the declared cap. Report feasible windows, exact dead windows, and capped windows (undecided); never call linear rank consistency a hit.
2. Known-stream residual test: scan every declared source, cyclic offset, direction, order, sign pair, and residual period. Keep fixed per-chunk parameter-cell and global monogram shortlists, rank their literal decrypts by quadgrams, and run deterministic coordinate polish only on the frozen finishing shortlist.
3. Difference test: compute $c\pm c'$ at every offset and orientation in each compatible order. Scan raw IC, periodic IC, and coset alignment over the declared periods; only then use a language endpoint. Compare the selected maximum with a matched family-wide null.
4. If a relation is found, hand the difference text to a two-plaintext solver (an exact running-key Viterbi with backtracking over a language model, or a beam), and require a control at the same length to recover both hidden texts before reading a target.
5. In a series of related texts, test each recovered plaintext as a key for later and earlier texts, with the same offset, direction, alphabet, forward-check, and multiplicity rules as any other candidate source.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function KNOWN_TEXT_WINDOWS(c, texts, m, cap):
    // exact only for a known long operand plus an unknown period-m operand
    for text t in texts, offset o with a full window t[o..o+n-1]:
        rows = {z(c[i]) - z(t[o+i]) - k[i mod m] = 0 mod 26}
        rows = PROJECT_TO_OBSERVED_LETTERS(rows) + VALID_GAUGE_ROW
        N2  = NULL_SPACE(rows mod 2)
        N13 = NULL_SPACE(rows mod 13)
        result[t,o] = ENUMERATE_ALL_DIFFERENT_CRT(N2, N13,
                observed_letters, cap)
        VERIFY_EACH_LIFT_AGAINST_ROWS(result[t,o])
    return (consistent windows, capped windows, dead windows)

function KNOWN_STREAM_RESIDUAL(c, sources, orders, periods, limits):
    seeds = empty list
    for A, X, direction d, cyclic offset o, signs eps and beta, period q:
        y[i] = index_A(c[i]) - beta*index_A(X[o+d*i]) mod 26
        k = MONOGRAM_MAP_BY_COSET(y, eps, q)
        p = DECRYPT_RESIDUAL(y, k, eps)
        KEEP_PER_CELL(seeds, (QUADGRAM(p), cell, k), limits.cell)
    seeds = DETERMINISTIC_TOP(seeds, limits.global)
    endpoints = COORDINATE_POLISH_TOP(seeds, limits.polish)
    require every endpoint passes independent full forward replay
    return DEDUPLICATE_PLAINTEXTS_WITH_ALL_PHYSICAL_ORIGINS(endpoints)

function MATCHED_RANK(c, FULL_SELECTOR, null_bank):
    observed = FULL_SELECTOR(c).best_score
    null = [FULL_SELECTOR(x).best_score for x in null_bank]
    return (1 + COUNT(score >= observed in null)) / (1 + LENGTH(null))
```
'''

[[blocks]]
kind = "complexity"
body = '''
Difference scan: $O(n)$ per trial, $\approx 10^3$ trials per order pair. Exact window CSP: 3,590 to 4,065 windows per zone with a cap of 3,000 nodes in seconds to minutes; capped windows re-run at 300,000 nodes in about two to six minutes per zone (logs/63).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Low signal in the difference.** The two-plaintext difference has an IC barely above uniform; at 144 to 153 letters the corpus's best difference IC never left the family-wise null band.
- **Period-1 blindness.** If the residual carries a short periodic key, raw IC pools differently rotated coset histograms and may be near uniform. A raw-IC miss closes only the raw-IC screen.
- **Linear consistency is automatic.** A homogeneous alphabet-coordinate system always has the zero solution. Only all-different CRT enumeration can make an exact infeasibility claim; a feasible wrong window is still possible.
- **Solver power.** A language-model beam on planted two-plaintext differences recovered 41%, 50% and 26% of the hidden pairs, with the truth leaving the beam every time (3/3 FAIL, logs/166). An unknown-shared-key negative on the real texts would therefore be meaningless and was not claimed.
- **Undecided windows.** With a small node cap, 166 windows of one zone stayed capped; at 300,000 nodes 16 remained undecided for that zone and none for the others (logs/63). Capped is not consistent.
- **Multiplicity.** Offsets, orientations, signs and two orders give hundreds of trials per pair. Only family-wise nulls are valid.
- **Shortlist saturation.** Every declared cell is visited, but a true offset can fall below the per-cell, global, or polish cap. Deterministic output and local stationarity do not turn the result into an exhaustive family search.
- **Control-pass inflation.** Exact recovery of a planted in-family text shows that the selector has some power. It does not make an observed leader significant and does not close candidates lost behind saturated shortlists.
- **Fixed-winner null.** The observed source, offset, sign, period, or polished key is carried into the null runs instead of being selected again. The resulting null is too easy to beat.
- **Null/statistic collision.** Shuffling positions inside the already-derived cosets leaves periodic IC and histogram alignment unchanged. Calibrate those gates by breaking the source pairing while preserving the individual source coset histograms; reserve within-derived-coset shuffles for order-sensitive language endpoints.
- **Model-specific concentration check.** In simulations from the recorded independent running-key chain, period-7 alignment was centred near $z\approx+0.1$, unlike the measured $+4.2$. This disfavours that generator but is not a necessary condition for every dependent running stream, plaintext distribution, or layered construction.
'''

[[blocks]]
kind = "controls"
body = '''
- Exact window test (logs/60): planted 63-letter window under a random alphabet and random period-7 shifts: 5 consistent solutions in 255 nodes; wrong window: 0 solutions in 26 nodes. Zones of the corpus texts against all known texts: 0 solutions (logs/63).
- Difference scan (logs/03, 11): best IC $0.0455$ to $0.0468$ against $0.0383 \pm 0.0017$ over 324 trials; mixed-order pairs at $z +0.8$ against the family-wise null.
- Two-plaintext beam (logs/166): hidden-pair match 41.3%, 49.5%, 26.2%; control gate FAIL.
- Cascade on the solved series (logs/145): the running-key link between two consecutive texts was recovered from the earlier text's plaintext with 100% match to the published solution.

A separate known-long-stream residual control should match the text length and exercise different source directions, alphabet orders, signs, and residual periods. Run that gate before observations, then pass each position-shuffled ciphertext through the same source scan, shortlist, reranking, and polish. If the observation stays inside the selected null distribution, report a bounded heuristic nonhit even when every planted control is recovered.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Key text `LEMONLEMONLE`. Two plaintexts `ATTACKATDAWN` and `HOLDTHEGATES`:

```
c   L X F O P V E F R N H R
c'  S S X R G S I S O G P W
c-c'  T F I X J D W N D H S V   =  p - p'
```

The key has cancelled: `TFIXJDWNDHSV` is exactly the letter-wise difference of the two plaintexts (A$-$H $= -7 \equiv 19$ = T, and so on). Reading it requires guessing pairs of compatible language symbols; the recorded beam had inadequate recovery at its tested lengths. If one long operand were known **and the other were restricted to a short-period stream**, each position would instead contribute a linear equation on the alphabet. An unrestricted unknown plaintext would not give that exact window test.
'''

