id = "key-cancellation"
section = "cryptanalysis"
title = "Key cancellation"
subtitle = "Subtract two ciphertexts to remove a stream they share"
status = "VERIFIED"
status_note = "The exact cancellation checks covered 144 combinations of offset, direction, and sign, including both inverses and forward reconstructions. A segment-aware selector then recovered 16/16 hidden positive pairs and rejected 4/4 negatives, each against 99 full-pipeline nulls. It was not run on the two research texts: a separate simulation check found their recorded summary statistics inconsistent with the tested chain generator, which is a scoped statistical screen rather than an algebraic exclusion (segment-cancellation review, logs/373, coupling note)."
family = "Relations between ciphertexts"
tags = ["two ciphertexts", "running key", "difference", "periodic IC", "gauge", "cancellation", "index map"]
related = ["running-key", "vigenere", "beaufort", "one-time-pad", "segment-chain-analysis", "running-key-relation-test", "shared-cycle-attack", "exact-period-alignment", "index-of-coincidence", "within-coset-null", "family-wise-null", "affine-maps-mod-26", "conjugacy-and-gauge", "difference-operators", "valid-model-nulls", "target-absent-controls", "known-answer-tests", "g-key-cancellation", "g-selection-freedom"]
summary = "Two ciphertexts may share one hidden stream because one plaintext keys the other or one running key is reused. Adding or subtracting aligned source indices with the right sign can remove that stream and leave a simpler periodic cipher. Whole-stream IC can miss that residual because it mixes differently shifted cosets, so the screen must measure periodic IC, aligned cosets, or shift-marginalised language evidence. Cancellation requires compatible index orders, leaves gauge aliases, and still needs exact reconstruction and matched nulls."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
All arithmetic is in $\mathbb{Z}_{26}$ with one letter-to-index map $z$. Text B is enciphered as $x_j = \epsilon_B z(P_j) + K_j$ ($\epsilon = +1$ additive, $-1$ reciprocal) and text A uses B's plaintext, read at position $\phi(i)$, as a running key: $y_i = \epsilon_A z(Q_i) + z(P_{\phi(i)})$. Since $\epsilon_B^2 = 1$, $z(P_j) = \epsilon_B (x_j - K_j)$, and

$$d_i := y_i - \epsilon_B x_{\phi(i)} = \epsilon_A z(Q_i) - \epsilon_B K_{\phi(i)}.$$

The unknown plaintext $P$ has cancelled; $d$ is $Q$ under the (signed) key of text B. Once $K$ is recovered from $d$, both plaintexts follow: $z(Q_i) = \epsilon_A(d_i + \epsilon_B K_{\phi(i)})$, $z(P_j) = \epsilon_B(x_j - K_j)$. The same identity with the roles of key and plaintext swapped gives the classical two-ciphertext difference under one running key: $c_i - c'_i = p_i - p'_i$.
'''

[[blocks]]
kind = "equations"
title = "Derived streams, periodic evidence and gauge"
body = '''
- **Derived family.** Write the two aligned sources as $x_i=z_L(C_i)$ and $y_{\phi(i)}=z_R(D_{\phi(i)})$, where $\phi$ includes offset and orientation. Screen both

$$d_i^{(\sigma)}=x_i+\sigma y_{\phi(i)}\pmod{26},\qquad \sigma\in\{-1,+1\}.$$

If $y_{\phi(i)}=r_i+h_{i\bmod m}$ and $x_i=q_i-\sigma r_i$, then $d_i^{(\sigma)}=q_i+\sigma h_{i\bmod m}$. The high-entropy stream $r$ is gone, but the result is still a period-$m$ cipher rather than plain text.
- **Why period-1 IC can miss.** Let $F_b(x)$ be the histogram of $d_i$ in positions $i\equiv b\pmod m$. If $F_b(x)=F(x-k_b)$, each coset has the peaked inner histogram $F$, while the whole histogram $H(x)=\sum_b F(x-k_b)$ is a mixture of rotations and can be nearly flat. Thus $\operatorname{IC}(d)\approx1/26$ does not reject the construction. A weighted periodic statistic keeps only within-coset pairs,

$$\operatorname{pIC}_m(d)=\frac{\sum_b\sum_xF_b(x)(F_b(x)-1)}{\sum_b n_b(n_b-1)},\qquad n_b=\sum_xF_b(x).$$

Exact coset alignment goes further: it finds relative rotations that maximise the union IC. A shift-marginalised monogram score integrates, rather than chooses, the unknown shift in every coset:

$$M_1(d;m)=\frac{1}{n}\left[\sum_b\log\left(\frac1{26}\sum_{s=0}^{25}\exp\left(\sum_xF_b(x)\log E(x-s)\right)\right)+n\log26\right].$$

For the reciprocal endpoint, apply the same score to $-d$. Periodic IC says that each coset is non-flat; alignment tests whether the coset histograms are rotations in the declared index order; $M_1$ asks whether those rotations resemble the reference distribution. None alone produces plaintext.
- **Common index space.** If B's plaintext is indexed by $z_9$ and A converts the running-key letters by $z_8$, cancellation requires the physical-letter conversion $F(u) = z_8(z_9^{-1}(u))$ to be affine, $F(u) = au + b$ with $\gcd(a, 26) = 1$: then $a\epsilon_B x$ cancels the plaintext and $b$ is absorbed into the key. The straight order and the keyword-mixed order of the corpus admit **no** affine map between them (checked over all 12 units and 26 translations), so only matched-order cells cancel literally; mixed-order subtraction tests a shared numeric stream, not a shared plaintext.
- **Signs.** With the plaintext sign convention, four sign cells $(\epsilon_B, \epsilon_A)$ give two observably different streams ($y - x$ and $y + x$) with two endpoint relations each. A convention that puts the sign on the key instead has only two effective cells. A production source must declare one convention and prove it with known-answer tests.
- **Alignment.** For a cycled 144-letter key the offsets live in $\mathbb{Z}/144$; with two orientations there are 288 raw alignments (not 592, which counts non-wrapped edge overlaps of a different model).
- **Gauge.** For any $b$, $K'_j = K_j + b$, $z(P'_j) = z(P_j) - \epsilon_B b$, $z(Q'_i) = z(Q_i) + \epsilon_A\epsilon_B b$ leave both ciphertexts unchanged: "recover the key exactly" is meaningful only after a gauge is fixed or a unique physical plaintext is selected.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The shared stream enters both texts additively in the same index order, at a known or enumerable alignment.
- The residual key $K$ has enough structure to be solved from $d$ (periodic, segmented periodic, or constant).
- The period and every selected source pair, order, sign, orientation, offset, and zone are either fixed in advance or re-selected inside every null replicate.
- Before applying an expensive selector, compare the texts with matched simulations of the proposed chain. In the recorded independent-stream generator, adding the running stream usually weakened periodic coset structure. That distributional expectation can make observed strong alignment inconsistent with that generator; it is not a necessary condition for every dependent stream or plaintext source (see failure modes).
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Fix the convention, the alignment $\phi$ and the common order; enumerate the sign cells (16 cells for two orders and two signs per text).
2. Form every $d^{(\sigma)}$. Do not stop at whole-stream IC: for each declared period compute periodic IC, shift-marginalised monogram evidence, and exact or validated coset alignment. Treat these as structural gates, not decryptions.
3. Solve admitted streams as the cipher the residual key implies (a constant Caesar segment, a periodic segment, or both when the key changes regime, see [Segment chain analysis](/cryptanalysis/segment-chain-analysis)).
4. Reconstruct both plaintexts and re-encrypt both texts independently; both forwards must reproduce the inputs exactly, which validates the implementation but is never evidence of language or uniqueness.
5. Select by a language statistic of the recovered $Q$ only (P may be structured rather than prose); expand every same-order key through its 26 gauge states before selection; retain ties.
6. Use two matched nulls for two different questions. To calibrate histogram gates at a fixed geometry, permute one source within the physical period groups while holding the other fixed, rebuild every derived cell, and rerun the complete compatible family. To calibrate language order after a key exists, permute the derived stream within its key groups and rerun the endpoint. The second null cannot calibrate periodic IC, alignment, or $M_1$ because it leaves their inputs unchanged.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertexts x (text B) and y (text A) as indices under one letter-to-index
// map z; alignment phi; signs eps_B, eps_A in {+1, -1}.
function CANCEL(y, x, phi, eps_B):
    for i in 0..|y|-1:
        // = eps_A z(Q_i) - eps_B K_phi(i): the plaintext P has cancelled
        d[i] = (y[i] - eps_B * x[phi(i)]) mod 26
    return d

function KEY_CANCELLATION(x, y, phi, orders):
    // 16 cells for two orders and two signs per text
    for each cell (order for x, order for y, eps_B, eps_A):
        d = CANCEL(y, x, phi, eps_B)
        structural[cell] = (PERIODIC_IC(d), MARGINAL_SHIFT_SCORE(d),
                ALIGN_COSETS(d))
        if not STRUCTURAL_GATE(structural[cell]): continue
        // the cipher the residual key implies: a constant segment, a periodic
        // segment, or both
        K = SOLVE_RESIDUAL(d)
        // gauge states K' = K + g; retain ties
        for g in (0..25 if the cell is same-order else {0}):
            K' = K + g
            Q[i] = (eps_A * (d[i] + eps_B * K'[phi(i)])) mod 26
            P[j] = (eps_B * (x[j] - K'[j])) mod 26
            // validates the implementation only
            assert ENCRYPT_B(P, K', eps_B) == x and ENCRYPT_A(Q, P, phi,
                    eps_A) == y
            // Q only; P may be structured rather than prose
            score[cell, g] = LANGUAGE_STATISTIC(Q)
    return (the best (cell, K', Q, P), observed = max score)

function SELECT_WITH_NULL(x, y, fixed_geometry, orders, N):
    (best, observed) = KEY_CANCELLATION(x, y, fixed_geometry, orders)
    // Draw inside the source's physical groups, then rebuild and reselect all
    // signs, orders, and relations compatible with this geometry.
    for r in 1..N:
        g = DRAW_MATCHED_SOURCE_PERMUTATION(fixed_geometry)
        y_null = APPLY_PHYSICAL_PERMUTATION(y, g)
        null[r] = observed score of KEY_CANCELLATION(x, y_null,
                fixed_geometry, orders)
    return (best, observed, observed beats every null[r])
```
'''

[[blocks]]
kind = "complexity"
body = '''
Cancellation is $O(n)$ per cell. The cost is in the residual solve and its nulls: 16 cells $\times$ (a width-8 shortlist cyclic DP of $8^7$ states plus 5,616 finish states), 1,600 cell solves and 561,600 full-candidate evaluations per fixture with 99 nulls. A 20-fixture hidden suite is 32,000 cell solves.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Wrong index space.** Subtracting a straight-order ciphertext from a keyed-order one cancels nothing. A selector must include a mismatched-index negative to prove it does not treat that as cancellation.
- **Period-1 blindness.** Raw IC pools all cosets. Differently shifted peaked histograms can average to an almost uniform histogram, so a flat derived stream does not rule out a periodic residual.
- **Degenerate nulls.** Histogram-only gates (periodic IC, marginalised monogram evidence, exact coset alignment) are invariant under shuffles within the derived cosets, so such a null cannot calibrate them. A structural null must destroy the cross-source pairing while preserving each source's coset histograms. If the period or alignment is selected, the null must repeat that selection too.
- **No common matched shuffle.** Different periods, zones, or position maps may induce incompatible groups. A permutation valid for one cell is not automatically exchangeable for their union. Use separate matched tests with a predeclared family-wise combination, or prove that a finer common partition both preserves every required margin and still contains non-identity permutations.
- **Variable-length scores.** A raw sum of log-probabilities over segments of different length grows deterministically with the breakpoint. An earlier design was blocked for exactly this bias.
- **Premise inconsistent under the tested generator.** Simulated chains with the recorded source and key distributions gave a period-7 alignment centred at $z +0.13$ (range $-1.1$ to $+2.0$) and zone coset IC about $0.040$, versus measured values $+4.2$ and $0.066$. Those discrepancies disfavoured that simulated chain model before any selector run. They do not rule out all dependent-stream constructions, and a hidden-bank pass would establish power only for its generator.
- **Reading too much.** A readable $Q$ determines $P$ only algebraically. A claim about $P$ needs its own predeclared criterion.
'''

[[blocks]]
kind = "controls"
body = '''
- Algebra known-answer tests (segment-cancellation review): random numeric fixtures over breakpoints $\{45, 53, 60\}$, orientations $\pm 1$, offsets $\{0, 1, 52, 53, 71, 143\}$ and all four sign pairs, 144 combinations, all passing the cancellation identity, both inverses and both source forwards. The exact key-group counts at the three breakpoints. The non-existence of an affine map between the two orders.
- Segment-aware selector (logs/373): 16/16 hidden positives (every order pair and sign pair at breakpoint 53) recovered exactly with strict rank one against 99 nulls; 4/4 negatives (two valid-family random-latent with independent-monogram $Q$, two no-chain with an independent running stream) rejected; zero generator ties; target absent.
- Two-regime derivation (coupling note, section 6): exact per-regime $8^7$ products with a 14-shift joint polish recovered $Q$ and, through the closure invariant, $P$ in 10/10 synthetic pairs in under a second per cell.
- Broad cross-derived scan (logs/155): every ordered pair, both orders, both signs, both orientations, every eligible offset, periods 7 and 26, with a null that shuffles each complete source and repeats the whole selection. A planted cross-running-key control at period 7 precedes the targets.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Text B plaintext `ATTACKATDAWN` under a segmented key (constant 3 on positions 0 to 5, then $(5, 20)$ repeating): $x$ = `DWWDFNFNIUBH`. Text A plaintext `HOLDTHEGATES` with B's plaintext as running key at offset 0 (both additive): $y$ = `HHEDVREZDTAF`. Subtracting letter by letter,

```
y   H H E D V R E Z D T A F
x   D W W D F N F N I U B H
d   E L I A Q E Z M V Z Z Y
```

and indeed $d = Q - K$: `HOLDTH` shifted back by 3 is `ELIAQE`, and `EGATES` under $-(5, 20)$ is `ZMVZZY`. Solving $d$ needs only a 26-way search on the first segment and a $26^2$ search on the second; once $K$ is known, $P = x - K$ returns `ATTACKATDAWN`. The gauge: adding 1 to every key element, subtracting 1 from every letter of $P$ and adding 1 to every letter of $Q$ reproduces the same $x$ and $y$, so the recovered key and plaintexts are determined only up to that common rotation until language fixes it.
'''

