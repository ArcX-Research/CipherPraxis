id = "shared-cycle-attack"
section = "cryptanalysis"
title = "Shared-cycle attack"
subtitle = "Build a bank of possible 26-cycle alphabets, then test each as a shared order"
status = "VERIFIED"
status_note = "A bank of 66,628 distinct 26-cycles was built from ciphertext, ignoring rotation. A loose bigram screen made a shortlist, and an exact cyclic dynamic program finished it. Two blind controls recovered at 100%, with rates -4.217 and -4.135. In the 126-letter period-26 zone, eight of nine full-pipeline nulls beat the best target candidate (-4.869 versus null mean -4.836 +/- 0.024, p = 0.90). The candidate was rejected as selection overfit (logs/151, 152)."
family = "Relations between ciphertexts"
tags = ["mixed alphabet", "cycle bank", "relaxation", "cyclic DP", "selection overfit", "within-coset null"]
related = ["quagmire-iii", "keyword-mixed-alphabet", "permutation-cycles", "periodic-substitution-dp", "exact-dynamic-programming", "selection-overfit-diagnostic", "within-coset-null", "blind-controls", "corpus-bank-screen", "crib-driven-alphabet-recovery", "modular-inverse-and-crt", "g-selection-freedom", "g-family-sweep"]
summary = "Construct candidate alphabet cycles from a declared structural bank, then solve the periodic key conditional on each cycle. A cheap screen can prioritize candidates for an exact cyclic dynamic program. The bank and any shortlist restrict coverage, and the complete selection must be calibrated with matched nulls."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
A **cycle** $A$ is a permutation of the alphabet used as the index order of a keyed periodic substitution: with $a(X)$ the position of $X$ in $A$,

$$\text{additive: } a(c_i) = a(p_i) + k_{i \bmod p}, \qquad \text{reciprocal: } a(c_i) = k_{i \bmod p} - a(p_i) \pmod{26}.$$

Cycles differing by rotation are the same hypothesis (the rotation is absorbed by the key), so the bank is rotation-canonical. The bank is **mechanical**: for every substring of at least three letters of every source ciphertext, its reversal, and column reads of the measured grids, take the letters in order of first occurrence and append the missing letters in straight or keyed order; 66,628 distinct cycles resulted. A shared cycle is also the natural coupling between two texts that show the same kind of layer with different keys (one alphabet, independent shift vectors).
'''

[[blocks]]
kind = "equations"
title = "Screen, relaxation and exact finish"
body = '''
- Monogram evidence per cycle, shifts marginalised: $\frac{1}{n}\sum_b \ln Z_b(A)$ with $Z_b(A) = \frac{1}{26}\sum_s \prod_x E\big(A[(a(x) - s) \bmod 26]\big)^{F_{b,x}}$. It ranked the hidden controls only 7,559th and 7,598th of 66,628: too weak to shortlist.
- Relaxed bigram score: on each adjacent-residue edge $b \to b+1$ maximise the bigram log-probability over the two shifts independently,

$$R(A) = \sum_b \max_{s,t} \sum_{i \equiv b} \ln P_2\big(A[a(c_i) - s],\, A[a(c_{i+1}) - t]\big),$$

a deliberately optimistic upper relaxation (edge shifts need not agree) that is cheap enough for the whole bank on a GPU and ranked the hidden additive cycle 16th and the hidden reciprocal cycle 2nd.
- Exact finish: for the top cycles, the exact cyclic order-3 quadgram dynamic programme over the per-residue shortlist restores one globally consistent 26-shift key, followed by an unrestricted polish. The forward encryption must reproduce the zone.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The true cycle is in the bank. The negative excludes the bank, not arbitrary cycles.
- The zone and period are right and the inner is language, so that bigrams and quadgrams carry signal.
- The relaxation's rank of the truth is measured on blind controls at the pre-registered depth (32 fast, 128 full). A truth ranked below the depth is a miss, not a negative.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Build the bank from ciphertext only; canonicalise by rotation.
2. Plant two blind controls: hidden bank cycles, random free keys, unseen generic plaintext. The identities are opened only after blind recovery, and a failed control blocks the target.
3. Score the bank by evidence and by the relaxation; shortlist the top $L$ per relation.
4. Finish each shortlisted cycle exactly; keep the best rate.
5. Null: shuffle the zone within its cosets (every histogram, equality pattern and bank candidate preserved; adjacency destroyed) and rerun steps 3 and 4 in full. The family-wise maximum of each replicate is the reference. Accept only a readable, round-tripping finish that beats every null maximum.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Zone ciphertext c[0..n-1], period p, source ciphertexts and grid reads for
// the bank, language tables (E, bigrams P2, quadgrams), shortlist depth L, N
// nulls.
function BUILD_BANK(sources, grids):
    // rotation-canonical: rotations are one hypothesis
    bank = SET()
    for stream in sources, their reversals and the column reads of grids, for
            substring s of stream with |s| >= 3:
        ADD(bank, ROTATE_TO_CANONICAL(letters of s in first-occurrence order
                ++ the missing letters in straight or keyed order))
    return bank

// optimistic: the two edge shifts need not agree
function RELAXED_BIGRAM(A, c, p):
    return sum over b in 0..p-1 of max over (s, t) of sum over i with i mod p
            == b of ln P2(A[(a(c[i]) - s) mod 26], A[(a(c[i+1]) - t) mod 26])

// exact cyclic order-3 quadgram DP over the per-residue shortlist
function FINISH(A, c, p, relation):
    // one globally consistent 26-shift key
    key = POLISH(CYCLIC_QUADGRAM_DP(c, A, relation, per-residue shift
            shortlist), unrestricted)
    // the forward must reproduce the zone
    plain = DECRYPT(c, A, key, relation)
    assert ENCRYPT(plain, A, key, relation) == c
    return QUADGRAM_RATE(plain)

function SELECT(c, p, bank, L):
    for relation in {additive, reciprocal}:
        // monogram evidence is computed too but is too weak to shortlist
        shortlist = the top L of bank by RELAXED_BIGRAM(., c, p)
        best[relation] = max over A in shortlist of FINISH(A, c, p, relation)
    return max over relation of best[relation]

function SHARED_CYCLE_ATTACK(c, p, sources, grids, L, N):
    bank = BUILD_BANK(sources, grids)
    for each of two blind controls (hidden bank cycle, random free key,
            unseen generic plaintext):
        // a failed control blocks the target
        if SELECT(control, p, bank, L) does not recover it: stop
    observed = SELECT(c, p, bank, L)
    // histograms, equality pattern and bank preserved; adjacency destroyed
    for r in 1..N: null[r] = SELECT(SHUFFLE_WITHIN_COSETS(c), p, bank, L)
    return (observed, accepted only if the finish reads, round-trips and
            observed > every null[r])
```
'''

[[blocks]]
kind = "complexity"
body = '''
Bank construction: $O(\sum |s|^2)$ over source streams, 66,628 cycles. Relaxation: 26 edges $\times$ $26^2$ shift pairs per cycle, batched on a GPU. Exact finish: $8^{26}$ is not enumerated. The cyclic DP over a width-8 shortlist costs $O(p \cdot 8^4)$ per cycle. The full run (128 finishes per relation, 9 null replicates of the whole pipeline) took 764 s.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Selection overfit.** The best of 256 exact finishes on a 126-letter zone reads "fragmented English" at $-4.87$. The same procedure on nine within-coset shuffles produced maxima of $-4.795, -4.819, -4.834, -4.879, -4.811, -4.849, -4.850, -4.835, -4.856$, eight of which beat the target (empirical upper-tail $p = 0.90$, $z = -1.37$). Without the full-pipeline null the candidate would have looked like a solution.
- **Weak screens.** Monogram evidence cannot shortlist a cycle at this length.
- **Bank scope.** "No solution in this cycle bank" is the only admissible negative.
- **Blind shared alphabet.** Without a bank, a joint annealer over one alphabet shared by two zones (63 + 96 letters) reached 35% of the alphabet on a planted control (logs/32). An exact anchor-and-join formulation over complete word tokens exceeds ten million records after three anchors at algebraic rank 7 of 32 (token-anchor audit): both are power blockers, not family negatives.
- **Corpus-window meets.** With a finite verbatim plaintext prior the shared-cycle relation between two zones becomes exact linear algebra over $\mathbb{Z}_{26}$ (gauge $z(A) = 0$, GF(2) and GF(13) nullspaces, CRT lift, all-different, unit-orbit canonical join), but the resulting negative would say nothing about paraphrased or original plaintext.
'''

[[blocks]]
kind = "controls"
body = '''
Blind controls at 126 letters, period 26, hidden bank cycles and random free keys (logs/151): additive relation, relaxed-bigram rank 16, monogram rank 7,559, in shortlist, plaintext match 100.0%, PASS; reciprocal relation, rank 2, monogram rank 7,598, match 100.0%, PASS; control gate PASS. Target zone at the fast depth (top 32 per relation): best $-4.912$, rejected by a within-coset null at $-4.795$. Full depth (top 128, logs/152): best $-4.869$ with a cycle mechanically derived from a reversed substring of another text; nine null maxima with mean $-4.836 \pm 0.024$; verdict "no solution in this cycle bank".
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Bank member from the toy ciphertext `HEXOJXHEKOAA`: first-occurrence order `HEXOJKA`, completed with the straight remainder to `HEXOJKABCDFGILMNPQRSTUVWYZ`, canonicalised by rotating to start at A: `ABCDFGILMNPQRSTUVWYZHEXOJK`. Every substring of at least three letters of every source, and of every reversed source, contributes such a member; substrings that produce the same cycle are stored once. Under a period-2 test of this toy, a cycle is scored by the relaxation on the single edge $0 \to 1$ (maximising the two shifts independently) and finished by an exact two-shift search.
'''

