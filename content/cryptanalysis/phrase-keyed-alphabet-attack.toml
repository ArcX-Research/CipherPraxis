id = "phrase-keyed-alphabet-attack"
section = "cryptanalysis"
title = "Phrase-keyed alphabet attack"
subtitle = "Build alphabets from known phrases and check each one under a repeating substitution"
status = "CLOSED"
status_note = "The search built 202,504 distinct alphabets from every 4- to 60-letter substring of known series texts in six styles, then tested each under a period-7 substitution. The planted control read at 100%; the two targets stayed at noise scores of -6.54 and -6.35. Larger zone searches also ruled out 2.06M dictionary and columnar alphabets, 100k nearby alphabets, and 1.56M numeric-grid alphabets in their stated scopes (logs/07, 24, 38, 41)."
family = "Known-plaintext methods"
tags = ["keyed alphabet", "phrase", "dictionary", "family sweep", "screen"]
related = ["keyword-mixed-alphabet", "quagmire-i", "quagmire-ii", "quagmire-iii", "quagmire-iv", "dictionary-attack", "corpus-bank-screen", "coset-shift-recovery", "crib-driven-alphabet-recovery", "family-wise-null", "finite-language-key-signature-join", "g-family-sweep"]
summary = "All 26! mixed alphabets are far too many to search from short text. Phrase-keyed alphabets form a much smaller list. Build alphabets from substrings of declared sources, or deterministically from a separately recovered related text, in every frozen serialization and completion style. Fit the remaining key, decrypt, and score. A negative rules out only that finite source-and-style table."
updated = "2026-09-06"

[[blocks]]
kind = "definition"
body = '''
A **phrase-keyed alphabet** is built from a phrase $w$ by writing its distinct letters in order of first appearance and appending the remaining letters by a rule (the keying style):

- straight remainder (`ABCD...` minus the used letters), or the remainder of a known keyed alphabet;
- reversed remainder;
- continued remainder, starting after the phrase's last letter and wrapping;
- columnar read-out: the phrase plus remainder written in rows of the phrase's width and read by columns (straight or keyed base).

For a periodic keyed substitution the alphabet can act on the plaintext side, on the ciphertext side or on both. Each variant is screened separately with the same shift fit.
'''

[[blocks]]
kind = "equations"
title = "Screen"
body = '''
For each alphabet $A$ and variant, coset $b$'s shift is fitted by chi-square against the language distribution in $A$'s order, $\hat k_b = \arg\min_k \chi^2\big(F_b, n_b E_A(\cdot - k)\big)$, followed by two quadgram sweeps over the $m$ shifts. The score is the quadgram rate of the decrypt. Large screens replace chi-square by the vectorised per-coset log-likelihood $\sum_x F_b(x) \log E(A[x - k])$ over all alphabets at once and calibrate the top rate on shuffled segments (see [Coset shift recovery](/cryptanalysis/coset-shift-recovery)).
'''

[[blocks]]
kind = "variants"
body = '''
- **Declared phrase bank:** take every allowed substring from frozen source texts and apply each listed keying style.
- **Related-text-derived alphabet:** after another text has been recovered and independently replayed, serialize it in a frozen set of routes, keep first occurrences, and append missing letters in each declared completion order. Preserve every route and completion as a physical origin even when several produce the same alphabet.
- **Exact downstream key:** when the derived alphabet bank is small, search the remaining periodic row key exactly rather than fitting it heuristically.
- **Self-consistency filter:** a derived alphabet may also be required to explain the source text under a second declared relation. This filters the primary solve; it is not an independent source of alphabets.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The alphabet was derived from a phrase in one of the enumerated sources by one of the enumerated styles. The sweep closes nothing outside that.
- A related-text variant accepts only complete, cap-free, independently replayed upstream plaintexts. An upstream shortlist or best-so-far row does not define a trustworthy alphabet bank.
- The period, relation and zone are right: screening a whole text whose first third is keyed differently corrupts every score, which is why the corpus re-ran its screens per zone once the zones were known.
- The plaintext is language of the reference distribution.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Build the alphabet table from every 4- to 60-letter substring of each source text in six styles, then remove duplicates. This gives 202,504 alphabets from the known texts. A larger table of 2.06 million also adds dictionary words in six styles plus columnar-keyed and multi-keyed alphabets.
2. Plant a control: a known text under a keyed substitution whose alphabet is in the table. It must read at 100% and rank first.
3. Screen every alphabet and variant; polish the top dozen; print the top rates against the noise level (about $-6.3$ per letter at 153 letters).
4. Report the family as excluded for the enumerated sources and styles only.

For a related-text construction, freeze the serialization routes and completion orders before opening the upstream result. Derive every literal alphabet with its origin, collapse duplicate computation only after preserving those origins, and include upstream endpoint selection in the family-wise accounting.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Source texts, keying styles, ciphertext c[0..n-1], period m, language
// distribution E, shuffled segments for the noise level.
function PHRASE_ALPHABET(phrase, style):
    head = the distinct letters of phrase in order of first appearance
    // straight or known-keyed remainder, reversed, continued after the last
    // letter, columnar read-out
    rest = the remaining letters ordered by style
    // a 26-letter permutation
    return head ++ rest

function BUILD_TABLE(sources, styles):
    table = SET()                                     // duplicates removed
    for text in sources, substring phrase of text with 4 to 60 letters, style
            in styles:
        ADD(table, PHRASE_ALPHABET(phrase, style))
    return table

function SCREEN(c, m, table, variants, E):
    // alphabet on the plaintext side, the ciphertext side, or both
    for A in table, variant in variants:
        for b in 0..m-1:
            F_b = histogram of coset b in A's order
            // large screens: vectorised per-coset log-likelihood over all A
            // at once
            k[b] = argmin over k of CHI_SQUARE(F_b, n_b * E_A(. - k))
        // two sweeps over the m shifts
        k = QUADGRAM_SWEEP(QUADGRAM_SWEEP(k, c, A, variant))
        rate[A, variant] = QUADGRAM_RATE(DECRYPT(c, A, variant, k))
    polish the top dozen;  return rates ranked

function PHRASE_KEYED_ATTACK(c, m, sources, styles, variants, E):
    table = BUILD_TABLE(sources, styles)
    control = a known text under a keyed substitution whose alphabet is in
            table
    // the screen is broken
    if SCREEN(control, m, table, variants, E) does not rank its alphabet
            first at 100% match:
        stop
    ranked = SCREEN(c, m, table, variants, E)
    noise = the top rate of the same screen on shuffled segments
    // excluded only for the enumerated sources and styles
    return (ranked top rates against noise)
```
'''

[[blocks]]
kind = "complexity"
body = '''
$O(|\mathcal{A}| \cdot m \cdot 26 \cdot n)$ for the chi-square screen: 202,504 alphabets in about 10 min on 12 cores. The vectorised likelihood screen handles 2.06 million alphabets per family and relation in about 30 s on a 96-letter zone.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Scope.** The sweep excludes only enumerated structures. The corpus concluded that either the alphabet's structure is of a kind not enumerated or the alphabet is random and was transmitted by other means. Family sweeps beyond that point were judged "buying lottery tickets".
- **Zoning.** Whole-text screens on a text with a differently keyed prefix score every alphabet at noise. The zone screens had to be repeated.
- **Top-of-null inflation.** The best of $10^6$ alphabets on a 63-letter zone sits near $-5.2$ to $-5.5$, the shuffled-segment maximum. Only a rate near the language level with a readable decrypt counts.
- **Upstream error propagation.** One wrong recovered letter can change the first-occurrence order of many later letters. A downstream exact maximum is conditional on the supplied upstream endpoint, not proof that endpoint was correct.
- **Alias collapse before selection.** Equal derived alphabets may share computation, but their routes, completion rules, and upstream origins must survive for exact tie and family-size accounting.
'''

[[blocks]]
kind = "controls"
body = '''
- Phrase alphabets (logs/07): planted text under a same-alphabet keyed substitution keyed by a 31-letter phrase in the keyed-remainder style, polished best $-4.34$, 100% match; targets $-6.54$ and $-6.35$.
- 2.06M structured alphabets on the 96-letter zone (logs/24): planted alphabet rank 1 at $-3.942$ against the shuffled-segment top $-6.194$; targets: best $-5.77$ against a shuffled maximum of $-5.9$ (nothing). The 63-letter zone of the other text (logs/30): tops $-5.3$ to $-5.5$ at the 63-letter shuffled maximum.
- Near-neighbour alphabets, within two transpositions of the two reference orders, 100,752 alphabets (logs/38): the planted swap-alphabet control ranked first and read $-3.94$; zones $-5.24$ against shuffled maxima $-5.75$ to $-5.90$ and $-5.91$ against $-6.1$ to $-6.3$.
- Numeric-grid alphabets, 1.56M (logs/41): zones $-5.42$ and $-5.82$, whole texts $-6.49$ / $-6.36$, all at their nulls. Two-keyword alphabets, 425k (logs/35): zones $-5.48$ and $-5.85$ to $-5.89$.

A target-absent related-text preflight derived eight literal alphabets from four fixed serializations and two completion orders. For each alphabet it searched all $13^7$ period-seven Porta row keys with an exact cyclic dynamic program. A separate implementation enumerated the same spaces by fixing three rows and directly scoring the remaining four, reproduced every optimum and tie, and checked 5,408 scalar Porta transformations. This verifies the finite derived-alphabet workflow and exact downstream search, not any unknown upstream plaintext.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Phrase `THE QUICK BROWN FOX`: distinct letters in order of appearance `THEQUICKBROWNFX` (15 letters). Styles:

```
straight remainder   THEQUICKBROWNFX ADGJLMPSVYZ
reversed remainder   THEQUICKBROWNFX ZYVSPMLJGDA
continued remainder  THEQUICKBROWNFX YZADGJLMPSV   (continue after X, wrap)
```

Each is a 26-letter permutation. A period-7 keyed substitution in the first of them applied to a 150-letter text is one row of the screen, and the table for a corpus of a few thousand letters of known text holds about two hundred thousand such rows.
'''

