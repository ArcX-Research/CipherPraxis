id = "immutable-artifact-postmortem"
section = "validation"
title = "Immutable artifact postmortems"
subtitle = "Recover what a completed one-shot worker proved without rerunning or rewriting it"
status = "VERIFIED"
status_note = "A read-only audit recovered a committed worker record after an outer validator rejected an order-only difference. Mutation tests distinguished harmless reordering from missing, duplicate, changed, and uncommitted data, while inherited stage limits kept the final status incomplete."
family = "One-shot validation"
tags = ["postmortem", "immutable artifacts", "canonical sets", "one-shot runs", "cap propagation", "independent replay"]
