summary = "Power measures recovery frequency under a declared family, fixture distribution, budget, and task order. Report it with uncertainty before interpreting a target miss. For a time-limited search, estimate both whether the solver recovers truth when its task runs and how much of the scheduled frontier is reached. Multiplying those terms is justified only when their dependence is controlled; direct end-to-end capped controls are stronger."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
For $N$ planted fixtures drawn from the declared model distribution, run through the same frozen pipeline (same code, gates, nulls, ordering and budget as the live run), with recovery indicators $r_i$:

$$\hat{\pi} = \frac{1}{N}\sum_i r_i, \qquad \operatorname{se}(\hat\pi) \approx \sqrt{\frac{\hat\pi(1-\hat\pi)}{N}}.$$

A target miss is reported together with $\hat\pi$, its interval, and the fixture scope. It is a powered heuristic miss, not an exact exclusion of the family. A family is called `POWER-LIMITED` when the measured recovery rate is too small for the miss to support even that scoped interpretation.
'''

[[blocks]]
kind = "equations"
title = "Power under a time cap"
body = '''
For an exhaustive search over a deterministically ordered frontier of $F$ tasks, let $D(T)$ be the number of tasks actually completed by cap $T$ and $\kappa=D(T)/F$. If truth positions are uniform over that frontier and conditional recovery when scheduled is independent of position and task difficulty, then

$$\pi_{\text{cap}} = \pi_{\text{sched}} \cdot \kappa .$$

The product is a model-based estimate, not an identity when speed or recovery varies with task position. The program measured $\pi_{\text{sched}}=20/20$ by searching a ten-task segment around each planted truth and estimated $\kappa$ per fixture between $0.012$ and $1.0$, with median $0.087$ at a 24-hour cap. This suggests median capped power near 9% under the stated assumptions. The live run covered 0.75% of its own frontier; that coverage alone is not a live-instance recovery probability.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Fixtures are drawn from the same distribution the target is assumed to come from. A hardest-window panel (planted prose down to rate $-5.56$) is reported separately from the uniform panel.
- Ordering matters: power measured in one task order does not transfer to another. The driver gained a `--control-task-order {lex,hash}` option so that controls use the live ordering.
- Power is a property of the whole decision, including gates and nulls, not of a preliminary statistic.
'''

[[blocks]]
kind = "attack"
body = '''
Power measurement helps locate a pipeline's weak link. In a segment-chain lane the suspected weak link was a width-8 shortlist of per-residue shifts. A different-agent review found that all seven true shifts survived the shortlist in 195 of 200 hard-plaintext trials (0.975) and that a per-residue true shift was in the top eight 99.64% of the time. Those controls make shortlist loss an unlikely explanation under that fixture distribution; they do not identify the cause of every live miss. In a blind annealing lane, best-of-$N$ recovery plateaued at 30 to 40% of the alphabet for $N$ from 500 to 8,000 chains. That result closed the tested annealer and budget range, not every larger budget or search method.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: the frozen pipeline P (same code, gates, nulls, task order and
// budget as the live run), model M, live length n, N fresh seeds; for a
// capped search, the frontier size F and declared cap T. Output: power_hat
// with an interval, or a model-based power estimate at the cap.
function POWER(P, M, n, seeds):
    N = LENGTH(seeds)
    r = []
    for seed in seeds:
        // drawn from the declared fixture distribution
        (p, k, c) = PLANT(M, n, seed)
        // the whole decision, gates and nulls included
        r.append(1 if P(c) recovers (p, k) else 0)
    power_hat = SUM(r) / N
    se = SQRT(power_hat * (1 - power_hat) / N)
    interval = BINOMIAL_INTERVAL(SUM(r), N)
    report N, the fixture distribution, the task order and the budget with
            power_hat, se, and interval
    // A miss is reported with this scoped estimate; it is not an exact
    // family exclusion.
    return power_hat

function POWER_AT_CAP(P, M, n, seeds, F, T):
    N = LENGTH(seeds)
    // Prefer the observed completed-task count. A rate extrapolation is an
    // additional model and must retain its uncertainty.
    coverage = COMPLETED_TASKS_BY_CAP(P, T) / F
    recovered_when_scheduled = 0
    for seed in seeds:
        (p, k, c) = PLANT(M, n, seed)
        // hash lookup in the live order
        t_star = LOCATE_TRUTH_INDEX(c, p, k, live_order)
        // the few tasks around t_star
        if P(c, tasks = SEGMENT_AROUND(t_star)) recovers (p, k):
            recovered_when_scheduled += 1
    power_sched = recovered_when_scheduled / N
    require truth position is uniform and scheduled recovery is not associated
            with position or task difficulty; otherwise report both factors
            without multiplying them
    // coverage is also reported per fixture
    return power_sched * coverage
```
'''

[[blocks]]
kind = "complexity"
body = '''
A power panel costs $N$ full solves. Segment panels reduce this for exhaustive searches: locating the truth's index is a hash lookup, and searching ten tasks around it costs seconds, so twenty fixtures ran beside a live job on two threads. A full-frontier control, by contrast, cost 903.7 s and never reached its truth.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Unmeasured power reported as a negative.** A cell whose blind control never reached its truth was at first described in outcome language. The ledger amended it to `POWER_UNMEASURED + SCOPED_INCONCLUSIVE` and ruled that no result from it may be called a negative.
- **One control read as a panel.** A disclosed run with one null has a smallest attainable plus-one value of $p=1/2$. The auditor recorded that it must not be read as evidence of separation at conventional levels.
- **Power from the wrong region.** Prose plants recovered at 97.5% say nothing about a target whose statistics no prose plant reproduces. The audit recommended citing such figures as within-family power only.
'''

[[blocks]]
kind = "controls"
body = '''
Every power number in this atlas states $N$, the fixture distribution, the ordering and the budget. Panels use fresh seeds recorded in the transcript, and the predeclared success threshold (for example 18 of 24) is derived and asserted from the run arguments rather than typed by hand.
'''

[[blocks]]
kind = "example"
title = "Power panel report"
body = '''
```
POWER_PANEL fixtures=20 seed_range=503100-503119 order=hash threads=2 cap=86400s
  recovered_when_scheduled = 20/20   invalid_candidates = 0   segments_complete = 20/20
  frontier_pairs: min=55,497 max=1,825,380      truth_index/frontier: 0.08..0.99
  pairs_per_second: 0.17..16.1 (median 1.21)
  coverage_at_cap: min=0.012 median=0.087 max=1.0  (4/20 would drain)
VERDICT power_at_cap ~= coverage; median ~9% for random plants
```
'''

