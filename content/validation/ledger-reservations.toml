id = "ledger-reservations"
section = "validation"
title = "Ledger reservations"
subtitle = "Reserve log numbers and file names in an append-only record before work starts"
status = "VERIFIED"
status_note = "The project ledger has 240 headed entries across 13,552 lines: 82 reservations, 8 seals, 25 final entries, and 12 corrections. When two jobs claimed the same number, the later claim was voided and renumbered instead of editing old records."
family = "Audit and release governance"
tags = ["ledger", "coordination", "reservations", "append-only"]
related = ["seal-and-audit-protocol", "correction-and-retraction", "reproducibility-receipts", "g-ledger"]
summary = "When several people test the same texts, a shared ledger prevents duplicate work, silent overwrites, and claims added after the fact. Each task reserves a log number and the new file names it will create. It later records file hashes, the final outcome, or a correction. Old entries are never rewritten. A wrong claim gets a dated correction, and a number collision voids and renumbers the later task. Auditors use this history to decide which negative results are valid."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
The ledger is a single Markdown file with dated `##` headers. Entry types, in the order a lane normally passes through them:

- **RESERVED**: a log number, the lane's question, the exact new-only paths (source, runner, parser, audit note, transcript names) and the paths the author promises never to create (canonical production transcripts and attempt markers).
- **SEALED**: the frozen hashes of every byte the lane will be audited on, with the disclosed evidence and its hashes.
- **INDEPENDENT AUDIT**: the auditor's verdict with the hashes it audited.
- **COMPLETE / TERMINAL / RESULT**: the outcome with transcript hashes and an explicit statement of what is and is not claimed.
- **CORRECTION / AMENDMENT / VOID**: a later entry that changes the reading of an earlier one without editing it.

Numbered logs are owned by exactly one lane. The ledger is the registry that makes the log directory's `NNN_name.log` convention unambiguous.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Append-only. Frozen bytes and earlier entries are never modified; even a hash miscount is corrected by a later entry so the sealed hashes stay valid.
- New-only paths. A successor never rewrites a predecessor's file. A blocked lane's bytes remain on disk as the predecessor of record.
- Reservation precedes creation. Creating an unreserved artefact, or a reserved one out of order, is itself a defect the auditors look for ("reserved paths absent before and after").
'''

[[blocks]]
kind = "attack"
body = '''
The ledger defends the evidence base rather than any single result. It records the *scope* of every negative ("closes only the enumerated family and search depth"), which is what allows a family to be reopened when a control is later found defective without relitigating everything else. It also carries the frozen no-repeat checklist: after a failed control no target run. No promotion of a fluent string unless the full selected-family null is lower. No reruns of closed banks unless the mathematical family changes.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: the append-only ledger, a lane's question, the new-only paths it
// will create and the canonical paths it promises never to create. Output:
// one dated entry per stage; earlier entries are never modified.
function RESERVE(ledger, question, new_paths, never_paths):
    n = NEXT_LOG_NUMBER(ledger)
    if n is already claimed in ledger:                      // collision
        // nothing was created under the voided number
        APPEND(ledger, VOID(n)); n = FRESH_NUMBER(ledger)
    APPEND(ledger, RESERVED(n, question, new_paths, never_paths))
    // reservation precedes any file creation
    return n

function SEAL(ledger, n, files, disclosed_evidence):
    APPEND(ledger, SEALED(n, {f: SHA256(f) for f in files},
            disclosed_evidence))

function AUDIT(ledger, n, verdict, audited_hashes):
    APPEND(ledger, INDEPENDENT_AUDIT(n, verdict, audited_hashes))

function CLOSE(ledger, n, transcript, claimed, not_claimed):
    // scope of a negative stated
    APPEND(ledger, TERMINAL(n, SHA256(transcript), claimed, not_claimed))

function CORRECT(ledger, n, defect):
    // the earlier entry stays as written
    APPEND(ledger, CORRECTION(n, defect))

function AUDIT_LEDGER(ledger, filesystem):
    for entry in RESERVED entries of ledger:
        for path in entry.never_paths:
            require ABSENT(path) before and after the audit
    for entry in SEALED entries of ledger:
        for (f, h) in entry.hashes: require SHA256(f) == h
```
'''

[[blocks]]
kind = "complexity"
body = '''
The ledger grew to 1.2 MB, which is why it is grepped rather than read: the headers alone are a 240-line index. Every lane pays a few minutes per entry. The alternative, a private notebook per agent, was the state before the ledger and produced two false exclusions found by the later audit.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Collisions.** Two numbering collisions are recorded. Each time the later claim was declared VOID, no artefact had been created under it, and the identical protocol was renumbered atomically to a fresh number with new-only paths.
- **Keyword search as audit.** A novelty claim was made by grepping the ledger for phrases. The implementations swept widths generically and had never needed to name the width in prose. Retracted with the rule that novelty claims must inspect code, not narrative (see [Correction and retraction](/validation/correction-and-retraction)).
- **Reservation without result.** Reserved-but-never-run designs remain in the ledger as reservations. The corpus map distinguishes them from executed lanes.
'''

[[blocks]]
kind = "controls"
body = '''
Audits verify the ledger against the filesystem: every path a reservation promises to leave absent is checked absent before and after the audit, and every hash a seal states is recomputed.
'''

[[blocks]]
kind = "example"
title = "Entry templates"
body = '''
```
## 2026-09-04 LOG NNN RESERVED (creator) — one-line question
Files claimed (new only): wm_name.py, run_name.sh, NAME_AUDIT.md, logs/NNN_name_disclosed.log
Reserved and never to be created by the author: logs/NNN_name_controls.log / .attempt
Scope: controls-only, target absent. No target read is authorised by this reservation.

## 2026-09-04 LOG NNN SEALED (creator) — static KAT PASS, disclosed 12/12, mutations 40/40 rejected
Frozen bytes: source sha256 …; runner sha256 … (normalised …); parser sha256 …; design sha256 …
Disclosed transcript logs/NNN_name_disclosed.log sha256 …  Awaiting different-agent audit.

## 2026-09-04 LOG NNN TERMINAL (creator) — outcome in one line
Transcript logs/NNN_name_20260904T093519Z.log sha256 …  What is claimed: … What is not: …
```
'''

