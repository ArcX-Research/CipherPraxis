id = "reproducibility-receipts"
section = "validation"
title = "Reproducibility receipts"
subtitle = "Keep the hashes, inputs, and command needed to reproduce every reported number"
status = "VERIFIED"
status_note = "Launchers print transcript paths, ledger entries store SHA-256 hashes for sources and transcripts, and audits recompute hashes before writing. A fresh rerun of one sealed control job reproduced every meaningful record; only timing fields changed."
family = "Reproducibility"
tags = ["receipts", "hashes", "transcripts", "provenance"]
related = ["seal-and-audit-protocol", "ledger-reservations", "seed-determinism", "isolated-acquisition-solver-handoff", "transitive-process-census", "fresh-holdout-after-selector-change", "known-answer-tests", "kat-harness", "candidate-bank-lineage-and-cap-accounting", "provenance-preserving-partial-map-join", "factorial-completion-resource-guards", "drainability-and-throughput", "g-receipt"]
summary = "A receipt stores the minimum needed to reproduce a number: hashes of the solver, runner, parser, independent replay checker, corpus, and model files; package versions; the seeds and exact command; and the transcript hash. Discover those runtime inputs from the environment itself, then hash them again after the run. A copied manifest value cannot prove which bytes a process actually used, that they stayed unchanged, or that a forward replay was independent."
updated = "2026-09-06"

[[blocks]]
kind = "definition"
body = '''
A **receipt** for a claim $x$ is the tuple

$$\big(h(\text{source}),\ h(\text{runner}),\ h(\text{parser}),\ h(\text{replay checker}),\ h(\text{corpus}),\ h(\text{model files}),\ \text{packages},\ \text{seeds},\ \text{argv},\ h(\text{transcript}),\ \text{record id}\big)$$

with $h$ = SHA-256, such that re-running the pinned bytes with the pinned inputs regenerates the transcript's semantic records and $x$ can be read from them. The runtime component is discovered rather than trusted: query installed package versions, resolve every model or tokenizer file actually selected by the loader, and hash those files directly. The independent checker implements the forward equation from the written specification with a scalar loop and verifies every position of every physical origin. It does not call the solver's decrypt, encrypt, coordinate, or table-building helpers. The transcript records its input pins; a detached receipt, the result ledger, and the audit bind the completed transcript hash. A file cannot contain its own final digest without a circular definition.
'''

[[blocks]]
kind = "equations"
title = "What must be equal"
body = '''
A fresh execution reproduces a transcript **semantically**, not byte-for-byte, whenever timing or memory fields are embedded. The program's audit of one sealed run found exactly three differences between the frozen transcript and a fresh re-execution:

```
elapsed_ms       156666    -> 200053
peak_rss_bytes   131776512 -> 136200192
prefix_sha256    38c98177… -> f1739a6b…   (necessarily, since the summary changed)
```

with all 24 fixture records byte-identical. A gate that expects transcript-hash equality across runs is therefore wrong by construction; compare the semantic records. Designs that want byte reproducibility keep elapsed values out of the canonical transcript entirely.

Let $D_0$ be the freshly discovered digest vector immediately before execution and $D_1$ the same discovery repeated after execution. If $M$ is the frozen manifest, runtime closure requires

$$D_0=M\qquad\text{and}\qquad D_1=D_0.$$

The first equality binds the run to the declared resources. The second detects mutation, replacement, or a package change while the process was active. Comparing $M$ with a second copy of $M$ proves nothing; both checks must read the current files and query the current environment.
'''

[[blocks]]
kind = "variants"
body = '''
- **Repository-only run:** hash source, runner, parser, input data, and generated tables.
- **Model-bearing run:** also resolve and hash every weight, tokenizer, vocabulary, configuration, and index file opened by the model loader.
- **Package-sensitive run:** query the installed distribution metadata or executable version; do not rely only on a lock file that may not describe the active environment.
- **Derived-resource run:** rebuild the derived table from its raw source when practical, then bind both the raw and derived digests.
- **Long-running job:** take both pre-run and post-run snapshots. For a multi-process job, bind each child to the same snapshot and record the process graph.
- **Multi-stage packet:** bind the canonical producer input, packet schema version, packet bytes, producer and consumer sources, and final artifact. The consumer revalidates every field it relies on instead of trusting a producer-written summary.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Hashes are recomputed from the files at the moment of writing, not copied from a hand-off. Audits in the program state this explicitly.
- Corpus and model tables are pinned by content hash, and derived tables (integer-scaled quadgram scores) by both their hash and a checksum.
- Host artefacts outside the repository (a system dictionary used as a word bank) are a reproducibility risk. The audit recommended pinning the derived bank blob itself.
- Runtime discovery follows the same loader rules as execution. Hashing a convenient directory listing is not enough if the loader can select a different revision, cache, or optional file.
- The post-run snapshot is taken before accepting or publishing the result. Any missing file, version-query failure, or digest drift makes the run incomplete.
- "Independent" describes code paths, not function names. The scalar checker may share the declared input schema and alphabet constants, but not derived arrays, inverse helpers, fitted state, or cached plaintext from the search. Its source and dependencies receive their own hashes.
- Every physical origin behind a deduplicated plaintext is replayed. Checking one representative proves nothing about the other keys, offsets, or sign cells in that bucket.
- Every origin in an intermediate packet resolves to one canonical input row. Its support positions are inside the declared input span and reproduce the stated direct or derived map cells.
- Producer and consumer bounds agree. A packet accepted by the producer cannot exceed an undocumented bank-size or completion limit at the next stage.
'''

[[blocks]]
kind = "attack"
body = '''
Before a run, resolve the executable sources, independent replay checker, and every transitive data resource, query active package versions, and recompute their hashes. Compare this fresh snapshot with the frozen manifest. Replay every emitted physical origin through the separate scalar forward before accepting its semantic bucket. After the last semantic record is produced, repeat the same discovery and require exact equality with the first snapshot. Only then bind the transcript and claim record.

At a process boundary, treat a digest as a pointer, not as validation. Either store the canonical producer input beside the packet or make it reproducibly rebuildable from bound inputs. Recompute the digest, enforce exact keys and types, check every origin-to-row link and support position, and verify that each candidate cell is supported by that candidate's own origins. A global pool containing some matching cell is not enough. Record direct observations separately from cells forced by a model identity.

For each child, durably write both the raw streams and the complete process record before asserting that the child passed or refused correctly. Record the exact command, environment, exit status, wall time, peak resource use, cap status, and stream hashes. If a later assertion aborts the controller, these facts must already be recoverable. An error message alone cannot reconstruct missing exit or resource evidence.

Keep observed resource use separate from its admission limit. Never replace a measured duration with the smaller of that duration and the timeout: an overrun must remain visible in both the process receipt and cumulative budget accounting. State whether a memory figure describes one process, an operating-system child-usage record, or a simultaneously measured process tree. A post-exit resource check is not a hard memory limit.

For a fixed panel, reserve enough time for a complete case and its required replay before starting it. When a resource ceiling is reached, record the current case and every unattempted case as incomplete; do not grade only the finished prefix. Keep search, verification and whole-controller budgets distinct, and check the whole limit again after a case and after final evaluation. A complete-looking score cannot override a capped process or a missing replay certificate.

Refusal tests must identify the expected failure phase. An import or initialization guard runs before the main handler, so it cannot emit a marker owned by that handler. Check the phase-appropriate exit and diagnostic, and verify that no downstream search artifacts were created. Preserve an earlier failed receipt when completing such a test separately; do not promote its surviving stderr into a process record that was never saved.

Receipts also stop three slower failures. **Drift:** current source is presented as the source that produced an older result. **Promotion:** an exploratory, capped, empty, or partial transcript is cited as an exclusion. **Untraceable claim:** a reported number cannot be derived from a named semantic record. Runtime closure adds a fourth check: the manifest must describe the resources the active process actually resolved.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: the pinned bytes (source, runner, parser, corpus, model tables),
// the seeds and exact command line, and the transcript record a number x is
// read from. Output: a detached receipt that binds the finished transcript.
function DISCOVER_RUNTIME(loader, declared_sources):
    files = declared_sources + loader.RESOLVE_ALL_ACTIVE_RESOURCES()
    packages = QUERY_ACTIVE_PACKAGE_VERSIONS(loader.dependencies)
    require every resolved file exists and is a regular file
    return SORTED(files with SHA256(READ(file))), SORTED(packages)

function RUN_WITH_RECEIPT(manifest, seeds, argv, record_id):
    // Fresh reads from the active environment, never copied manifest values.
    before = DISCOVER_RUNTIME(manifest.loader, manifest.sources)
    require before == manifest.runtime_snapshot
    transcript, processes = RUN_AND_FSYNC_PROCESS_RECORDS(argv, seeds)
    require transcript is complete and semantically valid
    require INDEPENDENT_SCALAR_REPLAY_ALL(manifest.checker, transcript)
    after = DISCOVER_RUNTIME(manifest.loader, manifest.sources)
    require after == before
    h_t = SHA256(READ(transcript))
    receipt = (before, seeds, argv, HASHES(processes), h_t, record_id)
    WRITE_ATOMIC(receipt)
    return receipt

function VERIFY_RECEIPT(receipt, transcript):
    current = DISCOVER_RUNTIME(receipt.loader, receipt.sources)
    if current != receipt.runtime_snapshot: return DRIFT
    fresh = RERUN(receipt.runtime_snapshot.files, receipt.seeds, receipt.argv)
    if SEMANTIC_RECORDS(fresh) != SEMANTIC_RECORDS(transcript):
        return NOT_REPRODUCED
    return REPRODUCED(READ_RECORD(fresh, receipt.record_id))
```
'''

[[blocks]]
kind = "complexity"
body = '''
Runtime discovery and hashing are linear in the total size of the bound files. Model checkpoints can make this visible, but it remains small compared with a long search and must not be replaced by trusting cached digest strings. Semantic replay may dominate verification when the solver's certificate is large. The procedural cost remains: keep the analysis program with its transcript, name the semantic record behind every claim, and print the transcript path when a launcher exits.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Path-bound hashes.** Smoke transcripts that embed the absolute log path in `argv` have path-dependent whole-file hashes. The program records a path-independent fixture digest alongside.
- **Self-computed runner hash.** A runner that hashes itself at run time and exports the value validates a modified copy of itself; production modes pin the runner through the manifest and environment instead, and the auditors recorded that a public-mode transcript alone does not attest runner identity.
- **Mis-filed transcripts.** A pilot's transcript was filed under a development directory when a superseded pilot was stopped. The ledger corrected the path and hash.
- **Manifest echo.** The end check compares stored manifest values with the same stored values instead of opening the resources again.
- **Checkpoint-directory hash.** A directory name or revision label is pinned, but the individual files selected by the loader are not enumerated and hashed.
- **Lock-file assumption.** A dependency lock is treated as proof of the packages imported by the active interpreter.
- **Pre-run only.** Resources are verified before execution but can change before the result is accepted.
- **Optional-resource omission.** A tokenizer vocabulary, lexical database, configuration file, or fallback table affects scoring but is absent from the snapshot.
- **Shared-helper replay.** A function called "independent forward" imports the inverse routine's coordinate table or calls its encryption helper, so one sign or indexing bug can make both paths agree.
- **Representative-only replay.** One key behind a deduplicated plaintext passes, while other physical origins are never checked or even written to the receipt.
- **Orphan packet hash.** An artifact names a packet digest, but the packet and canonical inputs needed to rebuild it are absent.
- **Decorative provenance.** Fields called `input_hash`, `rows`, or `origin` are accepted without recomputation or a link to the supporting source row.
- **Global-support substitution.** A candidate cell is accepted because some proposal supports it, although none of the candidate's recorded origins does.
- **Unbounded support position.** A residue check passes for a negative or far-out coordinate because only its value modulo the period was validated.
- **Schema limit mismatch.** A producer legally emits a bank that the consumer refuses, so the advertised pipeline contract is not closed.
- **Assertion before durable process record.** The raw streams survive, but a refusal assertion interrupts the controller before it saves the child's exit status, resources, or cap classification.
- **Wrong-phase marker.** A test demands a main-handler diagnostic from a child that correctly refused during import. The test is incomplete even though the safety guard worked; it is not a cipher-family negative.
- **Clipped resource evidence.** The reported duration is truncated to its limit, hiding an overrun from the cumulative budget and later audit.
- **Finished-prefix promotion.** Unattempted cases disappear after a panel timeout, so a favourable subset is graded as though it were the whole panel.
- **Memory-scope substitution.** A per-process peak or post-exit check is described as a hard bound on the entire pipeline's simultaneous memory use.
'''

[[blocks]]
kind = "controls"
body = '''
Test the closure with copies rather than valuable inputs. Mutate each source, checker, and model resource in turn, change one reported package version, remove an optional file, point the loader at a second cache, and alter a file between the pre-run and post-run snapshots. Mutate the sign, index order, offset, and final symbol in the solver output so the independent scalar replay demonstrably fails. Every case must refuse. A clean case must rediscover the same full resource set twice, replay every physical origin, and reproduce its semantic output independently. Independent review should also rebuild derived banks from raw sources and rederive counts and claims rather than accepting summaries.

For packet pipelines, also mutate the input digest, origin id, origin weight, support position, direct-versus-derived label, bank-size summary, and producer metadata one field at a time. Test the producer's largest valid bank and one row beyond it against the consumer. A clean packet must rebuild byte-for-byte from its canonical input, while every mutation either changes the bound digest or is refused.
'''

[[blocks]]
kind = "example"
title = "Receipt block"
body = '''
```
RECEIPT
  source   solver.py              sha256 9fe54b86…
  parser   solver_parser.py       sha256 04642c07…
  runner   run_solver.sh          sha256 11ac2a0b…  (normalised: b1f10523…)
  corpus   corpus.txt             sha256 06ed53d8…  2,344,368 letters
  q4       integer table          sha256 91f571a2…  scale 1e9, smoothing 0.01
  seeds    plant=<seed> solver=<seed>
  argv     <exact command line>
  transcript logs/NNN_name_<stamp>.log   sha256 …   <record or line the number is read from>
```
'''

