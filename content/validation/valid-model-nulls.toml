id = "valid-model-nulls"
section = "validation"
title = "Valid-model nulls"
subtitle = "Use negative cases that obey the cipher rules but remove the signal being tested"
status = "VERIFIED"
status_note = "Sealed control sets pair positives with two kinds of negatives: independent letters with the right single-letter counts, and cases that break the cipher model. The independent-letter negative caught an English gate that would otherwise have passed on algebra alone."
family = "Power and calibration"
tags = ["nulls", "negatives", "controls", "calibration"]
related = ["tautological-gate-rule", "planted-controls", "selection-overfit-check", "family-wise-null", "within-coset-null", "shuffled-null-z-score", "permutation-test", "english-gate-calibration", "homophonic-substitution"]
summary = "A negative that breaks the cipher rules may be easy to reject for the wrong reason. A valid-model null keeps the correct construction, a legal key, and English single-letter frequencies, but draws letters independently. Only a gate that uses adjacency, order, or language can reject it. This tests whether the pipeline really detects plaintext when the cipher's algebra is present but the language signal is not."
updated = "2026-09-05"

[[blocks]]
kind = "definition"
body = '''
Fix a cipher model $\mathcal{M}$ with key space $K$ and a selector that outputs a candidate plaintext and a decision. A **valid-model null** is a fixture $(p^\ast, k, c)$ with $k \in K$ legal, $c = \operatorname{Enc}_{\mathcal{M}}(p^\ast, k)$ computed by the real forward, and $p^\ast$ drawn so that every *marginal* the model exploits is preserved while the *signal* the gate claims to detect is absent. The program's standard choice is independent letters from the English monogram distribution: correct unigram statistics, no adjacency.

The required outcome is a **negative terminal** (`NON_ENGLISH` or "no candidate"). A valid-model null that reaches the candidate terminal is a gate failure of the whole pipeline, regardless of how many positives pass.

Model-violating negatives are kept alongside them, such as an independent random key for the second text or an offset or reversed chain. They test a different property: whether the algebra, rather than the language score, rejects the case.
'''

[[blocks]]
kind = "equations"
title = "Conditional randomisation nulls"
body = '''
The same idea applied to a *target* rather than a fixture gives the program's candidate-null certificate: permute the positions of the observed ciphertext so that its letter histogram $H(C)$ and its nuisance class structure are preserved exactly, re-run the identical full selector on each of $B$ permutations, and report

$$p = \frac{1 + \#\{b : S_1(\text{null}_b) \ge S_1(\text{obs})\}}{B + 1}, \qquad \text{equality loses}.$$

With $B = 99$ the finest attainable value is $p = 0.01$, and certification requires zero exceedances. The selection over classes is inside every replicate, so the multiplicity of the search is charged to the null automatically.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The null preserves exactly the invariants the selector is allowed to use (histogram, coset multisets, class census) and destroys exactly the structure it claims to detect. A within-coset shuffle preserves each coset's histogram, so a periodic-substitution selector sees identical coset statistics and can differ only through order.
- The null is generated before any score exists (a precommitted permutation bank with a digest), and no null is filtered by the observation's gates.
'''

[[blocks]]
kind = "attack"
body = '''
Valid-model nulls expose the decisions a pipeline makes on pure noise under a true model. In one sealed suite the independent-letter negative ranked first among its nulls *with the true cycle*, because the algebra was exactly right, and was stopped only by the English gate. A suite without that fixture would have certified a gate that merely checks algebra. In another, the negative ranked 3 to 12 among nulls and was rejected on rank alone. Both outcomes are informative and both were recorded per fixture.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: cipher model M with key space K and its real forward ENCRYPT_M, the
// full selector SELECT (candidate plaintext plus decision), the English
// monogram distribution E, and B precommitted permutations. Output:
// per-fixture verdicts; a gate failure if any valid-model null is accepted.
function VALID_MODEL_NULL(M, n, seed):
    // correct unigram statistics, no adjacency
    p_star = DRAW_INDEPENDENT_LETTERS(E, n, seed)
    k = DRAW_LEGAL_KEY(K, seed)
    // the algebra is present, the language signal is not
    return (p_star, k, ENCRYPT_M(p_star, k))

function CHECK_NEGATIVES(fixtures):
    // valid-model and model-violating negatives alike
    for f in fixtures:
        // NON_ENGLISH or "no candidate" is required
        if TERMINAL(SELECT(f.c)) != NEGATIVE:
            // regardless of how many positives pass
            return GATE_FAILURE
    return NEGATIVES_PASS

function CONDITIONAL_NULL_CERTIFICATE(c_obs, B):
    // histogram and class structure preserved; digest recorded first
    bank = PRECOMMITTED_PERMUTATIONS(c_obs, B)
    // selection over classes happens inside every replicate
    s_obs = SELECT(c_obs).score
    exceed = 0
    for b in 1..B:
        // identical full selector; no null filtered or rerolled
        s_b = SELECT(PERMUTE(c_obs, bank[b])).score
        if s_b >= s_obs: exceed += 1                     // equality loses
    p = (1 + exceed) / (B + 1)
    return (CERTIFIED if exceed == 0 else NOT_CERTIFIED, p)
```
'''

[[blocks]]
kind = "complexity"
body = '''
Each valid-model null costs one full selector run. A conditional randomisation certificate costs $B + 1$ full runs (100 for $B = 99$). The program budgets these inside the same wall and memory caps as the observation and treats any replicate that fails for a computational reason as `INCOMPLETE` for the whole certificate, never as a null loss.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Nulls that skip the finishing stage.** A two-stage selector's null replayed only the first stage. The decision-bearing second stage was never nulled, so the null could not lose. Blocked at audit.
- **Score-dependent null membership.** Accepting or replacing a null after seeing its score invalidates the bank. The design forbids reroll and requires the bank digest before selection.
- **Tied nulls dropped.** A null that ties the observation must count as a loss for the observation. The design states "equality loses" and the parser enforces `ties == len(top)`.
'''

[[blocks]]
kind = "controls"
body = '''
A control suite in this atlas lists, per fixture, its role: exact positive, structured-plaintext positive, valid-model negative, model-violating negative, boundary or robustness diagnostic. The pass predicate counts positives and negatives separately, and robustness diagnostics are excluded from it.
'''

[[blocks]]
kind = "example"
title = "Suite layout"
body = '''
```
P01..P16  exact positives, every (order, sign) cell once; two with list-like plaintext
N1, N2    valid-model: legal key, independent letters with English monogram frequencies
N3, N4    model-violating: second text keyed by an independent random stream
B50, B56  robustness diagnostics (boundary planted off by 3), reported with caps, not gated
nulls     99 precommitted within-residue permutations per fixture, digest recorded first
gate      Q_obs > max(Q_null[0:99]) and Q_obs >= frozen English threshold; equality fails
```
'''

