id = "selection-overfit-check"
section = "validation"
title = "Selection overfit check"
subtitle = "Compare the winning score with null runs that repeat the full search"
status = "VERIFIED"
status_note = "The ledger requires this check. In one ciphertext-based cycle bank, 8 of 9 full-pipeline null winners beat the best target score, so it was rejected as overfit. A cross-text maximum fell from +5.7 standard deviations in one trial to +0.8 after the family-wide comparison."
family = "Power and calibration"
tags = ["selection", "overfitting", "multiplicity", "nulls"]
related = ["selection-overfit-diagnostic", "family-wise-null", "within-coset-null", "shuffled-null-z-score", "valid-model-nulls", "tautological-gate-rule", "quadgram-log-likelihood", "bayesian-evidence-model-selection"]
summary = "A selected maximum is naturally larger than one unselected score. Compare it with maxima from the same complete search under a justified null model. Repeating only the final scoring stage fails to account for earlier choices of key, crib, width or candidate bank."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
Let a pipeline produce $S^\ast(c) = \max_{\theta \in \Theta} S(c, \theta)$ over a candidate set $\Theta$ (keys, cycles, placements, widths, relations), possibly followed by refinement of the top $k$. The **selection overfit check** compares $S^\ast(c_{\text{obs}})$ with the distribution of $S^\ast(c_b)$ over nulls $c_b$, $b = 1..B$, where each $c_b$ passes through the *identical* pipeline: the same $\Theta$, the same top-$k$ refinement, the same polish. The empirical exceedance

$$p = \frac{1 + \#\{b : S^\ast(c_b) \ge S^\ast(c_{\text{obs}})\}}{B+1}$$

is the matched plus-one rank. It is a valid Monte Carlo $p$-value when the observed and null inputs are exchangeable under the declared null generator; otherwise it remains a descriptive calibration rank. A per-candidate null ("how often does one random key score this well") usually produces a p-value that is too small after selection, thereby overstating surprise by an amount that grows with the effective search size.
'''

[[blocks]]
kind = "equations"
title = "How much selection buys"
body = '''
Profiling $m$ free shifts of 26 values each on $n$ letters buys spurious fit. The program measured about $0.15$ nats per letter at $n = 153$ for $m = 7$, enough to make wrong models win a likelihood comparison, which is why its evidence-based tests marginalise the shifts under a uniform prior instead of maximising them. For extreme-value intuition, the maximum of $M$ independent standard normals grows like $\sqrt{2\ln M}$: $M = 1{,}296$ trials gives about $3.8$, so a per-trial "$+5.7\sigma$" contains roughly $3.8\sigma$ of pure selection.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The nulls preserve what the pipeline is allowed to exploit and destroy what it claims to detect (within-coset shuffles for a periodic model; whole-text shuffles for a transposition-invariant one).
- The nulls go through **every** stage. A null that stops at the screening statistic cannot bound a score produced after refinement.
'''

[[blocks]]
kind = "attack"
body = '''
Three recorded applications:

- **Ciphertext-derived cycle bank.** 66,628 mechanically derived cycles were screened. The observation's best at depth top-128 was $-4.869$ per letter. Nine complete-pipeline within-coset nulls were run through the same screen, depth and refinement; eight of nine null maxima beat it (mean $-4.836$, plus-one upper-tail $p=0.90$). The candidate failed the matched-rank rule; the bank at that depth was retired under the protocol's stated power and null assumptions.
- **Cross-text relations.** The best coincidence rate over all index-space pairs and offsets was $0.0495$; against a per-trial null it looked like $+5.7\sigma$, against the family-wise null over the 1,296 trials it was $+0.8\sigma$.
- **Frozen 100-cycle bank on a live text.** Best rate $-6.70$, rank 16 of 20 in each of two independently declared null families ($p = 0.8$). The observation was ordinary under both matched searches; any bank-level negative remains conditional on the protocol's measured power.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: observed ciphertext c_obs, candidate set Theta, score S, top-k
// refinement and polish, a null generator NULL that preserves what the
// pipeline may exploit and destroys what it claims to detect, and B nulls.
// Output: the empirical exceedance p and a verdict.
function PIPELINE(c, Theta):
    // first screen
    top = the k candidates theta in Theta with the largest S(c, theta)
    // every later stage, unchanged
    top = REFINE(top); top = POLISH(top)
    // S*(c)
    return MAX(S(c, theta) for theta in top)

function SELECTION_OVERFIT_CHECK(c_obs, Theta, B):
    s_obs = PIPELINE(c_obs, Theta)
    exceed = 0
    for b in 1..B:
        // within-coset shuffle for a periodic model, whole-text for a
        // transposition-invariant one
        c_b = NULL(c_obs, b)
        // identical Theta, refinement and polish
        if PIPELINE(c_b, Theta) >= s_obs: exceed += 1
    p = (1 + exceed) / (B + 1)
    report p with its resolution limit 1 / (B + 1)
    // a per-candidate null would understate the surprise
    return p

function CALIBRATE_ON_PLANT(c_plant, Theta, B):
    // a real recovery under the same selection must rank first with a stated
    // margin
    s_plant = PIPELINE(c_plant, Theta)
    null_max = MAX(PIPELINE(NULL(c_plant, b), Theta) for b in 1..B)
    return (s_plant > null_max, s_plant - null_max)
```
'''

[[blocks]]
kind = "complexity"
body = '''
The null multiplies the pipeline's cost by $B + 1$. The program uses $B = 9$ for expensive complete pipelines, $B = 19$ per family in mid-cost lanes and $B = 99$ in sealed certificates, and it reports the resolution limit $1/(B+1)$ with the result.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Nulls that skip refinement.** The first screen is nulled, the top-$k$ polish is not. The polished target score then exceeds every null trivially.
- **Selecting the more favourable statistic.** Reporting whichever of two statistics gives the smaller $p$ is itself a selection; sealed designs declare one primary statistic and treat the second as a conjunctive guard that cannot rescue a failure.
- **Fluent overfits.** Language-model beams produce fluent strings on any input. The ledger forbids promoting one unless the full selected-family null is lower.
'''

[[blocks]]
kind = "controls"
body = '''
Run the identical check on a planted control: the plant's score should exceed all $B$ null maxima (rank 1) with a stated margin, which calibrates what a real recovery looks like under the same selection. The program's sealed suites require strict rank one for every positive and report the margin in rate units.
'''

[[blocks]]
kind = "example"
title = "Check layout"
body = '''
```
SELECTION  bank=66,628 cycles  screen=top-128  refine=quadgram polish  (identical pipeline for every null)
  observed best        -4.869 per letter
  null maxima (B = 9)  <one value per complete-pipeline null; recorded mean -4.836>
  exceedances          8/9  ->  p = (1 + 8)/(9 + 1) = 0.90
VERDICT matched-rank fail; bank/depth retired under declared scope; no candidate
```
'''

