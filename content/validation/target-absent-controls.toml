id = "target-absent-controls"
section = "validation"
title = "Target-absent controls"
subtitle = "Build and audit a test that has no way to read the live ciphertext"
status = "VERIFIED"
status_note = "Every sealed control job records target=ABSENT in its manifest and transcript. It also checks allowed imports, scans for forbidden strings, and rejects any target mode. Independent auditors followed the full import chain to verify this isolation."
family = "Control design"
tags = ["controls", "isolation", "leakage", "sealing"]
related = ["planted-controls", "blind-controls", "seal-and-audit-protocol", "kat-harness", "held-out-gates", "assumption-review-protocol", "g-target-absent"]
summary = "A target-absent tool is built, tested, frozen, and independently audited while it has no way to load the live ciphertext. It has no loader import, ciphertext constant, or target command. Its controls cannot be tuned by looking at the target, and its power can be published before the target is read. A later one-shot run then uses a tested selector that was not shaped by peeking."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A lane is **target-absent** when all of the following hold on its exact frozen bytes:

- the source's import set equals a declared allow-list (numpy, the standard library and named frozen predecessors) and contains no module that can load a live text;
- the source, parser and runner contain no long uppercase literal (the program scans for `[A-Z]` runs of length 30 or 40 and above) and none of the loader names or file tokens through which a target could arrive;
- the runner refuses `--target`, `--live`, `--solve` and any production basename;
- the transcript, manifest and release records carry the literal field `target = "ABSENT"`.

Independent audits check these properties **transitively**: a lane that imports a frozen predecessor inherits the predecessor's isolation only if the predecessor was audited to the same standard.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Generic corpus material and previously recorded measurements may enter. The live ciphertext may not. The program allows target-derived *constants* (a boundary position measured earlier, an alphabet order) but records them as oracle-supplied parameters that the controls never search over.
- Isolation is a property of bytes, not of intent. The audit rehashes the files and reads the imports rather than trusting the creator's note.
'''

[[blocks]]
kind = "attack"
title = "What isolation buys"
body = '''
1. **Do not tune on the target.** Set thresholds, restart schedules, and beam widths from disclosed calibration before reading the target. A later readable result then cannot come from changing settings only after something looked like English.
2. **Publishable power.** Because nothing secret entered, the control transcript, its seeds and its fixtures can be replayed by anyone.
3. **Use a clean handover.** Put the one-shot target run in a separate, independently audited file that pins the target-absent lane by hash. Read the target exactly once, after writing a durable attempt marker (see [Blind controls](/validation/blind-controls)).
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: the exact frozen bytes of source, parser and runner, the declared
// import allow-list, and the frozen predecessors the source imports. Output:
// ISOLATED or NOT_ISOLATED; only an isolated lane is sealed, audited and
// released.
function IS_TARGET_ABSENT(source, parser, runner, allow_list, predecessors):
    // no module that can load a live text
    if IMPORTS(source) != allow_list: return NOT_ISOLATED
    for file in [source, parser, runner]:
        if HAS_LONG_UPPERCASE_LITERAL(file): return NOT_ISOLATED
        if HAS_LOADER_NAME_OR_TARGET_FILE_TOKEN(file): return NOT_ISOLATED
    for flag in ["--target", "--live", "--solve"] + production_basenames:
        if not REFUSES(runner, flag): return NOT_ISOLATED
    if not (transcript, manifest and release carry target = "ABSENT"):
        return NOT_ISOLATED
    // isolation is inherited transitively
    for pred in predecessors:
        if not AUDITED_TO_SAME_STANDARD(pred): return NOT_ISOLATED
    return ISOLATED

function ISOLATION_KAT(source, parser, runner):
    // the check must itself be able to fail; refusals are counted
    assert IS_TARGET_ABSENT(source + loader_import, ...) == NOT_ISOLATED
    assert IS_TARGET_ABSENT(source + long_uppercase_literal, ...) ==
            NOT_ISOLATED

function LANE(design):
    // target never read
    set thresholds, restart schedules and beam widths from disclosed
            calibration
    freeze bytes
    require IS_TARGET_ABSENT(...) == ISOLATED
    independent audit
    publish control power
    // handover: a separate, independently audited file pins this lane by
    // hash, writes a durable attempt marker, then reads the target exactly
    // once
```
'''

[[blocks]]
kind = "complexity"
body = '''
Isolation costs engineering time, not compute: an allow-list KAT, a forbidden-string scan and refusal probes are a few hundred lines, and the audits add a day per lane. It also constrains design: parameters that would normally be read from the target must either be searched (which costs power) or be declared as oracle inputs whose absence from the control's search is recorded as a coverage hole.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Accidental exposure.** A broad metadata search displayed archived target fields to a reviewer. The review recorded that it could no longer claim strict blind isolation and could not itself authorise a later target run.
- **Oracle parameters hidden in "controls".** Plants generated with the target-measured boundary and period never test the selector's behaviour when those are wrong. The program's audit lists such parameters explicitly and marks the corresponding power as within-family only.
- **A transcript that must carry the target.** A one-shot target transcript needs the ciphertext for loader-free replay. The program flags that such a file will trip other lanes' forbidden-string scans and says so in its note.
'''

[[blocks]]
kind = "controls"
body = '''
The isolation KAT is itself a control: it must reject a copy of the source with a loader import added, and a copy with a 40-letter uppercase literal inserted. The program's static KATs report these as counted refusals (for one lane, seven split fragments rejected in source, parser and runner).
'''

[[blocks]]
kind = "example"
title = "Isolation checklist"
body = '''
```
[ ] imports == allow-list (ast scan)                      PASS
[ ] no [A-Z]{40,} literal in source/parser/runner         PASS
[ ] no loader module name, no target file token           PASS
[ ] runner refuses --target/--live/--solve (rc 2)         PASS 3/3
[ ] manifest.target == "ABSENT"                           PASS
[ ] transitive: predecessors audited to same standard     PASS (chain of 3)
```
'''

