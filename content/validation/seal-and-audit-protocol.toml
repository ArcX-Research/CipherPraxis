id = "seal-and-audit-protocol"
section = "validation"
title = "Seal and audit protocol"
subtitle = "Design, seal, independent exact-byte audit, release: an acyclic chain of custody for one-shot runs"
status = "VERIFIED"
status_note = "The protocol was executed end to end in the research program: two lineages passed through independent BLOCK verdicts, repaired successors, different-agent PASS audits and release-authority transactions, with every artefact pinned by SHA-256 and every verdict recorded in the ledger."
family = "Audit and release governance"
tags = ["audit", "seal", "release", "chain of custody", "independent review"]
related = ["reproducibility-receipts", "ledger-reservations", "correction-and-retraction", "build-manifests-and-release-json", "hash-chained-transcripts", "blind-controls", "target-absent-controls", "kat-harness", "g-seal", "g-independent-audit"]
summary = "Before an instrument may consume a one-shot resource (a hidden control bank, a single read of the live text), its bytes are frozen and a different agent audits them against the written design. The creator seals; the auditor issues PASS or BLOCK with exact hashes; a BLOCK forces a new-only successor rather than an edit; only the release authority can create the release record and run the transaction. The protocol's value showed in its blocks: audits found a null that could not fail, a one-shot property that lived only in process memory, and an unpinned runner, each before a bank was burned."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Roles: the **creator** writes the design and implementation; the **independent auditor** is a different agent who did not write the bytes; the **release authority** holds tokens and seeds and executes production modes. Stages, each producing a hashed artefact:

1. **Design** note, predeclaring family, algebra, controls, nulls, gates, terminals, resources and file names.
2. **Design audit** by the auditor: PASS authorises implementation; BLOCK names blockers.
3. **Implementation**: source, strict parser and runner, mutually pinned by hash.
4. **Build manifest** (detached JSON) binding implementation hashes, frozen ancestors, constants and reserved paths; it contains no descendant hash.
5. **Creator audit** (the *seal*): static KAT, disclosed runs, refusal probes, residuals.
6. **Independent exact-byte audit**: rehash, rerun public routes, mutate and probe; verdict PASS or BLOCK.
7. **Release** record created by the authority, binding manifest, both audits and an authorisation token.
8. **Transaction** (one shot) and **admission** replay.

A BLOCK is never repaired in place: the blocked bytes stay frozen and a fresh log number owns the successor.
'''

[[blocks]]
kind = "equations"
title = "Acyclic pinning"
body = '''
Let $h(\cdot)$ be SHA-256. The chain must satisfy $a_i \to a_j$ only if $a_i$ was written before $a_j$, so that no artefact hashes a later one:

$$\text{parser/source/runner} \to \text{manifest} \to \text{creator audit} \to \text{independent audit} \to \text{release}.$$

Mutual source/runner identity without a cycle is achieved by hashing the runner with its own hash-constant lines masked: the source pins $h(\text{runner}_{\text{masked}})$, the runner pins $h(\text{source})$. An auditor recomputed that masking independently and found that a body append changes the masked digest while a masked-constant change changes only the raw hash, so neither is unbound.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Auditors are genuinely different agents with no authorship of the bytes; the ledger records who wrote what, and a take-over of an interrupted implementation was recorded as such (the inherited bytes verified unchanged, the manifest and audit written fresh).
- Audits are target-absent: they run only public modes and mocks, never the production transaction.
- A PASS certifies the wrapper's gates, parser and transaction on the exact bytes; it is not a statement about any target.
'''

[[blocks]]
kind = "attack"
title = "What the audits caught"
body = '''
- A controls lane whose creator note said the null permutations were drawn before the identity run, while the code drew them after; whose generator truncated tie sets to 64; and whose structural parser accepted a false null tie count (an in-memory mutation from 1 to 2 was accepted). BLOCK; the successor retained ties completely, and the successor after that rejected 38 of 38 parser mutations and rejected a falsified runner pin at all three admission layers (parser, attempt marker, semantic replay).
- A one-shot target wrapper whose read-once counter lived in the process, so a crash after the read left no evidence; and whose runner was not pinned by the source. BLOCK; the replacement wrote a durable `O_EXCL` attempt marker before the sole read and added a one-line release manifest for mutual identity.
- A design whose seed-label clause was ambiguous and whose summary was rendered before the snapshot it had to contain existed. BLOCK; the successor fixed both, and an auditor replayed the whole 34-row public bank from the design text before implementation was allowed.
'''

[[blocks]]
kind = "complexity"
body = '''
Each lineage costs several audit-days and produces on the order of ten artefacts. The program's counts: 16 design notes, 9 creator audits, 33 independent audits and 216 audit notes of all kinds, for roughly 470 solver scripts. The compute inside an audit is small (static KATs of 50 to 100 s, disclosed replays of about 100 s); the discipline is the cost.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Creator statements that contradict the bytes** (the null-precommit order); the audit reads code, not notes.
- **Miscounted receipts.** An audit's terminal said 17/17 gates; recounting the sealed transcript gave 16, and the correction was carried in the binding receipt while the sealed bytes stayed unmodified so their hashes remained valid.
- **Reserved-path confusion.** The auditor of one lane wrote under a fresh log number and deliberately left the reserved audit path absent, so production stayed correctly blocked until the authority decided whether to install it.
'''

[[blocks]]
kind = "controls"
body = '''
Audits are themselves probed: tamper probes append one byte to copies of source, parser and core and require refusal with "hash drift" before execution; refusal panels run every production mode without tokens and require exit code 2 with no artefact created.
'''

[[blocks]]
kind = "example"
title = "Lineage record"
body = '''
```
LOG a  DESIGN            design.md                     sha256 …  (creator)
LOG a  DESIGN AUDIT      design_independent_audit.md   PASS      (auditor)
LOG b  IMPLEMENTATION    source.py parser.py runner.sh  mutually pinned
LOG b  BUILD MANIFEST    build_manifest.json           no descendant hashes
LOG b  CREATOR AUDIT     creator_audit.md              static KAT, disclosed, refusals
LOG c  INDEPENDENT AUDIT independent_audit.md          PASS 16/16 gates | BLOCK B1..Bn
LOG b  RELEASE           release.json                  token, audit hashes, target=ABSENT
LOG b  TRANSACTION       logs/b_name.log(.attempt)     terminal; admission ACCEPTED
```
'''

