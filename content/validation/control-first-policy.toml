id = "control-first-policy"
section = "validation"
title = "Control-first policy"
subtitle = "Do not load or print target results until planted checks pass"
status = "VERIFIED"
status_note = "Every launcher uses the same fixed order and prints an explicit CONTROL_GATE PASS, CONTROL_GATE FAIL, or TARGET_REFUSED result. A failed control stops the run, and the no-repeat checklist forbids trying the target afterward."
family = "Control design"
tags = ["controls", "gating", "launchers", "policy"]
related = ["planted-controls", "target-absent-controls", "blind-controls", "throughput-fail", "kat-harness", "seal-and-audit-protocol", "g-planted-control", "endpoint-specific-control-contracts", "evidence-scope-ladder", "transitive-process-census"]
summary = "Every run follows one order: self-tests, planted controls, and only then the live text if all controls pass. A failed control means the tool is not ready. The launcher stops and records that failure instead of loading the target. Enforcing this order in code prevents a weak test from creating a misleading negative result."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
A run under the control-first policy has three phases in a fixed order:

1. **Known-answer tests** of the compiled core and the parser (see [KAT harness](/engineering/kat-harness)). Any failure aborts before a corpus is loaded.
2. **Planted controls** at the target's length and information budget, printed in full with their planted and recovered parameters (see [Planted controls](/validation/planted-controls)).
3. **Target** rows, printed only if phase 2 ended in `CONTROL_GATE: PASS`.

The policy is stated in the program's launcher as: every script prints planted controls before the targets. A failed gate means that the method is not admitted for the target. It does not by itself prove a software defect: the objective, proposal support, information budget or search capacity may be inadequate.
'''

[[blocks]]
kind = "equations"
title = "Evidence conditional on the gate"
body = '''
Write $C$ for certified execution completion, $K$ for a passing correctness test and $G$ for a passing matched power gate. The release rule requires

$$\mathrm{target\_admitted}\implies C\land K\land G.$$

This is an evidence-admission policy, not a derived Bayesian likelihood ratio. A completed power miss is evidence about the frozen decoder's capability. A capped or interrupted attempt is incomplete. Neither authorises a target test or an exclusion of the target's cipher family.
'''

[[blocks]]
kind = "variants"
title = "Audit completed failures as well as passes"
body = '''
Execution completion and a favorable scientific outcome are separate fields. A fully executed, source-bound control panel may correctly report that its frozen method failed the recovery threshold. That negative result must remain independently auditable, with its inputs, all case outcomes and raw receipts preserved.

Freeze an explicit mapping from terminal receipts and observed exit codes to completed pass, completed failure and incomplete execution. A supervisor that accepts only a passing control payload can misclassify every honest power miss as infrastructure failure. Do not infer completion from a payload alone: source drift, resource caps, missing output, signals and an unclassified exit still invalidate completion.

Test both completed outcomes through the real supervisor and auditor before a one-shot panel. A failed gate keeps the target locked and the consumed attempt closed; it is not permission for a favorable retry. Expected cap-refusal probes inside a completed KAT remain distinct from an unexpected cap that prevents the experiment from finishing.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The control phase exercises the same code path, budget and ordering that the target phase will use. A control run in lexicographic task order does not validate a live run in hash order. The program had to reclassify such a pass as a wiring test.
- The controls are matched to the selector's real decision, including its gates and nulls, not only to a preliminary statistic (see [Tautological gate rule](/validation/tautological-gate-rule)).
'''

[[blocks]]
kind = "attack"
title = "Why the order matters"
body = '''
Running the target first invites two self-deceptions. The first is post-hoc control design: after seeing a suggestive target score, one builds controls that the score would pass. The second is silent promotion: an unfinished or partly failed run leaves a readable-looking row in a log, and months later the row is cited as an exclusion. The program's negative-results ledger was written to catch exactly that, and it found two earlier jobs that had not excluded what the working memory said they had: one had failed its own controls and one had crashed.

Under the policy the target phase is gated in code. The launchers expose modes `controls`, `smoke` and `live`. The `live` mode re-runs the controls in-process before touching the target, and a control gate failure ends with `TARGET_REFUSED`.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: compiled core and parser, a planted-control suite at the target's
// length and information budget, mode in {controls, smoke, live}. Output:
// CONTROL_GATE PASS or FAIL; target rows only after PASS, else
// TARGET_REFUSED.
function RUN(mode):
    // phase 1: known-answer tests, before any corpus is loaded
    if not SELF_KAT(core) or not SELF_KAT(parser): abort
    // phase 2: planted controls on the same code path, budget and task order
    // that the target phase will use, printed in full
    suite = CONTROL_SUITE()
    // Smoke checks one control and never authorises target access.
    if mode == smoke: suite = suite[0:1]
    gate = PASS
    for control in suite:
        // identical pipeline
        result = SOLVE(control.ciphertext)
        print control.planted, result.recovered
        if not RECOVERED(result, control): gate = FAIL
    print "CONTROL_GATE:", gate
    if gate == FAIL:
        record a decoder-power result, not evidence about the target family
        // no target run until the family changes
        print "TARGET_REFUSED"
        return
    if mode in {controls, smoke}: return
    // phase 3: target rows, printed only under CONTROL_GATE: PASS
    for row in TARGET_ROWS():
        print SOLVE(row)
```
'''

[[blocks]]
kind = "complexity"
body = '''
The cost is the control phase itself, typically one to twenty extra solves plus their nulls. For a search whose control cannot reach its planted truth within the declared budget, the policy converts a would-be negative into a throughput statement at the price of the whole budget (see [Throughput fail](/validation/throughput-fail)).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Fluent output from a control-gated decoder.** A seven-alphabet beam decoder produces fluent English on any input. Because its matched 63-letter controls failed, the program locked its target mode so that no such string could be promoted.
- **Controls passing on a broken selector.** An exact solver's control returned an unknown status (neither proved nor refuted) and the run was still catalogued. The ledger later ruled that no target verdict from that run is admissible.
- **A gate that never runs.** Early smoke variants of a mixture statistic failed several controls while the statistic was being developed. Only the final variant with an all-controls-pass contract may be cited.
'''

[[blocks]]
kind = "controls"
body = '''
The policy's own control is the ledger audit: every log is classified as complete, failed, interrupted or intentionally partial, and a frozen no-repeat checklist names the runs after which no target may be executed until the family changes.
'''

[[blocks]]
kind = "example"
title = "Launcher skeleton"
body = '''
```bash
#!/usr/bin/env bash
set -euo pipefail
core=$(mktemp -d)/core
clang++ -std=c++17 -O3 -pthread solver_core.cpp -o "$core"
"$core" --self-kat                       # phase 1: abort on failure
case "${1:-live}" in
  controls) python3 driver.py --core "$core" --controls-only ;;
  smoke)    python3 driver.py --core "$core" --controls 1 ;;
  live)     python3 driver.py --core "$core" --target 2>&1 | tee "logs/NNN_name_$(date -u +%Y%m%dT%H%M%SZ).log" ;;
esac
```

Inside `driver.py` the `--target` branch begins with the control suite and raises `TARGET_REFUSED` on a gate failure.
'''

