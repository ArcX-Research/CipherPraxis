id = "correction-and-retraction"
section = "validation"
title = "Correction and retraction"
subtitle = "Correct a wrong claim in a dated entry that explains the error and what it affects"
status = "VERIFIED"
status_note = "The ledger records full retractions, changed classifications, voided number collisions, and corrections carried into receipts. Examples include a novelty claim disproved by checking sources and a supposed power pass reduced to a wiring check. Each correction names the earlier entry, the defect, and what still stands."
family = "Audit and release governance"
tags = ["retraction", "correction", "ledger", "integrity"]
related = ["ledger-reservations", "seal-and-audit-protocol", "reproducibility-receipts", "gauge-defect-invalidation", "selection-overfit-check", "power-measurement"]
summary = "A large research project will make some wrong claims. A dated correction should quote the error, give the evidence against it, state which conclusions fall and which remain, and leave the original record unchanged. Corrections here came from source checks, independent audits, and arithmetic. They found a supposedly untested family that had been covered by a broader search, a power test that checked only wiring, and a gate count of 17 that was really 16."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A **correction** entry has five parts:

1. the earlier entry it corrects, by log number and quoted claim;
2. the defect, stated so that it can be checked (file and line, transcript hash, recount);
3. the refuting evidence, with its receipt;
4. the consequences: which results are withdrawn, which are reclassified, which stand unchanged;
5. a rule, when the defect is a method error, that prevents the repetition.

A **retraction** is a correction whose consequence is "the claim is false and withdrawn". A **reclassification** keeps the transcript but changes its evidentiary status (for example from `POWER_PASS` to `PIPELINE_CORRECTNESS_PASS`). A **void** is a correction of the ledger's own bookkeeping (a collided number) under which no artefact existed.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The corrected entry stays as written. Sealed bytes and their hashes remain valid. The correction is carried forward in later receipts.
- Corrections are dated and attributed to a role, and where a different agent found the defect the entry says so.
'''

[[blocks]]
kind = "attack"
title = "Cases"
body = '''
- **False novelty.** A lane claimed that square routes on a 144-letter text were "genuinely untested". A source audit found that an existing route generator built spirals, boustrophedon and diagonal orders for *every* width from 2 to 24, so width 12 had been covered. The ledger had never named it because the code was generic. Retracted, with the rule that a keyword search over prose is not a source audit. Two genuinely new sub-families (composed write/read routes, triangular lattices) were identified in the same entry and kept open pending durable source and nulls.
- **Power that was wiring.** Two blind controls recovered their truths at pairs 150 and 17 of 1.6 million because the fixture had been chosen with its truth at the front of the task order; reclassified to a wiring test, and the unreached random fixture remained the power measurement.
- **Selection mistaken for signal.** A cross-text coincidence maximum looked like $+5.7\sigma$ against a per-trial null and was $+0.8\sigma$ against the family-wise null over 1,296 trials. The ledger records the per-trial figure as the error.
- **Working memory versus logs.** Two earlier jobs were believed to have excluded a shared-square family. The audit found one had failed its own controls and the other had crashed, and the family was reopened.
- **Arithmetic.** An audit terminal said "17/17 gates". The receipt recounted 16 gate records and recorded the miscount without editing the sealed note.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: the earlier ledger entry (log number and quoted claim), the defect,
// the refuting evidence with its receipt, and the role that found the defect.
// Output: a dated correction appended to the ledger; the earlier entry is
// never edited.
function CORRECT(ledger, log_number, quoted_claim, defect, evidence, finder):
    // names a different agent when there was one
    entry = NEW_DATED_ENTRY(attributed_to = finder)
    entry.corrects = (log_number, quoted_claim)                // part 1
    // part 2: file and line, transcript hash, recount
    entry.defect   = defect
    entry.evidence = (evidence, RECEIPT(evidence))             // part 3
    // part 4: consequences, no more and no less than the defect warrants
    for result in RESULTS_RESTING_ON(log_number):
        // retraction
        if defect makes result false:        entry.withdrawn.add(result)
        // transcript kept, status changed
        else if defect changes its status:   entry.reclassified.add(result)
        else:                                entry.unchanged.add(result)
    // part 5
    if defect is a method error:
        entry.rule = RULE_PREVENTING_REPETITION(defect)
    // sealed bytes and their hashes stay valid
    APPEND(ledger, entry)
    // later receipts must carry it forward
    return entry

function VOID(ledger, collided_number):
    // a correction of the ledger's own bookkeeping: no artefact ever existed
    // under the number
    APPEND(ledger, VOID_ENTRY(collided_number))
    return FRESH_NUMBER(ledger)
```
'''

[[blocks]]
kind = "complexity"
body = '''
Cheap to write, expensive to omit: an unretracted "closed" family is never revisited. The program's negative-results audit exists largely to find such omissions, and it classified every log in the directory before the next attack was designed.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Silent edits.** Rewriting the earlier entry destroys the record of what was believed when later decisions were made. The ledger forbids it.
- **Over-retraction.** A correction that withdraws more than the defect warrants is also an error. The route retraction explicitly kept the lane's own sweep result (control power 1.000 per boundary, live feasibility 0 of 10,944) because the defect did not touch it.
- **Corrections that do not propagate.** A receipt that restates an audit must carry the audit's corrections forward, or a reader of the receipt alone inherits the mistake.
'''

[[blocks]]
kind = "controls"
body = '''
Independent auditors disclose their own errors in the same form: one recorded that its first replica of a runner normalisation blanked one line instead of three, disagreed with the pin, and was wrong, "rather than quietly fixing it".
'''

[[blocks]]
kind = "example"
title = "Correction entry"
body = '''
```
## 2026-09-04 CORRECTION TO LOG NNN (creator; defect found by the auditor) — THE "FAMILY X UNTESTED" CLAIM IS FALSE; RETRACTED
Retraction. LOG NNN claimed … That is false and is withdrawn. Verified in the sources, not the ledger:
  * generator.py:88 builds … for ANY width w; sweep.py:37 iterates w in 2..24.
What is actually new: (i) …; (ii) …  (kept OPEN pending durable source and nulls)
Unaffected: the LOG NNN sweep result (control power 1.000 per t, live 0/10,944) stands as recorded.
Rule: novelty claims must inspect the implementations, not the narrative.
```
'''

