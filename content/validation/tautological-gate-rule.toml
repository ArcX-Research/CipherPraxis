id = "tautological-gate-rule"
section = "validation"
title = "Tautological gate rule"
subtitle = "Show that a check rejects bad cases before treating a pass as evidence"
status = "VERIFIED"
status_note = "Gate designs include a valid-model negative that must fail and a random-input power row. Audits used this rule to block a test whose null could never fail. The ledger also warns that any fitted reversible key will always complete a round trip."
family = "Power and calibration"
tags = ["gates", "roundtrip", "nulls", "self-deception"]
related = ["valid-model-nulls", "planted-controls", "power-measurement", "selection-overfit-check", "kat-harness", "shuffled-null-z-score", "english-gate-calibration"]
summary = "A check that every candidate passes tells us nothing. Before citing a gate, show both sides: valid input passes, and input that should fail does fail at a measured rate. A common empty check is forward round-trip. If a key was fitted by reversing the ciphertext, it will re-encrypt that fitted plaintext by construction. False keys pass too, so the round trip alone does not prove correctness."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A **gate** is a predicate $G(x)$ applied to a candidate solution $x$ (a recovered key, plaintext or construction). $G$ is **tautological** on a family $\mathcal{F}$ when $\Pr[G(x)] = 1$ for every $x \in \mathcal{F}$, including wrong ones. The rule: a gate may be cited as evidence only after a transcript shows

1. **necessity**: $G$ passes on planted truths (else it is broken), and
2. **power**: $G$ fails on a stated fraction of inputs that are not solutions, drawn from the relevant alternative (random letters, a valid-model negative, a wrong placement).

The rule extends to nulls: a null distribution that the observed statistic cannot fall inside is not a null.
'''

[[blocks]]
kind = "equations"
title = "Roundtrip is not a test of a fitted key"
body = '''
If a decryption map $D_k$ is invertible and $k$ was obtained by fitting $D_k(c) = p$ for some $p$, then $E_k(p) = E_k(D_k(c)) = c$ identically. The forward check therefore has

$$\Pr[\text{roundtrip passes} \mid k \text{ fitted from } c] = 1$$

for every $k$ in the family, and the program records `forward_consistency` as a field that is logged but *excluded from evidence, tautological by construction*. A roundtrip becomes informative only when the construction is re-encrypted with parameters that were **not** all fitted from the same ciphertext (a key word from a dictionary, a boundary chosen independently), or when two independently implemented forwards are compared.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The failing inputs must be plausible alternatives. A gate that rejects white noise but accepts every fluent overfit has power only against white noise.
- Necessity and power are measured on the *full decision*, including selection over cells and the language threshold, not on a preliminary statistic.
'''

[[blocks]]
kind = "attack"
body = '''
Three tautologies recur in cryptanalytic pipelines and each appears in the program's ledger:

- **Fitted roundtrip.** Fluent-looking overfits with exact two-layer roundtrips were produced by several lanes; the ledger rule "English-looking and exact roundtrip are separate checks; a freely fitted invertible key always roundtrips" was written after three such logs.
- **A null the decision cannot lose to.** An audit of a two-stage selector found that its null replayed only a preliminary monogram statistic, never the finishing stage that declared a positive, so "every null comparison can fail and the immutable PASS can still be emitted". The lane was blocked.
- **A structural check that cannot fire.** A within-coset alignment null was found to be mathematically invariant under the shuffles that generated it; an exact-solver certificate was noted to be unable to fail for any candidate that reached it.

The cure in each case was the same: add an input class on which the check must fail, run it, and print the failure fraction.
'''

[[blocks]]
kind = "complexity"
body = '''
Negligible in compute (a few hundred random or valid-model inputs) and large in leverage: a single power row converts a decorative check into a measurement.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- A parity-style block test was presented with its necessity row (400 conforming plants, 0 violations) **and** its power row (random-letter zones violate with fraction 0.81 and 0.98; known prose windows 1 to 6 violations), so its exact refutation of two forms could be cited.
- A language gate whose threshold was placed by a prose-tail order statistic rejected genuine held-out English windows; the tautology in reverse (a necessity failure) was caught by running known-real text through it, and the gate was re-anchored to an independent-letter ceiling.
'''

[[blocks]]
kind = "controls"
body = '''
Every gate in this atlas carries a two-row certificate: `necessity: conforming plants pass a/a` and `power: alternative inputs fail b/c`. Where a check is retained for diagnostics only, it is labelled as such and excluded from the evidence fields.
'''

[[blocks]]
kind = "example"
title = "Gate certificate"
body = '''
```
GATE within-block all-different (42 pairs)
  necessity : 200 conforming plants x 2 forms -> violations 0/400
  power     : 200 random-letter zones -> P(>=1 violation) = 0.81 / 0.98
              (analytic: 1-(25/26)^42 = 0.81; 1-(12/13)^42 = 0.966)
  reference : known prose windows -> 1..6 violations
VERDICT gate is informative; a single violation refutes the form
```
'''

