id = "tautological-gate-rule"
section = "validation"
title = "Tautological gate rule"
subtitle = "Show that a check rejects bad cases before treating a pass as evidence"
status = "VERIFIED"
status_note = "Gate designs include a valid-model negative that must fail and a random-input power row. Audits used this rule to block a test whose null could never fail. The ledger also warns that any fitted reversible key will always complete a round trip."
family = "Power and calibration"
tags = ["gates", "roundtrip", "nulls", "self-deception"]
related = ["valid-model-nulls", "planted-controls", "power-measurement", "selection-overfit-check", "kat-harness", "shuffled-null-z-score", "english-gate-calibration"]
summary = "A check that every candidate passes tells us nothing. Before citing a gate, show both sides: valid input passes, and input that should fail does fail at a measured rate. A common empty check is forward round-trip. If a key was fitted by reversing the ciphertext, it will re-encrypt that fitted plaintext by construction. False keys pass too, so the round trip alone does not prove correctness."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
A **gate** is a predicate $G(x)$ applied to a candidate solution $x$ (a recovered key, plaintext or construction). $G$ is **tautological** on a family $\mathcal F$ when $G(x)$ is true for every $x\in\mathcal F$, including wrong ones. Before citing a nontrivial gate, a transcript should measure both:

1. **empirical sensitivity**: $G$ passes on conforming planted truths from the declared fixture distribution, and
2. **empirical rejection**: $G$ fails on a stated fraction of relevant non-solutions, such as random letters, valid-model negatives, or wrong placements.

The rule extends to nulls: a null distribution that the observed statistic cannot fall inside is not a null.
'''

[[blocks]]
kind = "equations"
title = "Roundtrip is not a test of a fitted key"
body = '''
If a decryption map $D_k$ is invertible and $k$ was obtained by fitting $D_k(c) = p$ for some $p$, then $E_k(p) = E_k(D_k(c)) = c$ identically. The forward check therefore has

$$\Pr[\text{roundtrip passes} \mid k \text{ fitted from } c] = 1$$

for every $k$ in the family, and the program records `forward_consistency` as a field that is logged but *excluded from candidate evidence, tautological by construction*. A roundtrip can test a constraint supplied independently of the fit, such as a predeclared dictionary key or boundary. Agreement between two independent implementations is evidence of software consistency, not evidence that a fitted plaintext is true.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The failing inputs must be plausible alternatives. A gate that rejects white noise but accepts every fluent overfit has power only against white noise.
- Both empirical rates are measured on the *full decision*, including selection over cells and the language threshold, not on a preliminary statistic.
'''

[[blocks]]
kind = "attack"
body = '''
Three tautologies recur in cryptanalytic pipelines and each appears in the program's ledger:

- **Fitted roundtrip.** Fluent-looking overfits with exact two-layer roundtrips were produced by several lanes. The ledger rule "English-looking and exact roundtrip are separate checks. A freely fitted invertible key always roundtrips" was written after three such logs.
- **A null the decision cannot lose to.** An audit of a two-stage selector found that its null replayed only a preliminary monogram statistic, never the finishing stage that declared a positive, so "every null comparison can fail and the immutable PASS can still be emitted". The lane was blocked.
- **A structural check that cannot fire.** A within-coset alignment null was found to be mathematically invariant under the shuffles that generated it. An exact-solver certificate was noted to be unable to fail for any candidate that reached it.
- **Feasibility after forward construction.** If a candidate plaintext is made by choosing hidden parameters and applying the model's own forward equation, the model-feasibility test must accept it. The check remains valuable as an independent implementation replay, but it cannot prune that proposal space. To gain search power, enforce a constraint not already guaranteed by the parameterization or test independently supplied endpoints.

The cure in each case was the same: add an input class on which the check must fail, run it, and print the failure fraction.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: a gate predicate G on candidate solutions, planted truths
// (conforming plants), and alternative input classes that are not solutions
// (random letters, a valid-model negative, a wrong placement). Output: a
// two-row certificate, or the gate is excluded from the evidence fields.
function CERTIFY_GATE(G, plants, alternatives):
    // Empirical sensitivity on the declared planted panel.
    a = COUNT(x in plants where G(x))
    if a < |plants|: return BROKEN
    // Empirical rejection on each declared class of non-solutions, measured
    // on the full decision with selection and the language threshold included.
    rows = []
    for class in alternatives:
        b = COUNT(x in class where not G(x))
        rows.append("power: " + class.name + " fail " + b + "/" + |class|)
    // tautological: a check that cannot fail is not evidence
    if every b == 0: return DIAGNOSTIC_ONLY
    return CERTIFICATE("necessity: " + a + "/" + |plants|, rows)

// A fitted roundtrip is the standard tautology: logged, never cited.
function FORWARD_CONSISTENCY(c, k_fitted):
    p = DECRYPT(c, k_fitted)
    // true for every invertible key fitted from c
    return ENCRYPT(p, k_fitted) == c

// The rule extends to nulls: a null the decision cannot lose to is not a
// null.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Negligible in compute (a few hundred random or valid-model inputs) and large in leverage: a single power row converts a decorative check into a measurement.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- A parity-style block test was presented with its necessity row (400 conforming plants, 0 violations) **and** its power row (random-letter zones violate with fraction 0.81 and 0.98; known prose windows 1 to 6 violations), so its exact refutation of two forms could be cited.
- A language gate whose threshold was placed by a prose-tail order statistic rejected genuine held-out English windows. The sensitivity failure was caught by running held-out real text through it, and the gate was re-anchored to a finite independent-letter reference maximum.
'''

[[blocks]]
kind = "controls"
body = '''
Every gate in this atlas carries two empirical rows. Existing receipts label them `necessity: conforming plants pass a/a` and `power: alternative inputs fail b/c`; scientifically, they estimate sensitivity and rejection only for the stated fixture distributions. Where a check is retained for diagnostics only, it is labelled as such and excluded from the evidence fields.
'''

[[blocks]]
kind = "example"
title = "Gate certificate"
body = '''
```
GATE within-block all-different (42 pairs)
  necessity : 200 conforming plants x 2 forms -> violations 0/400
  power     : 200 random-letter zones -> P(>=1 violation) = 0.81 / 0.98
              (analytic: 1-(25/26)^42 = 0.81; 1-(12/13)^42 = 0.966)
  reference : known prose windows -> 1..6 violations
VERDICT gate is informative; a single violation refutes the form
```
'''

