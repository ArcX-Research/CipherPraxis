title = "Planted controls"
subtitle = "Run known synthetic cases through the same pipeline before the target"
status = "VERIFIED"
status_note = "Every analysis tool includes a planted-control generator. Recorded pass rates range from 100% for three exact periodic controls to 0% for blind unknown-alphabet annealing. Each rate links to a log."
family = "Control design"
tags = ["controls", "synthetic truth", "power", "calibration"]
