id = "variant-beaufort"
section = "ciphers"
title = "Variant Beaufort"
subtitle = "Ciphertext = plaintext minus key; Vigenère run backwards"
status = "VERIFIED"
status_note = "The variant relation is carried as a third sign choice by the program's interrupted-key, Slidefair and ciphertext-autokey lanes; the interrupted-key and Slidefair variant controls at 504 letters passed exactly."
family = "Polyalphabetic substitution"
tags = ["periodic", "additive", "polyalphabetic"]
related = ["vigenere", "beaufort", "porta", "autokey", "digraphic-slide", "coset-shift-recovery", "g-tabula-recta"]
summary = "Variant Beaufort subtracts the key from the plaintext, which is the same as decrypting with a Vigenère table. Its cosets are Caesar shifts by the negated key, so it is cryptanalytically identical to Vigenère; it matters only when a solver must decide which of three sign conventions a setter used, and the program's audits treat it as a separately selected relation."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
$$c_i \equiv p_i - k_{i \bmod m} \pmod{26}, \qquad p_i \equiv c_i + k_{i \bmod m} \pmod{26}.$$

Encryption with key $k$ is Vigenère encryption with key $-k$, so every statement about Vigenère cosets holds with $k_b$ replaced by $26 - k_b$.
'''

[[blocks]]
kind = "equations"
title = "The three sign conventions"
body = '''
For key element $k$ and plaintext $p$:

$$\text{Vigenère: } c = p + k, \qquad \text{Variant: } c = p - k, \qquad \text{Beaufort: } c = k - p.$$

Vigenère and Variant are the same family with negated keys; Beaufort is the reflected family. A solver that searches all 26 values of $k_b$ per coset therefore covers Vigenère and Variant in one pass and needs a second pass only for Beaufort. The interrupted-key audit observed exactly this: its Vigenère and Variant searches returned the same target plaintext under complementary keys.
'''

[[blocks]]
kind = "variants"
body = '''
- **Interrupted key**: a periodic key whose index resets when a chosen interruptor letter appears in the plaintext or ciphertext; the program selected the reset strategy, the interruptor and the period blind.
- **Slidefair (Variant)**: the digraphic slide with the Variant bottom-row rule $\operatorname{bottom}_k(j) = j - k$; see [Digraphic slide](/ciphers/digraphic-slide).
- **Ciphertext autokey (Variant)**: $a(P_i) = x_i + x_{i-m}$ where $x$ is the ciphertext in an unknown order; see [Autokey](/ciphers/autokey).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Same as Vigenère: periodic key, one alphabet order, language-like plaintext.
- Invariant: a Variant key is not distinguishable from a Vigenère key unless the key is required to spell a word; only word-key hypotheses separate the two.
'''

[[blocks]]
kind = "attack"
title = "Attack strategy"
body = '''
Run the Vigenère attack. If the recovered shifts must be read as a key word, also read the complementary word $26 - k_b$; one of the two is the setter's key. For the interrupted-key form, enumerate periods 4 to 8, both reset strategies and all interruptor letters, and require the control to recover the hidden period, interruptor and keyword before any live text is scored.
'''

[[blocks]]
kind = "complexity"
body = '''
No extra cost over Vigenère. Interrupted key: periods 4 to 8, two reset strategies, 26 interruptors, then an annealed keyword search with 8 restarts of 20,000 steps in the program's declared budget; each 504-letter control gate completed in about three seconds.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Key-word ambiguity**: a dictionary key search that assumes Vigenère misses a Variant setter, and vice versa.
- **Interruptor over-fitting**: with the interruptor and reset strategy free, a short text admits many resets; the audit gates on exact control recovery for that reason.
- Everything that defeats Vigenère (flat inner text, short cosets) defeats the variant identically.
'''

[[blocks]]
kind = "controls"
body = '''
Interrupted-key Variant: the 504-letter held-out control recovered 100% plaintext, the hidden period 6, the ciphertext-interruptor strategy and letter, and the six-letter keyword, passing in 3.11 seconds; the live text scored $-7.467$ (not English), the same value as under the Vigenère relation with the complementary key (COLOSSUS_DYNAMIC_AUDIT.md). Slidefair-Variant: the 504-letter control with a seven-letter key recovered exactly at rate $-4.05$ (DIGRAPHIC_SLIDES_AUDIT.md).
'''

[[blocks]]
kind = "example"
title = "Reproducible example"
body = '''
Plaintext `ATTACK`, key `CIPHER`:

```
plain    A  T  T  A  C  K
key      C  I  P  H  E  R
p - k   -2 11  4 -7 -2 -7
mod 26  24 11  4 19 24 19
cipher   Y  L  E  T  Y  T
```

Check position 3: $A - H = 0 - 7 = -7 \equiv 19 = T$. Vigenère encryption of `YLETYT` with key `CIPHER` returns `ATTACK`.
'''

[[blocks]]
kind = "notes"
body = '''
Because the variant is a sign convention rather than a new mechanism, the program never gave it a lane of its own; it appears wherever a family's setter conventions are enumerated (interrupted key, Slidefair, ciphertext autokey), and its controls are those lanes' controls.
'''

