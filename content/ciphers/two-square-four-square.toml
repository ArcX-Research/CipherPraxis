id = "two-square-four-square"
section = "ciphers"
title = "Two-square and four-square"
subtitle = "Encrypt letter pairs across two or four Polybius squares"
status = "INCONCLUSIVE"
status_note = "Arbitrary two-square recovered a 504-letter control at 100% with 1,000,000 iterations x 8 restarts, then was ruled out on the 504-letter target at that budget. Four-square reached 503/504 and 97.8% on its controls, while seriated forms reached 8.1%. Those tests remain blocked by controls. At 144–153 letters, annealing cannot identify any of these square families."
family = "Polygraphic substitution"
tags = ["polygraphic", "digraphic", "polybius square", "two squares", "four squares"]
related = ["playfair", "bifid", "polybius-square", "simulated-annealing", "selection-overfit-diagnostic", "known-answer-tests", "g-polygraphic"]
summary = "Two-square and four-square extend Playfair by finding the two letters of a pair in different squares and exchanging their coordinates. Four-square uses two plain plaintext squares and two keyed ciphertext squares. Two-square uses two keyed squares placed side by side or one above the other. Annealing can recover an arbitrary two-square at 504 letters, but not four-square or any of these forms near 150 letters."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
**Two-square (horizontal).** With $a \in S_1[r_1, c_1]$ and $b \in S_2[r_2, c_2]$,

$$(a, b) \mapsto \big(S_2[r_1, c_2],\ S_1[r_2, c_1]\big);$$

the vertical variant returns $\big(S_1[r_1, c_2],\ S_2[r_2, c_1]\big)$. A same-row digraph is left unchanged in the horizontal form (a known transparency). **Four-square.** With plaintext squares in the straight order at upper-left and lower-right, and keyed squares $U$ (upper-right) and $L$ (lower-left), $a = (r_1, c_1)$ in the upper-left square and $b = (r_2, c_2)$ in the lower-right,

$$(a, b) \mapsto \big(U[r_1, c_2],\ L[r_2, c_1]\big).$$
'''

[[blocks]]
kind = "equations"
title = "Configurations and gauges"
body = '''
Beyond the squares, a setter chooses horizontal or vertical layout, which square receives the first letter, a digraph offset (0 or 1) and possibly a reversed reading; the program's full selector enumerated 16 such configurations for two-square. Row and column rotations that preserve every rule are gauges of each square. Four-square with straight plaintext squares has only two unknown squares, but the coordinate exchange couples them tightly enough that a single wrong cell produced a fluent one-letter error on a control.
'''

[[blocks]]
kind = "variants"
body = '''
- **Two-square horizontal / vertical**, with offsets and swaps.
- **Four-square** with straight or keyed plaintext squares.
- **Conjugated-matrix Bifid**: coordinates read from one square and letters written from another (see [Bifid](/ciphers/bifid)).
- **Under a periodic layer**: seven free shifts on top of the digraphic layer, which lets all 26 letters occur.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- 25-symbol alphabets; a ciphertext with all 26 letters cannot be a direct member of the family.
- Digraph alignment with the text start (or a declared offset).
- Invariant: a fitted pair of squares round-trips; readability plus round-trip is not evidence at any length tested.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Enumerate the configuration (layout, offset, swap, reversal).
2. Anneal both squares jointly under a quadgram objective; at 504 letters the program's engine used $1{,}000{,}000$ iterations with 8 restarts per configuration.
3. Verify with an independent transform (the program built a full transform matrix and checked it at 144 and 153 letters across every configuration) and require exact hidden-plaintext recovery and configuration recovery on the control.
4. Run the complete selection on within-coset shuffled nulls; a target is a candidate only if it reads as English and beats the null maxima.
'''

[[blocks]]
kind = "complexity"
body = '''
Two arbitrary squares: about $(25!)^2$ raw keys. Two-square at 504 letters: 16 configurations times 8 restarts of $10^6$ iterations; the earlier lane's 30,000 iterations times 3 restarts per configuration was insufficient at 144-153 letters and is recorded as a power failure.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Length.** At 144-153 letters the matched controls gave 9.2% and 5.6% (two-square), 8.5% and 6.9% (four-square) with round-trips that mostly passed and configurations that mostly failed; the observed selection beat null maxima on only 4/6 controls.
- **Four-square near-misses.** 503/504 with a fluent wrong letter in one engine; 97.8% with a failed forward in another. Neither is an almost-solve that can relax the exact gate.
- **Selection.** With 16 configurations and restarts, the best live two-square output at 504 letters scored about $-6.62$ with an exact false-state round-trip; it failed the English gate and the null tail was correctly not spent.
'''

[[blocks]]
kind = "controls"
body = '''
External engine (log 184): two-square horizontal and vertical 504-letter controls 504/504 with correct variant selection; four-square 503/504 (position 264 decrypted with one wrong letter), gate FAIL. Program's own annealer at 504 letters (log 181): arbitrary two-square control 100% plaintext, configuration PASS, forward PASS at rate $-4.10$; four-square 97.8% with forward FAIL; seriated Playfair 8.1%. Complete two-square selection on the 504-letter text (log 181b): best about $-6.62$, not English, no candidate. Under a period-7 layer at 144-153 letters (log 165): all six matched controls failed; no live text entered the search.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Two-square, horizontal, $S_1$ keyed by `EXAMPLE` and $S_2$ by `KEYWORD` (J merged into I):

```
S1: EXAMP / LBCDF / GHIKN / OQRST / UVWYZ
S2: KEYWO / RDABC / FGHIL / MNPQS / TUVXZ
```

Plaintext `HELPME`: `HE` has H at (2,1) in $S_1$ and E at (0,1) in $S_2$, giving $(S_2[2,1], S_1[0,1]) = (G, X)$; `LP` gives $(S_2[1,2], S_1[3,0]) = (A, O)$; `ME` has both letters in row 0, so it is transparent: `EM`. Ciphertext `GXAOEM`.
'''

[[blocks]]
kind = "notes"
body = '''
The mixed status is deliberate: the two-square annealer is verified and its 504-letter negative is scoped; four-square and seriated forms never passed a control; and the whole family is unidentifiable at 150 letters by generic annealing, so a short-text negative would mean nothing.
'''

