id = "one-time-pad"
section = "ciphers"
title = "One-time pad"
subtitle = "Add a truly random key that is as long as the message and never reused"
status = "UNTESTED"
status_note = "The project includes an encryption tool for a 153-letter pad from fixed key text, with plain or keyed tables and a decryption check. It has no attack for a truly random, single-use key because none is possible. This entry explains the model and why it marks the secure limit of running-key ciphers."
family = "Stream and machine ciphers"
tags = ["additive", "random key", "perfect secrecy", "information theory"]
related = ["vigenere", "running-key", "book-cipher", "autokey", "index-of-coincidence", "g-tabula-recta"]
summary = "A one-time pad adds one key letter to each plaintext letter. The key must be truly random, as long as the message, and never reused. Then every plaintext of that length fits the ciphertext equally well, so no statistic can choose the real one. Running-key and book ciphers look similar but use structured key text. That structure is what makes them attackable."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
With a key $k_0 \dots k_{n-1}$ drawn uniformly and independently from $\mathbb{Z}_{26}$,

$$c_i \equiv p_i + k_i \pmod{26}, \qquad p_i \equiv c_i - k_i \pmod{26}.$$

For any fixed plaintext the ciphertext is uniform over $\mathbb{Z}_{26}^n$, and for any ciphertext every plaintext has exactly one key that produces it.
'''

[[blocks]]
kind = "equations"
title = "Perfect secrecy and its failure modes"
body = '''
$\Pr[c \mid p] = 26^{-n}$ for every $p$, so $\Pr[p \mid c] = \Pr[p]$: the ciphertext carries no information. The guarantee depends on all three conditions. A reused pad leaks $c^{(1)} - c^{(2)} = p^{(1)} - p^{(2)}$, the same relation the program's cross-text tests look for between two ciphertexts. A key drawn from language is a [running key](/ciphers/running-key). A key shorter than the message is a Vigenère. In a keyed tableau the same arithmetic runs on $\operatorname{pos}_A$.
'''

[[blocks]]
kind = "variants"
body = '''
- **Plain tableau** (straight alphabet) or **keyed tableau** (the key text and message indexed in a mixed order).
- **Word-initial pads**: the corpus utility derives its 153-letter key from the initial letters of the words of a fixed text; such a key is not uniformly random and is only as secret as the text.
- **Reused pad**: two messages under one key, which reduces to a two-plaintext running-key problem.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Uniform, independent key letters; single use; key length at least the message length.
- Under the ideal model, ciphertext letters are independent and uniform. Thus the expected IC is $1/26$, and no lag has an elevated expected coincidence rate. A finite sample can deviate or show a chance peak; rejection requires a predeclared statistic and calibrated null, not equality to the expectation.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
There is no ciphertext-only attack on a correctly used pad. Flat histograms and an unremarkable lag profile are compatible with the model but also with many other ciphers. A statistically significant departure under a specified null is evidence against that ideal iid-uniform model, not proof of a particular alternative; ordinary finite-sample variation must be included. Between two ciphertexts, a difference test can reveal structure from key reuse when the two plaintexts provide enough signal.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Letters are indices 0..25. The key has n letters drawn uniformly and
// independently from 0..25, is used once, and is never shorter than the
// message.
function KEYGEN(n):
    for i in 0..n-1:
        // a true random source, not a text or a word
        k[i] = UNIFORM_RANDOM(0..25)
    return k

function ENCRYPT(p[0..n-1], k[0..n-1]):
    for i in 0..n-1:
        c[i] = (p[i] + k[i]) mod 26
    return c

function DECRYPT(c[0..n-1], k[0..n-1]):
    for i in 0..n-1:
        p[i] = (c[i] - k[i]) mod 26
    return p

// In a keyed tableau the same arithmetic runs on pos_A. There is no attack on
// a correctly used pad: every plaintext of length n has exactly one key.
// Reusing k on two messages leaks c1[i] - c2[i] = p1[i] - p2[i], a
// two-plaintext running-key problem.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Encryption and decryption are $O(n)$. The key space is finite, with $26^n$ members, but exhaustive enumeration does not identify the intended plaintext: every length-$n$ candidate has exactly one compatible key, and the ciphertext leaves their prior odds unchanged.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Key reuse** turns two pads into one running-key problem with two language streams.
- **Structured key** (text initials, a book passage) makes the pad a book cipher. The key is recoverable once the source is guessed.
- **Key transmission**: the pad must reach the recipient, which in practice means the key must be stored or hidden somewhere.
'''

[[blocks]]
kind = "controls"
body = '''
No planted-control receipt establishes random-key generation for this entry. The utility verifies only a known-key round trip, which checks implementation mechanics but not independence, uniformity, single use, or perfect secrecy. The theorem above supplies the exact result under its assumptions; empirical ciphertext statistics cannot certify that those assumptions held.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Plaintext `HELLO`, key `XMCKL` (used once):

```trace
plain   H  E  L  L  O
key     X  M  C  K  L
sum     30 16 13 21 25
cipher  E  Q  N  V  Z
```

Check: $H+X=7+23=30\equiv4=E$. With key `TQURI` instead, `EQNVZ` would decrypt to `LATER`. Uniform pads assign the two compatible keys equal probability; the ciphertext itself leaves whatever prior odds were assigned to `HELLO` and `LATER` unchanged.
'''

[[blocks]]
kind = "notes"
body = '''
The entry exists so that the running-key and book-cipher pages have their theoretical limit stated: an attack on those ciphers is exactly an attack on the structure of their keys.
'''

