id = "gronsfeld"
section = "ciphers"
title = "Gronsfeld cipher"
subtitle = "Use a repeating decimal key as a restricted Vigenere key"
status = "UNTESTED"
status_note = "The construction is documented by the American Cryptogram Association and appears in the project's bounded sequence probes. No dedicated blind-control panel has yet qualified a Gronsfeld solver in this repository."
family = "Polyalphabetic ciphers"
tags = ["numeric key", "periodic key", "restricted shifts", "vigenere"]
related = ["vigenere", "gromark", "exact-period-alignment", "coset-shift-recovery", "exhaustive-enumeration"]
summary = "Gronsfeld is Vigenère with a decimal key. Each repeated key digit shifts one plaintext letter by zero through nine positions. The smaller shift alphabet makes short periods easier to enumerate, but the cipher keeps the same residue-class structure as any periodic additive cipher."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Choose a sequence of decimal digits $d_0,\ldots,d_{m-1}$ and repeat it across the plaintext. With letters numbered from 0 to 25, add the current digit modulo 26. Decryption subtracts it. Unlike ordinary Vigenère, each key position is restricted to the ten shifts 0 through 9.
'''

[[blocks]]
kind = "equations"
title = "Restricted periodic addition"
body = '''
For key period $m$,

$$c_i\equiv p_i+d_{i\bmod m}\pmod{26},\qquad d_j\in\{0,\ldots,9\},$$

and

$$p_i\equiv c_i-d_{i\bmod m}\pmod{26}.$$

Every residue class $i\bmod m$ is therefore a Caesar cipher chosen from ten allowed shifts.
'''

[[blocks]]
kind = "variants"
body = '''
- Read digits from a fixed number, date, or written numeric key.
- Derive a digit ordering from a keyword under a stated ranking rule.
- Use subtractive or Beaufort-style arithmetic while keeping the decimal restriction.
- Extend the primer into a running digit stream, producing a related cipher such as Gromark.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Key digits repeat from a known or searched origin.
- Only letters advance the key unless another rule is stated.
- The allowed digit set is exactly the one declared by the variant.
- Alphabet coordinates use one fixed convention.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
Estimate the period with repeated fragments, coincidence statistics, or exact coset alignment. For each candidate period, score all ten shifts independently in every residue class using letter frequencies, then combine the best choices and rescore the whole plaintext with n-grams. Short keys can be enumerated completely. Always compare the selected period and key against controls that search the same range.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function ENCRYPT(plain, digits):
    require every element of digits is between 0 and 9
    out = empty
    for i, letter in enumerate(plain):
        p = alphabet_index(letter)
        c = (p + digits[i mod length(digits)]) mod 26
        append alphabet_letter(c) to out
    return out

function DECRYPT(cipher, digits):
    for i, letter in enumerate(cipher):
        c = alphabet_index(letter)
        p = (c - digits[i mod length(digits)]) mod 26
        append alphabet_letter(p) to out
    return out
```
'''

[[blocks]]
kind = "complexity"
body = '''
A known-key transform is linear in the message length. Exhaustive search for a period-$m$ numeric key costs $10^m$, compared with $26^m$ for unrestricted Vigenère shifts. Directly scoring all ten shifts over all coset letters costs $O(10n)$; with precomputed 26-bin histograms it costs $O(n+10\cdot26\,m)$ before whole-text reranking.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Treating digits as letters.** A numeric digit is a shift value, not the alphabet position of its written name.
- **Unsearched origin.** Starting the same digits at another phase changes every residue class.
- **False period multiple.** A multiple of the real period can fit better simply because it has more parameters.
- **Restricted-family overclaim.** Rejecting shifts 0 through 9 says nothing about an unrestricted 26-shift periodic key.
'''

[[blocks]]
kind = "controls"
body = '''
A dedicated solver control should hide the period, phase, and all digits, then require exact plaintext, exact key up to period aliases, and exact forward reconstruction. Include zero and nine so an implementation that silently assumes digits 1 through 8 cannot pass. The current project evidence contains only bounded digit-sequence probes, so this solver gate remains open.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Encrypt `ATTACKATDAWN` with numeric key `314`:

```trace
plain   A  T  T  A  C  K  A  T  D  A  W  N
key     3  1  4  3  1  4  3  1  4  3  1  4
cipher  D  U  X  D  D  O  D  U  H  D  X  R
```

The ciphertext is `DUXDDODUHDXR`. Subtracting the same repeated digits returns the plaintext.
'''

[[blocks]]
kind = "notes"
body = '''
The small key alphabet is useful structure, not proof of security. A solver should exploit it explicitly instead of fitting unrestricted shifts and checking afterward whether they happen to be decimal digits.
'''

