id = "bifid"
section = "ciphers"
title = "Bifid cipher"
subtitle = "Split letters into Polybius coordinates, rearrange them in blocks, and pair them again"
status = "VERIFIED"
status_note = "A direct 504-letter control recovered all 504 letters, an arbitrary square, and the hidden period. For two shorter texts sharing a Bifid square under a period-7 outer key, the outer key was checked completely and fixed-key square recovery scored 100/100. An earlier joint annealing search failed 0/4 controls."
family = "Fractionation"
tags = ["fractionation", "polybius square", "period", "5x5"]
related = ["trifid", "playfair", "two-square-four-square", "polybius-square", "sandwich-construction", "family-identification", "simulated-annealing", "exhaustive-enumeration", "bifid-lab", "g-fractionation", "g-period"]
summary = "Bifid looks up each letter's row and column in a 5 x 5 square. Within each block, it writes all row numbers, then all column numbers, and pairs the digits into new letters. One ciphertext letter can mix parts of two plaintext letters. This flattens letter frequencies and hides letter-pair patterns, though block edges remain. Tests covered Bifid alone and beneath a periodic key shared by two texts."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Let $S$ be a $5 \times 5$ square (25 letters) and let $(r(x), c(x))$ be the coordinates of $x$. For a block $x_0 \dots x_{m-1}$ of period $m$ form the sequence

$$\gamma = \big(r(x_0), \dots, r(x_{m-1}),\ c(x_0), \dots, c(x_{m-1})\big)$$

and output $y_j = S[\gamma_{2j}, \gamma_{2j+1}]$ for $j = 0 \dots m-1$. Decryption expands each ciphertext letter to two coordinates, refills $\gamma$, and reads $x_j = S[\gamma_j, \gamma_{m+j}]$. A short final block uses its true length.
'''

[[blocks]]
kind = "equations"
title = "Coordinate roles and the omission constraint"
body = '''
Within a full block of period 7 the two coordinates of $y_j$ come from fixed plaintext positions: the roles by output position are $(RR, RR, RR, RC, CC, CC, CC)$, i.e. the first three ciphertext letters are made of rows only, the middle one of the last row and first column, the last three of columns only. Under an outer period-7 additive layer in a 26-letter order $B$, the one letter absent from the square can never be emitted by the inner cipher, so each outer shift $k_b$ must keep the omitted symbol out of coset $b$ of the ciphertext; for the two corpus texts this reduces the $26^7$ outer keys to exactly $5 \times 5 \times 4 \times 5 \times 5 \times 7 \times 6 = 105{,}000$ admissible vectors per convention, which can be enumerated completely.
'''

[[blocks]]
kind = "equations"
title = "The square has a 120-way gauge"
body = '''
The coordinate digits have arbitrary names. For any permutation $\pi \in S_5$, define a new square by

$$S^\pi[\pi(r),\pi(c)] = S[r,c].$$

Every row and column digit in the fractionated stream changes by the same $\pi$, and the final square lookup changes it back. Thus $E_{S^\pi}(P)=E_S(P)$ for every plaintext. A recovered square must be compared across all 120 simultaneous digit relabellings, not by raw grid equality. Permuting row labels and column labels independently is not a gauge, because a row digit can later be used as an output column and vice versa.
'''

[[blocks]]
kind = "variants"
body = '''
- **Direct Bifid** with an arbitrary or keyword square and period 2 to 40.
- **Conjugated-matrix Bifid**: coordinates read from one square, letters written from another.
- **Bifid under a periodic key**, one square shared by two texts, each with its own or a rotated outer key.
- **Trifid**: the three-dimensional analogue on a 27-cell cube; see [Trifid](/ciphers/trifid).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- 25-symbol alphabet. A direct Bifid ciphertext cannot contain all 26 letters, so an outer layer is required for the corpus texts.
- Ciphertext letters inside a block depend only on that block. Candidate boundaries occur at multiples of the period, but recovering them from ciphertext is a statistical model-selection problem, not an invariant guarantee.
- Invariant: coordinate roles fix which plaintext positions feed each output, so histograms of decoded symbols inside the three row-only and three column-only residues align when the outer key is right.
- The block origin is part of the key description. A substring can be decrypted on its own only when it begins at a declared block boundary; shifting the origin or cutting through a larger block is a different cell.
- Round-trip of a fitted square is tautological.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Estimate the period from the block structure (candidate periods are those at which within-block statistics are distinctive).
2. Anneal the square under a quadgram objective for each candidate period; select the period by score.
3. With an outer layer shared across two texts, enumerate every admissible outer key from the omission constraint, order them by a coordinate-role histogram statistic without truncating, and run the square search for every key (512-state beam, then 64 restarts of 80,000 deep solves).
4. Gate on both texts reading as English with a joint rate above $-5.0$ and two independent literal forwards. A crossing is only a preliminary candidate until a phase-aware selected-family null re-maximises over all arms.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// S is a 5 x 5 square over 25 letters; r(x) and c(x) are the row and column
// of letter x in S. Blocks have period m; a short final block uses its true
// length L.
function ENCRYPT_BLOCK(x[0..L-1], S):
    // 2L coordinates
    gamma = [r(x[0]), ..., r(x[L-1]), c(x[0]), ..., c(x[L-1])]
    for j in 0..L-1:
        y[j] = S[gamma[2j], gamma[2j+1]]
    return y

function DECRYPT_BLOCK(y[0..L-1], S):
    for j in 0..L-1:
        gamma[2j] = r(y[j]); gamma[2j+1] = c(y[j])
    for j in 0..L-1:
        x[j] = S[gamma[j], gamma[L + j]]
    return x

function ENCRYPT(p[0..n-1], S, m):
    for each block x of p of length m (the last block may be shorter):
        append ENCRYPT_BLOCK(x, S) to c
    return c

function DECRYPT(c[0..n-1], S, m):
    for each block y of c of length m (the last block may be shorter):
        append DECRYPT_BLOCK(y, S) to p
    return p
```
'''

[[blocks]]
kind = "complexity"
body = '''
Square space $25!/120 \approx 1.29 \times 10^{23}$ after simultaneous coordinate-label relabelling. Direct 504-letter annealing selects the period among the estimated candidates inside the external engine's standard budget. Shared square under a period-7 key: 105,000 keys per cell times a 512-state beam, then deep solves; 8 cells (two orders, two relations, omitted J or X) were completed for the aligned-key case, and 40,500 and 43,200 keys per cell for the two length-predicted relative phases.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Joint annealing of square and 14 free shifts** at 153 + 144 letters stops at n-gram local optima (rates $-6.49$ to $-6.64$) and recovered none of four planted pairs. The key had to be enumerated, not annealed.
- **Ordering statistic with a heavy tail.** A 300-control audit found the coordinate-role histogram statistic can rank the true key low, so it may order the search but never truncate it.
- **Underpowered square panel.** A 24 x 40,000 fixed-key panel recovered 94/100 and was rejected; 64 x 80,000 gave 100/100.
- **Unmotivated phases.** The relative-phase lane closed only phases 0, 3 and 6; phases 1, 2, 4, 5 are not silently claimed.
- **Raw-square equality.** Two squares related by the same permutation of all five row and column labels are the same Bifid key. Requiring their printed grids to match would reject a correct recovery.
- **Cropped blocks.** Restarting the period at the start of a convenient substring silently changes the cipher unless that position is a true block boundary.
'''

[[blocks]]
kind = "controls"
body = '''
Direct Bifid (log 184): 504-letter control, arbitrary square, hidden period 7 among the estimated periods, 504/504 plaintext and exact forward. Tied-key twin Bifid annealer (log 491): 0/4 controls, family left open. Exhaustive outer key (log 492): the all-key timing control evaluated 112,000/112,000 keys and recovered the shared key and both plaintexts at rank 1; fixed-key square recovery 100/100 across both orders, both relations and both omitted letters. Aligned live run (log 493): all 840,000 outer keys across eight cells, best joint rates $-6.46$ to $-6.59$, all sixteen English verdicts no. Relative phase (logs 494-495): controls 144/144, 56/56 and 2/2 end-to-end; live phases 6 and 3 non-English (best $-6.52$ and $-6.48$).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Square (rows) `BGWKZ / QPNDS / IOAXE / FCLUM / THYVR`, period 5, plaintext `FLEEATONCE`.

Block `FLEEA`: rows $3,3,2,2,2$, columns $0,2,4,4,2$ (0-based). $\gamma = 3\,3\,2\,2\,2\,0\,2\,4\,4\,2$, read in pairs: $(3,3) = U$, $(2,2) = A$, $(2,0) = I$, $(2,4) = E$, $(4,2) = Y$.
Block `TONCE`: rows $4,2,1,3,2$, columns $0,1,2,1,4$; pairs $(4,2) = Y$, $(1,3) = D$, $(2,0) = I$, $(1,2) = N$, $(1,4) = S$.

Ciphertext `UAIEYYDINS`. The [Bifid lab](/labs/bifid-lab) shows the coordinate roles per block.
'''

[[blocks]]
kind = "notes"
body = '''
Family-identification statistics cannot separate Bifid from a Quagmire with an unstructured alphabet or from seven independent substitutions at 153 letters (self-classification 8-40%), which is why the program's Bifid work relied on structural constraints such as the omitted symbol rather than on distributional fingerprints.
'''

