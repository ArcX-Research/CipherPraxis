title = "Route transposition"
subtitle = "Write a message into a shape by one path and read it by another"
status = "VERIFIED"
status_note = "Two fixed route lists, 78 triangular and 81 square combinations, recovered 4/4 held-out controls at rank 1 beneath a two-key additive layer. The affine position-route test recovered 3/3 controls at 153, 144, and 504 letters. Both stated families were then ruled out for the project texts at the tested depth."
family = "Transposition"
