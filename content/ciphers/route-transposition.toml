summary = "A route transposition writes a message into a grid or other shape along one path, then reads it along another. Paths may follow rows, spirals, diagonals, or alternating directions. The shape and two paths form the key. Because a chosen shape has a limited list of natural paths, the solver can check them all. Tests also covered every affine position route j = ui + d for each valid unit u and offset d."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A route is a permutation $q$ of the positions $0 \dots n-1$ induced by a write path $\pi_w$ and a read path $\pi_r$ over the same set of cells: $q = \pi_r^{-1} \circ \pi_w$ and

$$c_j = p_{q[j]}.$$

The affine position route is the special family $X_i = C_{(u i + d) \bmod n}$ with $\gcd(u, n) = 1$, which is a complete cyclic re-reading of the text by a fixed stride.
'''

[[blocks]]
kind = "equations"
title = "Routes under an additive layer and the cut gauge"
body = '''
With outer order $o$, inner order $a$, a period-7 outer key $u$ indexed by ciphertext position and a period-$k$ inner key $v$ indexed by plaintext position, the shape-route model reads

$$o(C_j) \equiv a(P_{q[j]}) + u_{j \bmod 7} + v_{q[j] \bmod k} \pmod{26}$$

(Vigenère), or with the plaintext term negated (Beaufort). For the affine route with a divisor period $p \mid n$ the absolute cut is not identifiable: rotating the plaintext by $s$, the key phase by $s$ and replacing $d$ by $d + us$ leaves the ciphertext unchanged, so controls compare cyclic plaintext and configuration classes rather than the generator's arbitrary start.
'''

[[blocks]]
kind = "variants"
body = '''
- **Square and rectangular routes**: spirals (four starting corners, two directions), diagonals, boustrophedon, on every width; 15 standard scans of a $12 \times 12$ square give 81 distinct write/read compositions.
- **Triangular lattice routes**: 24 barycentric lexicographic or serpentine scans of a side-17 triangle, 78 distinct compositions.
- **Affine position routes**: every unit stride and offset, with the inner stream then decrypted at every period dividing $n$ up to 42.
- **Block reversal and whole-text reversal**: trivial routes included in the transposition sweeps.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The shape is fixed by the text length (153 is the 17th triangular number; 144 is a square) or by a chosen width.
- Invariant: letter identities and histograms are preserved.
- The vocabulary is finite by construction. An arbitrary keyed path is outside it.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Enumerate every route in the vocabulary and every inner period $k$, both alphabet orders and both relations.
2. Fit the outer and inner keys for each cell. Shape routes use exact maximisation for every residue. The affine family uses a cheap exact cyclic-cut stage for each offset $d$, then applies the validated quadgram periodic finish to the best 96 MAP endpoints.
3. Check every endpoint by an independent scalar decrypt and forward.
4. Compare the live best with nulls that shuffle within the seven outer cosets and repeat the complete selector.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// A shape with n cells. The write path W lists the cells in the order the
// plaintext is written in; the read path R lists them in the order the
// ciphertext is read out. q[j] is the plaintext position found in the j-th
// read cell, so c[j] = p[q[j]].
function ROUTE_PERMUTATION(W[0..n-1], R[0..n-1]):
    for i in 0..n-1: holds[W[i]] = i               // cell W[i] receives p[i]
    for j in 0..n-1: q[j] = holds[R[j]]
    return q

function ENCRYPT(p[0..n-1], W, R):
    q = ROUTE_PERMUTATION(W, R)
    for j in 0..n-1: c[j] = p[q[j]]
    return c

function DECRYPT(c[0..n-1], W, R):
    q = ROUTE_PERMUTATION(W, R)
    for j in 0..n-1: p[q[j]] = c[j]
    return p

// Affine position route: a complete cyclic re-reading by a fixed stride u
// (gcd(u, n) = 1) and offset d.
function AFFINE_ROUTE(C[0..n-1], u, d):
    for i in 0..n-1:
        X[i] = C[(u * i + d) mod n]
    return X

// Attack: enumerate every write/read composition of the finite vocabulary
// (and every unit stride and offset of the affine family), undo it, fit any
// additive layer exactly, score by quadgrams.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Shape routes: 78 or 81 routes times 4 order pairs times 2 relations times $k = 1 \dots 7$, all cells fitted exactly. Affine routes: $\varphi(n)$ units times $n$ offsets times divisor periods; e.g. 504 letters give 144 units and 504 offsets. The route sweep of the earlier lane covered every width 2-24 with all standard paths in both directions.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Selected-family overfit.** The affine-route endpoint on the 144-letter text scored $-4.82$, above the nominal English threshold, yet all three complete-pipeline shuffled maxima ($-4.74$, $-4.90$, $-4.88$) beat it: a high-parameter family manufactures fragmentary English.
- **Finite vocabulary.** A negative closes only the enumerated paths. An unusual path or padding rule is untested.
- **Unidentifiable cut.** Without the gauge argument a control would fail on a correct answer merely because its start differed from the generator's.
'''

[[blocks]]
kind = "controls"
body = '''
Shape routes (log 411): four target-absent held-out controls (triangle with straight/mixed orders and Vigenère at period 3; triangle with Beaufort at period 5; square with Vigenère at period 7; square with Beaufort at period 4) all recovered their exact hidden plaintext at rank 1 with rates $-3.96$ to $-4.18$ and passed the independent forward; live endpoints $-6.35$ and $-6.29$, ranks 4/20 and 7/20 among 19 nulls ($p = 0.20$ and $0.35$), no candidate. Affine routes (log 195): 36 route inversions, three exhaustive cyclic-cut comparisons and three gauge identities passed; hidden controls at 153/period 17, 144/period 16 and 504/period 28 recovered their cyclic plaintext and configuration class exactly; live: $-6.06$ and $-6.44$ fail the language gate, $-4.82$ beaten by all three nulls.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Plaintext `ROUTECIPHERS` written row by row into a $3 \times 4$ grid and read out by a clockwise inward spiral from the top-left corner:

```
R O U T
E C I P
H E R S
```

Read: top row `ROUT`, then down the right column `PS`, then the bottom row leftwards `REH`, then up the left column `E`, then the inner cells `CI`. Ciphertext `ROUTPSREHECI`. Decryption refills the spiral and reads the rows.
'''

[[blocks]]
kind = "notes"
body = '''
The route lanes are examples of "closing a finite vocabulary": the audits state exactly which 78 or 81 compositions were tested and decline to claim anything about arbitrary keyed paths, padding, or an additional layer.
'''

