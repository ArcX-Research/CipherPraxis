id = "sandwich-construction"
section = "ciphers"
title = "Sandwich construction"
subtitle = "Place a transposition between a short repeating substitution and a longer one"
status = "VERIFIED"
status_note = "The mixture and order-free width solvers recovered four planted columnar-layered ciphers from a cold start. Widths were 8, 9, 9, and 12; inner periods were 2 and 3, and the true width ranked first at z +4.3 to +12.8. A width-9 handoff passed 23/24 development controls. Live misses apply to the tested mixture, geometry, alphabet, and handoff assumptions; they do not exclude arbitrary transpositions."
family = "Composite constructions"
tags = ["composite", "layered", "transposition", "mixture", "periodic"]
related = ["vigenere", "columnar-transposition", "coordinate-columnar-fractionation", "compound-periodic-key", "mixture-inference-under-transposition", "order-free-width-statistic", "bayesian-evidence-model-selection", "expectation-maximisation", "within-coset-null", "g-period", "g-transposition-grid"]
summary = "A sandwich has the form c = Q_m(T(Q_k(p))): first a short-period substitution, then a transposition, then a longer-period substitution. The inner layer can weaken language-frequency contrast, the transposition changes its positional pattern, and the outer layer creates periodic mappings in ciphertext order. A transposition preserves the global inner-letter multiset. Recovering a mixture separately in every outer coset additionally requires a declared geometry or mixing model, which the width stage tests."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
With an inner key $v$ of period $k$ in alphabet $A_1$, a transposition $T$ (typically a columnar of width $w$) and an outer key $u$ of period $m$ in alphabet $A_2$,

$$y = A_1\big[\operatorname{pos}_{A_1}(p) + v_{i \bmod k}\big], \qquad z = T(y), \qquad c_j = A_2\big[\operatorname{pos}_{A_2}(z_j) + u_{j \bmod m}\big].$$

The corpus's solved texts stack these layers in other orders too (transposition after two substitutions). The sandwich moves the transposition between them.
'''

[[blocks]]
kind = "equations"
title = "Transposition invariance and the class pattern"
body = '''
Under the outer layer, coset $b$ is a rotation of the multiset of inner letters at the positions that $T$ sends into that output residue. The **global** inner-letter multiset is invariant under every transposition, but the multiset in an individual outer coset is not: an arbitrary $T$ may send unequal numbers of inner phases there. The baseline mixture model assumes that each relevant coset samples phase $j$ with declared weights $w_j$ and that plaintext positions share marginal distribution $E$, giving expected density $f(x)=\sum_jw_jE(x-g_j)$. Equal weights $1/k$ are exact only for a balanced design (and otherwise an approximation). Marginalising the $m$ outer shifts gives evidence for the tested one-, two-, or three-component models and posterior class probabilities. For a standard period-2 inner, plaintext positions alternate classes; a columnar of width $w$ gives constant-class columns when $w$ is even and alternating columns when $w$ is odd. The layout DP tests that specific geometry without first choosing the column order.
'''

[[blocks]]
kind = "variants"
body = '''
- **Single columnar** of width 3-20 with $k = 1 \dots 7$; **double columnar** (two word keys, as in one of the solved texts of the corpus).
- **Mixed alphabets**: inner and outer layers in different orders.
- **Cross-derived sandwich** $T_9(Q_7(T_9(P)))$: two width-9 rectangles around a period-7 layer, solved exactly by phase profiling and a subset DP.
- The tie-free case $T = \text{identity}$ is the [Compound periodic key](/ciphers/compound-periodic-key).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The outer layer is periodic and additive in a known order. The inner layer has a small period.
- Exact invariant: the global inner-letter multiset is independent of $T$. Equal component weights within each outer coset require the stated balance/mixing assumption and are not transposition invariants.
- Centring posterior scores per class is a model normalization that makes the degenerate "everything is class 0" assignment score zero; it does not assert that every finite period-$k$ sample is exactly balanced.
- Wrong models must lose: shuffled ciphertexts through the identical pipeline give the null for every width.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Fit the inner mixture with one, two, or three alphabets, using evidence that averages over the outer shifts. Read the inner spacing $\delta = g_2 - g_1$ from its marginal evidence. It was correct on 7 of 8 planted seeds, and the search keeps the top three $\delta$ values.
2. Compute class posteriors for every letter and the order-free width statistic for every width; run class-EM to re-estimate each outer shift from its coset's class-conditional likelihood (this fixes the one or two cosets the evidence fit gets wrong).
3. Hand widths with $z \ge 3$ to the column solver: residue classes fix part of the order, quadgrams fix the rest, then polish shifts and order alternately.
4. Nulls: pass shuffled ciphertexts through fit, $\delta$ candidates, EM and DP. This calibrates the selected statistic for that shuffle model; a $z$ value is not a theorem about untested transpositions.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inner key v (period k) in alphabet A1, a transposition T (typically a
// columnar of width w), outer key u (period m) in alphabet A2, applied in
// that order.
function ENCRYPT(p[0..n-1], A1, v[0..k-1], T, A2, u[0..m-1]):
    for i in 0..n-1:
        // inner substitution
        y[i] = A1[(pos_A1(p[i]) + v[i mod k]) mod 26]
    z = T(y)                                                  // transposition
    for j in 0..n-1:
        // outer substitution
        c[j] = A2[(pos_A2(z[j]) + u[j mod m]) mod 26]
    return c

function DECRYPT(c[0..n-1], A1, v[0..k-1], T, A2, u[0..m-1]):
    for j in 0..n-1:
        z[j] = A2[(pos_A2(c[j]) - u[j mod m]) mod 26]
    y = T_inverse(z)
    for i in 0..n-1:
        p[i] = A1[(pos_A1(y[i]) - v[i mod k]) mod 26]
    return p

// Width search without the column order: the multiset of inner letters is
// T-invariant.
function WIDTH_SEARCH(c, A2, m):
    fit the inner mixture (one, two or three alphabets), marginalising the m
            outer shifts
    // a period-k inner reads 0101... in plaintext order
    post = class posterior of every ciphertext letter
    for each candidate width w:
        // block pattern over the long and short columns
        z[w] = ORDER_FREE_WIDTH_DP(post, w)
    hand widths with z >= 3 to the column solver
    repeat the pipeline on shuffled c for the null
    return the widths ranked by z
```
'''

[[blocks]]
kind = "complexity"
body = '''
Evidence fits and the width DP are cheap (seconds per width); 60 null pipelines per control took about 20 seconds at 153 letters. The exhaustive column-order stages of the older solver cost $w!$ per width (about two hours for two texts including width 10). The cross-derived exact solver replaces that with 90,720 phase classes plus a subset DP.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Flat inner text.** If the inner layer is not a short-period substitution of language (a fractionation, say) the mixture evidence is silent. A Bifid control printed alongside shows no width, as designed.
- **Double transposition.** A double columnar under the outer layer still shows the two-alphabet evidence (z +5.8 on its control) but no single width, so the width solver cannot finish it.
- **Selection freedom.** Profiling instead of marginalising the outer shifts lets wrong models win on shuffled nulls.
- **Handoff basins.** In the exact width-9 solver one of 24 controls was lost because a single key initialised the inner DP in the wrong basin. The true key supplied post hoc recovered it immediately.
'''

[[blocks]]
kind = "controls"
body = '''
Mixture and width solver (logs/05_mix.log): four planted sandwiches, all solved 100% from cold with the true width on top (width-9 exact grid z +12.8, width-8 ragged z +11.3, width-12 mixed alphabets z +4.3, width-9 with period-3 inner z +5.1). A Bifid-7, a plain period-7 cipher and a double columnar printed alongside show the negative signatures. Older finite-order solver (ck_sandwich_report.txt): three controls (width 8 with period-2 inner, width 12 with period-3 inner, two width-9 word keys with period-2 inner) read ENGLISH at $-4.34$ with 100% match. Cross-derived width-9 solver (log 237): 23/24 development controls. On the two short corpus texts the mixture evidence found no inner spacing and no width in the tested alphabet and columnar-geometry combinations. That is a scoped empirical miss, not exclusion of period-2 or -3 under every possible transposition.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Inner shifts $(3, 10)$ of period 2, columnar of width 4 with key `CADB` (read order 1, 3, 0, 2), outer shifts $(1, 5, 7)$ of period 3, plaintext `SANDWICHLAYER`:

```trace
inner       V K Q N Z S F R O K B O U
grid        VKQN / ZSFR / OKBO / U
columns     0: VZOU  1: KSK  2: QFB  3: NRO
read 1,3,0,2  K S K N R O V Z O U Q F B
outer       L X R O W V W E V V V M C
```

Check the first letter: $S + 3 = V$; after transposition the first output letter is column 1's `K`; $K + 1 = L$. Ciphertext `LXROWVWEVVVMC`.
'''

[[blocks]]
kind = "notes"
body = '''
The mixture stage uses an exact global-multiset invariant, followed by geometry-specific assumptions and a calibrated width selector. Its negative result is therefore limited to the tested columnar layouts, mixture bank, and demonstrated handoff power; arbitrary transpositions remain outside that conclusion.
'''

