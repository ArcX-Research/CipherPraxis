summary = "Vigenère adds a repeating key to the plaintext one letter at a time modulo 26. A key of length m splits the ciphertext into m cosets. Each coset is a Caesar shift of the plaintext letters at those positions. Attacks use this repeated structure to find the period and shifts. Vigenère is also the baseline for keyed-alphabet and layered versions."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Fix the alphabet $\{A,\dots,Z\} \cong \mathbb{Z}_{26}$ and a key $k = (k_0, \dots, k_{m-1}) \in \mathbb{Z}_{26}^m$.
Plaintext $p_0 p_1 \dots$ encrypts position by position:

$$c_i \equiv p_i + k_{i \bmod m} \pmod{26}.$$

Decryption subtracts the same key. Positions with the same residue $i \bmod m$ form a **coset**; inside a coset the cipher is a single Caesar shift, so the coset's letter histogram is a rotation of the plaintext's histogram.
'''

[[blocks]]
kind = "equations"
title = "Coset structure"
body = '''
Write $C_b=\{c_i:i\equiv b\pmod m\}$ for coset $b$. If plaintext positions in every coset share a stationary marginal distribution $E$, the expected histogram of $C_b$ is $E$ rotated by $k_b$:

$$\Pr[c = x \mid i \in C_b] = E(x - k_b).$$

Two consequences drive the attacks:

- **Period signature.** If $t\equiv0\pmod m$, the key cancels and $c_i=c_{i+t}$ exactly when $p_i=p_{i+t}$; the rate is the plaintext lag-$t$ coincidence rate, not a universal constant. If $t\not\equiv0\pmod m$, equality requires a particular plaintext difference set by $k_i-k_{i+t}$. Under an iid marginal $E$ its probability is the corresponding cyclic autocorrelation of $E$, which is not generally $1/26$. The uniform value arises only under an appropriate null or after averaging over independent uniform key differences.
- **Shift recovery.** For a known $E$, a correlation estimate of $k_b$ maximises $\sum_x E(x-k)\hat h_b(x)$ between the rotated reference and observed coset histogram. This is a noisy estimator, not exact recovery. Under an independent multinomial model, the maximum-likelihood estimate instead maximises $\sum_x F_b(x)\log E(x-k)$; correlation and likelihood need not rank shifts identically.
'''

[[blocks]]
kind = "variants"
body = '''
- **Beaufort**: $c_i = k_{i \bmod m} - p_i$; reciprocal (encrypting twice decrypts). See [Beaufort](/ciphers/beaufort).
- **Variant Beaufort**: $c_i = p_i - k_{i \bmod m}$, i.e. Vigenère decryption used as encryption.
- **Keyed alphabets**: replacing the straight alphabet on the plaintext side, ciphertext side, or both gives the Quagmire I–IV family. The coset structure is unchanged, only the reference histogram becomes an unknown permutation of $E$.
- **Autokey and running key**: the key stream is the plaintext itself or a long text, which removes the period.
- **Compound keys**: two periodic keys of lengths $m$ and $q$ compose to one key whose minimal period divides $\operatorname{lcm}(m,q)$. Finite samples may show evidence at one or both component periods.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The key is strictly periodic and the same alphabet is used at every position.
- The plaintext cosets have enough nonuniform marginal contrast at the observed length. Under a uniform source model the expected coset histogram is uniform, but finite cosets fluctuate; random letters and mixing constructions do not make every realised coset exactly uniform.
- Exact invariant: a transposition preserves the **global** multiset of letters. An arbitrary transposition before the periodic layer changes which source letters land in each output coset and therefore can change every per-coset multiset. Per-coset preservation requires a residue-preserving map; common-mixture claims require an explicit balance or random-mixing assumption.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Find the period.** Kasiski repeats, the periodic index of coincidence, or an exact alignment objective over all shift vectors (see [Exact period alignment](/cryptanalysis/exact-period-alignment)).
2. **Recover shifts per coset.** Correlate each coset histogram with the reference distribution. Report likelihood gaps or posterior uncertainty and calibrate at the actual coset sizes; reliability depends on period, language, and the full set of tried models.
3. **Polish.** Score the full decrypt with a language model (quadgram log-likelihood) and adjust individual shifts.

With a crib (known plaintext), a crib letter at position $i$ determines $k_{i \bmod m}$ directly. A contiguous crib of length $\ge m$ determines the whole key.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Alphabet letters are indices 0..25 (A = 0). Key k has length m ≥ 1.
function ENCRYPT(p[0..n-1], k[0..m-1]):
    for i in 0..n-1:
        c[i] = (p[i] + k[i mod m]) mod 26
    return c

function DECRYPT(c[0..n-1], k[0..m-1]):
    for i in 0..n-1:
        p[i] = (c[i] - k[i mod m]) mod 26
    return p

// Ciphertext-only recovery of the key once the period m is known. E =
// reference letter distribution
function RECOVER_KEY(c[0..n-1], m, E):
    for b in 0..m-1:
        coset = [c[i] for i in 0..n-1 if i mod m == b]
        h = HISTOGRAM(coset)                       // 26 counts
        k[b] = argmax over s in 0..25 of CORRELATION(ROTATE(E, s), h)
        // an estimate; likelihood scoring may rank the shifts differently
    return k
```
'''

[[blocks]]
kind = "complexity"
body = '''
A direct lag scan costs $O(n\,t_{\max})$. Building coset histograms costs $O(n)$; testing 26 shifts against 26 bins costs $O(26^2m)$ (fixed-alphabet constants are often suppressed). Exhaustive relative-shift alignment examines $26^{m-1}$ vectors after fixing one gauge shift, with polynomial factors in $m$ depending on the objective implementation. The recorded compiled implementation handles $m=7$; that benchmark is not an asymptotic guarantee.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Flat cosets.** A random, deliberately balanced, or sufficiently mixing inner layer can leave little histogram contrast. A transposition alone does not flatten the global histogram, although it can redistribute letters unevenly among cosets. Period evidence and shift recovery can therefore fail separately.
- **Short cosets.** Small samples can leave several shifts nearly tied. Treat single-coset readings as uncertain estimates and report their matched-control error rather than a universal cutoff.
- **Selection freedom.** In the cited $n=153$ model-comparison setup, profiling the free shifts added about $0.15$ nats per letter relative to the recorded baseline. That is an empirical value for that period, source, score, and selector—not a constant for arbitrary $m$ or $n$. Profiling can favour more flexible models, so compare it with a full-selection null or integrate shifts under a declared prior.
'''

[[blocks]]
kind = "controls"
body = '''
Each recorded solver run places matched controls before target output: plaintext from the declared language source, the same length and period range, hidden random keys, and the same selector. The gate must state its endpoint separately (period, key modulo aliases, and/or exact plaintext). A failed matched control invalidates the corresponding target inference; a passing control demonstrates recovery only for the tested distribution and budget. Language-score thresholds are model-specific and are not fixed mathematical constants.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Plaintext `ATTACKATDAWN`, key `LEMON` ($m = 5$):

```trace
plain   A T T A C K A T D A W N
key     L E M O N L E M O N L E
cipher  L X F O P V E F R N H R
```

Check position 2: $T + M = 19 + 12 = 31 \equiv 5 = F$. The [Vigenère family lab](/labs/vigenere-lab) reproduces this and shows the coset histograms.
'''

