id = "vigenere"
section = "ciphers"
title = "Vigenère cipher"
subtitle = "Add a repeating key to the plaintext modulo 26"
status = "VERIFIED"
status_note = "The cipher, exact period alignment, and planted-control generators are implemented and pass matched checks. With at least about 150 letters of English, the tests routinely recover the period and shifts."
family = "Polyalphabetic substitution"
tags = ["periodic", "additive", "polyalphabetic", "tabula recta"]
related = ["beaufort", "variant-beaufort", "quagmire-iii", "gronsfeld", "permutation-keystream", "index-of-coincidence", "exact-period-alignment", "vigenere-lab"]
summary = "Vigenère adds a repeating key to the plaintext one letter at a time modulo 26. A key of length m splits the ciphertext into m cosets. Each coset is a Caesar shift of the plaintext letters at those positions. Attacks use this repeated structure to find the period and shifts. Vigenère is also the baseline for keyed-alphabet and layered versions."
updated = "2026-09-05"

[[blocks]]
kind = "definition"
body = '''
Fix the alphabet $\{A,\dots,Z\} \cong \mathbb{Z}_{26}$ and a key $k = (k_0, \dots, k_{m-1}) \in \mathbb{Z}_{26}^m$.
Plaintext $p_0 p_1 \dots$ encrypts position by position:

$$c_i \equiv p_i + k_{i \bmod m} \pmod{26}.$$

Decryption subtracts the same key. Positions with the same residue $i \bmod m$ form a **coset**; inside a coset the cipher is a single Caesar shift, so the coset's letter histogram is a rotation of the plaintext's histogram.
'''

[[blocks]]
kind = "equations"
title = "Coset structure"
body = '''
Write $C_b = \{c_i : i \equiv b \pmod m\}$ for coset $b$. If $E$ is the plaintext letter distribution, the expected histogram of $C_b$ is $E$ rotated by $k_b$:

$$\Pr[c = x \mid i \in C_b] = E(x - k_b).$$

Two consequences drive the attacks:

- **Period signature.** Coincidences $c_i = c_{i+t}$ occur at the plaintext rate ($\approx 0.066$ for English) when $t \equiv 0 \pmod m$ and near the uniform rate ($1/26 \approx 0.038$) otherwise.
- **Shift recovery.** For a known $E$, each $k_b$ is read off by maximising the correlation $\sum_x E(x - k)\,\hat{h}_b(x)$ between the rotated reference and the observed coset histogram $\hat h_b$.
'''

[[blocks]]
kind = "variants"
body = '''
- **Beaufort**: $c_i = k_{i \bmod m} - p_i$; reciprocal (encrypting twice decrypts). See [Beaufort](/ciphers/beaufort).
- **Variant Beaufort**: $c_i = p_i - k_{i \bmod m}$, i.e. Vigenère decryption used as encryption.
- **Keyed alphabets**: replacing the straight alphabet on the plaintext side, ciphertext side, or both gives the Quagmire I–IV family. The coset structure is unchanged, only the reference histogram becomes an unknown permutation of $E$.
- **Autokey and running key**: the key stream is the plaintext itself or a long text, which removes the period.
- **Compound keys**: two periodic keys of lengths $m$ and $q$ compose to one key of period $\operatorname{lcm}(m,q)$. A short text may show both periods as separate coincidence peaks.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The key is strictly periodic and the same alphabet is used at every position.
- The plaintext has a non-flat letter distribution (natural language). A flat inner text (random letters or a well-mixed fractionation) makes every coset uniform and the shift unrecoverable.
- Invariant: the **multiset** of letters in each coset does not depend on any transposition applied *before* the periodic layer, only on which positions land in which coset. This is what lets a mixture analysis test "substitution over an unknown transposition" without knowing the transposition.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Find the period.** Kasiski repeats, the periodic index of coincidence, or an exact alignment objective over all shift vectors (see [Exact period alignment](/cryptanalysis/exact-period-alignment)).
2. **Recover shifts per coset.** Correlate each coset histogram with the reference distribution; with $n/m \ge 20$ letters per coset this is reliable for English.
3. **Polish.** Score the full decrypt with a language model (quadgram log-likelihood) and adjust individual shifts.

With a crib (known plaintext), a crib letter at position $i$ determines $k_{i \bmod m}$ directly. A contiguous crib of length $\ge m$ determines the whole key.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Alphabet letters are indices 0..25 (A = 0). Key k has length m ≥ 1.
function ENCRYPT(p[0..n-1], k[0..m-1]):
    for i in 0..n-1:
        c[i] = (p[i] + k[i mod m]) mod 26
    return c

function DECRYPT(c[0..n-1], k[0..m-1]):
    for i in 0..n-1:
        p[i] = (c[i] - k[i mod m]) mod 26
    return p

// Ciphertext-only recovery of the key once the period m is known. E =
// reference letter distribution
function RECOVER_KEY(c[0..n-1], m, E):
    for b in 0..m-1:
        coset = [c[i] for i in 0..n-1 if i mod m == b]
        h = HISTOGRAM(coset)                       // 26 counts
        k[b] = argmax over s in 0..25 of CORRELATION(ROTATE(E, s), h)
    return k
```
'''

[[blocks]]
kind = "complexity"
body = '''
Period test: $O(n \cdot t_{\max})$. Shift recovery: $O(26\, m)$ correlations. Exhaustive shift-vector enumeration for the exact alignment objective is $O(26^{m-1})$ after fixing one shift by gauge; $26^6 \approx 3.1\times10^8$ for $m = 7$ is feasible in a compiled core in seconds.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Flat cosets.** If the material under the periodic layer is not natural language (fractionated, transposed then substituted with a second layer, or random), the histogram correlation has nothing to align. The period may still be visible through coincidence counts while shifts are unrecoverable.
- **Short cosets.** Below roughly 12 letters per coset the argmax shift is often wrong; treat single-coset readings as votes, not facts.
- **Selection freedom.** Freely fitting $m$ shifts on a short text buys about $0.15$ nats per letter of spurious fit. A model comparison that profiles the shifts will prefer wrong models unless the shifts are marginalised or the gain is calibrated on shuffled nulls.
'''

[[blocks]]
kind = "controls"
body = '''
Every solver run prints planted controls first: real English of the same length, random keys of the same period, the same pipeline. A control that does not decrypt to readable English (quadgram rate near $-4.3$ per letter, 100% key match) means the test is broken and the target rows below it carry no information.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Plaintext `ATTACKATDAWN`, key `LEMON` ($m = 5$):

```trace
plain   A T T A C K A T D A W N
key     L E M O N L E M O N L E
cipher  L X F O P V E F R N H R
```

Check position 2: $T + M = 19 + 12 = 31 \equiv 5 = F$. The [Vigenère family lab](/labs/vigenere-lab) reproduces this and shows the coset histograms.
'''

