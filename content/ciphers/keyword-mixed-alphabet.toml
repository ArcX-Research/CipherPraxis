id = "keyword-mixed-alphabet"
section = "ciphers"
title = "Keyword-mixed alphabet"
subtitle = "Build a substitution alphabet from a word or phrase"
status = "VERIFIED"
status_note = "Six keyed-alphabet styles and the phrase-keyed search passed their planted control at 100% across 202,504 alphabets. The general substitution solver also recovered all six hidden 504-letter controls."
family = "Monoalphabetic substitution"
tags = ["monoalphabetic", "keyword", "mixed alphabet", "structured key"]
related = ["caesar-shift", "quagmire-i", "quagmire-iii", "phrase-keyed-alphabet-attack", "dictionary-attack", "simulated-annealing", "frequency-analysis", "g-keyed-alphabet", "g-mixed-alphabet"]
summary = "A keyword-mixed alphabet writes each keyword letter once, then adds the unused letters in a fixed order. Mapping the normal alphabet to this new order gives a simple substitution. The keyword creates a small, structured set of keys. This matters inside Quagmire ciphers: a solver can try every phrase-keyed alphabet, while all 26! arbitrary alphabets are far too many."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Let $w$ be a keyword with repeated letters removed and let $R$ be the remaining letters in a base order. The keyed alphabet is $K = w \,\|\, R$, a permutation of the 26 letters. Simple substitution then maps

$$c_i = K[\operatorname{pos}(p_i)], \qquad p_i = \operatorname{pos}^{-1}\!\big(\operatorname{pos}_K(c_i)\big),$$

where $\operatorname{pos}$ is the index in the straight alphabet and $\operatorname{pos}_K$ the index in $K$.
'''

[[blocks]]
kind = "equations"
title = "Keying styles"
body = '''
The program's generator produces six alphabets from one word: keyword plus the straight remainder; keyword plus a keyword-mixed remainder; keyword plus the reversed remainder; keyword continued from its last letter; and two columnar styles in which the keyword heads a block of the remaining letters that is read off by columns (with straight or mixed remainder). A related "K2M" style, used by Gromark, deduplicates the keyword, fills rows of keyword width and reads the columns in the alphabetical order of the keyword letters.
'''

[[blocks]]
kind = "variants"
body = '''
- **Dictionary keyword**: one word from a word list. A bank of tens of thousands of alphabets.
- **Phrase-keyed**: every 4 to 60-letter substring of a long text, in six styles. The program built 202,504 such alphabets from its own solved texts.
- **Text-keyed**: the first-appearance order of the letters of a ciphertext or plaintext (140 alphabets in one sweep, 87 in another).
- **Two-keyword**: word one followed by a keyed remainder generated from word two (425,000 alphabets).
- **Arbitrary alphabet**: no structure. Only a heuristic substitution solver applies.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The cipher is a bijection, so the ciphertext keeps the plaintext's index of coincidence, repeat pattern and word-length pattern. Only letter identities change.
- Structured alphabets are enumerable. An arbitrary alphabet is not. This is why the status of a Quagmire attack depends on whether its alphabet is keyed.
- The base order for the remainder (straight or keyword-mixed) is itself a modelling choice.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Structured bank.** Generate every alphabet from the bank in every style, decrypt, and rank by quadgram rate. The true alphabet reads as English at once. The wrong ones sit near $-6$ per letter.
2. **Blind substitution.** Frequency initialisation followed by simulated annealing over letter swaps with a quadgram objective and a steepest pair-swap finish. At 504 letters this is reliable. The program's frozen schedule is 3 restarts of 10,000 steps over all cells, then 5 of 30,000 and 11 of 80,000 over the leaders.
3. **Identifiability.** For a standalone substitution, the observable key is the plaintext-to-ciphertext map on letters that occur. Rotating or reflecting the written keyed alphabet generally changes that map and is not a gauge. Additional coordinate gauges apply only inside surrounding ciphers where they are derived explicitly.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// pos(x) is the index of x in the straight alphabet; pos_K(x) its index in
// the keyed alphabet K.
function KEYED_ALPHABET(keyword, base_order):
    w = keyword with repeated letters removed
    // straight or keyword-mixed remainder
    R = the letters of base_order that are not in w, in base order
    // a permutation of the 26 letters
    return w || R

function ENCRYPT(p[0..n-1], K):
    for i in 0..n-1:
        c[i] = K[pos(p[i])]
    return c

function DECRYPT(c[0..n-1], K):
    for i in 0..n-1:
        p[i] = straight_alphabet[pos_K(c[i])]
    return p

// Structured-bank attack: one decrypt and one language score per candidate
// alphabet.
function BANK_ATTACK(c, keywords, styles):
    for each keyword in keywords, each keying style:
        K = KEYED_ALPHABET_IN_STYLE(keyword, style)
        score[K] = QUADGRAM_RATE(DECRYPT(c, K))
    // the true alphabet reads as English at once
    return the best K
```
'''

[[blocks]]
kind = "complexity"
body = '''
Bank search: one decrypt and quadgram score per alphabet, about 200,000 alphabets in ten minutes on twelve cores. Blind annealing: each swap is scored incrementally. The frozen 52-cell schedule ran in 106 seconds for six positives, three negatives and nineteen nulls at 504 letters.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Wrong style.** A keyword alphabet generated in a style outside the bank is missed entirely. The bank is a hypothesis, not a proof.
- **Short texts.** Below about 100 letters the blind annealer's quadgram landscape has spurious optima; readability plus round-trip is not evidence.
- **Partial alphabets.** A plaintext that exposes only $m$ letters leaves $(26-m)!$ completions of the alphabet unresolved. The program reports the observed map and the completion count separately.
'''

[[blocks]]
kind = "controls"
body = '''
Phrase-keyed Quagmire sweep: the planted control, a 31-letter phrase in the keyword-mixed style, was recovered with a 100% match and rate $-4.34$. The two live texts scored $-6.54$ and $-6.35$, which is noise (log 7). General arbitrary-substitution solver: six hidden 504-letter positives recovered exactly, with observed alphabet sizes 20, 22, 24, 25, 26, and 26. Three random-latent negatives scored $-15.06$ to $-15.01$, and 19 shuffled-prose nulls scored $-13.96$ to $-13.50$ against a frozen gate of $-10.0$ (log 327). The slope-0 cell in that lane is a plain substitution.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Keyword `ZEBRAS`, straight remainder:

```trace
plain  ABCDEFGHIJKLMNOPQRSTUVWXYZ
keyed  ZEBRASCDFGHIJKLMNOPQTUVWXY
```

Plaintext `CIPHER`: C is position 2 of the straight alphabet, so it becomes the third keyed letter `B`; I (8) becomes `F`; P (15) becomes `M`; H (7) becomes `D`; E (4) becomes `A`; R (17) becomes `O`. Ciphertext `BFMDAO`.
'''

[[blocks]]
kind = "notes"
body = '''
In the recorded applications the keyed alphabet usually sits inside a period-7 Quagmire. Finite bank searches produced no candidate for the enumerated vocabulary and styles on the two short ciphertexts. That does not imply that the alphabet is unstructured: unlisted construction rules and arbitrary alphabets remain outside the bank, and the latter are precisely where the tested Quagmire solvers have low power (see [Quagmire III](/ciphers/quagmire-iii)).
'''

