id = "rail-fence"
section = "ciphers"
title = "Rail-fence transposition"
subtitle = "Write in a zigzag across r rows, then read one row at a time"
status = "VERIFIED"
status_note = "Among 192,853 permutations, the transposition search recovered its planted five-rail control with offset 2 at 100% and a -4.17 rate. The control sat under a period-7 keyed layer with a key change. The live 144-letter text was negative for every rail count from 2 to 40 and every offset."
family = "Transposition"
tags = ["transposition", "zigzag", "rails", "offset"]
related = ["route-transposition", "columnar-transposition", "myszkowski", "transposition-width-recovery", "exhaustive-enumeration", "g-transposition-grid"]
summary = "A rail fence writes a message in a zigzag across r rows, then reads those rows in order. Its only key values are the row count and starting offset. Once those are chosen, the letter positions are fixed, so a solver can check every case. The transposition search covered every row count from 2 to 40 and every offset beneath a repeating layer."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
For $r$ rails the zigzag has period $2(r - 1)$. Position $i$ (after an offset $o$) lies on rail

$$\rho(i) = (r-1) - \big|\,\big((i+o) \bmod 2(r-1)\big) - (r-1)\,\big|,$$

counted from the top rail. For $r = 3$ the rails of positions $0, 1, 2, 3, 4, \dots$ are $0, 1, 2, 1, 0, \dots$

The ciphertext lists all positions on rail 0 in order, then rail 1, and so on. The permutation $q$ with $c_j = p_{q[j]}$ depends only on $(n, r, o)$.
'''

[[blocks]]
kind = "equations"
title = "Key space and structure"
body = '''
For a text of $n$ letters there are at most $\sum_{r=2}^{r_{\max}} 2(r-1)$ distinct $(r, o)$ pairs, 1,560 for $r \le 40$. Each is a fixed permutation that can be precomputed. Under a period-$m$ additive layer applied after the fence, the coset residue of ciphertext position $j$ is $j \bmod m$, while the plaintext neighbour structure is recovered by undoing $q$. The sweep therefore decrypts the periodic layer first for each candidate $q$ and scores the un-fenced text.
'''

[[blocks]]
kind = "variants"
body = '''
- **Offset rail fence**: the zigzag starts partway through its period.
- **Redefence**: rails read in a keyed order rather than top to bottom (a columnar-like key on the rails).
- Combined with block reversal, whole-text reversal, routes and Myszkowski read-outs in the same sweep.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Histogram and index of coincidence are preserved. Only positions move.
- Invariant: rail lengths are fixed by $(n, r, o)$, so a candidate $(r, o)$ is either exactly right or wrong; there is no partial credit.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Precompute the permutation for every $(r, o)$.
2. For each, undo the fence (and, in the layered model, fit the periodic key on the un-fenced text in both alphabet orders and relations), score by quadgrams, and polish the best few.
3. Compare the best rate against the sweep's own distribution. A real solution reads as English at once.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// r rails and offset o; the zigzag has period 2(r - 1). RAIL(i) is the rail
// of plaintext position i.
function RAIL(i, r, o):
    return (r - 1) - abs(((i + o) mod (2 * (r - 1))) - (r - 1))

// q[j] = plaintext position of ciphertext letter j
function PERMUTATION(n, r, o):
    q = empty
    for rail in 0..r-1:
        for i in 0..n-1:
            if RAIL(i, r, o) == rail: append i to q
    return q

function ENCRYPT(p[0..n-1], r, o):
    q = PERMUTATION(n, r, o)
    for j in 0..n-1:
        c[j] = p[q[j]]
    return c

function DECRYPT(c[0..n-1], r, o):
    q = PERMUTATION(n, r, o)
    for j in 0..n-1:
        p[q[j]] = c[j]
    return p

// Attack: precompute q for every (r, o), undo the fence (and fit any periodic
// layer on the un-fenced text), score by quadgrams; a candidate (r, o) is
// either exactly right or wrong.
```
'''

[[blocks]]
kind = "complexity"
body = '''
1,560 permutations for rails 2-40, each requiring one decrypt and score (or a small periodic fit). The whole family costs seconds and was run alongside 192,853 permutations of other types in about ten minutes.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Wrong offset.** A neighbouring offset yields a nearly right but unreadable text (the control's second-best entries at offsets 3 and 7 matched only 4-6%). The exact $(r, o)$ must be in the enumeration.
- **Layered keys.** With a key change inside the periodic layer, the fit of the layer dominates the cost and its own polish is required.
'''

[[blocks]]
kind = "controls"
body = '''
Transposition sweep control (logs/29_pk9x.log): a planted five-rail fence with offset 2 under a period-7 keyed layer with a prefix key change was recovered at polished rate $-4.169$ with 100% match at both tested drift values, while the closest wrong offsets reached 4-6% match; CONTROL PASSED. The live 144-letter text and its 96-letter suffix were negative over rails 2-40 and every offset (whole $-6.00$, suffix $-5.71$).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Three rails, no offset, plaintext `WEAREDISCOVEREDFLEEATONCE`:

```
rail 0: W . . . E . . . C . . . R . . . L . . . T . . . E
rail 1: . E . R . D . S . O . E . E . F . E . A . O . C .
rail 2: . . A . . . I . . . V . . . D . . . E . . . N . .
```

Rails read in order: `WECRLTE`, `ERDSOEEFEAOC`, `AIVDEN`. Ciphertext `WECRLTEERDSOEEFEAOCAIVDEN`.
'''

[[blocks]]
kind = "notes"
body = '''
The rail fence is the simplest member of the enumerable-transposition vocabulary; its control served to validate the whole sweep pipeline (permutation library, layered decrypt, quadgram polish) rather than to test a serious hypothesis about the corpus texts.
'''

