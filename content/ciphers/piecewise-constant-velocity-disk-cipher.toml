id = "piecewise-constant-velocity-disk-cipher"
section = "ciphers"
title = "Piecewise-constant-velocity disk cipher"
subtitle = "Change the disk speed at fixed boundaries while carrying its phase forward"
status = "POWER-LIMITED"
status_note = "The algebra, exact schedule step, equality-class scan, and forward transform pass recorded controls. The tested end-to-end solver retained every planted structural class but missed two exact output labelings, so recovery remains power-limited at the substitution stage."
family = "Stream and machine ciphers"
tags = ["cipher disk", "piecewise velocity", "continuous phase", "arbitrary substitution", "change points"]
related = ["alberti-progressive", "alternating-velocity-disk-cipher", "piecewise-running-shift-dp", "arbitrary-substitution-equality-classes", "latent-label-identifiability", "stationary-alternating-optimization", "strict-best-improvement-swap-ascent", "lexical-band-contextual-reranking", "reverse-alphabet-affine-alias", "word-prefix-csp", "conjugacy-and-gauge"]
summary = "This cipher turns one alphabet disk at a constant speed inside each segment. At a boundary, the speed may change, but the disk does not jump back to its starting position. Removing the carried disk phase leaves one latent symbol stream under a single substitution alphabet."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
Work modulo an alphabet size $m$. Fix boundaries

$$0=b_0<b_1<\cdots<b_s=n,$$

and let segment $q$ have length $L_q=b_{q+1}-b_q$ and velocity $d_q\in\mathbb{Z}_m$. The phase is continuous:

$$\phi_0=0,\qquad \phi_{q+1}=\phi_q+L_qd_q\pmod m.$$

Let $B$ be the outer alphabet order and let $M$ be one stationary permutation from latent coordinates to plaintext letters. At position $i=b_q+j$,

$$C_i=B\!\left(M^{-1}(P_i)+\phi_q+jd_q\pmod m\right),$$

and decryption subtracts the same carried phase before applying $M$. Setting $\phi_0=0$ fixes a coordinate gauge when an arbitrary $M$ can absorb a global rotation.
'''

[[blocks]]
kind = "equations"
title = "The boundary does not reset"
body = '''
Within segment $q$, the phase at local offset $j$ is

$$a_{b_q+j}=\phi_q+jd_q\pmod m.$$

The next segment starts at

$$a_{b_{q+1}}=\phi_q+L_qd_q=\phi_{q+1}\pmod m.$$

Replacing this value with zero, or fitting it independently, defines a reset model. It is not an equivalent way to optimise the continuous model. For equal segment lengths $L$,

$$a_{Lq+j}=L\sum_{r<q}d_r+jd_q\pmod m.$$

That closed form makes the carried history explicit: every earlier velocity affects every later segment's starting phase.
'''

[[blocks]]
kind = "equations"
title = "Constrain a proposed word path without guessing the alphabet"
body = '''
For a fixed outer order, put $x_i=B^{-1}(C_i)$ and $z=M^{-1}$. Write the carried phase as $f_i\cdot d$, where $f_i$ contains each earlier segment's length, the current local position, and zeros for later segments. Then

$$z(P_i)=x_i-f_i\cdot d\pmod m.$$

Store the first occurrence a of each proposed plaintext letter. Every repeat at i adds

$$(f_i-f_a)\cdot d=x_i-x_a\pmod m.$$

Different letters must have different resulting coordinates. Thus a path through candidate words can constrain only the s velocity variables plus observed-letter anchors, rather than branching on every unused alphabet entry. Once a complete path is consistent, u observed letters leave exactly $(m-u)!$ bijective map completions. Preserve these completions, physical schedules and distinct segmentation paths when the application needs them.

This remains exact over composite m; never divide by a nonunit. For example, $2d=2\pmod4$ has both solutions1 and3. A work cap is an incomplete search, not evidence that a path is impossible.
'''

[[blocks]]
kind = "equations"
title = "An equivalent curvature test keeps the bridge windows"
body = '''
Assume every segment has at least two positions. For a complete proposed text and a bijection z, the continuous model is equivalent to the initial gauge $z(P_0)=x_0$ and

$$z(P_i)-2z(P_{i+1})+z(P_{i+2})=x_i-2x_{i+1}+x_{i+2}$$

at all valid triple starts except $i=b_q-1$ for internal boundaries. There are $n-s-1$ such equations. The omitted window contains the change from the old velocity to the new one. Keep $i=b_q-2$: it makes the step into the next segment use the previous velocity and therefore enforces continuous phase.

To see sufficiency, subtract z(P) from x. The retained equations make consecutive first differences equal everywhere except the declared velocity changes. The zero initial residual fixes the phase gauge. Read each segment's velocity from its first residual edge and independently replay the whole cipher. Using only triples wholly inside segments loses the bridge constraints and admits independent phase jumps.
'''

[[blocks]]
kind = "variants"
body = '''
- **Constant velocity:** all $d_q$ are equal, giving ordinary progressive disk motion.
- **Periodic velocity:** a short list of velocities repeats position by position rather than changing only at segment boundaries.
- **Reset at boundaries:** every segment chooses a fresh phase; this is a larger and different family.
- **Independent segment maps:** each segment has its own substitution $M_q$; this removes the shared-label constraint.
- **Unknown boundaries:** the change points become part of the key and require a wider search or a change-point model.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Boundaries, the outer alphabet bank, and the direction of motion are declared before scoring.
- One substitution map $M$ applies to the full text.
- The phase update uses the complete length of the previous segment.
- A fixed-map schedule optimiser may be exact even when the joint search over schedules and substitutions is heuristic.
- Parameter rows with the same latent equality pattern are observational aliases until output labels are fixed.
'''

[[blocks]]
kind = "assumptions"
title = "Delayed velocity introduction — scope"
body = '''
Delayed velocity introduction is justified by the local transition equations. The cited delayed-state proposal is a design, so the earlier word-path controls do not establish its enumeration completeness, memory use or recovery power. Compare complete witness sets against a direct small-instance enumerator before using it to exclude a model.
'''

[[blocks]]
kind = "attack"
title = "Peel motion before fitting labels"
body = '''
Enumerate or optimise the admitted velocity schedules. For each schedule, carry the phase across every boundary and subtract it from the ciphertext coordinates. Group the resulting latent streams by their complete equality pattern before fitting the arbitrary substitution. For a fixed substitution, use [Piecewise running-shift dynamic programming](/exact/piecewise-running-shift-dp) so internal and boundary-crossing language terms are counted exactly. Preserve all schedule aliases and independently encrypt every reported plaintext.

An exact alternative interleaves word paths with the anchor constraints above. The first segment, plus the next segment's first symbol when there is one, depends only on the first velocity: at most m distinct prefix equality patterns need be tested, with all physical velocity aliases retained. Introduce later velocities only when they affect an observed position. Do not match segments independently; literal-letter anchors and correlated velocity constraints must carry across boundaries. This is an algebraic search interface, not a proved language-recovery guarantee.

Each new velocity first affects local position1, where its coefficient is1. For a proposed letter with known coordinate y, it is forced by $d_q=x_i-\phi_q-y\pmod m$. For a new letter, branch over unused coordinates y and use the same equation. Keep the correlated earlier velocities and any unfinished word arc; this delay removes redundant future-slope enumeration without dividing by a nonunit.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function ENCRYPT(plain, boundaries, velocities, outer, map):
    require one velocity for each segment
    phase = 0
    for segment q in order:
        length = boundaries[q + 1] - boundaries[q]
        for local j in 0..length-1:
            i = boundaries[q] + j
            latent = INVERSE_MAP(map, plain[i])
            coordinate = (latent + phase + j * velocities[q]) mod ALPHABET_SIZE
            cipher[i] = outer[coordinate]
        phase = (phase + length * velocities[q]) mod ALPHABET_SIZE
    return cipher

function PEEL(cipher, boundaries, velocities, outer):
    phase = 0
    for segment q in order:
        for each local position j in segment q:
            latent[i] = (POSITION(outer, cipher[i]) - phase
                         - j * velocities[q]) mod ALPHABET_SIZE
        phase = (phase + SEGMENT_LENGTH(q) * velocities[q]) mod ALPHABET_SIZE
    return latent
```
'''

[[blocks]]
kind = "pseudocode"
title = "Delayed velocity introduction"
body = '''
```text
function EXTEND_WORD_PATH(state, arc):
    for symbol at physical position i within arc:
        q, j = SEGMENT_AND_OFFSET(i)
        phase = segment_length * SUM(state.previous_velocities) mod modulus
        if j == 1:
            choices = EXISTING_COORDINATE_OR_EVERY_UNUSED_COORDINATE(symbol, state)
            for y in choices:
                d = ciphertext_coordinate[i] - phase - y mod modulus
                EXTEND_CORRELATED_STATE_WITH_NEW_VELOCITY(state, d, y)
        else:
            y = ciphertext_coordinate[i] - phase - j * ACTIVE_VELOCITY_OR_ZERO(state)
            KEEP_ONLY_CONSISTENT_INJECTIVE_ANCHOR(state, symbol, y mod modulus)
        if any declared work or memory cap reached: return INCOMPLETE
    CHARGE_ARC_SCORE_ONCE_AT_ITS_END(state, arc)
    KEEP_ALL_REQUIRED_PATH_AND_KEY_ORIGINS(state)
    if complete text:
        for full_map in ALL_UNUSED_COORDINATE_COMPLETIONS(state):
            require LITERAL_FORWARD_REPLAY(full_map, state.velocities) == cipher
            EMIT_COMPLETE_WITNESS(state, full_map)
    else: continue through each legal outgoing word arc
```
'''

[[blocks]]
kind = "complexity"
body = '''
For $s$ segments and $m$ allowed velocities per segment, direct schedule enumeration has $m^s$ cells and costs $O(nm^s)$ just to peel them. Equality-pattern grouping can reduce repeated substitution work. With a fixed substitution, the continuity constraint supports an exact dynamic program whose cost is polynomial in $s$ and $m$ rather than exponential in $s$.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Hidden reset:** local segment code starts every phase at zero and tests the wrong family.
- **Boundary score loss:** language n-grams that cross a change point are omitted.
- **Raw-cell ranking:** equivalent schedules occupy several ranking slots and appear to be independent support.
- **Substitution bottleneck:** the correct latent class is retained, but a rare output symbol receives the wrong label.
- **Boundary tuning:** several segmentations are tried on the evaluation text without correcting the selection freedom.
- **Shared transform bug:** encryption and decryption reuse the same faulty phase helper and agree for the wrong reason.
'''

[[blocks]]
kind = "controls"
body = '''
Use planted texts with different velocity patterns, alphabet directions, and symbol coverage. Include nearby-family sentinels for boundary reset, shifted boundaries, periodic velocity, and independent segment maps. Require an exact equality-class scan over every declared schedule, a complete alias census, whole-text score agreement, and a separately written forward recurrence. Report structural-class recovery apart from literal plaintext recovery so a label-scoring failure does not become a false rejection of the motion model.

A finite word-path implementation was separately checked on eight public symbolic cases over alphabets of size3 and4. Across384 segmentation paths and256 case-texts, all108 accepted full map/schedule/path records matched both exhaustive map-times-schedule enumeration and the curvature/gauge formulation. Unused-map completions, nonunit roots, physical outer aliases and a non-self-inverse outer direction test survived. All four intentional caps remained incomplete; a reset contrast rejected the intended continuous witnesses. This establishes tiny exact inference and software composition, not full-alphabet word-search complexity or language power.
'''

[[blocks]]
kind = "example"
title = "A carried phase over two segments"
body = '''
Use alphabet `ABCDE`, the identity map, two segments of length three, and velocities one then two. For plaintext `ABCADE`, the phase is $(0,1,2)$ in the first segment. The second segment starts at three, not zero, and its phases are $(3,0,2)$:

```trace
plain   A B C | A D E
phase   0 1 2 | 3 0 2
cipher  A C E | D D B
```

The boundary phase is $3\cdot1\equiv3\pmod5$. Encrypting the second segment from phase zero would produce a different ciphertext and would test the reset variant.
'''

[[blocks]]
kind = "notes"
body = '''
Variable disk motion is classical. The important modelling distinction here is simple: velocity is piecewise constant, while phase is one continuous state. The exact schedule optimiser and the arbitrary-substitution labeler are separate recovery stages and should receive separate power verdicts.
'''

