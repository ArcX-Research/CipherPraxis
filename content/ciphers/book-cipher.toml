id = "book-cipher"
section = "ciphers"
title = "Book cipher"
subtitle = "Use a passage from an agreed book as a long key"
status = "INCONCLUSIVE"
status_note = "The bank search checked four public novels, related public texts, and every recovered project text at every offset, under three relations and two alphabet orders. It used a shuffled-ciphertext null but no planted positive control. A related exact known-text test has both checks, so this negative is useful but not fully qualified as a book-cipher result."
family = "Stream and machine ciphers"
tags = ["running key", "book", "known text", "bank"]
related = ["running-key", "one-time-pad", "vigenere", "dictionary-attack", "corpus-bank-screen", "running-key-relation-test", "frequency-analysis"]
summary = "A book cipher uses a passage from an agreed text as a running key. The sender shares a page or line location instead of the full key. If the book is unknown, the problem is as hard as any running-key cipher. If likely books are available, try every matching window as the key. The correct passage should produce readable plaintext. The bank search performs these comparisons in batches."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
With a source text $t$ and a start offset $o$,

$$a(c_i) \equiv a(p_i) + a(t_{o+i}) \pmod{26}$$

(or the Beaufort and Variant forms), in a straight or keyed order $a$. The secret is the pair (text, $o$); a numeric locator such as page and line is one way to transmit $o$.
'''

[[blocks]]
kind = "equations"
title = "Sliding correlation"
body = '''
For every candidate text and offset, the trial decrypt $d_i = a^{-1}\big(a(c_i) - a(t_{o+i})\big)$ is scored by its monogram log-likelihood $\sum_i \log E(d_i)$, computed for all offsets at once as a correlation; the top offsets are re-scored by the index of coincidence and quadgrams. The same sweep on shuffled ciphertext gives the maximum reachable by chance: in the corpus runs the shuffled best monogram log-likelihood per letter was $-1.41$, $-1.44$ and $-1.54$ against an English reference of $-1.24$.
'''

[[blocks]]
kind = "variants"
body = '''
- **Book as running key** (the form treated here).
- **Book as code**: words replaced by their locations in the book; a different, non-additive scheme not treated by the program.
- **Chained texts**: the previous message's plaintext as the key, which the recipe-free cascade handles as a running-key link.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The key text is in the bank; a negative sweep says nothing about texts outside it.
- Invariant: a true window yields the plaintext's index of coincidence (about 0.066) and quadgram rate (near $-4.3$) far above the shuffled null; there is no partial credit for a nearly right offset except at the overlap.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Assemble a bank of plausible texts (public books, texts related to the setting, everything previously recovered) forward and reversed.
2. Sweep all offsets under both orders and three relations by monogram correlation; re-score the top offsets by IC and quadgrams; also score the plaintext side by monograms alone in case a transposition sits underneath.
3. Compare with the shuffled-ciphertext sweep; report anything above it.
'''

[[blocks]]
kind = "complexity"
body = '''
One vector correlation per (text, order, relation); four novels of several hundred thousand letters each, all offsets, three texts of 153, 144 and 504 letters, ran in three to six minutes single-threaded.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Bank coverage** is the whole question; every other failure is secondary.
- **Multiple comparisons.** Across millions of offsets the best chance alignment reaches the shuffled maximum; a hit must exceed it clearly, not marginally.
- **No planted positive.** The receipt shows what chance reaches but not that the sweep finds a planted window; a control should be planted before the sweep is cited as evidence.
'''

[[blocks]]
kind = "controls"
body = '''
ck_book_report.txt records the shuffled-ciphertext null for each of the three texts ($-1.409$, $-1.441$, $-1.542$ monogram log-likelihood per letter at the best offset) and the top offsets by quadgram rate, IC and monogram likelihood, none above the null. The related known-text window CSP (wm_knowntext.py, logs/60 and 63) plants a 63-letter window under a random alphabet and random shifts and recovers a consistent solution while the adjacent wrong window dies, and found no window of any bank text for the corpus zones.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Key passage beginning `ITWASTHEBESTOFTIMES` (say, page 1, line 1 of an agreed book), plaintext `MEETATNOON`, Vigenère relation:

```
plain   M  E  E  T  A  T  N  O  O  N
key     I  T  W  A  S  T  H  E  B  E
cipher  U  X  A  T  S  M  U  S  P  R
```

Check position 2: $E + W = 4 + 22 = 26 \equiv 0 = A$. Given the book and the locator, decryption is subtraction; given only a bank, the sweep finds this passage at offset 0 because the decrypt reads as English.
'''

[[blocks]]
kind = "notes"
body = '''
The corpus's solved prefix contains a running key that is a previous plaintext, which is the book cipher with the "book" being the correspondence itself; that case was recovered, while no external text in the bank keyed the unsolved texts.
'''

