summary = "Quagmire I is a Vigenère cipher with a mixed plaintext alphabet and a straight ciphertext alphabet. Its periodic cosets remain, so standard period diagnostics apply. Each coset's expected letter profile is a shifted, relabelled language profile. A contiguous crib at least as long as the tested period fixes every shift conditional on a trial alphabet. In recorded 153-letter controls, batched annealing then recovered the remaining alphabet."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Let $P$ be a mixed plaintext alphabet and $C$ the straight alphabet, with $\operatorname{pos}_P$ and $\operatorname{pos}_C$ their index maps. With shifts $k = (k_0, \dots, k_{m-1})$,

$$\operatorname{pos}_C(c_i) \equiv \operatorname{pos}_P(p_i) + k_{i \bmod m} \pmod{26}.$$

In the classical presentation the shifts are given by a key word read against an indicator letter. The program treats them as free integers, which contains every word key.
'''

[[blocks]]
kind = "equations"
title = "What a crib determines"
body = '''
A crib letter $p$ known at position $i$ in coset $b$ fixes $k_b = \operatorname{pos}_C(c_i) - \operatorname{pos}_P(p)$ for whatever alphabet $P$ is being tried. A contiguous crib of length at least $m$ therefore removes all $m$ shifts from the search; surplus crib letters in a coset vote for $k_b$ and dissenters are penalised. What remains is one unknown alphabet. Reversing $P$ turns a Beaufort relation into a Vigenère one, so the sign is not a separate parameter in this family. Because the ciphertext alphabet is known, a Quagmire I in a fixed order shows the ordinary period alignment in that order's index space, whereas a Quagmire II does not.
'''

[[blocks]]
kind = "variants"
body = '''
- [Quagmire II](/ciphers/quagmire-ii): straight plaintext alphabet, mixed ciphertext alphabet.
- [Quagmire III](/ciphers/quagmire-iii): the same mixed alphabet on both sides.
- [Quagmire IV](/ciphers/quagmire-iv): two different mixed alphabets.
- **Structured alphabets**: keyword, phrase, text-keyed and two-keyword alphabets make the search a bank lookup; see [Keyword-mixed alphabet](/ciphers/keyword-mixed-alphabet).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Periodic shifts and a single alphabet for the whole text.
- Invariant: each coset is a simple substitution of the plaintext letters at those positions, so within-coset equalities $c_i = c_j \Leftrightarrow p_i = p_j$ hold regardless of the alphabet.
- A blind (crib-free) search over an unstructured alphabet is not assumed to work; see the failure modes.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Recover the period from coincidences or the exact alignment objective.
2. **Structured alphabet**: try every keyed alphabet in the bank, fit the shifts by chi-square and quadgram sweeps, rank by quadgram rate.
3. **Crib**: for every crib and offset, derive the shifts from the crib votes and anneal the alphabet with a batched simulated annealer (swap and insertion moves, quadgram objective on the whole decrypt), then polish over all 925 swap/insertion neighbours and re-anneal the top placements (see [Crib-driven alphabet recovery](/cryptanalysis/crib-driven-alphabet-recovery)).
4. A hit reads as English end to end (rate near $-4.3$); wrong placements stay at the $-6$ null.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// P is the mixed plaintext alphabet and C the straight alphabet; pos_P and
// pos_C are their index maps.
function ENCRYPT(p[0..n-1], P, k[0..m-1]):
    for i in 0..n-1:
        // C[x] is simply letter x
        c[i] = C[(pos_P(p[i]) + k[i mod m]) mod 26]
    return c

function DECRYPT(c[0..n-1], P, k[0..m-1]):
    for i in 0..n-1:
        p[i] = P[(pos_C(c[i]) - k[i mod m]) mod 26]
    return p

// Crib attack: a known plaintext letter at position i fixes the shift of its
// coset for the alphabet P being tried; a contiguous crib of length >= m
// fixes all m shifts.
function SHIFTS_FROM_CRIB(c, crib[0..L-1], offset, P, m):
    for j in 0..L-1:
        b = (offset + j) mod m
        vote[b] += (pos_C(c[offset + j]) - pos_P(crib[j])) mod 26
    for b in 0..m-1: k[b] = the most voted value (dissenters are penalised)
    return k

function CRIB_ATTACK(c, crib, offset, m):
    P = a random alphabet
    repeat (batched annealing with swap and insertion moves):
        k = SHIFTS_FROM_CRIB(c, crib, offset, P, m)
        propose P'
        k' = SHIFTS_FROM_CRIB(c, crib, offset, P', m)
        accept the pair (P', k') by the quadgram score of DECRYPT(c, P', k')
    // a hit reads as English end to end
    return P, k
```
'''

[[blocks]]
kind = "complexity"
body = '''
Bank search: one decrypt per alphabet; 202,504 phrase-keyed alphabets in about ten minutes on twelve cores. Crib attack: every crib, offset, relation and restart is one annealing chain. The production sweep of 6,701 placements per text with 16 restarts of 40,000 steps took about six hours on twelve cores for two texts and four families.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **No crib, unstructured alphabet.** Blind annealing over the alphabet does not reach the basin at 153 letters; see [Quagmire III](/ciphers/quagmire-iii) for the measurements.
- **Wrong crib or offset.** Wrong placements converge to alternative alphabets with rates around $-5.6$ to $-6.1$ that never read. The sweep must compare against that wrong-placement null rather than a fixed threshold.
- **Key change inside the text.** A text whose shifts change part way through breaks the per-coset votes. The program handled this by fitting zones separately.
'''

[[blocks]]
kind = "controls"
body = '''
Crib calibration on planted ciphers (random alphabet, random shifts, real English, true crib at its offset): Quagmire I with a known straight or keyword-mixed ciphertext alphabet solved 3/3 seeds at crib lengths 7, 9, 11, 13, 16, 20 and 25, with 9 to 16 of 16 restarts reading English and 100% match, while wrong placements averaged $-6.06 \pm 0.21$ (log 22). On the two live texts, 6,701 placements each (46 cribs at every offset plus 66 opening cribs) gave best rates $-5.70$ to $-5.83$ and $-5.53$ to $-5.68$, at the wrong-placement null (log 23).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Plaintext alphabet keyed by `ZEBRAS` ($P$ = `ZEBRASCDFGHIJKLMNOPQTUVWXY`), ciphertext alphabet straight, shifts $(3, 7, 12)$. Plaintext `QUAGMIRE`:

```trace
plain    Q   U   A   G   M   I   R   E
pos_P   19  21   4   9  15  11   3   1
shift    3   7  12   3   7  12   3   7
sum     22  28  16  12  22  23   6   8
cipher   W   C   Q   M   W   X   G   I
```

Check position 1: U is letter 21 of $P$; $21 + 7 = 28 \equiv 2 = C$ in the straight alphabet. Ciphertext `WCQMWXGI`.
'''

[[blocks]]
kind = "notes"
body = '''
The program regarded Quagmire I with a known ciphertext order as the principled reading of a text whose cosets align in that order's index space. The crib sweep excluded it for both short ciphertexts for every crib in a 112-word bank, which is a strong scoped negative because 3/3 seeds solved at every crib length.
'''

