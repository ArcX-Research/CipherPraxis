id = "running-key"
section = "ciphers"
title = "Running-key cipher"
subtitle = "Use a long piece of ordinary text as a Vigenère key"
status = "POWER-LIMITED"
status_note = "When the key text came from a known bank, an exact window test found the planted passage and rejected wrong windows within a few nodes. The general cascade also found a running-key link between two earlier solved texts. With an unknown English key, a joint beam decoder recovered only 41%, 50%, and 26% on controls at 63, 95, and 126 letters. That case is not identifiable with this method."
family = "Stream and machine ciphers"
tags = ["running key", "aperiodic", "book key", "two-language-stream"]
related = ["vigenere", "book-cipher", "autokey", "one-time-pad", "running-key-relation-test", "key-cancellation", "beam-search", "viterbi-decoding", "constraint-satisfaction-forward-checking", "word-prefix-csp", "transposed-running-key-endpoint-scoring"]
summary = "A running-key cipher adds a long meaningful text to the plaintext one letter at a time. The key does not repeat, so there is no period to find. If the key passage is in a known bank, a solver can search for it. If it is unknown, both key and plaintext are language, and many wrong pairs can sound convincing. Tests solved the known-bank case but showed that the unknown-key decoder lacks power."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
With a key text $t_0 t_1 \dots$ at least as long as the message and an index order $a$,

$$a(c_i) \equiv a(p_i) + a(t_i) \pmod{26}$$

(Vigenère), or $a(t_i) - a(p_i)$ (Beaufort), or $a(p_i) - a(t_i)$ (Variant). The key is the identity of the text and the starting offset. A keyed order adds a permutation. The one-time pad is the limit in which $t$ is uniformly random and never reused.
'''

[[blocks]]
kind = "equations"
title = "Known bank versus unknown key"
body = '''
**Known long operand, periodic other operand.** If one additive operand is a window $T[o:o+n]$ of a known text and the other is restricted to a period-$m$ numeric sequence, every position gives $x(c_i)-x(T_{o+i})-k_{i\bmod m}\equiv0$, with all letter coordinates $x$ distinct. This is the exact window test used in the recorded controls; it does not cover an arbitrary unknown plaintext paired with the known key text. On its 63- and 95-letter instances, wrong windows often became inconsistent within a few nodes and the planted window admitted a consistent alphabet. **Unknown English key.** The pair $(p,t)$ must be inferred jointly from $c$ alone. The symmetry $p\leftrightarrow t$ under Vigenère is intrinsic, and language models admit many fluent decompositions. Between two ciphertexts, a shared running key cancels: $c^{(1)}_i-c^{(2)}_i=p^{(1)}_i-p^{(2)}_i$ in a common coordinate order.
'''

[[blocks]]
kind = "variants"
body = '''
- **Book cipher**: the key is a passage identified by its location in a book; see [Book cipher](/ciphers/book-cipher).
- **Chained running key**: one recovered plaintext keys the next message. The solved prefix of the corpus contains such a link, which the cascade recovered through its running-key decision (see [Running-key relation test](/cryptanalysis/running-key-relation-test)).
- **Running key under a transposition**: when a complete key candidate is rearranged in blocks, neighbouring-block n-gram terms allow an exact subset-DP route search. Known letters of an incomplete key can supply an earlier assignment proxy; see [Transposed running-key endpoint scoring](/exact/transposed-running-key-endpoint-scoring).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Both streams are natural language. The cipher is additive in a known or guessed order.
- A nonperiodic key has no deterministic key period. Under independent stationary plaintext/key language models, ordinary period tests are not expected to show a stable key-lag peak, but finite texts can show chance or linguistic autocorrelation peaks.
- Invariant: two messages under the same key text differ by the difference of their plaintexts, regardless of the key.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Bank sweep.** Slide every candidate key text past the ciphertext at every offset in every order and relation; score offsets by monogram likelihood (vectorised), re-score the top ones by index of coincidence and quadgrams, and compare with the same sweep on shuffled ciphertext.
2. **Exact window test.** With a candidate long operand and a declared periodic other operand, solve the alphabet-position CSP for every window; keep windows that admit a consistent alphabet.
3. **Unknown key.** Exact Viterbi over the last three key letters ($26^3$ states) scoring quadgrams of both streams, or a recurrent language model run jointly on both streams inside a beam; in either case require matched planted controls first.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// a is the index order; the key text t is at least as long as the message.
function ENCRYPT(p[0..n-1], t, a, relation):
    for i in 0..n-1:
        if relation == Vigenère: c[i] = a_inverse((a(p[i]) + a(t[i])) mod 26)
        if relation == Beaufort: c[i] = a_inverse((a(t[i]) - a(p[i])) mod 26)
        if relation == Variant:  c[i] = a_inverse((a(p[i]) - a(t[i])) mod 26)
    return c

function DECRYPT(c[0..n-1], t, a, relation):
    for i in 0..n-1:
        if relation == Vigenère: p[i] = a_inverse((a(c[i]) - a(t[i])) mod 26)
        // its own inverse
        if relation == Beaufort: p[i] = a_inverse((a(t[i]) - a(c[i])) mod 26)
        if relation == Variant:  p[i] = a_inverse((a(c[i]) + a(t[i])) mod 26)
    return p

// Known text T, unknown alphabet positions x and period-m shifts k: the exact
// window test.
function WINDOW_TEST(c[0..n-1], T, o, m):
    constraints = [x(c[i]) - x(T[o + i]) - k[i mod m] = 0 (mod 26) for i in
            0..n-1]
    // a wrong window dies within a few nodes
    return SOLVE_CSP(constraints, all x distinct)

// Unknown English key: exact Viterbi over the last three key letters (26^3
// states), scoring quadgrams of both streams p and t at every position;
// matched planted controls come first.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Bank sweep: one vector correlation per (text, offset), minutes for four novels and all offsets. Exact Viterbi: $26^3 = 17{,}576$ states per position. Joint beam: two recurrent states per hypothesis, beam 12,000, seconds per 100-letter control.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Identifiability.** The joint beam decoder's best hidden-pair matches were 41.3%, 49.5% and 26.2% on 63-, 95- and 126-letter controls. The truth left the beam every time while the decoder emitted two fluent streams with exact round-trips. That is why fluency plus round-trip cannot authenticate a running-key reading.
- **Multiple comparisons.** Sweeping thousands of windows and offsets yields top alignments at the family-wise null. One lane's best alignment (z +4.7) sat at the multiple-comparison expectation of about 4.5.
- **Bank coverage.** A negative bank sweep excludes only the texts in the bank.
'''

[[blocks]]
kind = "controls"
body = '''
Known-text CSP (logs/60_knowntext.log, logs/63_knowntext2.log): the planted 63-letter window under a random alphabet and random shifts yields a consistent solution while the adjacent wrong window dies. Joint beam decoder (log 166): control gate FAIL on all three matched controls, so no live text was run. Recipe-free cascade (logs/145_infer.log): the running-key link between two solved texts of the corpus was recovered at 100% published match. Cross-text relation tests in all four index-space pairings on the two short texts: the best index of coincidence, 0.0495, is z +0.8 against the family-wise null once selection over 1,296 trials is included (logs/11_misc.log).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Plaintext `SENDHELP`, key text beginning `THEQUICKBROWN`, Vigenère relation:

```trace
plain   S  E  N  D  H  E  L  P
key     T  H  E  Q  U  I  C  K
cipher  L  L  R  T  B  M  N  Z
```

Check position 3: $D + Q = 3 + 16 = 19 = T$; position 4: $H + U = 7 + 20 = 27 \equiv 1 = B$. With the key text known, decryption is subtraction; without it, `LLRTBMNZ` is consistent with many (plaintext, key) pairs.
'''

[[blocks]]
kind = "notes"
body = '''
Enumerating a plausible key-text bank can make a running-key attack practical, but it is not the only possible source of information: cribs, key reuse, and related messages can also constrain the pair. For an otherwise unknown key, a fluent decomposition still needs independent evidence because the tested joint decoder did not recover its controls reliably.
'''

