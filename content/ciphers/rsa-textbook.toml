summary = "Textbook RSA raises a message block to a public power modulo a product of primes. For letters, a b-letter block is one base-26 number below 26^b. The modulus must also stay below 26^b if the result must fit in b letters. This makes small blocks a finite search. Tests covered all allowed modulus and exponent classes at widths 2 and 3, bank exponents at width 4, and a word-based prime family at width 9. Every answer had to pass a direct modular-power replay."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Serialise a block of $b$ letters in digit order $O$ (straight or keyword-mixed) and orientation $e(r)$ (most- or least-significant first):

$$X_j=\sum_{r=0}^{b-1}O(x_{jb+r})\,26^{e(r)},\qquad C_j\equiv X_j^E\pmod N,\qquad X_j\equiv C_j^D\pmod N,$$

with $ED\equiv1\pmod{\lambda(N)}$, where $\lambda$ is the Carmichael function. Each admitted plaintext representative must satisfy $0\le X_j<N$; otherwise reduction modulo $N$ loses information before encryption. Because $C_j<N<26^b$, the ciphertext representative can be decoded back to $b$ letters by the same serialisation.
'''

[[blocks]]
kind = "equations"
title = "Admissible moduli and exponent classes"
body = '''
The observed maximum ciphertext block $c_{\max}$ satisfies $c_{\max}<N<26^b$, which leaves a narrow interval of moduli. Enumerating every distinct-prime semiprime $N=pq$ in that interval (and every squarefree $N$ with three or more prime factors) covers the declared squarefree RSA family at that size. Prime-power moduli are outside that family; for nontrivial exponents their action on representatives divisible by the prime can collapse values, so they require a separate correctness analysis rather than blanket inclusion. For the exponent, enumerating every unit class $D\in(\mathbb{Z}/\lambda(N))^\times$ covers both naming directions at once, since inversion permutes the group. Padding is modelled as a subset of block columns: either every omitted column is constant across blocks (deterministic pad) or the omitted columns are unconstrained (erasure), and every non-empty payload subset is scored.
'''

[[blocks]]
kind = "variants"
body = '''
- **Unpadded fixed width** $b = 2, 3, 4$ with a classic exponent bank $\{3, 5, 17, 257, 65537\}$, then all odd exponents up to 257.
- **Deterministic fixed-column padding** and **unconstrained erased columns**.
- **All unit exponents** at $b = 2, 3$ (exact); **multi-prime** squarefree moduli at $b = 2, 3$.
- **Width 9 with word-valued primes**: $N = pq < 26^9$ with $p, q$ the base-26 values of generic English words of 3-6 letters; 17 contiguous payload masks.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Fixed-width serialisation in one of four cells, a modulus bounded by the block width, and every plaintext representative below that modulus.
- Invariant: a literal modular-power replay must reproduce every ciphertext block, which is the gate a language score can never replace.
- For the admitted squarefree moduli and inverse exponents, modular exponentiation is a permutation of representatives $0,\dots,N-1$. It therefore preserves equality of **whole block values** in both directions. It does not imply any universal equivalence between equality of individual letters at fixed positions; such letterwise patterns are, at most, model diagnostics. Width-1 RSA ($N<26$) reduces to a monoalphabetic map on its admitted representatives.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Read $c_{\max}$ from the serialised ciphertext in each cell; enumerate every admissible $N$ (sieve, then products).
2. For each $N$ and exponent class decrypt every block; score each payload subset by quadgrams.
3. Keep the top candidates, verify by independent decryption and literal replay, and compare with an out-of-sample English threshold. Any crossing requires a selection-matched null that permutes whole ciphertext blocks and reruns the complete selector.
4. Gate on planted controls that recover the exact modulus, factors, exponent, mask and plaintext before any live text is loaded.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Blocks of b letters; digit order O (straight or keyword-mixed) and
// orientation e(r) (most- or least-significant first). N is the modulus, N <
// 26^b; E and D satisfy E * D = 1 (mod lambda(N)).
function SERIALISE(x[0..b-1], O, e):
    // an integer below 26^b
    return sum over r in 0..b-1 of O(x[r]) * 26^e(r)

function DESERIALISE(X, O, e):
    // same order and orientation
    return the b letters whose digits O(x[r]) * 26^e(r) sum to X

function ENCRYPT(p[0..n-1], b, N, E, O, e):
    for each block of b letters of p:
        X = SERIALISE(block, O, e)
        require X < N
        // C < N < 26^b
        C = POWMOD(X, E, N)
        append DESERIALISE(C, O, e) to c
    return c

function DECRYPT(c[0..n-1], b, N, D, O, e):
    for each block of b letters of c:
        C = SERIALISE(block, O, e)
        X = POWMOD(C, D, N)
        append DESERIALISE(X, O, e) to p
    return p

// Attack: read c_max from the serialised ciphertext, enumerate every
// admissible N with c_max < N < 26^b (distinct-prime semiprimes, then
// squarefree multi-prime), every unit exponent class D modulo lambda(N) and
// every payload subset; score by quadgrams and gate on literal replay.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Width 3 with all unit exponents: 1,348,830 exponent maps and 14,618,198 payload scores for two-prime moduli; 4,214 multi-prime moduli (3,267 three-factor, 881 four-factor, 66 five-factor) with 360,512 maps. Width 4 with the expanded bank and erasure: 1,653,009 exponent pairs and 50,429,456 projections. The full unit group at width 4 contains about $1.02 \times 10^9$ maps and was not run; the cited design judged that cost too high for its four-letter-block identification gate. Width 9 word factors: 648,896 moduli and 4,799,164 maps on the blind gate.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Short hits are selection noise.** The width-9 family produced two 16-letter and two 17-letter English-looking prefixes/suffixes; under 19 block-order permutations 13 of 19 (and 19 of 19) nulls scored at least as well, giving $p = 0.70$ and $p = 1.00$.
- **Erased columns impose no forward constraint**, so replay is necessary but not sufficient there. An English threshold and a matched null are required.
- **Scope.** Width 4 is only bank-complete; widths 5–8, 10 and above, non-word primes at width 9, variable-width serialisation, non-fixed pad positions, and an external modulus remain open. The cited runs establish neither tractability nor identifiability for those untested families.
'''

[[blocks]]
kind = "controls"
body = '''
Every lane recovered its exact planted modulus, exponent pair, serialisation and plaintext with replay before release: widths 2-4 (log 478), deterministic padding (log 479, live structural admission count zero in every width and group), erasure (log 480), all unit exponents (log 481), multi-prime (log 482), and the width-9 word-factor lane (log 483), whose blind gate recovered a cross-convention plant with a 13-digit modulus and its two word factors. All live outcomes were negative. The two short width-9 hits were rejected by logs 484 and 485 as above. An independent read-only audit certified the closures.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Width $b = 2$, $N = 667 = 23 \times 29$, $\lambda(N) = \operatorname{lcm}(22, 28) = 308$, $E = 3$, $D = 103$ (since $3 \times 103 = 309 \equiv 1 \pmod{308}$). Block `HI` in straight order, most significant first: $X = 7 \times 26 + 8 = 190$.

$$C = 190^3 \bmod 667 = 6{,}859{,}000 - 10{,}283 \times 667 = 239, \qquad 239 = 9 \times 26 + 5 \to \texttt{JF}.$$

Decryption: $239^{103} \bmod 667 = 190 \to$ `HI`. A second block `YO` $= 638 < 667$ encrypts to $290 \to$ `LE`.
'''

[[blocks]]
kind = "notes"
body = '''
The RSA lanes are the corpus's demonstration that a "modern" cipher on a classical alphabet becomes a finite classical-style enumeration once the serialisation is fixed, and that language-scored short hits inside a million-map search need a selection-matched null before they mean anything.
'''

