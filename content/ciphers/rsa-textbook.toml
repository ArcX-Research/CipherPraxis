subtitle = "Raise fixed-width base-26 letter blocks to a power modulo a small number"
status = "CLOSED"
status_note = "At widths 2 and 3, exact searches covered every stated product of distinct primes below 26^b, every invertible exponent, and every fixed column subset. Planted controls passed with direct modular replay. Widths 2–4 with an exponent bank and a width-9 word-factor family were also negative. Matching nulls rejected two short hits with p = .70 and 1.00."
