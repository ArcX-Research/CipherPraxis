id = "gromark"
section = "ciphers"
title = "Gromark"
subtitle = "A keyed substitution driven by a digit chain from a short numeric primer"
status = "CLOSED"
status_note = "Basic Gromark controls passed at primer lengths 4, 5, 6, and 7. Every 504-letter control recovered the plaintext, primer, and alphabet exactly, including a primer that began with zero. Tests ruled out those lengths on the 504-letter target. Primer length 8 and layered forms remain open."
family = "Stream and machine ciphers"
tags = ["running digit chain", "primer", "keyed alphabet", "lagged fibonacci", "stream"]
related = ["keyword-mixed-alphabet", "condi", "linear-recurrences-lcg", "meet-in-the-middle", "modular-inverse-and-crt", "exhaustive-enumeration", "simulated-annealing", "g-autokey-primer", "g-keyed-alphabet"]
summary = "Gromark adds a changing decimal digit to each plaintext letter, then applies a keyed substitution. A short numeric primer grows into the digit stream through a lagged-Fibonacci rule. The key is therefore the primer plus an alphabet. Checking every primer costs 10 to the power of its length. A meet-in-the-middle method handled lengths through 7 and used an alphabet-free filter before searching any substitution."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
For a primer of $P$ digits $r_0, \dots, r_{P-1}$ and a keyed alphabet $\sigma$,

$$d_i = r_i \ (i < P), \qquad d_i \equiv d_{i-P} + d_{i-P+1} \pmod{10} \ (i \ge P),$$

$$c_i = \sigma\big[(p_i + d_i) \bmod 26\big], \qquad p_i \equiv \sigma^{-1}(c_i) - d_i \pmod{26}.$$

The standard alphabet is "K2M": deduplicate a keyword, append the unused letters, fill rows of keyword width and read the columns in the alphabetical order of the keyword letters.
'''

[[blocks]]
kind = "equations"
title = "Linearity and the substitution-invariant selector"
body = '''
The chain is linear, so every running digit is a public linear form of the primer:

$$d_i \equiv \sum_j A_{i,j}\, r_j \pmod{10}, \qquad A_{i,j} = A_{i-P,j} + A_{i-P+1,j}.$$

Splitting $\mathbb{Z}_{10} \cong \mathbb{Z}_2 \times \mathbb{Z}_5$ and the primer into two halves lets all $10^P$ states be visited by a meet in the middle without recomputing the chain. Before any alphabet is known, equal ciphertext letters have equal pre-substitution ranks, so

$$c_i = c_j \ \Rightarrow\ p_j - p_i \equiv d_i - d_j \pmod{26},$$

which turns the consecutive occurrences of each ciphertext letter into a spanning forest of plaintext-difference constraints scored by a generic lag/difference model. That selector ranks primers exactly and is independent of $\sigma$.
'''

[[blocks]]
kind = "variants"
body = '''
- **Periodic Gromark**: a distinct-letter keyword of length $P$ gives the alphabet, the primer (letter ranks $1 \dots P$) and block offsets $o_g = \sigma^{-1}(\text{keyword}_g)$ added per block of $P$ letters.
- **Basic Gromark with longer primers**: each extra digit multiplies the exact primer stage by ten.
- **Condi**: a related running-key substitution whose feedback comes from the plaintext itself; see [Condi](/ciphers/condi).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The chain rule and the alphabet style are fixed by the model. The primer and alphabet are unknown.
- Invariant: with $\sigma$ unknown, the ciphertext-letter equality forest above constrains only plaintext differences, never absolute letters.
- A fitted invertible state always round-trips. Only exact control recovery is evidence.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Enumerate all $10^P$ primers (meet in the middle at $P = 6, 7$) and score each by the substitution-invariant difference model.
2. Give the top cells (32,768 at $P = 6$, 131,072 at $P = 7$) a one-to-one monogram assignment (Hungarian) and a provisional quadgram score.
3. Anneal the arbitrary 26-letter alphabet for the best 32 (or 64 at $P = 5$) primers.
4. Require the control gate: exact plaintext, exact transmitted primer including leading zeros, the hidden alphabet on every observed rank, and an independent forward reconstruction. Only then read a live text, and require an English verdict before spending any null budget.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Primer r[0..P-1] of decimal digits; sigma is the keyed alphabet; letters
// are indices 0..25.
function DIGIT_CHAIN(r[0..P-1], n):
    for i in 0..n-1:
        d[i] = r[i] if i < P else (d[i - P] + d[i - P + 1]) mod 10
    return d

function ENCRYPT(p[0..n-1], r, sigma):
    d = DIGIT_CHAIN(r, n)
    for i in 0..n-1:
        c[i] = sigma[(p[i] + d[i]) mod 26]
    return c

function DECRYPT(c[0..n-1], r, sigma):
    d = DIGIT_CHAIN(r, n)
    for i in 0..n-1:
        p[i] = (pos_sigma(c[i]) - d[i]) mod 26
    return p

// K2M alphabet: deduplicate the keyword, append the unused letters, fill rows
// of keyword width, read the columns in the alphabetical order of the keyword
// letters.
function K2M_ALPHABET(keyword):
    w = keyword with repeated letters removed
    grid = rows of width len(w) filled with w followed by the unused letters
    return the columns of grid concatenated, taken in the alphabetical order
            of the letters of w
```
'''

[[blocks]]
kind = "complexity"
body = '''
Exact primer stage: $10^4$ to $10^7$ cells. The $P = 5$ lane ran 100,000 primers with a Hungarian pre-pass in about 51 to 54 seconds per control. The alphabet anneal is bounded (top 32 or 64 primers) and therefore control-qualified rather than exhaustive. Each additional primer digit multiplies the exact stage by ten, which is why $P \ge 8$ was left open.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Rank spread of the true primer.** Under the invariant selector the hidden primers ranked 8,319 and 6,499 of $10^6$ at $P = 6$ and 72,008 and 13,812 of $10^7$ at $P = 7$. A shortlist smaller than those ranks would silently lose the truth. The leading-zero control is what set the $P = 7$ shortlist size.
- **Non-language endpoints.** Every live endpoint round-tripped but scored $-6.67$ to $-7.20$ per letter, far below the English gate, so the nulls were never triggered.
- **Scope.** A different composition (Gromark under or over another layer) or $P \ge 8$ is not covered.
'''

[[blocks]]
kind = "controls"
body = '''
$P = 4$: exhaustive primer pre-pass, control PASS in 13.39 s; periodic Gromark $P = 4..8$: control PASS in 9.46 s (COLOSSUS_DYNAMIC_AUDIT.md). $P = 5$: two independently generated 504-letter controls recovered 504/504 letters, the exact primer and alphabet, forward PASS, in 51.37 s and 54.28 s. The live text gave primer-stage rate $-7.12$ (no) (logs/201_gromark5.log). $P = 6$ and $7$: four held-out 504-letter controls (two per length, arbitrary alphabets, one seven-digit primer with a leading zero) all recovered 504/504 letters, 26/26 alphabet entries and the exact primer with forward PASS; live endpoints $-7.20$ and $-7.11$ (no) (logs/212_gromark67_recurrence.log). Every control ciphertext also byte-matched an independently compiled source generator.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Primer `27182`, alphabet $\sigma$ keyed by `ZEBRAS` (`ZEBRASCDFGHIJKLMNOPQTUVWXY`), plaintext `GROMARK`. Chain: $2, 7, 1, 8, 2$, then $d_5 = 2 + 7 = 9$, $d_6 = 7 + 1 = 8$.

```trace
plain    G   R   O   M   A   R   K
p        6  17  14  12   0  17  10
d        2   7   1   8   2   9   8
p+d      8  24  15  20   2  26   18
mod 26   8  24  15  20   2   0   18
sigma    F   X   M   T   B   Z   P
```

Ciphertext `FXMTBZP`. Decrypt position 5: `Z` is rank 0 of $\sigma$, $0 - 9 \equiv 17 = R$.
'''

[[blocks]]
kind = "notes"
body = '''
The corpus result is a control-qualified negative for direct basic Gromark at primer lengths 4 to 7 and the declared alphabet budgets on one 504-letter text, and for periodic Gromark at keyword lengths 4 to 8. It is not a theorem about longer primers or about Gromark composed with another layer.
'''

