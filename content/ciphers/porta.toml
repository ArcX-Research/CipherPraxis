related = ["beaufort", "vigenere", "autokey", "digraphic-slide", "periodic-substitution-dp", "exact-dynamic-programming", "g-reciprocal-cipher", "g-period"]
summary = "Porta splits the alphabet into two groups of 13. Each key-letter pair, such as AB or CD, chooses one rotation that swaps the two halves. There are 13 distinct tables. The same operation decrypts, and a letter never maps within its own half. An exact cyclic dynamic program solved one free Z13 key value per coset. Separate tests covered word keys and plaintext autokey."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Index the alphabet $0 \dots 25$ in a fixed order $A$ and let $x = \operatorname{pos}_A(p_i)$. The key letter at position $i$ has pair index $t = \lfloor \operatorname{pos}(k_{i \bmod m}) / 2 \rfloor \in \mathbb{Z}_{13}$. Then

$$\operatorname{pos}_A(c_i) = \begin{cases} 13 + (x + t) \bmod 13 & x < 13 \\ (x - 13 - t) \bmod 13 & x \ge 13. \end{cases}$$

The same formula decrypts: the map is an involution, and a letter of the top half always goes to the bottom half and vice versa.
'''

[[blocks]]
kind = "equations"
title = "Key classes and invariants"
body = '''
Key letters in the same pair (A/B, C/D, ...) select the same table, so the observable key is the vector $(t_0, \dots, t_{m-1}) \in \mathbb{Z}_{13}^m$ rather than a word. A sign-reversed tableau ($t \mapsto -t$) is absorbed into the free-key family, so it is not a separate trial. Because a letter never encrypts within its own half, a plaintext letter and its ciphertext differ in half at every position: $\lfloor x/13 \rfloor \ne \lfloor \operatorname{pos}_A(c_i)/13 \rfloor$. In a word-keyed Porta an ordinary word can produce only two or three distinct tables, which gives a period-7 text an unusually small number of substitution classes.
'''

[[blocks]]
kind = "variants"
body = '''
- **Free periodic Porta**: every coset chooses any of the 13 tables, in the straight or a keyword-mixed order.
- **Word-keyed Porta**: seven-letter dictionary keys at every phase, both directions, two tableaux.
- **Porta autokey**: the key stream is a primer followed by the plaintext. The pair equivalence makes the primer identifiable only up to A/B, C/D, ... classes.
- **Portax**: the digraphic slide built from the Porta rectangle; see [Digraphic slide](/ciphers/digraphic-slide).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Periodic key and one index order; natural-language plaintext.
- Invariant: reciprocity, so a fitted state always round-trips and round-trip is not evidence.
- Invariant: the half-swap. If ciphertext and plaintext ever share a half at the same position in the assumed order, that order is wrong.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. For each coset rank the 13 tables by monogram likelihood of the decrypted coset; keep the best eight.
2. Solve the shortlisted product exactly with the cyclic order-three quadgram dynamic programme, then let all 13 tables enter through coordinate and adjacent-pair polish (see [Periodic substitution DP](/exact/periodic-substitution-dp)).
3. Require the planted controls to recover every letter and the exact order and key before any live zone is scored; give any English endpoint a within-coset shuffled null that repeats the full order/key selection.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Index order A (straight or keyword-mixed); x = pos_A(letter). A key letter
// selects the table t = floor(pos(key letter) / 2) in 0..12. One routine
// encrypts and decrypts.
function PORTA_TABLE(x, t):
    // top half goes to the bottom half
    if x < 13: return 13 + (x + t) mod 13
    // bottom half goes to the top half
    else:      return (x - 13 - t) mod 13

function PORTA(text[0..n-1], key[0..m-1], A):
    for i in 0..n-1:
        t = floor(pos(key[i mod m]) / 2)
        out[i] = A[PORTA_TABLE(pos_A(text[i]), t)]
    return out

function ENCRYPT(p, key, A): return PORTA(p, key, A)
function DECRYPT(c, key, A): return PORTA(c, key, A)   // involution

// Free-key attack: each coset may use any of the 13 tables; shortlist per
// coset by monogram likelihood, then solve the shortlisted product with the
// cyclic quadgram DP.
function SHORTLIST(c[0..n-1], m, A):
    for b in 0..m-1:
        coset = [c[i] for i in 0..n-1 if i mod m == b]
        for t in 0..12:
            score[t] = MONOGRAM_LOGLIK([A[PORTA_TABLE(pos_A(y), t)] for y in
                    coset])
        keep[b] = the eight best t by score
    return keep
```
'''

[[blocks]]
kind = "complexity"
body = '''
Free key: $13^m$ raw keys ($13^7 \approx 6.3 \times 10^7$, $13^{26} \approx 9 \times 10^{28}$). The DP makes the shortlisted product exact at $8^3$ states per step. Word keys: every seven-letter dictionary word times seven phases, batched, in one to two minutes.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Partial-language endpoints.** The 126-letter period-26 zone reached $-5.73$ per letter ("partial"): a free 26-table key on five letters per coset fits fragments of language without being plaintext.
- **Autokey power.** The plaintext-fed Porta autokey solver reached only 97.22% and 99.21% plaintext on its 144- and 504-letter controls, with the wrong primer class despite exact false-state round-trips, so those targets were never run.
- **Unknown order.** Only two fixed orders were tried. An arbitrary mixed order under a Porta layer is outside the tested scope.
'''

[[blocks]]
kind = "controls"
body = '''
Free periodic Porta (log 204): three blind controls at 63 letters/period 7 (straight order), 95 letters/period 7 and 126 letters/period 26 (keyword-mixed order) each recovered 100% plaintext, the exact order and effective key, and the forward ciphertext. The three admitted zones then scored $-6.25$ (no), $-6.36$ (no) and $-5.73$ (partial); none reached the predeclared English gate, so no null budget was spent and no candidate followed. Word-keyed Porta (logs/55_porta.log): controls ranked the planted key first; both zones negative. Porta autokey (log 185): the 153-letter control passed exactly. The 144- and 504-letter controls failed as above.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Straight order, key `KEY`: K is letter 10, pair index $t = 5$; E gives $t = 2$; Y gives $t = 12$. Plaintext `HELLO`:

```trace
plain   H   E   L   L   O
x       7   4  11  11  14
t       5   2  12   5   2
result  13+12=25  13+6=19  13+(23 mod 13)=23  13+(16 mod 13)=16  (14-13-2) mod 13=12
cipher  Z   T   X   Q   M
```

Applying the same tables to `ZTXQM` returns `HELLO`. Every plaintext letter changed half.
'''

[[blocks]]
kind = "notes"
body = '''
The closure is scoped: free periodic Porta in the straight and one keyword-mixed order on three measured zones of 63, 95 and 126 letters, with a demonstrated control power of 3/3. It says nothing about Porta over an arbitrary order or a Porta layer inside a composite.
'''

