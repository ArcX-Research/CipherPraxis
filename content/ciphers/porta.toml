title = "Porta cipher"
subtitle = "A repeating reciprocal cipher with 13 tables chosen by key-letter pairs"
status = "CLOSED"
status_note = "The free periodic Porta solver passed all three target-length controls at 63, 95, and 126 letters. Every result in the three measured target zones failed the language check, ruling out free periodic Porta in the two fixed orders at those lengths. The Porta autokey test cannot pass its 144- and 504-letter controls."
family = "Polyalphabetic substitution"
