id = "affine-cipher"
section = "ciphers"
title = "Affine cipher"
subtitle = "Multiply and add modulo 26, either once or separately in each coset"
status = "VERIFIED"
status_note = "The exact periodic-affine solver chooses among 312 maps per coset. It solved both period-7 planted controls at 63 and 95 letters. A 126-letter period-26 control failed because four or five letters per coset do not identify one map."
family = "Monoalphabetic substitution"
tags = ["monoalphabetic", "affine", "units mod 26", "periodic"]
related = ["caesar-shift", "vigenere", "affine-maps-mod-26", "units-mod-26", "periodic-substitution-dp", "exact-dynamic-programming", "within-coset-null", "affine-lab"]
summary = "The affine cipher maps each letter x to ax + b modulo 26, where a has an inverse. There are 12 x 26 = 312 maps, so a single affine substitution can be checked completely. A periodic version uses one affine map per coset. It sits between simple additive keys and unrelated substitutions, and an exact dynamic program can solve it."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Let $a \in \mathbb{Z}_{26}^{\times}$ (so $\gcd(a, 26) = 1$, twelve choices) and $b \in \mathbb{Z}_{26}$. Then

$$c \equiv a\,p + b \pmod{26}, \qquad p \equiv a^{-1}(c - b) \pmod{26}.$$

With $a = 1$ this is a Caesar shift; with $b = 0$ it is a pure decimation. Because $a$ must be a unit, only $12 \times 26 = 312$ maps exist.
'''

[[blocks]]
kind = "equations"
title = "Periodic affine layer"
body = '''
In an index order $A$ (straight or keyword-mixed), the program's periodic version gives coset $b = i \bmod p$ its own map:

$$\operatorname{pos}_A(p_i) \equiv m_b \operatorname{pos}_A(c_i) + d_b \pmod{26}, \qquad \gcd(m_b, 26) = 1,$$

and the forward form is $\operatorname{pos}_A(c_i) \equiv m_b^{-1}(\operatorname{pos}_A(p_i) - d_b)$. The Vigenère and Beaufort layers are the sub-cases $m_b = 1$ and $m_b = -1$. Configuration equality is judged on the letters actually observed in each coset, because two affine actions can agree on every observed symbol and differ elsewhere.
'''

[[blocks]]
kind = "variants"
body = '''
- **Single affine map**: 312 keys. The frequency correlation over all keys is immediate.
- **Periodic affine (one map per coset)**: $312^p$ raw keys, searched by a monogram shortlist of the best eight maps per coset followed by an exact cyclic order-three quadgram DP, then an unrestricted 312-way coordinate polish.
- **Affine position routes** are a different object: an affine permutation of *positions*, treated under [Route transposition](/ciphers/route-transposition).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Natural-language plaintext. Each coset must hold enough letters to distinguish 312 candidate maps.
- Invariant: an affine map is a bijection, so within-coset coincidences $c_i = c_j \Leftrightarrow p_i = p_j$ are preserved, exactly as for a shift.
- The index order is part of the model. The program tried the straight order and one keyword-mixed order.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. For each coset rank all 312 maps by monogram likelihood of the decrypted coset; keep the best eight.
2. Run the exact cyclic order-three dynamic programme over the shortlisted product with a quadgram objective, which is exact inside the shortlist (see [Periodic substitution DP](/exact/periodic-substitution-dp)).
3. Let every one of the 312 maps enter through unrestricted coordinate polish and adjacent-pair polish.
4. Any English-looking endpoint receives a within-coset shuffled null that repeats the full selection.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Letters are indices 0..25. a must be a unit mod 26 (gcd(a, 26) = 1, twelve
// choices), b in 0..25.
function ENCRYPT(p[0..n-1], a, b):
    for i in 0..n-1:
        c[i] = (a * p[i] + b) mod 26
    return c

function DECRYPT(c[0..n-1], a, b):
    a_inv = INVERSE_MOD_26(a)                     // a * a_inv = 1 (mod 26)
    for i in 0..n-1:
        p[i] = (a_inv * (c[i] - b)) mod 26
    return p

// Periodic affine layer in index order A: coset b = i mod p has its own
// decrypt map (m_b, d_b).
function PERIODIC_DECRYPT(c[0..n-1], A, p, m[0..p-1], d[0..p-1]):
    for i in 0..n-1:
        b = i mod p
        plain[i] = A[(m[b] * pos_A(c[i]) + d[b]) mod 26]
    return plain

// Ciphertext-only shortlist: all 312 maps per coset, ranked by monogram
// likelihood of the decrypted coset.
function SHORTLIST(c[0..n-1], A, p):
    for b in 0..p-1:
        coset = [c[i] for i in 0..n-1 if i mod p == b]
        for each unit m and each d in 0..25:
            score[m, d] = MONOGRAM_LOGLIK([A[(m * pos_A(y) + d) mod 26] for y
                    in coset])
        keep[b] = the eight best (m, d) by score
    // handed to the exact cyclic quadgram DP
    return keep
```
'''

[[blocks]]
kind = "complexity"
body = '''
Single map: 312 decrypts. Periodic: $8^p$ shortlisted states are exact in the DP with an order-three chain ($8^3$ states per step). The polish visits $312\,p$ single moves per sweep plus shortlisted pairs. Both period-7 controls completed inside the audit's standard budget (logs/205_periodic_affine.log).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Identifiability at four to five letters per coset.** The period-26 control on 126 letters produced an attractive false state: its selected text scored $-4.28$ per letter (inside the English band) and round-tripped, yet neither the plaintext nor the observable maps matched the plant. A wider family manufactures false language on short cosets. The target of that length was therefore kept locked.
- **Round-trip is tautological.** Any invertible fitted map reproduces the ciphertext.
- **Language-model overfit.** The period-7 endpoints on the two live zones reached only $-5.26$ and $-5.77$ (partial), which the audit classified as quadgram overfit rather than plaintext.
'''

[[blocks]]
kind = "controls"
body = '''
Two target-length period-7 controls passed exactly: 63/63 and 95/95 plaintext letters, the exact observed affine maps and order, and independent forward reconstruction. The separate 126-letter period-26 control failed as described above, so the periodic-affine reading was closed only for the two period-7 zones and left undecided for the period-26 zone (PERIODIC_AFFINE_DP_AUDIT.md; logs/205_periodic_affine.log).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Key $a = 5$, $b = 8$ ($a^{-1} = 21$ since $5 \times 21 = 105 = 4 \times 26 + 1$). Plaintext `AFFINE`:

```trace
plain    A   F   F   I   N   E
x        0   5   5   8  13   4
5x+8     8  33  33  48  73  28
mod 26   8   7   7  22  21   2
cipher   I   H   H   W   V   C
```

Decrypt `W`: $21 \times (22 - 8) = 294 = 11 \times 26 + 8 \to I$. The [affine lab](/labs/affine-lab) enumerates all 312 maps.
'''

[[blocks]]
kind = "notes"
body = '''
The periodic-affine family was chosen because it is the largest structured subset between "one shift per coset" and "one arbitrary substitution per coset" that an exact DP can still search. The seven-free-substitution family itself is not identifiable at 63 letters (its control gate failed), so the affine subset is where exactness ends.
'''

