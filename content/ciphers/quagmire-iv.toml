subtitle = "Repeat shifts between separate mixed alphabets for plaintext and ciphertext"
status = "POWER-LIMITED"
status_note = "Blind annealing over two unknown alphabets recovered 0% of 153-letter planted controls. Exact searches passed their controls when both alphabets came from a 7,438 x 7,438 word bank or two fixed orders, but the arbitrary two-alphabet case remains power-limited."
family = "Polyalphabetic substitution"
