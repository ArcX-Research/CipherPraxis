summary = "Quagmire IV uses one mixed alphabet for plaintext and another for ciphertext, with a repeating shift between their index positions. It is the broadest periodic additive form; Vigenère and the other Quagmires are special cases. Two arbitrary alphabets are too hard to search from short text. If each alphabet comes from a known bank, an exact search can check every pair. If the period-class substitutions are already complete, quotient factorization gives an exact algebraic test."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
With plaintext alphabet $P$, ciphertext alphabet $C$ and shifts $k$,

$$\operatorname{pos}_C(c_i) \equiv \operatorname{pos}_P(p_i) + k_{i \bmod m} \pmod{26}.$$

Quagmire I is $C$ straight, Quagmire II is $P$ straight, Quagmire III is $P = C$, and Vigenère is both straight.
'''

[[blocks]]
kind = "equations"
title = "Gauge and equivalent descriptions"
body = '''
The written coordinates have independent rotation gauges. If the arrays are re-indexed by $P'[j]=P[j+r_P]$ and $C'[j]=C[j+r_C]$, the same cipher is obtained with $k'_b=k_b+r_P-r_C$. Simultaneously reversing both axes preserves the Vigenère form with sign-reversed shifts; reflecting only one axis changes the additive/reflection convention. A solver that includes those conventions must compare keys modulo the resulting gauge, not literally (see [Conjugacy and gauge](/algebra/conjugacy-and-gauge)). Seen from the ciphertext, coset $b$ applies $C\circ\rho_{k_b}\circ P^{-1}$. Equality-only or histogram diagnostics can make these maps look like independent substitutions, but complete maps obey a shared two-dial factorization and can be distinguished algebraically.
'''

[[blocks]]
kind = "variants"
body = '''
- **Vocabulary-by-vocabulary**: both alphabets keyed by words from a bank of 7,438 candidates, both relations, i.e. 55 million alphabet pairs per text.
- **Fixed-order pairs**: $(P, C)$ from the straight order and one keyword-mixed order in all four combinations, with free shifts. This gives a small index-alphabet grid for exact search.
- **Keyed plaintext side over a known ciphertext order** with a transposition underneath: a staged solver can combine the substitution search with an exhaustive columnar stage for widths 3 to 9.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Periodic shifts; both alphabets constant over the text.
- Invariant: the within-coset equality pattern is alphabet-free and shared with every other Quagmire.
- The relation and the two alphabets are jointly identifiable only up to the explicitly included rotation/reflection gauges above.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. **Alignment in a candidate ciphertext order.** Score the aligned index of coincidence of the seven cosets in the straight order, a keyword-mixed order and every keyword alphabet in six keying styles against the same maximum on shuffled ciphertext; refine the ciphertext alphabet greedily under the aligned-IC objective.
2. **Cryptogram stage.** With a ciphertext order fixed, the aligned index text is a simple substitution of the plaintext; anneal the plaintext alphabet and the shifts jointly under quadgrams, restarting from every combination of near-tie coset shifts.
3. **Bank stage.** Keyword plaintext alphabets times 26 offsets times two relations, scored by an order-free monogram likelihood and by quadgrams.
4. **Transposition stage.** Exhaustive columnar widths 3 to 9 (annealed 10 to 20) on the order-free hits.
5. **Complete-map stage.** If every period-class substitution has already been reconstructed as a full permutation, [two-dial translation factorization](/algebra/two-dial-translation-factorization) exactly tests whether all classes share two cyclic dial coordinates and preserves every compatible root. It filters supplied maps; it does not infer them from ciphertext.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// P is the plaintext alphabet and C the ciphertext alphabet, both mixed;
// pos_P and pos_C are their index maps.
function ENCRYPT(p[0..n-1], P, C, k[0..m-1]):
    for i in 0..n-1:
        c[i] = C[(pos_P(p[i]) + k[i mod m]) mod 26]
    return c

function DECRYPT(c[0..n-1], P, C, k[0..m-1]):
    for i in 0..n-1:
        p[i] = P[(pos_C(c[i]) - k[i mod m]) mod 26]
    return p

// C straight gives Quagmire I, P straight Quagmire II, P = C Quagmire III,
// both straight Vigenère.

// Two-stage attack through a candidate ciphertext order.
function ATTACK(c, m, candidate_orders):
    for each C in candidate_orders:
        // index text in the candidate order
        x = [pos_C(c[i]) for i in 0..n-1]
        s = the per-coset shifts maximising the aligned index of coincidence
                of the m cosets of x
        score[C] = ALIGNED_IC(x, s, m), compared with the same maximum on
                shuffled c
    C = the best candidate order
    x aligned by s is now a simple substitution of p
    anneal P and refit k jointly under quadgrams, restarting from every
            near-tie coset shift;
    or try every keyword alphabet P, 26 offsets and both relations
    // compared with planted keys modulo the independent coordinate gauges
    return P, C, k
```
'''

[[blocks]]
kind = "complexity"
body = '''
Vocabulary pairs: $7{,}438^2 \approx 5.5 \times 10^7$ pairs times two relations per text. The sweep ran as a subsampled batch with shuffled tops as the null. Blind two-alphabet annealing: the state has two permutations and $m$ shifts, about $26! \cdot 26! \cdot 26^m$ raw states. No recorded budget made a dent at 153 letters.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Blind search.** The Quagmire IV relaxation of the blind Quagmire III solver reached 0% success on four planted controls (best rates $-5.48$ to $-5.73$, 1-18% match). It finds alphabets with higher monogram evidence than the truth.
- **Selection over a huge bank.** 55 million pairs per text produce top scores that sit exactly at the subsampled shuffled maximum; without that null the best pair would look like a lead.
- **Misaligned coset.** The first solver version pinned one coset and left a control coset misaligned, blocking exact recovery. The repaired version moves every coset and polishes pairwise.
'''

[[blocks]]
kind = "controls"
body = '''
Vocabulary-by-vocabulary Quagmire IV (both relations) on a 95-letter zone, a 144-letter text and a 153-letter text gave best rates $-5.71$, $-6.25$ and $-6.22$, at the subsampled shuffled tops (log 28). A staged solver's planted control (keyed plaintext alphabet, keyword-mixed ciphertext order, with and without a columnar transposition underneath) reached 100% anneal match on the plain case and read English through the columnar stage on the transposed case. Blind two-alphabet annealing recovered 0/4 planted controls (log 8). A full-spelling wordlist search under four fixed-order alphabet pairs recovered all eight planted controls exactly before its measured evaluation (log 472).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
$P$ keyed by `ZEBRAS` (`ZEBRASCDFGHIJKLMNOPQTUVWXY`), $C$ keyed by `QUIET` (`QUIETABCDFGHJKLMNOPRSVWXYZ`), shifts $(3, 7, 12)$. Plaintext `QUAGMIRE`:

```trace
plain    Q   U   A   G   M   I   R   E
pos_P   19  21   4   9  15  11   3   1
+shift  22  28  16  12  22  23   6   8
mod 26  22   2  16  12  22  23   6   8
C[...]   W   I   N   J   W   X   B   D
```

Check position 6: R is letter 3 of $P$; $3 + 3 = 6$, and letter 6 of $C$ is `B`. Ciphertext `WINJWXBD`.
'''

[[blocks]]
kind = "notes"
body = '''
An exact bank search can exclude every structured $(P,C)$ pair it enumerates, but it says nothing about alphabet pairs outside that bank. Alphabet-free class structure can constrain a possible shift pattern without identifying either alphabet. Keep those two evidence scopes separate.
'''

