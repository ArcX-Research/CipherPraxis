subtitle = "Digraph rectangles between a fixed top row and a key-shifted bottom row"
status = "CLOSED"
status_note = "All four direct families (Portax; Slidefair with Vigenère, Variant and Beaufort rules) recovered their 504-letter controls exactly with periods 1-12 selected blind and byte-matched a source generator; every live endpoint on the 504-letter text scored -7.42 to -7.58 and the family is excluded there at periods 1-12."
family = "Polygraphic substitution"
