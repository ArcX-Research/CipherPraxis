id = "circulant-hill"
section = "ciphers"
title = "Circulant Hill cipher"
status = "VERIFIED"
status_note = "The parameter reduction and CRT invertibility criterion follow from the stated matrix model. Exhaustiveness requires uncapped enumeration and final invertibility checks; language ranking is separate."
family = "Polygraphic substitution"
tags = ["Hill cipher", "circulant matrix", "CRT", "known plaintext", "linear system"]
related = ["hill-cipher", "matrix-invertibility-mod-26", "hill-row-recovery"]
summary = "A Hill transformation generated by one row. Its structured key reduces crib equations from a full matrix to a short vector, while invertibility still has to hold over both prime factors of the alphabet modulus."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
For a block of dimension $d$, choose $d$ coefficients $h_0,\ldots,h_{d-1}$ and set $H_{r,k}=h_{(k-r)\bmod d}$. The affine version is $c=Hx+b\pmod{26}$ with a scalar shared offset or a separately declared vector offset. The reverse-circulant convention $h_{(k+r)\bmod d}$ must be treated as a different layout. Rows, columns, input blocking and output serialization must all be explicit.
'''

[[blocks]]
kind = "equations"
body = '''
A supplied plaintext block gives linear equations in $h$. A decryption-row search instead solves $x=Dc+e$ and must report that $D$ is the inverse key, with $H=D^{-1}$ and $b=-He$. The key is valid exactly when $\det H\ne0\pmod2$ and $\det H\ne0\pmod{13}$. Solving linear equations alone also admits singular matrices.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function RECOVER_CIRCULANT(cipher, crib, declared_layouts, limit):
    results = []
    for layout, direction, crib_offset in declared_layouts:
        rows = BUILD_STRUCTURED_LINEAR_EQUATIONS(cipher, crib, crib_offset, layout, direction)
        binary = AFFINE_SOLUTION_SPACE(rows, 2)
        odd = AFFINE_SOLUTION_SPACE(rows, 13)
        if either space is inconsistent: continue
        if COMPLETE_PRODUCT_SIZE(binary, odd) exceeds limit: return INCOMPLETE
        for a, b in COMPLETE_CARTESIAN_PRODUCT(binary, odd):
            coefficients = CRT(a, b)
            matrix, offset = EXPAND_CIRCULANT(coefficients, layout, direction)
            if rank(matrix mod 2) < dimension: continue
            if rank(matrix mod 13) < dimension: continue
            plain, encryption_key = DECODE_AND_RECOVER_FORWARD_KEY(cipher, matrix, offset, layout)
            require plain matches crib at crib_offset
            require ENCRYPT(plain, encryption_key, layout) equals cipher
            results.append(plain, encryption_key, layout, crib_offset)
    return COMPLETE, results
```
'''

[[blocks]]
kind = "complexity"
body = '''
A general matrix has $d^2$ coefficients; a circulant matrix has $d$. With nullities $u,v$ after field elimination, the join has $2^u13^v$ candidates before invertibility filtering. Fixed layouts do not justify excluding all other Hill keys.
'''

[[blocks]]
kind = "failure_modes"
body = '''
A bounded candidate pool, omitted crib placements, or an unsearched layout makes the whole search incomplete. Correct inverse-key equations do not imply that an assumed keyword describes the encryption matrix.
'''

[[blocks]]
kind = "example"
body = '''
Take $d=2$, $h=(1,2)$ and no offset. Then $H$ has rows $(1,2)$ and $(2,1)$, determinant $-3\equiv23\pmod{26}$, a unit. The block $(0,1)$ maps to $(2,1)$. The inverse has rows $(17,18)$ and $(18,17)$ and recovers $(0,1)$.
'''

