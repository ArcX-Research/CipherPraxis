related = ["affine-cipher", "playfair", "matrix-invertibility-mod-26", "finite-field-linear-algebra", "units-mod-26", "periodic-substitution-dp", "meet-in-the-middle", "family-wise-null", "hill-lab", "g-polygraphic"]
summary = "The Hill cipher treats each d-letter block as numbers and multiplies it by a reversible d x d matrix modulo 26. During decryption, each row of the inverse matrix produces every d-th plaintext letter. A solver can score those sampled streams one row at a time, then join rows only if the full matrix is reversible. Tests covered arbitrary matrices of sizes 2, 3, and 4, both alone and over a repeating additive layer."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
For a block $\mathbf{p}_j \in \mathbb{Z}_{26}^d$ and a matrix $E \in \mathrm{GL}(d, \mathbb{Z}_{26})$,

$$\mathbf{c}_j \equiv E\,\mathbf{p}_j \pmod{26}, \qquad \mathbf{p}_j \equiv D\,\mathbf{c}_j \pmod{26}, \quad D = E^{-1}.$$

$E$ is invertible exactly when $\det E$ is a unit modulo 26, i.e. odd and not divisible by 13 (see [Matrix invertibility mod 26](/algebra/matrix-invertibility-mod-26)).
'''

[[blocks]]
kind = "equations"
title = "Row separability and decimated periods"
body = '''
Row $r$ of $D$ gives the stream $y_{r,j} = r \cdot \mathbf{c}_j$, which is plaintext position $jd + (\text{row index})$. A row can belong to an invertible matrix only if it is non-zero modulo 2 and modulo 13; for $d = 3$ there are 15,372 such primitive rows, for $d = 2$ 504, for $d = 4$ 428,400. If the Hill layer sits over a period-$p$ additive layer, each row stream is periodic with the decimated period $q = p / \gcd(p, d)$, and the shifts can be marginalised rather than maximised:

$$Z_b(r) = \frac{1}{26}\sum_s \prod_x E[x - s]^{F_{b,x}(r)},$$

with $F_{b,x}(r)$ the count of letter $x$ in coset $b$ of the row stream. Rows are joined only when they share $q$, model and orientation and their determinant is a unit.
'''

[[blocks]]
kind = "variants"
body = '''
- **Direct Hill** of size 2, 3 or 4 on the whole text.
- **Hill over a periodic layer** (Hill-3 and Hill-2 lanes): the inner additive key is finished with the exact cyclic quadgram DP after the matrix is chosen.
- **Keyword matrices**: a $d^2$-letter word read into the matrix in one of four conventions; screened by dictionary and by the cascade's decision D4.
- **Padding**: an odd-length text cannot be split into digraphs without a convention. The program refused to truncate or pad silently.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Block boundaries are aligned with the start of the text. The matrix is constant.
- Invariant: permuting whole ciphertext blocks applies the same permutation to the values of every fixed within-block linear combination. It preserves each such stream's multiset, not its original order; this is the null used for the periodic variants.
- Invariant: a Hill layer destroys single-letter frequencies but not the periodicity of a layer beneath it, seen through the decimated period $q$.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Check every primitive row of $D$ and score its decimated stream. Use monogram likelihood for direct Hill, shift-marginalised periodic likelihood for Hill over a periodic layer, and lag-$d$ trigram likelihood when $d = 4$.
2. Join the top rows into unit-determinant matrices in every row order; rescore the full decrypt with quadgrams.
3. For periodic variants, finish the inner key with the exact cyclic DP and check the independent forward equations $\mathbf{h}_j = D\mathbf{c}_j$, $\mathbf{c}_j = E\mathbf{h}_j$.
4. Compare any English-looking endpoint against whole-block permutation nulls run through the same selector.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Blocks of d letters are column vectors over Z_26; E is a d x d matrix whose
// determinant is a unit mod 26.
function ENCRYPT(p[0..n-1], E, d):
    for each block j (P = p[jd .. jd+d-1] as a column vector):
        C = (E * P) mod 26
        write C into c[jd .. jd+d-1]
    return c

function MATRIX_INVERSE(E):
    // must be odd and not divisible by 13
    det = DET(E) mod 26
    return (INVERSE_MOD_26(det) * ADJUGATE(E)) mod 26

function DECRYPT(c[0..n-1], E, d):
    D = MATRIX_INVERSE(E)
    for each block j (C = c[jd .. jd+d-1] as a column vector):
        P = (D * C) mod 26
        write P into p[jd .. jd+d-1]
    return p

// Row-separable attack: row r of D yields every d-th plaintext letter and is
// scored on its own.
function ROW_ATTACK(c, d):
    for each primitive row r (non-zero mod 2 and mod 13):
        // one decimated plaintext stream
        y = [(r . C_j) mod 26 for each ciphertext block C_j]
        // monogram, or shift-marginalised over a periodic layer
        score[r] = STREAM_SCORE(y)
    join the top rows in every row order into matrices D with a unit
            determinant
    return the D whose full decrypt scores best on quadgrams
```
'''

[[blocks]]
kind = "complexity"
body = '''
Rows: 504, 15,372 and 428,400 for $d = 2, 3, 4$. Hill-2 periodic: top 192 rows, 400 unordered pairs per cell, 6,400 matrices screened by a width-4 DP, then width-8 DP on the global top 64. Hill-3: production matrix budget 24 (set by a control whose true row triple ranked 13th). Hill-4 direct: top 16 rows joined through every unit-determinant four-row subset and all 24 row orders, then the full 504-letter quadgram score.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Shortlist too narrow.** The first Hill-2 preflight kept eight pairs per cell and failed because the planted pairs ranked 256 and 319. The repaired selector ranks the hidden matrix first on both controls.
- **Periodic overfit.** The 126-letter period-26 Hill-2 endpoint scored $-4.87$, but the selected-family block-shuffled null panel contained $-4.74$, so it was ordinary overfit. The 144-letter Hill-3 statistic was ordering-dependent yet its reconstructions stayed near $-6.2$.
- **Odd lengths.** A 153-letter text is out of scope for unpadded Hill-2.
- **Word-keyed matrices** cover a tiny fraction of $\mathrm{GL}(d, \mathbb{Z}_{26})$. The arbitrary-row lanes exist for that reason.
'''

[[blocks]]
kind = "controls"
body = '''
Hill-3 free rows (log 149): controls matched to target lengths and decimated periods (direct Hill at 153 letters; Hill over period 9 at 153 and 144; Hill over period 33 at 504) all recovered their hidden text after the exact periodic finish; live bests $-5.72$, $-5.29$, $-6.52$, none English. Hill-2 over a periodic layer (log 206): 96 letters/period 7 and 126 letters/period 26 controls recovered 96/96 and 126/126 letters, the hidden matrices, keys, orders and independent forwards; live endpoints $-6.06$ (no) and $-4.87$ beaten by its null panel. Direct Hill-4 (log 171): two random $\mathrm{GL}(4, \mathbb{Z}_{26})$ controls recovered the four hidden inverse rows at ranks 1-4, the exact matrix and 100% plaintext; live best $-7.28$ inside nine permutation-null maxima (mean $-7.29$, $p = 0.40$). Cascade decision D4 recovered the keyword-matrix Hill layer of a solved corpus text (logs/145_infer.log).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
$d = 2$, $E = \begin{pmatrix} 3 & 3 \\ 2 & 5 \end{pmatrix}$, $\det E = 15 - 6 = 9$, a unit ($9 \times 3 = 27 \equiv 1$). Plaintext `HELP`:

```
HE = (7, 4):   3*7 + 3*4 = 33 = 7 (H);  2*7 + 5*4 = 34 = 8 (I)
LP = (11, 15): 3*11 + 3*15 = 78 = 0 (A); 2*11 + 5*15 = 97 = 19 (T)
```

Ciphertext `HIAT`. The inverse is $D = 3 \begin{pmatrix} 5 & -3 \\ -2 & 3 \end{pmatrix} = \begin{pmatrix} 15 & 17 \\ 20 & 9 \end{pmatrix}$; row $(15, 17)$ applied to `HI` $= (7, 8)$ gives $105 + 136 = 241 \equiv 7 = H$. The [Hill lab](/labs/hill-lab) enumerates invertible matrices.
'''

[[blocks]]
kind = "notes"
body = '''
The algebraic row decomposition is exact: each inverse row can be scored through its own decimated stream, and a layer beneath it has period $p/\gcd(p,d)$. The implemented attack is nevertheless heuristic when it retains only top-scoring rows or matrix joins; exactness of the final periodic DP is conditional on the planted rows and key values surviving those handoffs.
'''

