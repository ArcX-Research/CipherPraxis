title = "Hill cipher"
subtitle = "Multiply letter blocks by a reversible matrix modulo 26"
status = "VERIFIED"
status_note = "Arbitrary-matrix attacks passed controls at every tested size. Hill-2 over a periodic layer solved 96- and 126-letter controls exactly. Hill-3 controls passed at 153, 144, and 504 letters while checking 15,372 valid rows. Two random direct Hill-4 controls also passed. A dictionary-matrix screen recovered an earlier solved text."
family = "Polygraphic substitution"
