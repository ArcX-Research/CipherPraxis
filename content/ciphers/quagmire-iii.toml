title = "Quagmire III"
subtitle = "Repeat shifts within one mixed alphabet used for both plaintext and ciphertext"
status = "POWER-LIMITED"
status_note = "With an unknown alphabet at 153 letters, annealing recovered 0/24 blind controls and 0/21 controls with cribs up to 25 letters. Parallel tempering with 2,000 to 8,000 chains stopped at 30–40% of the alphabet. When a keyword or phrase structures the alphabet, the bank search recovers controls at 100%."
