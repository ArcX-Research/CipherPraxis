id = "dictionary-attack"
section = "search"
title = "Dictionary and structured-bank attacks"
subtitle = "Check every key in a stated list of words, phrases, alphabets, routes, or other objects"
status = "VERIFIED"
status_note = "Bank searches cover 202,504 phrase-keyed alphabets, 2.06 million structured alphabets, 425,000 two-word alphabets, 10- to 20-letter transposition words, word pairs, 190,000 Myszkowski words, 32,000 nine-letter Hill keys, and other fixed lists. Before target rows, each search prints a planted control at rank 1. Every recorded target search stayed at its bank's noise floor."
family = "Enumeration strategies"
tags = ["dictionary", "keyword alphabet", "phrase key", "word bank", "finite bank", "scoped closure"]
related = ["exhaustive-enumeration", "corpus-bank-screen", "k-best-lists", "keyword-mixed-alphabet", "phrase-keyed-alphabet-attack", "columnar-transposition", "myszkowski", "hill-cipher", "quagmire-iii", "multiple-rounds-analysis", "family-wise-null", "quadgram-log-likelihood", "planted-controls"]
summary = "A dictionary attack checks a fixed finite bank of candidate keys or structured objects. Membership of the true key is necessary but not sufficient for top-rank recovery: short data, score mismatch, ties, or additional fitted parameters can still misrank it. Planted controls estimate recall for the declared bank and pipeline. A completed miss excludes only candidates actually enumerated under the stated conventions, while the selected maximum requires a family-wise null comparison."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
```
bank <- explicit list of keys (words, phrases, alphabets, orders), hashed and counted
control: plant a key from the bank on real text of the target length; the sweep must rank it first
for each key in bank:
    for each cipher configuration (alphabet order, relation, phase, direction):
        p <- decrypt(c, key, configuration); score <- rate(p)
report the top scores, the planted control's rank, and the null level of the bank
```

Keyword-mixed alphabets from a word $w$ (letters deduplicated) in the corpus's six styles: `std` ($w$ followed by the unused letters in straight order), `kry` (unused letters in a second fixed order), `rev` (unused letters reversed), `cont` (unused letters continuing from the last letter of $w$ and wrapping), `col` and `kcol` (the keyed alphabet written in rows of width $|w|$ and read by columns, over either base order).
'''

[[blocks]]
kind = "equations"
body = '''
Bank size is a product of independent choices: for four 7-letter words as round keys with $r$ rounds, each round choosing one of 8 alphabets (two fixed orders and six styles) and one of 2 relations, the count is $P(4, r) \cdot 16^r$: $64$, $3{,}072$, $98{,}304$ and $1{,}572{,}864$ for $r = 1, 2, 3, 4$.

Noise floor: selecting the maximum of $B$ wrong-key scores shifts the null distribution upward. The scores are usually dependent, so an independence approximation is not a reliable correction; rerun the whole bank selection on matched null data. In one recorded relation test, a per-trial standardization gave $+5.7\sigma$ while the empirically selected family maximum gave $+0.8\sigma$.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The bank is fixed and enumerated before the target is scored; its hash and size are printed. Adding entries after seeing near-misses is selection.
- A planted control from the bank at the evaluation length must meet the preregistered recovery gate. Failure demonstrates inadequate power for that control distribution; success estimates, but does not guarantee, future recall.
- The verdict threshold is the bank's own null (shuffled text through the same sweep, or the distribution of wrong-key scores), not an absolute number.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Phrase-keyed alphabets.** Every 4-60-letter substring of a set of source texts, six keying styles: 202,504 distinct alphabets under a period-7 keyed substitution of types I, II and III; control 100%; targets $-6.54$ and $-6.35$, the noise level.
- **Structured alphabet library.** 2.06 million alphabets (words, phrases, styles, both bases) with per-coset shifts by monogram maximum likelihood, quadgram ranking and refinement of the top 40; control rank 1 / 100%; best target $-5.77$ against a shuffled maximum of $-5.9$.
- **Two-keyword alphabets.** 425,000 alphabets of the form first word followed by the keyed remainder of a second word (both bases, reversed variant): targets at the 63- and 96-letter nulls.
- **Transposition keys.** Every dictionary word of 10-20 letters as a columnar key, word pairs (a themed list paired with all 9-letter words), triple and quadruple columnars from a small vocabulary, 190,000 Myszkowski words, rail fences with 2-40 rails at every offset; planted word-pair, triple-columnar and rail-fence controls at 100%.
- **Matrix keys.** 32,000 nine-letter keywords as 3x3 Hill matrices in four conventions on the flat segments: all at shuffle maxima.
- **Word-list rows and object vocabularies.** 7-letter word banks of 704, about 52,000 and about 25,000 entries as rows under seven fixed substitutions; frozen vocabularies of numbers, ordinals, compass points, note names, element names and symbols, calendar names and Greek letters tiled exactly (see [constraint satisfaction](/exact/constraint-satisfaction-forward-checking)).
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Bank: an explicit, finite list of keys (words, phrases, alphabets, orders)
// fixed before scoring.
function DICTIONARY_SWEEP(c, bank, configurations, rate):
    print hash(bank) and |bank|
    c_ctrl = encrypt(real text of length |c|, a key drawn from bank, some
            configuration)
    if rank of the planted key in SCORE_ALL(c_ctrl, bank, configurations,
            rate) != 1:
        stop
    null = selected scores from the same sweep on matched null inputs
    results = SCORE_ALL(c, bank, configurations, rate)
    return the top entries of results, the control's rank, and null

function SCORE_ALL(c, bank, configurations, rate):
    results = []
    for each key in bank:
        for each configuration (alphabet order, relation, phase, direction)
                in configurations:
            p = decrypt(c, key, configuration)
            results = results + [(rate(p), key, configuration)]
    return results sorted by score descending

```
'''

[[blocks]]
kind = "complexity"
body = '''
Cost is bank size times configurations times one decrypt-and-score. A compiled or vectorised scorer handles millions per minute: the four-round bank of 1,572,864 combinations scored in 33 s on one machine, 202,504 phrase alphabets in about ten minutes on 12 workers, 2.06 million alphabets with refinement in the order of an hour.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Coverage.** Under a uniform prior on a bank of 100 entries, the candidate index has about 6.6 bits of entropy; this does not measure the prior mass that the bank captures in practice. An arbitrary alphabet belongs to a vastly larger space. A miss excludes the enumerated bank, not all structured or unstructured alphabets.
- **Multiple comparisons.** The best of many trials always looks significant against a per-trial null (the $+5.7\sigma$ versus $+0.8\sigma$ case above); banks need family-wise nulls.
- **Noise floor.** Score ranges are table-, length-, and preprocessing-specific. A relatively fluent-looking maximum from a large bank may be selection noise rather than a partial solve; only the matched maximum distribution calibrates it.
- **Free parameters inside the sweep.** Refitting shifts per bank element lifts the null on short texts. The control's rank, not its absolute score, is the calibration.
'''

[[blocks]]
kind = "controls"
body = '''
Phrase alphabets: control 100%. Structured library: control rank 1 / 100%. Four-round bank: the planted three-round construction is found exactly among 98,304 combinations at $-4.34$ (the two- and one-round scans of the same text stay at $-7.5$ and $-7.64$). Transposition banks: planted word-pair, triple-columnar and rail-fence constructions read at $-4.34$, 100%. Word-list CSP: control found in 244 nodes.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Ciphertext `LXFOPVEFRNHR` (the Vigenère exemplar: plaintext `ATTACKATDAWN`, key `LEMON`). Bank $\{$`APPLE`, `LEMON`, `MANGO`, `PEACH`$\}$ as Vigenère keys. Decrypting with `APPLE` position by position ($c-k\bmod26$) gives `LIQDLVPQGJHC`; decrypting with `LEMON` returns `ATTACKATDAWN`, and re-encryption reproduces the ciphertext. A scorer used as the selector must rank this planted member according to the declared gate. The example checks mechanics only; score separation on a larger bank is an empirical property to calibrate.
'''

