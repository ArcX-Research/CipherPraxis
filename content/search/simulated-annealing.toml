id = "simulated-annealing"
section = "search"
title = "Simulated annealing"
subtitle = "Explore nearby keys while slowly becoming less willing to accept worse moves"
status = "VERIFIED"
status_note = "Both single-search and batched NumPy versions are implemented. Planted 5x5-square, one-sided keyed-alphabet, and transposition-order controls recovered at 100%, with saved records. On a two-sided unknown alphabet in Quagmire III at 63–96 letters, the same search stops at 30–40% correct. A separate adjacent-reflection control also missed both planted texts even though each hidden truth outscored every reached proposal. Parallel-tempering and search-basin pages measure that limit."
family = "Stochastic local search"
tags = ["metropolis", "cooling schedule", "swap moves", "batch chains", "quadgram objective"]
related = ["parallel-tempering", "hill-climbing", "polish-basin-measurement", "coordinate-descent", "quadgram-log-likelihood", "bifid", "playfair", "quagmire-i", "quagmire-iii", "columnar-transposition", "planted-controls", "shuffled-null-z-score", "numpy-instrument-pattern", "g-move-set", "g-temperature-schedule", "g-objective-function"]
summary = "Simulated annealing explores a key by making random small changes. It always keeps improvements and sometimes accepts worse moves, with that chance falling as the temperature cools. A language model scores each trial decryption. The method works well for keyed squares over fixed inner text, alphabets whose shifts a crib fixes, and many transposition orders. It fails on short texts when one unknown alphabet acts on both sides; the score landscape, not just the computing budget, blocks progress."
updated = "2026-09-06"

[[blocks]]
kind = "definition"
body = '''
Let $S$ be a finite state space (for example the $26!$ orderings of an alphabet) with an objective $E(s)$ to be **maximised** and a move operator $m(s)$ that returns a random neighbour. With a schedule $T_0 > T_1$ over $N$ steps:

```
s <- random state; best <- s
for t in 0 .. N-1:
    T    <- T0 * (T1/T0)^(t/N)          # geometric cooling
    s'   <- m(s)
    d    <- E(s') - E(s)
    if d > 0 or U(0,1) < exp(d / T):    # Metropolis acceptance
        s <- s'
        if E(s) > E(best): best <- s
return best
```

The **batch form** keeps $N_c$ chains as rows of an array. Each step proposes one move per row, scores all rows in one vectorised decrypt, and accepts per row. Every (crib, offset, relation, restart) combination becomes one chain, so the whole placement sweep is one array computation.
'''

[[blocks]]
kind = "equations"
body = '''
Acceptance probability of a move with score change $\Delta = E(s') - E(s)$ at temperature $T$:

$$\Pr[\text{accept}] = \min\!\left(1,\; e^{\Delta / T}\right).$$

Geometric schedule: $T_t = T_0 (T_1/T_0)^{t/N}$, so $\log T$ falls linearly in $t$.

Objective used throughout the corpus: the quadgram log-likelihood rate of the decrypt $p_0 \dots p_{n-1}$,

$$\operatorname{rate}(p) = \frac{1}{n-3}\sum_{i=0}^{n-4} \log_{10} q_4(p_i p_{i+1} p_{i+2} p_{i+3}),$$

with $q_4$ an add-$0.01$ smoothed quadgram table from a generic corpus. English scores near $-4.3$ per letter, a random-key decrypt near $-6.5$. A verdict threshold sits $0.7$ below the English reference.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The objective separates the truth from wrong keys by a margin larger than the noise of the move set, and improving moves form a connected path to the optimum (a "funnel"). Where a single swap corrupts many positions at once (an alphabet that acts on both sides of a substitution) this fails.
- Every accepted state is a legal key: the move set preserves the permutation property by construction (swap, insertion, row/column swap of a square).
- Free parameters that are refit at every step (per-coset shifts derived from crib votes, or re-estimated by monogram maximisation) add selection freedom; shuffled-text nulls through the identical annealer calibrate what score a wrong state can reach.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Squares over a fixed inner text.** A 5x5 square (Bifid, Playfair) is annealed with the outer periodic layer held fixed: moves are letter swaps (85%), row swaps (5%), column swaps (5%) and a transpose or flip (5%); schedule $T_0 = 12 \to T_1 = 0.08$ over $10^6$ steps, six restarts, best-of-restarts reported.
- **One-sided unknown alphabet with a crib.** A contiguous crib of at least the period pins every shift, so only the alphabet is annealed (swap or insertion moves). The best chain per placement is finished by an exhaustive 925-neighbour polish and the top placements are re-annealed with more restarts.
- **Transposition orders under a class solver.** Column orders of widths 10-20 are annealed with a mixed move set (swap 35%, insertion 30%, segment reversal 15%, rotation 10%, relabelling 10%), six restarts of 1,500 steps, then 40 rounds of iterated local search (a three-move kick, a 300-step anneal, a full-neighbourhood finish). The energy is the class solver's quadgram score after refitting all shifts.
- **Nulls.** The identical pipeline is run on shuffled ciphertexts; wrong-placement medians of $-6.0$ to $-6.2$ and maxima of $-5.5$ to $-5.9$ are the reference against which a target row is read.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// State space S, objective E(s) to be maximised, move operator m(s) giving a
// random neighbour. Schedule T_0 > T_1 over N steps: geometric cooling, so
// log T falls linearly in t.
function ANNEAL(E, m, T_0, T_1, N):
    s = random state in S; best = s
    for t in 0..N-1:
        T = T_0 * (T_1 / T_0)^(t / N)
        s' = m(s)
        d = E(s') - E(s)
        // Metropolis acceptance, min(1, e^(d/T))
        if d > 0 or U(0,1) < exp(d / T):
            s = s'
            if E(s) > E(best): best = s
    return best

// Batch form: N_c chains as rows of one array; one proposal per row, one
// vectorised decrypt-and-score of all rows, per-row acceptance under the same
// rule and schedule.
function ANNEAL_BATCH(E, m, T_0, T_1, N, N_c):
    S = N_c random states (one row per chain); best = S
    for t in 0..N-1:
        T = T_0 * (T_1 / T_0)^(t / N)
        S' = m applied to every row
        // one array call scores every chain
        d = E(S') - E(S)
        accept = (d > 0) or (U(0,1) per row < exp(d / T))
        S[accept] = S'[accept]
        best = row-wise better of best and S
    return best                                   // one state per chain
```
'''

[[blocks]]
kind = "complexity"
body = '''
One step costs one decrypt and one score, $O(n)$ in the text length. Recorded budgets: $6$ restarts $\times$ $10^6$ steps per square problem on 12 workers; crib sweeps of 6,701 placements per text and family with a refine of the top 40 placements at 64 restarts $\times$ 80,000 steps (6.1 hours on 12 cores for four families and two texts); transposition anneals of $6 \times 1{,}500 + 40 \times 300$ steps per width. The batch routine evaluates thousands of chains per vectorised step, which is what made the 2000-chain tempering runs affordable.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Rugged landscape (two-sided alphabet).** When the same alphabet indexes both plaintext and ciphertext sides, a swap is simultaneously a cryptogram move and a re-slotting of two ciphertext letters, corrupting about four of 26 mapping entries in every coset. On a planted 96-letter instance the polished best reaches only 29-40% of the alphabet, and best-of-$N$ does not improve with $N$: 500 chains $\to -5.045$, 2,000 $\to -4.829$, 8,000 $\to -4.916$ (same instance, two further seeds $-4.971$ and $-4.876$). The polish basin is at most three swaps wide, so the annealer's best states (about ten swaps away) never fall into it.
- **Identifiable but unreachable.** On a chained construction the true state scored $-10.01$ per letter against $-12.71$ one swap away and $-16.57$ for random states, yet swap annealing plateaued at a total of $-2101$ against the truth's $-1477$ over 12 restarts of 40,000 iterations. Separation of the optimum does not imply a reachable optimum.
- **The score works, but the proposal path does not.** In a 63-letter adjacent-reflection control, one hidden 26-letter permutation acted on the source, ciphertext, and derived plaintext at once. The planted truth would have ranked first by the frozen quadgram score in both a development and an untouched confirmation case, but neither ordinary swaps nor moves grouped by modulo-13 coordinate pairs proposed it. Even after the correct direction, window, and sign were supplied, 512 restarts of 100,000 moves missed in all four arm/control combinations. This is a proposal-access failure, not evidence against the cipher model or the language score.
- **Partial solves.** A 144-letter Playfair square annealed to a $-5.20$ "partial" state with 60% of the plaintext right while the 153-letter Bifid and the 297-letter joint problem solved at 100%.
- **Selection freedom.** Refitting free shifts on every move buys score on short texts; without shuffled nulls a wrong-placement score of $-5.5$ looks like signal.
'''

[[blocks]]
kind = "controls"
body = '''
- Squares, no outer layer: planted 153-letter Bifid (period 7) solved at rate $-4.34$, 100% match; planted 297-letter joint Bifid+Playfair sharing one random square solved at $-4.43$, 100%/100%; planted 144-letter Playfair only 60% ($-5.20$).
- Crib-pinned one-sided alphabets: Quagmire I with a known ciphertext alphabet solved 3/3 seeds at every crib length $\ge 7$ (9-16 of 16 restarts converge); Quagmire II solved 12/21 seed-by-length cases (0-7 of 16 restarts); Quagmire III 0/21 even with a 25-letter crib, 200,000 steps and 32 restarts.
- Transposition orders: planted width-8 and width-12 sandwiches read at $-4.34$ with 100% match; word-pair, triple-columnar and rail-fence planted constructions likewise at $-4.34$, 100%.
- Direct hidden-permutation generator: two target-absent length-63 plants, two move sets, all 324 direction/window/sign cells, and matched histogram-preserving null searches. Exact recovery was 0/2; correct-cell oracle recovery was 0/4. The planted score was counterfactually rank one in every linked arm, cleanly separating score quality from proposal access.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Schedule $T_0 = 12$, $T_1 = 0.08$, $N = 10^6$. At the midpoint $t = N/2$:

$$T = 12 \cdot (0.08/12)^{1/2} = \sqrt{12 \cdot 0.08} = \sqrt{0.96} \approx 0.98.$$

A move that lowers the score by $\Delta = -1.0$ is accepted with probability $e^{-1/0.98} \approx 0.36$ at that point, with $e^{-1/12} \approx 0.92$ at the start, and with $e^{-1/0.08} \approx 3.7 \times 10^{-6}$ at the end. A swap move on the alphabet state `ZYXWVUTSRQPONMLKJIHGFEDCBA` at positions 0 and 25 yields `AYXWVUTSRQPONMLKJIHGFEDCBZ`. An insertion of position 0 after position 2 yields `YXZWVUTSRQPONMLKJIHGFEDCBA`. Both are permutations, so the state stays legal.
'''

[[blocks]]
kind = "notes"
body = '''
The scalar routine is generic (state, energy, move, iterations, schedule). Every solver passes its own move set. Batch annealing is followed by a deterministic polish and, on targets, by shuffled-text nulls: the polished score of the best null chain is the noise floor. The two-sided-alphabet limit motivated the exact methods in the constraint-programming section.
'''

