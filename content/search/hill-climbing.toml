id = "hill-climbing"
section = "search"
title = "Hill climbing and iterated local search"
subtitle = "Keep making small key changes that improve the score"
status = "VERIFIED"
status_note = "The implementations exhaust their declared local neighborhoods and pass the cited finite controls for several layered, permutation, and crib pipelines. On the recorded two-sided-alphabet perturbation panel, recovery fell sharply beyond nearby starts; this measures that fixture and search contract, not a universal radius."
family = "Deterministic heuristics"
tags = ["local search", "neighbourhood", "first improvement", "steepest ascent", "iterated local search", "polish"]
related = ["simulated-annealing", "coordinate-descent", "polish-basin-measurement", "parallel-tempering", "columnar-transposition", "sandwich-construction", "quadgram-log-likelihood", "index-of-coincidence", "planted-controls", "g-move-set", "g-search-basin"]
summary = "Hill climbing replaces the current key with a higher-scoring neighbor and stops at a local optimum for the declared move set. The recorded alphabet finisher checks a fixed set of swaps and insertions; column-order variants use their own declared moves. Iterated local search perturbs a local optimum and climbs again, which samples additional basins without becoming exhaustive. Recovery distance is empirical and depends on the objective, start distribution, tie rule, and fixture."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Given a state $s$, an objective $E$ and a neighbourhood $N(s)$:

```
first-improvement:   repeat: for s' in N(s): if E(s') > E(s): s <- s'; break   until no improvement
steepest ascent:     repeat: s' <- argmax_{N(s)} E; if E(s') > E(s): s <- s' else stop
iterated local search (ILS):
    best <- local_search(random start)
    for r in 1 .. rounds:
        s <- best perturbed by k random moves      # the "kick", k = 3 in the corpus
        s <- short anneal, then steepest-ascent finish
        if E(s) > E(best): best <- s
```

For an alphabet permutation the corpus neighbourhood is the 325 transpositions plus the 600 insertions of one letter into a non-adjacent slot, 925 neighbours in all, generated as source-index maps so that all 925 candidates are decrypted and scored in one vectorised call.
'''

[[blocks]]
kind = "equations"
body = '''
Neighbourhood sizes. Alphabet of 26 letters: $\binom{26}{2} = 325$ swaps and $26 \cdot 25 - 2 \cdot 25 = 600$ insertions (all ordered pairs $(i, j)$ with $|i - j| > 1$), total $925$. Column order of width $w$: $w(w-1)/2$ swaps, $w(w-1)$ insertions and $w-1$ cyclic relabellings $o \mapsto (o + d) \bmod w$; for $w = 8$ that is $28 + 56 + 7 = 91$ neighbours.

Alphabet polish alternates two exact sub-steps until neither improves: for each text and coset, the shift $k_b \leftarrow \arg\max_{s \in \mathbb{Z}_{26}} E(A, k \text{ with } k_b = s)$ (26 candidates), then $A \leftarrow \arg\max_{A' \in N(A)} E(A', k)$ over the 925 neighbours.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- For a fixed deterministic implementation, the truth's basin is defined as the starts that converge to it. Starts outside that basin can converge to another local optimum whose score may be lower, equal, or even higher under a misspecified language model.
- The finish is deterministic given its start, so a polished score is reproducible from the (seed, chain) that produced the start.
- Shift refits inside the polish are exact per coordinate. They add no randomness but do add selection freedom on short texts.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Finisher for annealed alphabets.** The best chain of every crib placement is polished by first-improvement over the 925 neighbours (up to 80 iterations). The best tempering chains by the alternating shift/alphabet climb (up to 60 iterations).
- **Column orders.** After each anneal restart, a steepest-ascent finish over all swaps, insertions and relabellings of every order in the state, with the energy recomputed by the class solver (all outer and inner shifts refit per candidate). Iterated local search then runs 40 rounds of kick-anneal-finish from the incumbent.
- **Evidence climb.** A stage-one climb over the alphabet maximising shift-marginalised monogram evidence was tried as a start for the two-sided problem. It converges to alphabets with higher evidence than the truth and was abandoned.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Objective E is maximised over the declared neighbourhood N(s).
function FIRST_IMPROVEMENT(s, E):
    repeat:
        improved = false
        for s' in N(s) in a fixed index order:
            if E(s') > E(s): s = s'; improved = true; break
    until not improved
    return s

function STEEPEST_ASCENT(s, E):
    repeat:
        s' = argmax over N(s) of E
        if E(s') <= E(s): return s
        s = s'

function ITERATED_LOCAL_SEARCH(E, rounds, k):
    best = local_search(random start)
    for r in 1..rounds:
        s = best perturbed by k random moves
        s = short anneal from s, then STEEPEST_ASCENT(s, E)
        if E(s) > E(best): best = s
    return best

function POLISH(A, k, E):
    repeat:
        for each text and coset b:
            k_b = argmax over s in Z_26 of E(A, k with k_b = s)
        A = argmax over A' in N(A) of E(A', k)
    until neither step improved E
    return (A, k)
```
'''

[[blocks]]
kind = "complexity"
body = '''
For the recorded period-7 lane, one polish iteration costs one batch of 925 decrypt-and-scores plus $7 \times 26$ shift candidates per text, all vectorised. A full-neighbourhood finish over two column orders of width $w$ costs about $2(1.5\,w^2 + w)$ objective evaluations per round, each with its declared shift refit. The corpus caps the alphabet polish at 60-80 iterations.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Narrow basin.** On the recorded planted two-sided alphabet, starts two swaps from the truth converged to states near $-6.1$ rather than returning; from random alphabets 0 of 24 restarts across four schedules reached the truth's basin. On the cited fixture and perturbation panel, a 13-letter crib recovered starts through three swaps and a 25-letter crib through six; these are measured boundaries, not universal basin radii.
- **Degenerate objectives.** A climb that maximises the decrypt's coincidence rate over ring and shifts collapses letters: on a planted control it found 594-601 coincidences against the truth's 383. The objective, not the climber, was wrong.
- **Overfit climbs.** The monogram-evidence climb over alphabets prefers alphabets with higher evidence than the planted one at 153 letters.
- **Path dependence and plateaus.** First-improvement and steepest ascent can follow different paths and reach different local optima. Neither samples alternatives once stationary; iterated local search explores only the basins reached by its frozen kick distribution and budget.
'''

[[blocks]]
kind = "controls"
body = '''
Planted sandwiches (period-7 keyed layer over a columnar transposition over a short-period inner) of width 8 and 12 read at $-4.34$ with 100% match after anneal plus full-neighbourhood finish; planted word-pair, triple-columnar and rail-fence constructions likewise $-4.34$, 100%. Crib-pinned one-sided alphabets polish to 100% match in 3/3 seeds. The two-sided calibration above (0/24) is the recorded negative.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
State: an order of four symbols, objective $f$ = number of adjacent pairs in alphabetical order, neighbourhood = swaps of two positions, first improvement in index order.

- `BADC`: pairs (B,A) no, (A,D) yes, (D,C) no, so $f = 1$. First improving swap is positions 0,1: `ABDC`, $f = 2$ (A,B yes; B,D yes; D,C no). Accept.
- From `ABDC`, swap 2,3: `ABCD`, $f = 3$. Accept. No swap improves further: local and global optimum.

The same climber from `DCBA` ($f = 0$), scanning swaps in index order (0,1), (0,2), (0,3), (1,2), (1,3), (2,3) and restarting the scan after each acceptance, accepts swap 0,1 (`CDBA`, $f = 1$), then swap 0,3 (`ADBC`, $f = 2$: A,D yes; D,B no; B,C yes), and then finds no strictly improving swap: `DABC`, `BDAC`, `ABDC` and `ACBD` all score 2, `CDBA` and `ADCB` score less. It stops at `ADBC`, a local optimum two swaps from `ABCD`. That is the basin phenomenon in miniature.
'''

