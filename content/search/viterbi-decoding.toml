title = "Viterbi decoding of a periodic key"
subtitle = "Find the exact best repeating key while tracking its last three letters"
status = "VERIFIED"
status_note = "Two solvers implement the cyclic order-three quadgram dynamic program for any period. Blind controls passed at the target information sizes: 63 and 95 letters at period 7, and 126 letters at period 26. Each recovered 100% plaintext, the exact key, and the forward ciphertext. At width two, 8/8 known-answer checks match complete enumeration."
family = "Dynamic programming"
tags = ["viterbi", "dynamic programming", "periodic key", "quadgram", "exact within shortlist"]
related = ["periodic-substitution-dp", "exact-dynamic-programming", "k-best-lists", "coordinate-descent", "vigenere", "beaufort", "porta", "affine-cipher", "quadgram-log-likelihood", "within-coset-null", "planted-controls", "g-objective-function"]
summary = "For a key of period p, the plaintext quadgram ending at position i depends on four neighboring key positions. A Viterbi dynamic program can therefore track states made from the last three key letters and keep the exact best path. An open chain is direct. To close the repeating cycle exactly, try every starting three-letter state. Unlike separate coset scores, this uses letter order and can work with only four or five letters per coset, such as period 26 on 126 letters."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Let the key be $k_0 \dots k_{p-1}$ over a candidate set $\mathcal{K}_b$ per residue (all 26 shifts, or a shortlist of the $W$ best by monogram likelihood). For a start residue $r$ collect every quadgram of the decrypt that begins at a position $i \equiv r \pmod p$:

$$\Phi_r(k_r, k_{r+1}, k_{r+2}, k_{r+3}) = \sum_{i \equiv r} \log_{10} Q_4\big(P_i P_{i+1} P_{i+2} P_{i+3}\big), \qquad P_i = A\big[(a(C_i) - k_{i \bmod p}) \bmod 26\big].$$

The objective $\sum_r \Phi_r$ is an order-three cyclic chain. With states $(k_{t-2}, k_{t-1}, k_t)$:

```
for each choice of the first three key letters (k_0, k_1, k_2):
    V_2(k_0,k_1,k_2) <- 0
    for t in 3 .. p-1:
        V_t(b,c,d) <- max_a [ V_{t-1}(a,b,c) + Phi_{t-3}(a,b,c,d) ]      # keep argmax a as back-pointer
    close the cycle with Phi_{p-3}, Phi_{p-2}, Phi_{p-1}, whose last arguments are the fixed (k_0,k_1,k_2)
    trace back the best (k_{p-3}, k_{p-2}, k_{p-1})
return the best over all starting triples
```

An open-chain variant ignores the three wrap-around terms and repairs them with a coordinate polish. The Beaufort relation replaces $a(C_i) - k$ by $k - a(C_i)$.
'''

[[blocks]]
kind = "equations"
body = '''
Recurrence (maximisation):

$$V_t(b, c, d) = \max_{a \in \mathcal{K}_{t-3}} \Big[ V_{t-1}(a, b, c) + \Phi_{t-3}(a, b, c, d) \Big].$$

Emission tables are built once per residue: $\Phi_r$ is a $|\mathcal{K}|^4$ array accumulated over the $\lceil n/p \rceil$ quadgrams starting at residue $r$. The state count is $|\mathcal{K}|^3$ and each transition step costs $|\mathcal{K}|^4$; with the cyclic enumeration of $|\mathcal{K}|^3$ starting triples the total is $O(p \cdot |\mathcal{K}|^7)$ in the worst case, which is why the shortlist ($W = 8$) matters: $8^7 = 2{,}097{,}152$ table operations per (alphabet order, relation).
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The plaintext is in order (a "quad" mode). If a transposition sits under the periodic layer the emission collapses to per-position monogram terms (a "mono" mode) and the chain structure carries no information.
- The alphabet order is known (straight or one fixed keyword-mixed order) and the relation is additive (Vigenère or Beaufort) or belongs to a small per-residue family (13 Porta rows; 312 affine maps) that can be shortlisted.
- Exactness holds inside the shortlisted product. A coordinate and adjacent-pair pass afterwards lets an omitted shift enter.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
Run the DP for every period in a range, both alphabet orders and both relations, and compare each finish with the same solve on a shuffled ciphertext (or on within-coset shuffles, which preserve every coset histogram and destroy only adjacency). A real key gives a decrypt that reads as English and a large excess over the null. A wrong period gives an excess near zero. The same finisher is used inside larger selectors: after an exact stage-one enumeration of alphabets, each retained alphabet's seven shifts are initialised by the width-8 cyclic DP and four polish rounds.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertext C[0..n-1], period p, alphabet order A with position function
// a(.), candidate shifts K_b per residue b. Decrypt P_i = A[(a(C_i) - k_{i
// mod p}) mod 26] (Beaufort: k - a(C_i)).
function BUILD_EMISSIONS(C, p):
    // residue indices are taken mod p
    for r in 0..p-1:
        Phi_r = zero table over K_r x K_{r+1} x K_{r+2} x K_{r+3}
        for each (k_r, k_{r+1}, k_{r+2}, k_{r+3}) and each i ≡ r (mod p) with
                i + 3 < n:
            Phi_r(k_r, k_{r+1}, k_{r+2}, k_{r+3}) += log10 Q_4(P_i P_{i+1}
                    P_{i+2} P_{i+3})
    return Phi

// exact maximum of sum over r of Phi_r
function CYCLIC_VITERBI(Phi, p):
    best = -infinity
    for each starting triple (k_0, k_1, k_2) in K_0 x K_1 x K_2:
        V_2 = -infinity everywhere except V_2(k_0, k_1, k_2) = 0
        for t in 3..p-1:
            for each state (b, c, d) in K_{t-2} x K_{t-1} x K_t:
                V_t(b, c, d) = max over a in K_{t-3} of [ V_{t-1}(a, b, c) +
                        Phi_{t-3}(a, b, c, d) ]
                // ties broken by a fixed rule
                back_t(b, c, d) = the maximising a
        // close the cycle on the fixed k_0, k_1, k_2
        for each (x, y, z) in K_{p-3} x K_{p-2} x K_{p-1}:
            total = V_{p-1}(x, y, z) + Phi_{p-3}(x, y, z, k_0) + Phi_{p-2}(y,
                    z, k_0, k_1) + Phi_{p-1}(z, k_0, k_1, k_2)
            if total > best:
                best = total
                keep (k_0, k_1, k_2), (x, y, z) and the back tables
    trace back from the kept (k_{p-3}, k_{p-2}, k_{p-1}) through back_t to
            recover k_3 .. k_{p-4}
    // then an optional coordinate polish
    return the key k_0 .. k_{p-1} and best

// Open-chain variant: skip the three closing terms and repair them with a
// coordinate polish.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Full-width states $26^3 = 17{,}576$ and $26^4 = 456{,}976$ transitions per residue. A 504-letter text at periods 4-170 over two orders, three relations, two modes and two prior weights produced 4,676 jobs on a 12-core pool. With the width-8 shortlist a period-7 or period-26 zone finishes in seconds. The rank-sharded validation finished 512 such DP-plus-polish runs in 265.004 s.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Too few letters per residue for a wide family.** At period 26 on 126 letters (four to five observations per residue) the 312-map affine family manufactured a false state: the control's selected text scored $-4.2767$ (reads as English) and reproduced the ciphertext, yet was neither the hidden plaintext nor the hidden maps. The additive and Porta families, with 26 and 13 options per residue, recovered the same-size control exactly. Family width, not the DP, is the limit.
- **Shortlist omission.** A shift outside the eight best monogram candidates is unreachable by the DP. The polish pass is the repair, not a guarantee.
- **Free-shift overfit.** On measured 63-, 95- and 126-letter zones the best exact finishes ($-6.037$, $-6.290$, $-5.107$) sat at or below the maxima of five within-coset nulls ($-5.770$, $-6.185$, $-5.021$): a globally optimal key under a wrong model still scores like noise, and only the null says so.
- **Wrap-around terms.** The open-chain variant is exact only up to the three closing quadgrams. The cyclic variant enumerates starts to remove that gap.
'''

[[blocks]]
kind = "controls"
body = '''
Cyclic periodic DP: three blind controls (63 letters period 7; 95 letters period 7; 126 letters period 26) recover 100% of the hidden plaintext and reproduce the ciphertext exactly; control gate PASS before any target zone was admitted. Free periodic Porta by the same DP: 63/63, 95/95 and 126/126 letters with exact row keys and forward checks. Periodic affine maps: 63/63 and 95/95 at period 7 pass, the 126-letter period-26 control fails as described. Rank-sharded validation with the width-8 DP finisher: 5/5 positives. KAT: cyclic DP versus exhaustive width-2 brute force, 8/8.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
One Viterbi step with four states. Previous scores $V_{t-1} = (-2.0, -1.0, -3.0, -1.5)$ for states $0..3$; transition-plus-emission scores into state $1$ from states $0..3$ are $(-1.0, -2.0, -0.5, -1.0)$. Then

$$V_t(1) = \max(-2.0 - 1.0,\ -1.0 - 2.0,\ -3.0 - 0.5,\ -1.5 - 1.0) = \max(-3.0, -3.0, -3.5, -2.5) = -2.5,$$

with back-pointer $3$. Repeating for every target state and every position, then tracing back from the best final state, yields the exact maximum-likelihood key inside the candidate product; ties (here between predecessors $0$ and $1$ for a hypothetical $-3.0$ winner) are broken by a fixed rule so the result is deterministic.
'''

