summary = "For a period-p key and a quadgram objective, each score factor depends on four neighboring key positions. A max-sum dynamic program can track the last three key values; fixing and enumerating the first three closes the cyclic factors exactly. The result is the exact objective maximum only within the declared per-residue candidate sets. Recorded additive and Porta controls succeeded with short cosets, but that empirical result is not a general sample-size guarantee."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Let the key be $k_0 \dots k_{p-1}$ over a candidate set $\mathcal{K}_b$ per residue (all 26 shifts, or a shortlist of the $W$ best by monogram likelihood). For a start residue $r$ collect every quadgram of the decrypt that begins at a position $i \equiv r \pmod p$:

$$\Phi_r(k_r, k_{r+1}, k_{r+2}, k_{r+3}) = \sum_{i \equiv r} \log_{10} Q_4\big(P_i P_{i+1} P_{i+2} P_{i+3}\big), \qquad P_i = A\big[(a(C_i) - k_{i \bmod p}) \bmod 26\big].$$

The objective $\sum_r \Phi_r$ is an order-three cyclic chain. With states $(k_{t-2}, k_{t-1}, k_t)$:

```
for each choice of the first three key letters (k_0, k_1, k_2):
    V_2(k_0,k_1,k_2) <- 0
    for t in 3 .. p-1:
        V_t(b,c,d) <- max_a [ V_{t-1}(a,b,c) + Phi_{t-3}(a,b,c,d) ]      # keep argmax a as back-pointer
    close the cycle with Phi_{p-3}, Phi_{p-2}, Phi_{p-1}, whose last arguments are the fixed (k_0,k_1,k_2)
    trace back the best (k_{p-3}, k_{p-2}, k_{p-1})
return the best over all starting triples
```

An open-chain variant ignores the three wrap-around terms and then applies a coordinate polish using the full cyclic score. That polish is heuristic and does not retroactively make the open-chain optimum exact. The Beaufort relation replaces $a(C_i) - k$ by $k - a(C_i)$.
'''

[[blocks]]
kind = "equations"
body = '''
Recurrence (maximisation):

$$V_t(b, c, d) = \max_{a \in \mathcal{K}_{t-3}} \Big[ V_{t-1}(a, b, c) + \Phi_{t-3}(a, b, c, d) \Big].$$

Emission tables are built once per residue: $\Phi_r$ has up to $|\mathcal{K}|^4$ entries and is accumulated from the valid quadgram starts in residue $r$. A direct cyclic implementation fixes $|\mathcal{K}|^3$ starting triples and performs up to $O(p|\mathcal{K}|^4)$ transition work for each, for a worst-case $O(p|\mathcal{K}|^7)$ bound. Implementation reuse and short periods can reduce constants, but the width-eight shortlist is what makes the recorded jobs bounded.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The quadgram factorization assumes candidate plaintext order is the order scored. If an unresolved inner transposition destroys those adjacencies, the implementation can deliberately switch to a monogram objective; that alternative factorization ignores the chain information rather than being an algebraic consequence of every transposition.
- The alphabet order is known (straight or one fixed keyword-mixed order) and the relation is additive (Vigenère or Beaufort) or belongs to a small per-residue family (13 Porta rows; 312 affine maps) that can be shortlisted.
- Exactness holds inside the shortlisted Cartesian product. A later coordinate or adjacent-pair polish can introduce an omitted value, but is heuristic and does not restore global exactness over the full product.
- The displayed recurrence assumes $p\ge4$. Shorter periods repeat variables inside a quadgram and require direct enumeration or separately derived factors.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
Run the DP over a preregistered period and model range, and compare the selected finish with null replicates that repeat the same range and optimization. Within-coset shuffles preserve each coset histogram while randomizing its positional order, subject to the chosen exchangeability assumptions. A planted key should be evaluated by recovery and forward checks; a large null excess is statistical evidence, whereas a wrong period can still score highly through harmonics or selection. The same finisher can initialize larger selectors, but any upstream shortlist and later polish remain part of their claim boundary.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertext C[0..n-1], period p, alphabet order A with position function
// a(.), candidate shifts K_b per residue b. Decrypt P_i = A[(a(C_i) - k_{i
// mod p}) mod 26] (Beaufort: k - a(C_i)).
function BUILD_EMISSIONS(C, p):
    for r in 0..p-1:
        Phi_r = zero table over K_r x K_{r+1} x K_{r+2} x K_{r+3}
        for each candidate quadruple and each i ≡ r (mod p), i + 3 < n:
            Phi_r(k_r, k_{r+1}, k_{r+2}, k_{r+3}) += log10 Q_4(P_i P_{i+1}
                    P_{i+2} P_{i+3})
    return Phi

function CYCLIC_VITERBI(Phi, p):
    best = -infinity
    for each starting triple (k_0, k_1, k_2) in K_0 x K_1 x K_2:
        V_2 = -infinity everywhere except V_2(k_0, k_1, k_2) = 0
        for t in 3..p-1:
            for each state (b, c, d) in K_{t-2} x K_{t-1} x K_t:
                V_t(b, c, d) = max over a in K_{t-3} of [ V_{t-1}(a, b, c) +
                        Phi_{t-3}(a, b, c, d) ]
                back_t(b, c, d) = the maximising a
        // close the cycle on the fixed k_0, k_1, k_2
        for each (x, y, z) in K_{p-3} x K_{p-2} x K_{p-1}:
            total = V_{p-1}(x, y, z) + Phi_{p-3}(x, y, z, k_0) + Phi_{p-2}(y,
                    z, k_0, k_1) + Phi_{p-1}(z, k_0, k_1, k_2)
            if total > best:
                best = total
                keep the fixed start, final state, and back tables
    trace back from the kept (k_{p-3}, k_{p-2}, k_{p-1}) through back_t to
            recover k_3 .. k_{p-4}
    return the key k_0 .. k_{p-1} and best
```
'''

[[blocks]]
kind = "complexity"
body = '''
Full-width states $26^3 = 17{,}576$ and $26^4 = 456{,}976$ transitions per residue. A 504-letter text at periods 4-170 over two orders, three relations, two modes and two prior weights produced 4,676 jobs on a 12-core pool. With the width-8 shortlist a period-7 or period-26 zone finishes in seconds. The rank-sharded validation finished 512 such DP-plus-polish runs in 265.004 s.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Too few letters per residue for a wide family.** At period 26 on 126 letters (four to five observations per residue) the 312-map affine family produced a false state: the control's selected text scored $-4.2767$, passed the configured English-score gate, and reproduced the ciphertext, yet was neither the hidden plaintext nor the hidden maps. The additive and Porta families, with 26 and 13 options per residue, recovered the same-size control exactly. The broader family failed this recovery test despite successful objective optimization.
- **Shortlist omission.** A shift outside the eight best monogram candidates is unreachable by the DP. The polish pass is the repair, not a guarantee.
- **Free-shift overfit.** On measured 63-, 95- and 126-letter zones the reported finishes ($-6.037$, $-6.290$, $-5.107$) sat at or below the maxima of five within-coset nulls ($-5.770$, $-6.185$, $-5.021$). Optimizing the declared score did not separate these observations from their null replicates; it did not establish a plaintext recovery.
- **Wrap-around terms.** The open-chain variant omits three closing residue factors, each of which may collect several plaintext quadgrams. The cyclic variant enumerates starting triples to include those factors exactly within its candidate sets.
'''

[[blocks]]
kind = "controls"
body = '''
Cyclic periodic DP: three blind controls (63 letters period 7; 95 letters period 7; 126 letters period 26) recover 100% of the hidden plaintext and reproduce the ciphertext exactly; control gate PASS before any target zone was admitted. Free periodic Porta by the same DP: 63/63, 95/95 and 126/126 letters with exact row keys and forward checks. Periodic affine maps: 63/63 and 95/95 at period 7 pass, the 126-letter period-26 control fails as described. Rank-sharded validation with the width-8 DP finisher: 5/5 positives. KAT: cyclic DP versus exhaustive width-2 brute force, 8/8.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
One Viterbi step with four states. Previous scores $V_{t-1} = (-2.0, -1.0, -3.0, -1.5)$ for states $0..3$; transition-plus-emission scores into state $1$ from states $0..3$ are $(-1.0, -2.0, -0.5, -1.0)$. Then

$$V_t(1) = \max(-2.0 - 1.0,\ -1.0 - 2.0,\ -3.0 - 0.5,\ -1.5 - 1.0) = \max(-3.0, -3.0, -3.5, -2.5) = -2.5,$$

with back-pointer $3$. Repeating for every target state and every position, then tracing back from the best final state, yields the exact maximizer of the declared quadgram objective inside the candidate product; calling that objective a likelihood requires an explicitly normalized probabilistic model. Ties (here between predecessors $0$ and $1$ for a hypothetical $-3.0$ winner) are broken by a fixed rule so the result is deterministic.
'''

