title = "Viterbi decoding of a periodic key"
subtitle = "Find the exact best repeating key while tracking its last three letters"
status = "VERIFIED"
status_note = "The cyclic order-three quadgram solver is exact within its declared candidate sets; the separately cited open-chain solver uses heuristic closure repair. Cyclic controls at 63 and 95 letters with period 7, and 126 letters with period 26, recovered the plaintext and key with exact forward checks. At width two, 8/8 known-answer checks match complete enumeration."
family = "Dynamic programming"
