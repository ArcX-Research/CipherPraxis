summary = "A latent-class mixture model can alternate between estimating class responsibilities and updating cipher parameters. Standard soft EM optimizes one observed-data likelihood and has a monotonicity guarantee under exact E- and M-steps. The recorded cryptanalytic routine additionally centers class scores, optimizes a column layout, hardens assignments, and keeps the best width statistic. It is therefore an EM-inspired alternating heuristic whose recovery must be measured on controls."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Let $z_i \in \{0, \dots, k-1\}$ denote a latent inner class and let the parameters include the outer shifts $k_b$. A standard mixture E-step computes posterior responsibilities from class-conditional distributions $E_z$. The project routine then performs additional layout and hard-assignment operations:

```
initialise shifts from the evidence fit (shifts marginalised, not maximised)
repeat up to 4 sweeps:
    responsibilities: P(z_i | x_i, k) proportional to E_z(x_i - k_{b(i)})
    center class scores and choose a long/short-column layout and hard class z_i
    shift update: for each coset b, maximize the hard-class monogram score
    stop if no shift changed; keep the shifts with the best width statistic
```

Alternating exact monogram updates of outer and inner shifts are likewise block-coordinate heuristics unless they are shown to optimize one common objective at every step. Both procedures keep their best observed endpoint because their transformations do not inherit the standard EM theorem automatically.
'''

[[blocks]]
kind = "equations"
body = '''
Posterior of class $z$ for a letter $x$ in coset $b$ with prior $\pi_z$:

$$P(z \mid x, k_b) = \frac{\pi_z\, E_z\big((x - k_b) \bmod 26\big)}{\sum_{z'} \pi_{z'}\, E_{z'}\big((x - k_b) \bmod 26\big)}.$$

M-step for coset $b$ given predicted classes $z_i$:

$$k_b \leftarrow \arg\max_{s \in \mathbb{Z}_{26}} \sum_{i \in \text{coset } b} \log E_{z_i}\big((x_i - s) \bmod 26\big).$$

For standard soft EM, an exact M-step increases or preserves the auxiliary expectation and therefore does not decrease the observed-data likelihood under regular conditions. That result does not apply automatically to centered scores, a separately optimized layout, hard assignments, sweep caps, or selection by another width statistic. The recorded routine reports a heuristic endpoint rather than a likelihood-stationarity certificate.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- A transposition preserves the global letter multiset, but class-specific membership depends on the construction and candidate layout. The rotated class distributions require the stated periodic-inner model; they are not invariant under an arbitrary reassignment of positions to classes.
- The width statistic centers scores by class to suppress an all-in-one-class degeneracy. A period-$k$ schedule gives class counts differing by at most one when the text length is not divisible by $k$, not necessarily exactly $n/k$ each.
- The shifts entering EM come from an evidence (marginalised) fit; profiling the seven shifts instead buys about $0.15$ nats per letter of selection freedom at 153 letters, enough to make wrong models win.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
1. Fit the inner mixture by evidence while averaging over the outer shifts. Read the inner spacing from the $\delta$-marginal. It was correct on 7 of 8 planted seeds, and the search kept the top three values.
2. For each width $w$, run the order-free pattern statistic (DP over long and short columns) and refine the shifts by class-EM; report the width's $z$ against shuffled ciphertexts pushed through the identical pipeline.
3. Hand widths with $z \ge 3$ to the column solver (residue classes fixed by the pattern, the rest by quadgrams, then a polish of shifts and order).

Hard-EM appears wherever a class solver fits outer and inner shifts jointly for a candidate transposition: alternating exact monogram maximisation started from the coset alignment and from zero, so a misaligned coset costs nothing.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Ciphertext letters x_i in the outer order, outer coset b(i) = i mod 7, k
// inner classes with class-conditional distributions E_z and priors pi_z;
// parameters: the seven outer shifts k_b.
function CLASS_EM(x, E, pi, w, k_init):
    // from the evidence fit (shifts marginalised)
    k = k_init
    for sweep in 1..4:
        // E-step: posterior class of every position under the current shifts
        for each position i:
            for each class z: post[i][z] = pi_z * E_z((x_i - k_{b(i)}) mod 26)
            normalise post[i] to sum to 1
        centre post per class, lay it out at width w by the long/short column
                DP
        z_hat = predicted class per position from that layout
        // M-step: re-estimate each outer coset's shift from its
        // class-labelled letters
        changed = false
        for b in 0..6:
            s* = argmax over s in 0..25 of sum over i in coset b of log
                    E_{z_hat[i]}((x_i - s) mod 26)
            if s* != k_b: k_b = s*; changed = true
        // prior re-estimate
        optionally pi_z = mean over i of post[i][z]
        if not changed: break
    return the shifts k with the best width statistic seen

// Hard-EM variant (class solver): replace post by the current best assignment
// and alternate exact monogram maximisation of the 7 outer and k inner shifts
// for four sweeps.
```
'''

[[blocks]]
kind = "complexity"
body = '''
One EM sweep costs one DP layout per width plus $7 \times 26$ coset-shift evaluations, each $O(n/7)$. Four sweeps per width and up to 25 widths, repeated for 60 shuffled nulls, is the dominant cost of the mixture pipeline (about 40 minutes for two texts in all alphabet combinations).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Degeneracy.** Without per-class centring the all-in-one-class configuration maximises even widths. The fix is structural, not a tuning.
- **Local and nonmonotone endpoints.** The alternating routine can return a wrong fixed point or a best-so-far state; the recorded controls happened to require at most two coset corrections. That observation is not a threshold theorem.
- **Flat inner texts.** If the inner layer is not a short-period substitution of natural language (fractionation, a second transposition-substitution layer, random letters) the classes are uninformative and EM has nothing to sharpen. The negative signatures of a Bifid, a plain periodic layer and a double columnar are printed alongside the controls for that reason.
- **Selection freedom.** Maximising rather than marginalising the shifts in the first stage overfits by about $0.15$ nats per letter and picks wrong models on shuffled nulls.
'''

[[blocks]]
kind = "controls"
body = '''
Four planted sandwiches (exact 17x9 grid; ragged width 8; width 12 with nine long columns and a different inner order; width 9 with a period-3 inner) all solve 100% from cold with the true width on top: width 9 at $z = +12.8$ and width 8 at $z = +11.3$ and width 12 at $z = +4.3$, each polishing to rate $-4.34$ with 100% match. EM corrected the one or two cosets the evidence fit got wrong on every control (7/7 after EM). A Bifid, a plain periodic layer and a double columnar show no width; on the double columnar the two-class model itself still registers at $z = +5.8$ because the multiset argument is transposition-invariant.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Two classes over a three-letter alphabet with $E_0 = (0.6, 0.3, 0.1)$ and $E_1 = (0.1, 0.3, 0.6)$ for letters A, B, C, equal priors, no shift. Observed letters A, C, A, B.

E-step: $P(z{=}0 \mid A) = 0.6/(0.6 + 0.1) = 0.857$; $P(z{=}0 \mid C) = 0.1/0.7 = 0.143$; $P(z{=}0 \mid B) = 0.3/0.6 = 0.5$. Posteriors for class 0: $(0.857, 0.143, 0.857, 0.5)$.

M-step for the prior: $\pi_0 = (0.857 + 0.143 + 0.857 + 0.5)/4 = 0.589$. A shift M-step in a standard soft mixture would weight every candidate rotation by the responsibilities; the recorded hard variant instead uses selected classes. One more E-step with the new prior moves the A posterior to $0.896$ and the C posterior to $0.193$. Standard soft EM guarantees a nondecreasing observed-data likelihood when its exact assumptions hold. The extra centering, layout, and hardening operations above require separate empirical checks.
'''

