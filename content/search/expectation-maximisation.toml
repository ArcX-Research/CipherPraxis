id = "expectation-maximisation"
section = "search"
title = "Expectation-maximisation over latent letter classes"
subtitle = "Alternating class posteriors and shift re-estimation for a mixture under a periodic layer; hard-EM as alternating exact maximisation"
status = "VERIFIED"
status_note = "Class-EM refinement of the outer shifts is implemented in the mixture solver and corrects the one or two cosets the evidence fit gets wrong on every planted control (7/7 after EM); the four planted sandwiches solve from cold with the true width on top at z 6-13."
family = "Deterministic heuristics"
tags = ["EM", "latent class", "mixture", "posterior", "alternating maximisation"]
related = ["mixture-inference-under-transposition", "order-free-width-statistic", "bayesian-evidence-model-selection", "exact-dynamic-programming", "coordinate-descent", "sandwich-construction", "vigenere", "columnar-transposition", "shuffled-null-z-score", "planted-controls"]
summary = "When a short-period inner substitution sits under a transposition and a period-7 outer key, each ciphertext letter came from one of k inner alphabets. Expectation-maximisation alternates an E-step that assigns every position a class posterior (via the column layout that best explains the pattern) and an M-step that re-estimates each outer coset's shift from the class-conditional likelihood of its letters. In the corpus it is the refinement that turns an evidence-based fit with one or two wrong cosets into a complete solve."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Latent variable $z_i \in \{0, \dots, k-1\}$ = the inner alphabet that produced position $i$; parameters $\theta$ = the seven outer shifts $k_b$ (and the inner spacing $\delta$ carried from the evidence stage). With class-conditional letter distributions $E_z$ in the outer order:

```
initialise shifts from the evidence fit (shifts marginalised, not maximised)
repeat up to 4 sweeps:
    E-step: P(z_i | x_i, k) proportional to E_z(x_i - k_{b(i)})            # per position
            lay the posteriors out at width w by the long/short column DP    # predicted class per position
    M-step: for each coset b:  k_b <- argmax_s  sum_{i in coset b} log E_{z_i}((x_i - s) mod 26)
    stop if no shift changed; keep the shifts with the best width statistic
```

The hard-EM variant used by the class solver (alternating exact monogram maximisation of the 7 outer and $k$ inner shifts, four sweeps) replaces posteriors by the current best assignment.
'''

[[blocks]]
kind = "equations"
body = '''
Posterior of class $z$ for a letter $x$ in coset $b$ with prior $\pi_z$:

$$P(z \mid x, k_b) = \frac{\pi_z\, E_z\big((x - k_b) \bmod 26\big)}{\sum_{z'} \pi_{z'}\, E_{z'}\big((x - k_b) \bmod 26\big)}.$$

M-step for coset $b$ given predicted classes $z_i$:

$$k_b \leftarrow \arg\max_{s \in \mathbb{Z}_{26}} \sum_{i \in \text{coset } b} \log E_{z_i}\big((x_i - s) \bmod 26\big).$$

Both steps are monotone in the complete-data likelihood, so EM converges to a stationary point; it is not global.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The multiset of inner letters is invariant under the transposition, so the class-conditional distributions are rotations of the language distribution and can be estimated before the column order is known.
- Posteriors are centred per class before the width statistic: a period-$k$ inner puts exactly $n/k$ letters in each class, so the degenerate assignment "everything is class 0" must score zero rather than maximise every even width.
- The shifts entering EM come from an evidence (marginalised) fit; profiling the seven shifts instead buys about $0.15$ nats per letter of selection freedom at 153 letters, enough to make wrong models win.
'''

[[blocks]]
kind = "attack"
title = "Attack strategy"
body = '''
1. Fit the inner mixture by evidence with the outer shifts marginalised; read the inner spacing off the $\delta$-marginal (correct on 7/8 planted seeds; the top three carried).
2. For each width $w$, run the order-free pattern statistic (DP over long and short columns) and refine the shifts by class-EM; report the width's $z$ against shuffled ciphertexts pushed through the identical pipeline.
3. Hand widths with $z \ge 3$ to the column solver (residue classes fixed by the pattern, the rest by quadgrams, then a polish of shifts and order).

Hard-EM appears wherever a class solver fits outer and inner shifts jointly for a candidate transposition: alternating exact monogram maximisation started from the coset alignment and from zero, so a misaligned coset costs nothing.
'''

[[blocks]]
kind = "complexity"
body = '''
One EM sweep costs one DP layout per width plus $7 \times 26$ coset-shift evaluations, each $O(n/7)$; four sweeps per width and up to 25 widths, repeated for 60 shuffled nulls, is the dominant cost of the mixture pipeline (about 40 minutes for two texts in all alphabet combinations).
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Degeneracy.** Without per-class centring the all-in-one-class configuration maximises even widths; the fix is structural, not a tuning.
- **Local optima.** EM from a fit with more than two wrong cosets can converge to a wrong stationary point; the recorded controls needed at most two corrections.
- **Flat inner texts.** If the inner layer is not a short-period substitution of natural language (fractionation, a second transposition-substitution layer, random letters) the classes are uninformative and EM has nothing to sharpen; the negative signatures of a Bifid, a plain periodic layer and a double columnar are printed alongside the controls for that reason.
- **Selection freedom.** Maximising rather than marginalising the shifts in the first stage overfits by about $0.15$ nats per letter and picks wrong models on shuffled nulls.
'''

[[blocks]]
kind = "controls"
body = '''
Four planted sandwiches (exact 17x9 grid; ragged width 8; width 12 with nine long columns and a different inner order; width 9 with a period-3 inner) all solve 100% from cold with the true width on top: width 9 at $z = +12.8$ and width 8 at $z = +11.3$ and width 12 at $z = +4.3$, each polishing to rate $-4.34$ with 100% match. EM corrected the one or two cosets the evidence fit got wrong on every control (7/7 after EM). A Bifid, a plain periodic layer and a double columnar show no width; on the double columnar the two-class model itself still registers at $z = +5.8$ because the multiset argument is transposition-invariant.
'''

[[blocks]]
kind = "example"
title = "Reproducible example"
body = '''
Two classes over a three-letter alphabet with $E_0 = (0.6, 0.3, 0.1)$ and $E_1 = (0.1, 0.3, 0.6)$ for letters A, B, C, equal priors, no shift. Observed letters A, C, A, B.

E-step: $P(z{=}0 \mid A) = 0.6/(0.6 + 0.1) = 0.857$; $P(z{=}0 \mid C) = 0.1/0.7 = 0.143$; $P(z{=}0 \mid B) = 0.3/0.6 = 0.5$. Posteriors for class 0: $(0.857, 0.143, 0.857, 0.5)$.

M-step for the prior: $\pi_0 = (0.857 + 0.143 + 0.857 + 0.5)/4 = 0.589$. A shift M-step would instead score each of the 26 candidate rotations of $E_{z_i}$ against the coset's letters and keep the best. One more E-step with the new prior moves the A posterior to $0.589 \cdot 0.6 / (0.589 \cdot 0.6 + 0.411 \cdot 0.1) = 0.896$ and the C posterior to $0.589 \cdot 0.1 / (0.589 \cdot 0.1 + 0.411 \cdot 0.6) = 0.193$; the complete-data likelihood rises at every step, which is the monotonicity that makes EM converge.
'''

