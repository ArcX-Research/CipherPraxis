id = "coherent-endpoint-distance-polynomial"
section = "search"
title = "Coherent endpoint distance polynomials"
subtitle = "Keep whole proposal rows together, but do not mistake closeness for likelihood"
status = "POWER-LIMITED"
status_note = "Exact reduced-alphabet tests verified the coherent polynomial and shared-cycle legality. On three longer consumed controls, legal wrong cycles had strictly smaller endpoint distance than the planted cycle, so distance is not a safe primary rank or hard prune."
family = "Proposal-guided constrained search"
tags = ["coherent endpoints", "distance polynomial", "shared cycle", "proposal ranking", "counterexample"]
related = ["unique-proposal-voting", "candidate-bank-lineage-and-cap-accounting", "relabeling-permutation-distance", "quadgram-log-likelihood", "local-language-model-prior", "planted-controls", "cross-residue-collision-alignment"]
summary = "Preserve each approximate substitution map as a complete row instead of assembling its best cells from unrelated rows. A distance polynomial records the full distribution of distances from a legal candidate to those rows. Products of per-residue polynomials additionally assume that endpoint choices across residues form an allowed Cartesian product; coupled multi-residue endpoints require a joint polynomial. Distance is proposal geometry, not language likelihood, and recorded controls contain legal wrong keys closer than the planted key."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Let residue $r$ have a deduplicated bank $E_r$ of complete physical endpoint maps. For a candidate map $G_r$, define its endpoint-distance polynomial

$$F_r(G_r;x)=\sum_{M\in E_r} x^{d_H(G_r,M)},$$

where $d_H$ is Hamming distance on the declared observed domain. For a tuple $G=(G_0,\ldots,G_{p-1})$, keep only tuples that satisfy the shared algebra, such as powers or reflections of one regular cycle. If endpoint rows in different residue banks are independent choices, their Cartesian support can be represented by

$$F(G;x)=\prod_r F_r(G_r;x).$$

Its smallest nonzero degree is the minimum total distance to one complete endpoint row from each residue bank. This is coherent within each map, but does not mean that the chosen rows came from one coupled search run. If a physical endpoint jointly supplies $(M_0,\ldots,M_{p-1})$, preserve a joint bank $E$ and use

$$F_{\rm joint}(G;x)=\sum_{M\in E}x^{\sum_r d_H(G_r,M_r)}$$

rather than multiplying marginals. In either form, no term is a per-cell plurality assembled from fragments of maps.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Endpoint rows are deduplicated as physical maps before multiplicity is interpreted.
- Distance uses a declared symbol domain; changing the domain changes the statistic.
- Every output tuple passes the full shared-cycle or reflection legality test.
- Zero-support edges remain searchable. Absence from an approximate proposal bank is not an algebraic contradiction.
- Distance is a proposal heuristic unless fresh controls measure the complete selector's recovery behavior.
- The product form is valid only when the declared proposal family permits independent endpoint-row choices across residue banks; coupled origins use the joint form.
'''

[[blocks]]
kind = "attack"
title = "Use coherence without a distance trap"
body = '''
Build the exact polynomials from complete endpoint rows and enumerate only algebraically legal tuples. Preserve candidates from several distance bands or temperatures, including candidates with zero-vote edges. Give those candidates to the actual plaintext objective, such as a frozen n-gram score, and let that objective choose the final result. A useful implementation keeps a Pareto set over language score, endpoint distance, and proposal origin rather than deleting every state outside the minimum-distance shell.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function COHERENT_PROPOSALS(endpoint_banks, legal_generator, betas):
    candidates = empty semantic set
    for G in legal_generator:
        polynomial = 1
        for residue r:
            polynomial *= sum(x ^ HAMMING(G[r], M) for M in endpoint_banks[r])
        for beta in betas:
            proposal_score = log of the normalized mean exp(-beta * distance)
                    represented by polynomial
            RETAIN_BY_DECLARED_BUDGET(candidates, G, beta, proposal_score)

    candidates = SEMANTIC_DEDUPLICATE(candidates)
    for G in candidates:
        G.language_score = INDEPENDENT_PLAINTEXT_SCORE(DECRYPT(G))
        require FORWARD_REPLAY(G)
    return RANK_PRIMARILY_BY_LANGUAGE(candidates)
```
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Frankenstein plurality.** Picking the most frequent image independently for every cell can create an injective-looking collection that no single endpoint or shared cycle supports.
- **Nearest means true.** Approximate decoders can cluster around a smooth but wrong basin. Minimum Hamming distance then rewards the basin rather than the hidden key.
- **Lexicographic lock-in.** If distance is the first sort key, an excellent language candidate at distance $d+1$ can never beat nonsense at distance $d$; a later language tie-break cannot repair this.
- **Zero-vote pruning.** The true map may use edges absent from every retained endpoint. Exact reduced tests retained planted tuples with several such edges.
- **Alias voting.** Gauge-equivalent coordinates or duplicate endpoints can multiply support without adding evidence.
- **Control reuse called fresh.** A consumed control can falsify a selector, but success on it cannot admit a newly tuned selector.
'''

[[blocks]]
kind = "controls"
body = '''
On reduced exact fixtures, two independent enumerators agreed on 11,546 legal rotation-map tuples and 11,160 legal reflection-map tuples. They preserved planted candidates with three zero-support edges per fixture and rejected per-cell Frankenstein pluralities; 544,944 scalar forward/decrypt letters agreed.

A separate audit then applied minimum endpoint distance to three already-consumed longer controls. Blind legal, non-orbit cycles reached total distances $26<30$, $20<22$, and $28<31$ against the planted cycles. All three wrong distance winners had much worse quadgram scores than truth. This is a constructive counterexample: coherent distance is useful geometry, but minimum distance is not a truth-safe primary selector.
'''

[[blocks]]
kind = "notes"
body = '''
The polynomial preserves more information than a single minimum: its coefficients show how much support exists at every distance. Finite-temperature summaries can expose several basins, but temperature is a selector choice and needs fresh controls. The safest workflow is broad proposal acquisition, semantic deduplication, independent language ranking, and literal forward replay.
'''

