id = "parallel-tempering"
section = "search"
title = "Parallel tempering (replica exchange)"
subtitle = "Run searches at several temperatures and swap states between nearby levels"
status = "POWER-LIMITED"
status_note = "A recorded batch solver searches the alphabet and shifts across a fixed temperature ladder. It recovered only 3–42% of the alphabet on the cited short, two-sided controls, and the tested chain-count increase did not improve the best score monotonically. These finite failures make target misses uninformative about the cipher family."
family = "Stochastic local search"
tags = ["replica exchange", "temperature ladder", "batch chains", "quagmire iii", "unknown alphabet"]
related = ["simulated-annealing", "hill-climbing", "polish-basin-measurement", "quagmire-iii", "quadgram-log-likelihood", "shuffled-null-z-score", "planted-controls", "power-measurement", "cp-sat-and-smt-solvers", "g-temperature-schedule", "g-search-basin"]
summary = "Parallel tempering runs Metropolis chains at several temperatures and proposes exchanges between neighboring levels. Hotter chains can cross some score barriers more readily, while colder chains concentrate more strongly near high scores. A recorded implementation searched an unknown alphabet and periodic shifts, then polished selected chains. It failed its cited short, two-sided-alphabet controls under the tested ladders and budgets; this is an empirical power limit, not evidence that arbitrarily many chains or another tempering design must fail."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Choose $L$ temperatures on a geometric ladder and assign $N_c$ chains round-robin to levels. Each step is an ordinary Metropolis update at the chain's own temperature. Every $x$ steps, chains on adjacent levels $l$ and $l+1$ are paired and their states swapped with the replica-exchange probability.

```
temps[l] <- T_cold * (T_hot/T_cold)^(l/(L-1)),  l = 0..L-1
for each chain c: level[c] <- c mod L, state[c] <- random
for t in 1 .. steps:
    propose one move per chain (alphabet swap/insertion with prob p_alpha, else one shift redrawn)
    accept per chain with prob min(1, exp(delta / temps[level[c]]))
    if t mod x == 0:
        for l in 0 .. L-2: pair chains at level l with chains at level l+1
            d <- (1/temps[l] - 1/temps[l+1]) * (E[b] - E[a])
            swap states of a and b with prob min(1, exp(d))
polish the best chains; report the best polished score
```
'''

[[blocks]]
kind = "equations"
body = '''
Exchange acceptance for a state $a$ at temperature $T_l$ and a state $b$ at $T_{l+1}$ with scores $E_a, E_b$ (maximisation):

$$\Pr[\text{swap}] = \min\!\left(1,\ \exp\!\Big[\Big(\tfrac{1}{T_l} - \tfrac{1}{T_{l+1}}\Big)(E_b - E_a)\Big]\right).$$

A better state on the hotter level always moves down the ladder. The state is $(A, k)$ with $A$ a permutation of 26 letters shared by the texts and $k$ one shift vector of length 7 per text. The decrypt of text $j$ is $p_i = A[(A^{-1}(c_i) - k^{(j)}_{i \bmod 7}) \bmod 26]$ (Vigenère relation) or $A[(k^{(j)}_{i \bmod 7} - A^{-1}(c_i)) \bmod 26]$ (Beaufort). The score is the quadgram log-likelihood of all decrypts plus optional bigram and trigram terms with weights $w_2, w_3$ intended to smooth the early landscape.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- Exchange only helps if some temperature level mixes across the barriers that separate basins. The ladder ($T_{hot} = 12$, $T_{cold} = 0.4$ by default) is assumed to span that range.
- Parameter-count and language-redundancy estimates do not prove identifiability. Gauge symmetries, short-sample alternatives, and model mismatch can leave several observationally equivalent or high-scoring states. Counterfactual truth scores and exact checks must assess separation on each control independently of search reachability.
- Polishing (exact per-coset shift descent alternating with an exhaustive 925-neighbour alphabet climb) is applied to the top chains, so the reported number is a polished score.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
Target family: a period-7 keyed substitution whose single unknown alphabet acts on both sides (Quagmire III), possibly shared by two texts with separate shift vectors, on zones of 63 and 96 letters. Moves: with probability $p_\alpha = 0.5$ an alphabet move (swap with probability 0.7, else an insertion), otherwise one shift of one text redrawn uniformly; exchange every 20 steps. An optional keyword mode derives shifts from a candidate word and therefore reduces the freely searched parameter set. Nulls run the same finite search and selection on shuffled zones, because refitted shifts can overfit short texts.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// N_c chains, L temperatures, exchange every x steps. Chain state (A, k): A a
// permutation of 26 letters shared by the texts, k one shift vector per text;
// E = score of the decrypts.
function PARALLEL_TEMPERING(E, N_c, L, T_cold, T_hot, x, steps, p_alpha):
    // geometric ladder
    for l in 0..L-1: temps[l] = T_cold * (T_hot / T_cold)^(l / (L - 1))
    // round-robin levels
    for c in 0..N_c-1: level[c] = c mod L; state[c] = random (A, k)
    for t in 1..steps:
        for each chain c (one vectorised step for all chains):
            with probability p_alpha: s' = state[c] with an alphabet move
                    (swap or insertion)
            otherwise:                s' = state[c] with one shift of one
                    text redrawn uniformly
            delta = E(s') - E(state[c])
            // Metropolis
            if U(0,1) < min(1, exp(delta / temps[level[c]])): state[c] = s'
        // replica exchange
        if t mod x == 0:
            for l in 0..L-2:
                pair each chain a at level l with a chain b at level l+1
                d = (1 / temps[l] - 1 / temps[l+1]) * (E(state[b]) -
                        E(state[a]))
                // a better hot state always moves down
                if U(0,1) < min(1, exp(d)): swap state[a] and state[b]
    polish the best chains (exact per-coset shift descent alternating with
            the alphabet climb)
    // read against shuffled-text nulls
    return the best polished (A, k) and its score
```
'''

[[blocks]]
kind = "complexity"
body = '''
Cost per step is one vectorised decrypt-and-score of all chains, $O(N_c \cdot n)$. Recorded budgets and wall times on one machine: 2,000 chains $\times$ 60,000 steps $\times$ 8 levels took 920 s for the joint 63+96 control and 599 s for the 96-letter control; at 50,000 steps, 500 / 2,000 / 8,000 chains took 40 / 164 / 655 s. The polish of the top 8 chains is negligible by comparison.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **No monotone gain in the tested scaling panel.** On one planted 96-letter instance the polished best was $-5.045$ with 500 chains, $-4.829$ with 2,000 and $-4.916$ with 8,000 (two other search seeds at 2,000: $-4.971$, $-4.876$), corresponding to 29–40% alphabet match. This small panel does not establish a scaling law or an asymptotic plateau; it shows that the tested increase did not cure the control failure.
- **Smoothing does not rescue it.** Bigram weight 1 gave $-4.87$ (42% of the alphabet) on the 96-letter control versus $-5.07$ (19%) with weight 3. A bigram ramp with trigrams gave $-5.45$ on the joint control (27% on the 96-letter part); key-word-derived shifts were worse ($-5.57$, 16%). A longer run (2,000 chains $\times$ 100,000 steps, bigram weight 1) ended at $-4.83$ with 35% match.
- **Observed search geometry.** The alphabet acts twice, so every swap changes both symbol coordinates and induced substitutions. The accompanying perturbation panel observed useful recovery only near the truth, while the best global-search states were farther away (see [polish-basin measurement](/search/polish-basin-measurement)). The finite panel diagnoses a likely proposal-path problem but does not prove a hard basin radius.
- **Consequence.** A target run of this solver cannot distinguish "not this family" from "family present but unreachable". It was therefore not used as a family negative.
'''

[[blocks]]
kind = "controls"
body = '''
Planted Quagmire III with a random alphabet and random shifts on real English, 2,000 chains $\times$ 60,000 steps, 8 levels, quadgram only: joint 63+96 letters polished $-5.603$ with 3% and 6% of the two plaintexts right; 96 letters alone $-5.108$ with 16% right. Both are failures by the pre-declared standard (read as English, match near 100%). The one-sided variants of the same problem (alphabet on one side only, shifts pinned by a crib) are solved by plain annealing, so the failure is specific to the two-sided landscape.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Ladder with $L = 4$, $T_{cold} = 0.4$, $T_{hot} = 12$: $T_l = 0.4 \cdot 30^{l/3}$, giving $0.4,\ 1.243,\ 3.862,\ 12$.

Exchange between a chain at $T_1 = 1.243$ with score $E_a = -520$ and a chain at $T_2 = 3.862$ with score $E_b = -505$:

$$d = \Big(\tfrac{1}{1.243} - \tfrac{1}{3.862}\Big)(-505 + 520) = 0.5456 \times 15 \approx 8.18 > 0,$$

so the swap is accepted and the better state moves to the colder level. If instead $E_b = -530$, $d = 0.5456 \times (-10) \approx -5.46$ and the swap is accepted with probability $e^{-5.46} \approx 0.0043$.
'''

[[blocks]]
kind = "notes"
body = '''
The negative calibration is the useful output: it is the reason the two-sided-alphabet problem was moved from landscape search to exact constraint solving (crib plus key-word linear systems, all-different enumeration, CP-SAT). Any future claim of a blind two-sided solve at these lengths needs a planted control that this solver could not pass.
'''

