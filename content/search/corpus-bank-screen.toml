id = "corpus-bank-screen"
section = "search"
title = "Corpus bank screen"
subtitle = "Filter every fixed-length corpus window with alphabet-free rules, then test survivors exactly"
status = "CLOSED"
status_note = "One full search checked all 2,344,345 length-24 windows in a fixed 2,344,368-letter corpus. Alphabet-free equality rules reduced them to 39,528 unique prefixes. An exact chain solver tested every survivor under all four sign pairs and found zero answers. Controls passed 256/256. This rules out only exact corpus windows under the stated chain."
family = "Enumeration strategies"
tags = ["proposal bank", "corpus", "pattern filter", "exact oracle", "scoped closure"]
related = ["exact-chain-oracle", "dictionary-attack", "word-prefix-csp", "all-different-enumeration", "isomorph-analysis", "segment-chain-analysis", "shared-cycle-attack", "target-absent-controls", "planted-controls", "g-certificate"]
summary = "A corpus bank screen treats every fixed-length text window as a possible plaintext opening. Fast rules that do not need the alphabet or key reject impossible windows in batches. For example, equal ciphertext pairs can force equal plaintext letters. Duplicate survivors are removed. An exact solver then rejects each remaining window or returns every compatible key. If none work, only that text bank is ruled out, not the whole cipher family."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
For a chained construction whose positions $i$ in one constant-key class satisfy $z(P_i) = e_A\, z(C_i) - e_A e_B\, z(C'_i) + \text{const} \pmod{26}$ with $z$ an unknown bijection and $e_A, e_B \in \{\pm 1\}$, injectivity of $z$ gives alphabet-free implications between positions $i, j$:

- $(C_i, C'_i) = (C_j, C'_j) \Rightarrow P_i = P_j$;
- exactly one of $C_i = C_j$, $C'_i = C'_j$ holds $\Rightarrow P_i \ne P_j$.

```
mask <- equality/inequality pairs implied by the two ciphertexts on positions 0..L-1
for every window w of length L in the corpus (vectorised):
    keep w iff w satisfies every pair in mask
survivors <- deduplicate(kept windows)
for each survivor, for each sign pair (e8, e9):
    oracle(survivor) -> infeasible | list of compatible cycles; finish each cycle on the full text
    require literal re-encryption of both ciphertexts for any endpoint
```
'''

[[blocks]]
kind = "equations"
body = '''
Number of windows: $N - L + 1 = 2{,}344{,}368 - 24 + 1 = 2{,}344{,}345$. The live mask on positions $0..23$ consisted of one forced equality ($P_2 = P_{19}$) and 23 forced inequalities. It reduced the windows to $40{,}331$ offsets and $39{,}528$ unique prefixes, a survival rate of about $1.7\%$. Over the whole 153-letter text the same rule yields 4 equalities and 108 inequalities inside the first 53 positions.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The implications are exact consequences of injectivity and hold for every alphabet, key value and sign pair. The filter can only remove windows that no key could explain.
- The bank is finite and stated: verbatim windows of one pinned corpus (hash-recorded). A hit would be a candidate pending independent reproduction and null evidence. A miss says only that the opening is not a verbatim window of that corpus under that chain.
- The oracle is exact (GF(2) and GF(13) null spaces with all-different enumeration) and returns every compatible cycle, not a best guess.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
The screen extends a word-prefix constraint solver whose earlier proposal banks sampled complete openings from a language model. The corpus screen instead enumerates every opening the corpus contains. The pattern mask is derived before any expensive algebra and was handed to the prefix solver as a free pre-filter for its own proposals. Each survivor is passed to the exact oracle as a black box (a prefix file), under all four sign pairs. Any endpoint would be finished on all 153 letters and both ciphertexts re-encrypted literally.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Two ciphertexts C, C' of one chain; window length L; corpus of N letters (N
// - L + 1 windows).
function BUILD_MASK(C, C', L):
    mask = {}
    for each pair of positions i < j in 0..L-1:
        if (C_i, C'_i) == (C_j, C'_j): mask = mask + {P_i = P_j}
        else if exactly one of C_i == C_j, C'_i == C'_j holds:
            mask = mask + {P_i != P_j}
    // needs no alphabet, key or sign pair
    return mask

function CORPUS_SCREEN(corpus, L, mask):
    kept = []
    for every window w = corpus[o .. o+L-1], o in 0..N-L (vectorised over all
            offsets):
        if w satisfies every equality and inequality in mask:
            kept = kept + [w]
    survivors = deduplicate(kept)
    endpoints = []
    for each survivor in survivors:
        for each sign pair (e_A, e_B) in {+1, -1} x {+1, -1}:
            // exact: infeasible, or every compatible cycle
            result = oracle(survivor, e_A, e_B)
            for each cycle in result:
                finish the cycle on the full text
                if both ciphertexts re-encrypt literally:
                    endpoints = endpoints + [(survivor, e_A, e_B, cycle)]
    // no endpoint closes only this bank under this chain
    return survivors, endpoints
```
'''

[[blocks]]
kind = "complexity"
body = '''
The vector filter is $O(N \cdot |\text{mask}|)$ over the corpus. The oracle cost is dominated by survivors with large GF(13) nullity (each exact decision costs $2^{d_2} + 13^{d_{13}}$ combinations). With 39,528 unique prefixes and four sign pairs the whole screen ran to completion in one recorded session.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Bank coverage.** A text whose opening is a new sentence never appears verbatim in any corpus. The negative is uninformative about the family.
- **Model dependence.** The mask assumes the chain relation and the constant-key class boundary. If either is wrong the filter removes the truth.
- **Pattern is a speed-up, not an identifier.** The same equality/inequality pattern on the first 53 positions admits enormous numbers of English strings. Only the exact oracle decides.
- **Homogeneous systems.** A single window's equations are always linearly consistent; rejection comes solely from the all-different enumeration of a small null space, so long windows (here 24 letters) are needed for decisions to be cheap.
'''

[[blocks]]
kind = "controls"
body = '''
Standalone filter controls on 256 synthetic arbitrary-permutation chains across all four sign pairs: every planted opening survived its own mask and 256/256 deliberately violated mutations were rejected. The scalar and vectorised implementations agreed on 4,096 test windows. The oracle's own controls belong to the [exact chain oracle](/exact/exact-chain-oracle) entry (control gate 1/1 in this deployment). Live result: zero exact endpoints from 39,528 unique survivors under all four sign pairs.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Corpus `THEREISATREEBYTHERIVERANDAHILL` (30 letters), window length 5, mask $\{P_0 = P_3,\ P_1 \ne P_2\}$. The 26 windows are checked in turn. Only window 22, `ANDAH`, satisfies $P_0 = P_3$ (A = A) and $P_1 \ne P_2$ (N $\ne$ D). Every other window fails the equality (for example `THERE`: T $\ne$ R; `RIVER`: R $\ne$ E). The survivor is then handed to the exact oracle, which tests whether some bijection $z$ and constant satisfy the five chain equations with all letter positions distinct. An infeasible answer closes the bank for this mask.
'''

