id = "hash-chained-transcripts"
section = "engineering"
title = "Hash-chained transcripts"
subtitle = "Write strict typed records once and hash the exact bytes before the final commit"
status = "VERIFIED"
status_note = "The audited format uses standard JSONL records with COMMIT hashes. Parsers reject hundreds of damaged variants. Files are written through one retained descriptor, flushed with fsync, checked by inode, and accepted only after full semantic replay. One 4 MB transcript passed this process."
family = "Reproducibility"
tags = ["transcripts", "hash chain", "parser", "durability", "admission"]
related = ["reproducibility-receipts", "build-manifests-and-release-json", "seed-determinism", "kat-harness", "seal-and-audit-protocol", "blind-controls", "run-script-log-convention"]
summary = "An evidence transcript must not look valid when only part of it is valid. It stores typed JSON lines in a fixed order. A COMMIT line gives the SHA-256 hash of every earlier byte and the record count. The parser recomputes the final result from the summary. The writer creates the file once, writes and flushes it through one open descriptor, reads it back the same way, and parses it before publishing its name. Admission then rebuilds the records from fixed inputs and requires an exact standard match."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
**Grammar.** `HEADER, LINEAGE/PINS, RELEASE, GATES, METHOD, MODEL, REGISTRY, BANK, CASE×n (or FIXTURE×n), SUMMARY, COMMIT, terminal`, each record one canonical JSON line (sorted keys, no whitespace, exact key sets, typed leaves) with a fixed ASCII prefix. Operational failures use separate typed prefixes (`PREBANK`, `BANK_READY`, `CASES_DONE INCOMPLETE`) and never a fabricated `CASE`.

**Commit.** $\text{COMMIT.evidence\_sha256} = \operatorname{SHA256}(\text{prefix})$ where the prefix is every byte from `HEADER` through the LF ending `SUMMARY`; `evidence_record_count` is the number of records in it; `final_bytes = prefix || COMMIT || terminal || LF`.

**Strict parser.** Rejects duplicate keys, `NaN`/`Infinity`, non-canonical serialisation, bool-for-int, unknown or missing keys, out-of-order records, wrong counts, hashes or censuses, ties inconsistent with the top set, and any terminal not forced by the records; requires whole-byte equality `data == render(rows)`.

**Durable write.** Open with `O_CREAT|O_EXCL|O_NOFOLLOW`, mode 0600; `fstat` (regular, one link); write all; `fsync`; seek and read back through the same descriptor; parse; hard-link publish; unlink temporary; directory `fsync`; final no-follow pathname `(dev, ino, mode, nlink)` check. Any failure after the attempt marker appends `INCOMPLETE` and never unlinks.
'''

[[blocks]]
kind = "equations"
title = "Snapshots and admission"
body = '''
Integrity barriers $S_0 \dots S_5$ hash the path-sorted tuple set $\{(\text{path}, \text{dev}, \text{ino}, \text{mode}, \text{nlink}, \text{size}, \operatorname{SHA256}(\text{bytes}))\}$ of every protected artefact; `SUMMARY` carries $S_2, S_3, S_4$ and the post-publication $S_5$ is deliberately outside the committed bytes so that publication is not circular. Admission reads the reveal only from the committed `HEADER`, regenerates the bank, runs the selector twice, rebuilds the sole $S_4$-bearing prefix and requires

$$\operatorname{render}(\text{regenerated}) = \text{bytes on disk}$$

exactly, including the COMMIT and the terminal.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Semantic fields are deterministic (integer scores, pinned seeds, one thread or a scheduling-independent pool); elapsed time and memory are either kept out of the committed prefix or accepted as the only fields that may differ between runs.
- The parser and the generator are separately pinned. A parser inside the generating source is a recorded deviation.
'''

[[blocks]]
kind = "attack"
body = '''
The design answers specific attacks found by audits: a fabricated transcript with plausible values passes structure, so admission replays the selector (seven "plausible-value" mutations were admitted by structure alone and rejected by replay). A permissive grammar admitted `1.00`, `-1E1`, key reorder and unicode escapes, so canonical re-serialisation is required. A post-write failure could leave success-shaped bytes, so nine exception paths were shown to leave the canonical path absent; and `str.splitlines()` admitted CRLF and a missing final newline, so whole-byte render equality was added.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Records in fixed order: HEADER, LINEAGE/PINS, RELEASE, GATES, METHOD,
// MODEL, REGISTRY, BANK, CASE x n (or FIXTURE x n), SUMMARY, COMMIT,
// terminal; each record = fixed prefix + canonical JSON line.
function RENDER(records, terminal):
    prefix_bytes = ""
    for each record from HEADER through SUMMARY:
        // sorted keys, no whitespace
        prefix_bytes = prefix_bytes + PFX + " " + canonical_json(record) + LF
    commit = {evidence_sha256: SHA256(prefix_bytes), evidence_record_count:
            number of records so far}
    // final_bytes
    return prefix_bytes + PFX + " COMMIT " + canonical_json(commit) + LF +
            terminal + LF

procedure DURABLE_WRITE(temp_path, canonical_path, final_bytes):
    fd = open(temp_path, O_CREAT | O_EXCL | O_NOFOLLOW, mode 0600)
    require fstat(fd) is a regular file with one link
    write all of final_bytes to fd; fsync(fd)
    seek fd to 0; data = read everything back through the same fd
    // whole-byte equality
    require STRICT_PARSE(data) succeeds and data == RENDER(parsed rows)
    hard-link temp_path to canonical_path; unlink temp_path; fsync(directory)
    require the no-follow stat of canonical_path gives the expected (dev,
            ino, mode, nlink)
    // any failure after the attempt marker: append INCOMPLETE, never unlink

function STRICT_PARSE(data):
    reject duplicate keys, NaN or Infinity, non-canonical serialisation,
            bool-for-int, unknown or missing keys,
           out-of-order records, wrong counts, hashes or censuses, ties
                   inconsistent with the top set,
           and any terminal not forced by the records
    require SHA256(bytes from HEADER through the LF ending SUMMARY) ==
            COMMIT.evidence_sha256
    // admission then regenerates the rows from fixed inputs and requires
    // render == bytes on disk
    return rows
```
'''

[[blocks]]
kind = "complexity"
body = '''
A 34-case transcript with full maps and permutations was 4,051,007 bytes (cap 32 MiB) and was parsed three times in memory and once from the retained descriptor within a 1,200 s wall budget. A 24-fixture controls transcript was 178,969 bytes with 30 records.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Bool/float laxity in regenerated constant fields** (`true` for `1`, `504.0` for `504`) admitted by dictionary equality; fix by comparing canonical serialisations.
- **Environmental residue.** A hard kill between hard-link publication and temporary unlink leaves an nlink-2 canonical plus a dot-prefixed temporary; admission refuses it (fail-closed) but recovery is manual and the fixtures are burned.
- **Post-commit stdout errors.** A closed stdout turned a valid committed transcript into exit code 2; integrity unaffected.
'''

[[blocks]]
kind = "controls"
body = '''
Parser mutation panels (31, 38, 40 and 420 mutations in different lanes, each with a no-op guard) and transaction fail-once KATs (18 interruption failpoints, 4 filesystem rejections) are run before every mode; auditors additionally recompute the COMMIT digest by hand over the stated prefix length.
'''

[[blocks]]
kind = "example"
title = "Record sequence"
body = '''
```
PFX HEADER  {"artifact_log":381,"case_count":34,"length":504,"mode":"PRODUCTION","reveal_hex":"…","schema":"…"}
PFX LINEAGE {"manifest_sha256":"…","runner_sha256":"…","source_sha256":"…"}
PFX MODEL   {"q4_sha256":"…","train_range":[0,1100000]}
PFX CASE    {"index":0,"label":"HP01","rate":-9.740118,"gap":4.009164,"forward":true,"plaintext_sha256":"…"}
…
PFX SUMMARY {"decision":"PASS","snapshot_S2_sha256":"…","snapshot_S3_sha256":"…","snapshot_S4_sha256":"…"}
PFX COMMIT  {"evidence_record_count":43,"evidence_sha256":"<sha256 of every byte above>"}
RESULT LANE VALIDATION PASS target=ABSENT
```
'''

