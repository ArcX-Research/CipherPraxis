id = "local-llm-server-integration"
section = "engineering"
title = "Local LLM server integration"
subtitle = "Use a local language model only for scoring or suggestions its API can support"
status = "INCONCLUSIVE"
status_note = "A read-only audit found that the local server gives log-probabilities only for generated tokens. It cannot provide exact scores for supplied full sequences, so the fixed reranking plan was closed. A grammar-guided suggestion run made 3,500 calls over 1,128 s and produced no complete answer. That heuristic miss rules out nothing."
family = "Tooling"
tags = ["language model", "local server", "reranking", "constrained decoding"]
related = ["local-language-model-prior", "semi-markov-word-model", "english-gate-calibration", "tautological-gate-rule", "reproducibility-receipts", "control-first-policy", "quadgram-log-likelihood"]
summary = "A language model can either score complete candidates or suggest candidates for exact checks. Reliable scoring needs an API that returns each supplied token's log-probability. Suggestions need only controlled sampling under a grammar. An audit of the local server showed that it supports suggestions but not exact full-text scoring. Exact algebra checks every suggestion, and a failure to suggest the truth does not rule anything out."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
For a candidate ordering or plaintext $x = (x_1, \dots, x_T)$ the frozen-scorer use needs

$$L(x) = \sum_{t=1}^{T} \log p(x_t \mid x_1, \dots, x_{t-1}),$$

i.e. the log-probability of every token **already present** in the submitted text. A completion endpoint that returns top-$N$ probabilities only for tokens it generates cannot supply this; forcing tokens by logit bias changes the distribution being measured, and asking a chat model to choose among candidates is a judgement, not the predeclared score.

The proposal use needs only next-token sampling. The program's version compiles, for each beam state, the finite set of dictionary words compatible with the ciphertext's exact within-residue equality and injectivity constraints into a trie grammar, lets the model choose complete legal words, and verifies every completed proposal by the exact modular relations, the all-different constraint, decryption and a literal forward reconstruction.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The server is inventoried read-only before use: process, model file hash and metadata, chat-template hash matching the served properties, adapter identity and scale, context size, build id, executable hash.
- Requests are deterministic: temperature fixed, seed fixed, prompt caching off, penalties disabled, request-local adapter scale zero so that a post-launch fine-tune does not enter, serialised calls, and a hard memory stop.
- Provenance is checked: the adapter's training data was scanned for project tokens (none found) and its date recorded. The audit notes this reduces but does not exclude contamination.
'''

[[blocks]]
kind = "attack"
title = "The capability probe"
body = '''
A single generic request with `echo: true` and `logprobs: 5` returned five prompt tokens and one completion token, but a log-probability array of length **one**, for the generated token only. A directed next-token pilot then tried to score each ordered chunk pair by finding the successor's first token in the top-$N$ list with $N$ escalated 128, 512, 2,048: of 72 directed edges, 37 were observed and 35 remained censored, including four of the eight planted-path edges, so no complete $9!$ ranking existed. A final interval variant scored censored tokens as $[-\infty, \text{cutoff}]$. The planted path's second edge was censored, its lower bound was $-\infty$, and the preregistered certificate failed before any non-planted edge was requested. The stop rule was followed: no second token, no extra control, no target.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Abstract interface to a local model server; two uses with different
// requirements.
interface MODEL_SERVER:
    inventory() -> process, model file hash and metadata, chat-template hash,
            adapter identity and scale, context size, build id, executable
                    hash
    complete(prompt, max_tokens, temperature, seed, echo, logprobs,
            penalties, cache_prompt, adapter_scale)
        -> the generated tokens with their log-probabilities (top-N per
                position)

procedure BEFORE_USE(server):
    record server.inventory() read-only
    fix temperature and seed
    cache_prompt = false
    penalties disabled
    adapter_scale = 0
    serialise calls
    set a hard memory stop

// frozen-scorer use needs L(x) = sum over t of log p(x_t | x_1 .. x_{t-1})
function CAPABILITY_GATE(server):
    reply = server.complete(a generic prompt, max_tokens = 1, temperature =
            0, fixed seed, echo = true, logprobs = 5)
    if reply carries a log-probability for every supplied prompt token:
        return PASS
    // only the generated token is scored: no exact L(x)
    return FAIL

function FROZEN_SCORE(server, x):
    // never substitute -infinity, a rank, a cutoff or a forced token
    require CAPABILITY_GATE(server) == PASS
    return sum over t of the returned log p(x_t | x_1 .. x_{t-1})

// proposal use needs only next-token sampling
function PROPOSE(server, C, dictionary):
    beam = {empty state}
    while beam has live states and no complete proposal:
        for each state:
            grammar = trie of the dictionary words compatible with the exact
                    within-residue
                        equality and injectivity constraints of C; extend the
                                state by one word chosen through
                                server.complete under grammar
    verify each completed proposal by the exact modular relations, the
            all-different constraint,
           decryption and a literal forward reconstruction
    // an empty result excludes nothing
    return the verified proposals
```
'''

[[blocks]]
kind = "complexity"
body = '''
The probes were cheap (168 completion calls in 31.4 s; 19 calls in 2.2 s) and the server's resident memory stayed between about 8.8 and 11.6 GiB under a 16 GiB stop. The proposal lane spent 1,127.9 s on 3,500 model calls for one 95-letter zone and ended with 64 live partial states and zero complete proposals.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Substituting a surrogate for a missing likelihood.** Replacing censored entries by $-\infty$, the last returned probability, a rank or a forced token would not be the declared model probability and could manufacture an exact order; refused.
- **Character-level proposals collapsing.** A character-token smoke reached 49 of 95 letters and collapsed into one-letter fragments. The successor changed the search unit to complete words.
- **Source improved after the run.** The executed proposal lane's source hash differs from the current source. The ledger says the current hash must not be represented as the executed one.
'''

[[blocks]]
kind = "controls"
body = '''
The frozen-scorer lane predeclared 40 development controls and never submitted them because the capability gate failed first. A proposal lane's controls are its exact verifier (a readable survivor must reproduce both texts under the declared algebra) and the rule that a failed beam excludes nothing.
'''

[[blocks]]
kind = "example"
title = "Deterministic probe request"
body = '''
```json
{"prompt": "The capital of France is", "max_tokens": 1, "temperature": 0, "seed": 232,
 "echo": true, "logprobs": 5, "repeat_penalty": 1.0, "cache_prompt": false,
 "lora": [{"id": 0, "scale": 0.0}]}
```
Expected for a frozen scorer: log-probabilities for all five prompt tokens. Observed: one entry, for the generated token. Capability gate: FAIL.
'''

