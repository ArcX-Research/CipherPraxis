id = "run-script-log-convention"
section = "engineering"
title = "Run-script and log convention"
subtitle = "Give each test one launcher, numbered logs, clear failed-log names, and durable attempt markers"
status = "VERIFIED"
status_note = "The project follows this rule across 325 launchers and 1,334 log-directory items: 1,284 numbered transcripts, 21 failed files with status suffixes, and 9 attempt markers. A full directory audit classified every item."
family = "Tooling"
tags = ["launchers", "logs", "naming", "provenance"]
related = ["control-first-policy", "reproducibility-receipts", "ledger-reservations", "state-checkpoints", "compiled-hot-cores", "hash-chained-transcripts"]
summary = "A small launcher script fixes every setting a person might otherwise change: compiler command, self-test, hashes, mode, seeds, and transcript path. The ledger number also names the transcript, and UTC gives its time. If a run is later found defective, move it to failed logs with the problem in its suffix. Never delete or cite it. These rules let the ledger and files check each other."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
**Launcher** (`run_<lane>.sh`): `set -euo pipefail`; resolves its own directory; compiles the core into a temporary directory removed by a trap; runs `--self-kat`; verifies SHA-256 pins of every frozen input; dispatches on a mode word (`controls | smoke | live`, or `static | benchmark | disclosed | parse | admit`); tees the driver's output to the transcript while preserving the driver's exit status (`PIPESTATUS`); prints `transcript: <path>` last.

**Transcript names**: `logs/NNN_<lane>_<variant>_<UTC stamp>[_<pid>].log` with stamp `%Y%m%dT%H%M%SZ`; the first eight instruments used the short form `logs/01_audit.log` to `08_q3.log`. Development and smoke transcripts carry `_disclosed`, `_smoke` or `_dev` in the name and are labelled non-evidence.

**Failed logs**: `logs/failed/NNN_<lane>.<DEFECT>.<stamp>.log`, where the defect token is one of the recorded vocabulary: `INVALID-gauge-defect`, `CONTROL_FAIL`, `CONTROL_CRITERION_DEFECT`, `STALE_SOURCE-NO_LIVE`, `RESOURCE_BLOCKED-rss-ceiling`, `SUPERSEDED-<reason>`, `interrupted`.

**Attempt markers**: `logs/NNN_<lane>.log.attempt`, created `O_EXCL` before a one-shot computation and never removed.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The log number is reserved in the ledger before the launcher exists (see [Ledger reservations](/validation/ledger-reservations)).
- A frozen gate launcher takes **no arguments**; anything that could vary is inside the script and pinned.
'''

[[blocks]]
kind = "attack"
body = '''
The convention protects against the two ways a log becomes a false exclusion: a run whose inputs drifted, and a run that was stopped or broken but looks complete. Hash pins refuse the first ("REFUSED hash drift: <path>"). For the second, the failed-logs directory and the defect suffix keep the artefact while making it uncitable; the ledger's audit of the directory found multiprocessing shutdowns, a missing-module failure, a traceback mid-run, an exact-solver control that returned unknown, and several runs stopped after a stated fraction of placements, all of which are now labelled and excluded.
'''

[[blocks]]
kind = "complexity"
body = '''
A launcher is 20 to 260 lines. The directory audit that classified 200 text logs (106,010 lines) was a day's work and is the reason the convention exists in its strict form.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Mis-filing.** A pilot's transcript was filed under a development directory when an earlier pilot was stopped; corrected in the ledger with the restored path and hash.
- **Empty logs.** Four historical logs are empty and prove nothing; they were left in place and listed as such.
- **Suffix collisions.** A `.failed-no-numpy` suffix was used ad hoc before the failed directory existed; later runs of the same family exist without the suffix.
- **Stale sources.** A live run launched from bytes that had since changed is labelled `STALE_SOURCE-NO_LIVE` and its target portion is void.
'''

[[blocks]]
kind = "controls"
body = '''
Refusal probes are part of a launcher's test: running a frozen gate with an argument, or a production mode without its token, must exit 2 and create nothing. The independent auditors run these probes and record the count (for one lane, 13 probes all exit 2).
'''

[[blocks]]
kind = "example"
title = "Frozen gate launcher"
body = '''
```bash
#!/usr/bin/env bash
set -euo pipefail
HERE="$(cd "$(dirname "$0")" && pwd)"
[[ $# -eq 0 ]] || { echo "REFUSED frozen no-argument gate" >&2; exit 2; }
check_hash() { [[ "$(shasum -a 256 "$1" | cut -d' ' -f1)" == "$2" ]] || { echo "REFUSED hash drift: $1" >&2; exit 2; }; }
check_hash "$HERE/../corpus.txt"      06ed53d8…
check_hash "$HERE/wm_gate.py"          11825e25…
check_hash "$HERE/wm_core.cpp"         f2f10162…
mkdir -p "$HERE/logs"; stamp="$(date -u +%Y%m%dT%H%M%SZ)"
log="$HERE/logs/504_gate_${stamp}.log"
python3 -u "$HERE/wm_gate.py" --cases 24 --minimum-power 0.75 --strict 2>&1 | tee "$log"
status="${PIPESTATUS[0]}"; printf 'transcript: %s\n' "$log"; exit "$status"
```
'''

