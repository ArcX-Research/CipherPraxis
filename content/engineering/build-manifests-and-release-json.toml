id = "build-manifests-and-release-json"
section = "engineering"
title = "Build manifests and release JSON"
subtitle = "Detached, canonical one-line JSON records that pin an implementation, its ancestors and its authorisation without a hash cycle"
status = "VERIFIED"
status_note = "Thirteen manifest and release records exist in the research program; their fields were verified against live files by independent auditors, and one release record authorised the single hidden-bank transaction that was later admitted."
family = "Audit and release governance"
tags = ["manifest", "release", "json", "pinning", "provenance"]
related = ["seal-and-audit-protocol", "reproducibility-receipts", "hash-chained-transcripts", "seed-determinism", "run-script-log-convention", "g-manifest"]
summary = "A build manifest is written after the source, parser and runner are frozen and before anyone audits them; it names every input by path and SHA-256, every constant the run depends on, and every path the run may create. A release record is written by the release authority after the audits and binds the manifest, the audits and an authorisation token. Neither contains the hash of anything written after it, so the provenance graph is acyclic and every executable can compare the records with the live files before it does anything."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
**Build manifest** (`<lane>_build_manifest.json`, one canonical JSON line, sorted keys, no whitespace), fields observed in the program:

- `schema`, `version`, `artifact_log`, `wire_protocol`, `target = "ABSENT"`;
- `authority`: hashes of the governing design, its audit and the blocked predecessors;
- `implementation`: `{source, parser, runner}` each as `{path, sha256}`, plus a normalised-runner hash;
- `frozen_pins`: every inherited artefact (predecessor sources, cores, runners, audits, transcripts, corpus) as `{path, sha256}`; 22 entries in one lane;
- `constants`: text length, case count and fixed case order, exact gates as decimals and as integer cross-products, model table hash and checksum, registry and commitment hashes, the literal authorisation token;
- `paths`: the reserved basenames for attempt, canonical transcript, audits, release;
- calibration facts where the lane has them: calibration window count, English mean, s.d., minimum, threshold rate and integer gate.

**Release record** (`<lane>_release.json` or `_independent_release.json`, mode 0600, one link): `authorization` token string, `manifest_sha256`, `creator_audit_sha256`, `implementation_audit_sha256` (or the predecessor and new independent-audit hashes), `bank_sha256`/`registry_sha256`/`reveal_commitment_sha256` where a hidden bank is prederived, `gates`, `case_count`, `case_order`, `canonical_basename`, `attempt_basename`, `target = "ABSENT"`.
'''

[[blocks]]
kind = "equations"
title = "Acyclicity and the masked runner"
body = '''
Writing order is `parser/source/runner → manifest → creator audit → independent audit → release`. The manifest cannot contain an audit hash and the audit cannot contain the release hash. Mutual identity between source and runner is achieved by masking: the runner's hash-constant lines (its `SOURCE_SHA256`, `PARSER_SHA256` and its own normalised value) are blanked before hashing, so

$$\text{source} \ni h(\text{runner}_{\text{masked}}), \qquad \text{runner} \ni h(\text{source}), h(\text{parser}),$$

and the manifest records both the raw and the normalised runner hash.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Records are compared, not trusted: the source rebuilds the expected manifest object from live hashes at every root-mode start and refuses on any field mismatch; the runner parses the release with duplicate-key and canonical checks.
- Tokens are literal strings, not secrets; the secret in a hidden-bank lane is the seed, which appears in the release only as a commitment.
'''

[[blocks]]
kind = "attack"
body = '''
The records make three refusals mechanical: a tampered source, parser or core (one byte appended to a copy) is refused with "hash drift" before execution; a production mode without the release record or token is refused; and a stale artefact at a predecessor's path (a hard link, a symlink, an old wire-protocol transcript) is refused by the artefact/wire identity pair and regular-one-link gates. An auditor's falsified `runner_normalized_sha256` field was rejected by three independent layers: the parser's frozen constant, the attempt-marker verifier and the semantic replay.
'''

[[blocks]]
kind = "complexity"
body = '''
Records are small (436 to 6,391 bytes in the program) and cheap to verify; the discipline is in writing them at the right moment and in never rewriting one.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Manifest generated by the code it pins.** One manifest was produced by calling the source's own expected-object function; the creator recorded that an independent reconstruction from the design's field list is the auditor's job.
- **A record that would need a future hash.** The build stage cannot hash an audit written after it; the program predeclares the release record's schema and path instead, and the release binds the audit.
- **Public-mode runner self-hash.** In non-production modes the runner hashed itself at run time; production modes pin it through the manifest and environment.
'''

[[blocks]]
kind = "controls"
body = '''
Every manifest field is rehashed by the independent auditor from the file it names ("22 matched, 0 mismatched, 0 not found"), and the reserved paths are checked absent before and after the audit.
'''

[[blocks]]
kind = "example"
title = "Skeletons"
body = '''
```json
{"schema":"LANE_BUILD_MANIFEST_V1","version":1,"artifact_log":381,"wire_protocol":"WIRE_V1","target":"ABSENT",
 "authority":{"design_sha256":"…","design_audit_sha256":"…"},
 "implementation":{"source":{"path":"wm_lane.py","sha256":"…"},"parser":{"path":"wm_lane_parser.py","sha256":"…"},
                   "runner":{"path":"run_lane.sh","sha256":"…"}},
 "frozen_pins":{"corpus":{"path":"corpus.txt","sha256":"…"},"core":{"path":"wm_core.cpp","sha256":"…"}},
 "constants":{"n":504,"case_count":34,"case_order":["HP01",…],"gap_rhs":753375243000,"rate_rhs":-6441024837000,
              "q4_array_sha256":"…","root_authorization_token":"ROOT_AUTHORIZED_LANE_TARGET_ABSENT_ONCE"},
 "paths":{"attempt":"logs/381_lane.log.attempt","canonical":"logs/381_lane.log","release":"lane_release.json"}}
```
```json
{"authorization":"ROOT_AUTHORIZED_LANE_TARGET_ABSENT_ONCE","manifest_sha256":"…","creator_audit_sha256":"…",
 "implementation_audit_sha256":"…","bank_sha256":"…","case_count":34,"canonical_basename":"381_lane.log",
 "attempt_basename":"381_lane.log.attempt","target":"ABSENT","version":1}
```
'''

