id = "seed-determinism"
section = "engineering"
title = "Seed determinism"
subtitle = "Derive every random seed from labeled hashes so the same inputs reproduce the same run"
status = "VERIFIED"
status_note = "Sealed designs derive all random values from labeled SHA-256 streams with rejection sampling. An independent auditor rebuilt a 68-seed, 34-case bank from the design text alone. A fresh rerun of a sealed job reproduced every meaningful record."
family = "Reproducibility"
tags = ["seeds", "determinism", "randomness", "replay"]
related = ["blind-controls", "reproducibility-receipts", "valid-model-nulls", "compiled-hot-cores"]
summary = "A randomized computation is exactly replayable only when its random draws, algorithm, inputs, concurrency semantics, and relevant numeric behavior are fixed compatibly; recording the environment diagnoses differences but does not by itself force equality. One robust convention derives case, shuffle, and search seeds from domain-separated hash streams with explicit counters. Fixed selector randomness makes a finite heuristic a deterministic statistic of its input, while randomization-test validity still requires the declared exchangeability model and the same complete procedure for every replicate."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Given a root reveal $r$ (32 bytes) and a label $L$ (an ASCII string such as `SEED/CONSTRUCTION/HP01_M20_BETA0`), the stream is

$$W(L, c) = \operatorname{uint64be}(\operatorname{first8}(\operatorname{SHA256}(r \,\|\, \operatorname{EL}(L) \,\|\, \operatorname{uint64be}(c)))), \qquad c = 0, 1, 2, \dots$$

with $\operatorname{EL}$ a length-prefixed encoding and `[0:8]` denoting the first eight digest bytes. Unsigned 64-bit words are consumed in order. Under the intended pseudorandom-word model, a draw in $[0,n)$ rejects $x \ge \lfloor 2^{64}/n \rfloor n$ and otherwise returns $x \bmod n$, removing simple modulo bias. A seed is $1 + \operatorname{draw}(L,2^{63}-1)$. If it duplicates an accepted seed, consumption continues on the same label's stream at its next unused counter. Construction and selector seeds use distinct label prefixes and fixed case order.
'''

[[blocks]]
kind = "equations"
title = "Modulo-bias-free index sampling"
body = '''
Conditional on uniform independent index draws, descending Fisher-Yates gives a uniform permutation: for $i=n-1,\dots,1$, draw $j$ in $[0,i]$ by the rejection rule and swap $i,j$. SHA-256 streams are used as a deterministic pseudorandom construction, not as a mathematical proof that a particular fixed reveal samples uniformly. The proposal key for permutation $k$ is $\operatorname{SHA256}$ of a literal domain string with $k$ formatted as `%04d`, and blocks are $\operatorname{SHA256}(\text{key} \,\|\, \operatorname{uint64be}(\text{counter}))$. The first 99 eligible proposals in index order form the bank; eligibility may depend only on identity and declared invariants, never on a score.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Labels are exact bytes. The auditor checked that lowercase kinds, a NUL suffix, doubled slashes or a shared counter all diverge at the first seed (four negative spellings, each giving a different integer).
- More than $2^{32}$ consumed words for one seed is a derivation failure that retires the reveal; there is no fallback stream.
- Compiled cores derive per-work-unit seeds from an injective, domain-separated encoding of the unit coordinates. Scheduling independence additionally requires race-free state, order-independent or fixed-order reductions, and deterministic tie handling.
'''

[[blocks]]
kind = "attack"
body = '''
Determinism makes exact replay and independent audit possible. Reusing the same selector stream for the observation and every replicate makes a finite annealer a fixed function of its input; under the stated exchangeability assumptions, that function can be used as the randomization statistic. Distinct preregistered streams can also be valid if assigned symmetrically, but choosing or extending randomness after seeing scores creates unequal search effort. The cited independent replay reconstructed the recorded seed and permutation bank from the design text and matched every audited field.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Root r, exact label bytes L, and one counter per label; EL is length-prefixed.
function WORD(r, L, c):
    return UINT64BE(first 8 bytes of SHA256(r || EL(L) || uint64be(c)))

function DRAW(r, L, n, counters):
    require 0 < n < 2^64
    loop:
        x = WORD(r, L, counters[L]); counters[L] = counters[L] + 1
        if x < floor(2^64 / n) * n: return x mod n

function SEED(r, L, counters, accepted):
    loop:
        s = 1 + DRAW(r, L, 2^63 - 1, counters)
        if s not in accepted: accepted = accepted + {s}; return s

function DERIVE_SEEDS(r, cases):
    for each case in cases in fixed order:
        construction_seed[case] = SEED(r, "SEED/CONSTRUCTION/" + case, counters, accepted)
        selector_seed[case] = SEED(r, "SEED/SELECTOR/" + case, counters, accepted)
    return construction_seed, selector_seed

function SHUFFLE(r, L, n, counters):
    perm = [0, 1, ..., n-1]
    for i in n-1 down to 1:
        j = DRAW(r, L, i + 1, counters)
        swap perm[i] and perm[j]
    return perm
```
'''

[[blocks]]
kind = "complexity"
body = '''
Hash derivation is normally small relative to the search, but its cost should still be measured if draws dominate a tiny kernel. Under a uniform 64-bit-word model and $0<n<2^{64}$, the rejection probability is $(2^{64}\bmod n)/2^{64}<n/2^{64}$. The main reproducibility burden is specifying byte encodings, counters, duplicate handling, and failure terminals precisely enough for a second implementation to agree.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Ambiguous label grammar.** A design that wrote `<kind>` where the stored case kind and the seed kind could be confused was blocked. The successor enumerated the two uppercase seed kinds and the exact label bytes.
- **Reroll after observation.** Replacing or extending seeds once a score is known invalidates the bank; designs state that seeds cannot be replaced after the observation is known and that a derivation failure retires the reveal rather than permitting search.
- **Seeds in the clear.** The hidden seed appears in the attempt record only as its hash and is revealed only in the final transcript. A reveal in the environment at admission time is refused.
'''

[[blocks]]
kind = "controls"
body = '''
Derivation primitive KATs check the published first seeds, the same-stream continuation vectors after a forced duplicate, and the four negative spellings. The public bank hash is a KAT vector for the whole derivation.
'''

[[blocks]]
kind = "example"
title = "Seed derivation sketch"
body = '''
```python
def word(r, label, c):  return int.from_bytes(sha256(r + EL(label) + c.to_bytes(8, "big")).digest()[:8], "big")
def draw(r, label, n, state):
    while True:
        x = word(r, label, state[label]); state[label] += 1
        if x < (2**64 // n) * n: return x % n
seed = 1 + draw(r, b"SEED/SELECTOR/" + case_label, 2**63 - 1, counters)
# published vector for the all-zero test reveal: construction 4844331123840797721, selector 3391159140334670312
```
'''

