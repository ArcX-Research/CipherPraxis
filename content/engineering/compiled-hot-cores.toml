id = "compiled-hot-cores"
section = "engineering"
title = "Compiled hot cores"
subtitle = "Put the slowest loops in small C++ programs that Python controls and checks"
status = "VERIFIED"
status_note = "The project has fifty single-file cores. Each launcher compiles its core, requires --self-kat to pass, and controls it through pipes. Recorded examples include a complete search of 248,405 pairs in 307.5 s and a 209 ms benchmark using at most 96 MB."
family = "Compute and throughput"
tags = ["c++", "cores", "protocol", "threads", "integer scores"]
related = ["numpy-instrument-pattern", "kat-harness", "seed-determinism", "drainability-and-throughput", "exhaustive-enumeration", "simulated-annealing", "incremental-language-score"]
summary = "When a measured hot loop is awkward to express as array operations, a small compiled core can expose it through a narrow protocol while a higher-level driver owns controls and receipts. Integer accumulation makes ranks and ties deterministic only when the quantized score table, overflow bounds, candidate order, and tie rules are also fixed. Reproducibility across machines additionally requires compiler, architecture, dependencies, and binary provenance; a source hash alone is insufficient."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
A **hot core** is a program `name_core.cpp` with two entry modes:

- `--self-kat`: deterministic known-answer tests of the core's own algebra and scoring deltas; prints one `SELF_KAT PASS` line with check counts or throws.
- `--server CORPUS [WORKERS]` (or a batch CLI): builds the language model from the pinned corpus, prints a `READY` event carrying the model checksum, then reads one request per line (`SOLVE <seed> <ciphertext>`) and answers with one JSON line (`RESULT`, or `ERROR` with `BAD_REQUEST` / `BAD_CIPHERTEXT`), until `QUIT`.

The Python driver spawns the core with pipes, reads the `READY` line, sends requests, parses replies, and on exit sends `QUIT` and waits with a timeout. The transcript is written by Python. The core never touches the filesystem beyond the corpus.
'''

[[blocks]]
kind = "equations"
title = "Integer scoring"
body = '''
Log-scores are quantized as integers, $q = \operatorname{rint}(10^{s}\log_{10}p)$ with the scale fixed by the lane, and a candidate's score is $Q=\sum_iq[w_i]$. The displayed rate is $Q/(10^s\cdot\#\text{windows})$. Once the exact integer table is pinned and sums cannot overflow, gates and ties are exact integer comparisons. Rebuilding $q$ from floating-point logarithms can differ at a rounding boundary across libraries, so cross-machine replay must compare or distribute the quantized table and its checksum rather than assume source probabilities suffice.
'''

[[blocks]]
kind = "assumptions"
body = '''
- A recorded compiler command is necessary but does not alone reproduce binary behavior. Pin the compiler and relevant libraries, target architecture, source and binary hashes, runtime inputs, and any implementation-defined assumptions; one cited audit records missing compiler and binary provenance as a residual.
- Work units are independent. Scheduling-independent output additionally requires race-free state, per-unit random streams, exact or order-fixed reductions, and a deterministic total order for ties before serializing results.
'''

[[blocks]]
kind = "attack"
title = "Patterns from the corpus"
body = '''
- **Embedding a validated engine.** A successor core includes its predecessor's file with `main` renamed by a macro, changes only the state schedule and outer selector, and pins the predecessor's SHA-256 as a string constant printed by the self-KAT.
- **Staged selection inside the core.** One core enumerates $2 \times 4 \times 26 \times 26 = 5{,}408$ raw cells, solves each with a short annealing stage, keeps 192 for a second stage and 32 for a third, and emits the top 256 with per-cell seeds derived by XOR of the request seed with the cell coordinates.
- **Batch CLI cores.** A restart-based annealer exposes `--restarts 96 --iterations 300000 --threads 4 --seed 202000 --t0 16 --t1 0.08` and screening, refinement and consensus stages as flags; its runner script and Python wrapper own the protocol.
- **Frozen cores with scheduling-only edits.** A build script verifies the frozen core's source hash, applies guarded textual insertions (`--pair-begin/--pair-end` slicing, `--locate-pair`), records the generated source and binary hashes, and a KAT proves the union of segments equals the full run.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// A host script drives one compiled core through pipes; the core never writes
// files.
function RUN_LANE(core_source, corpus, workers, requests):
    // one recorded compiler line
    binary = compile(core_source)
    // deterministic known-answer checks, or throw
    require run(binary, "--self-kat") prints "SELF_KAT PASS"
    core = spawn(binary, "--server", corpus, workers) with stdin and stdout
            pipes
    // READY event carrying the model checksum
    ready = read one line from core
    record ready.model_checksum in the transcript
    for each (seed, ciphertext) in requests:
        write "SOLVE " + seed + " " + ciphertext + newline to core
        // RESULT, or ERROR with BAD_REQUEST / BAD_CIPHERTEXT
        reply = parse one JSON line from core
        // the transcript is written by the host
        append reply to the transcript
    write "QUIT" + newline to core; wait for exit with a timeout
    return transcript

// q is a pinned integer table; bounds exclude overflow and ties use a fixed
// order. Rebuilding q from floating point is outside this exact contract.
function SCORE(candidate, q, s):
    Q = 0
    for each window w_i of candidate: Q = Q + q[w_i]
    // displayed rate = Q / (10^s * number of windows)
    return Q
```
'''

[[blocks]]
kind = "complexity"
body = '''
Recorded rates: an exhaustive three-shift cell drained 248,405 pairs (494,577 triples) in 307.5 s. A fixed-order structured-plaintext solver benchmarked at 209 ms with 95.7 MB peak memory for 26 first-stage and 104 endpoint states. The same family's largest identity enumerated 2.47 million first-stage and 9.9 million endpoint states inside a 156.7 s suite. Sanitiser builds (ASAN and UBSAN) were run on both oracle and blind paths before one core was frozen.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Rate extrapolated across cells.** A two-extra-shift cell ran about 300 times slower per pair than its three-shift sibling because the linear pruning fired later; see [Throughput fail](/validation/throughput-fail).
- **Truth-map arguments.** A core that can be handed the planted truth for oracle KATs must refuse that argument in live mode. The lane's design states that no truth map is passed to the core.
- **Unrecorded compiler provenance.** A different compiler could fail a deterministic replay at admission (fail-closed, but then permanently incomplete).
'''

[[blocks]]
kind = "controls"
body = '''
The self-KAT is mandatory before any mode. Typical contents: for every one of the 325 letter pairs, the incremental swap delta equals the full rescore difference; forward then inverse of the state schedule reproduces the input over all 5,408 cells and 504 positions. A zero-width variant equals the constant-slope schedule for all 26 slopes.
'''

[[blocks]]
kind = "example"
title = "Protocol transcript"
body = '''
```
$ ./core --self-kat
CORE SELF_KAT PASS raw_cells=5408 schedule_checks=2725632 constant_alias_checks=52416 base_sha256=fe882dde…
$ ./core --server corpus.txt 8
{"event":"CORE_READY","model_checksum":<integer>,"raw_cells":5408,"workers":8}
SOLVE 490001 ABCD…(504 letters)
{"cells":[{"d0":3,"d1":9,"key":"…","outer":"S","plaintext":"…","quarter":2,"score":-5012345,"stage":3},…],
 "emitted":256,"event":"CORE_RESULT","model_checksum":<integer>,"raw_top_ties":1,"seed":490001}
QUIT
```
'''

