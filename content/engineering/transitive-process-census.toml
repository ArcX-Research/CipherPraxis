id = "transitive-process-census"
section = "engineering"
title = "Transitive process census"
subtitle = "Reconstruct every expected child invocation instead of trusting a pipeline's summary"
status = "UNTESTED"
status_note = "Single- and two-child process boundaries have passed exact replay, and the full conditional-DAG verifier passed static refusal tests. Its complete model-bearing multi-branch preflight was still running at the inventory cutoff, so end-to-end status remains untested."
family = "Reproducible solver architecture"
tags = ["process census", "execution DAG", "subprocess", "provenance", "replay"]
related = ["isolated-acquisition-solver-handoff", "reproducibility-receipts", "kat-harness", "candidate-bank-lineage-and-cap-accounting", "seal-and-audit-protocol", "drainability-and-throughput"]
summary = "A multi-process solver should declare the child-process graph implied by its public inputs and intermediate decisions. An independent verifier reconstructs that graph, matches it exactly to committed process records, and replays every edge binding. Missing, extra, reordered, or unauthenticated children then fail even when the final summary claims success."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
A **transitive process census** treats a solver pipeline as a directed acyclic graph $G=(V,E)$. Each vertex is one expected invocation and each edge carries a committed input or output artefact. The verifier derives $G$ from the frozen protocol and authenticated public results, not from a worker's reported process count.

For every observed child it requires a process record containing the exact command, executable and source identities, standard-input hash, standard-output hash, standard-error hash, exit status, and declared output hashes. Acceptance requires a bijection between expected and observed vertices plus semantic replay along every edge. This is an execution-completeness check relative to the declared protocol, not proof that the protocol itself is complete or scientifically adequate.
'''

[[blocks]]
kind = "equations"
title = "Graph reconciliation"
body = '''
Let $V_E$ be the independently derived expected invocation multiset and $V_O$ the committed observed process-record multiset. The census condition is

$$V_E=V_O$$

under a canonical invocation identity, not merely $|V_E|=|V_O|$. For every edge $(u,v)\in E$, the producer hash written by $u$ must equal the consumer hash read by $v$:

$$H(O_u)=h^{\rm out}_u=h^{\rm in}_v=H(I_v).$$

If public stage output determines whether a conditional child exists, the verifier recomputes that predicate and derives the branch before consulting process summaries.
'''

[[blocks]]
kind = "variants"
body = '''
- **Linear pipeline:** one process per stage with a fixed order.
- **Conditional DAG:** support misses or exact cap failures legitimately remove named descendants.
- **Parallel shards:** the expected multiset contains every declared shard; completion is order-insensitive but census-sensitive.
- **Replay stage:** a child may consume frozen output instead of rerunning an ancestor, provided that provenance and semantics are explicit.
- **Remote jobs:** signed execution records replace local process files while the graph equality remains the same.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Expected branches are functions of authenticated public state and frozen policy, never hidden truth.
- Process records and every referenced stream are included in the pre-reveal output commitment.
- Exit success alone is insufficient. The protocol must declare whether standard error must be empty or merely authenticated and parsed; complete record-schema and semantic output checks remain explicit requirements.
- A replayed ancestor is labelled replayed. Its presence cannot be misreported as a new invocation or fresh power measurement.
- The graph describes observable orchestration, not operating-system containment against a malicious child.
'''

[[blocks]]
kind = "attack"
title = "Audit a process pipeline"
body = '''
Write the frozen protocol as a small independent graph builder. Starting from the public packet, derive each mandatory child and each conditional branch. Parse all committed process files, reject undeclared files, and compare canonical invocation identities. For every vertex, rehash the executable, input, output, and sidecars, then independently parse and replay its semantics. Finally, check that output-to-input hashes agree on every graph edge and that no child ran after a withholding or support-miss terminal.
'''

[[blocks]]
kind = "attack"
title = "Test the execution lifetime as well as the output graph"
body = '''
A correct output census does not show that a timed-out process tree has stopped. If every nested child starts a separate process group or session, killing only the wrapper's group can leave a native worker running. Declare which session and group owns each child and how the supervisor reaches all of its own descendants. Never infer permission to signal unrelated processes.

Exercise a timeout while a nested child is actually alive, not merely while the wrapper imports. Record process identities, launch hashes, the stop cause, cleanup and child reaping, then verify that no live descendant remains. Include exceptions after a successful launch. Cleanup belongs on every exit path, and a failed monitor observation must not be mistaken for child absence.

Keep ownership simple enough to enforce when monitoring fails. One isolated process group containing a wrapper and its fixed native worker is easier to stop than a collection of groups discovered by polling. If group creation is part of the frozen child code, account for it explicitly. A worker can wait on a one-byte launch gate until its parent has verified and durably recorded ownership; an unreleased gate must refuse, not start work. This closes the interval in which a child could launch further work before its parent has recorded how to stop it.

Preserve a verified identity for every signal. Do not reap a group leader and later treat its old numeric identifier as continuing authority. Keep cleanup independent of process-table reads, bound the wait for reaping, and withhold further launches if lifetime verification fails. A later independent observation can show that a diagnostic child really stopped, but must not retroactively turn its failed production monitor into a successful certificate. Readiness has a similar publication rule: a pathname becoming visible is not proof that its JSON is complete; consume a post-write, post-flush commit notification.

A one-shot alarm does not bound cleanup after its exception has been caught. Do not follow a failed stop operation with an unbounded blocking wait and assume the original timer still protects it. Cleanup needs its own bounded stop-and-reap path, with verified ownership and an independent deadline. Handle catchable termination of the supervisor too; otherwise its separately owned worker may outlive it.

Test ordinary completion too. A worker can finish correctly while its supervisor rejects the final cleanup operation. Process death, zombie state, reaping, a successful signal call and verified absence are different facts. Exercise both a completed leader with no live child and a completed leader whose child is still alive. Do not suppress an unexpected signal error after the run or turn a numerical result into an execution certificate. Preserve the failed receipt and test a revised cleanup contract separately.

Make monitor refusals diagnosable without weakening them. A parser that reports only "domain or duplicate" and discards the rejected row cannot distinguish an invalid state from a repeated process identifier afterward. Record the specific failed predicate and bounded relevant numeric/state fields, or an appropriately protected raw receipt, without exposing unrelated command-line secrets. A later successful census does not repair the earlier failure. Valid cleanup evidence from one stage can be preserved while the complete panel remains incomplete.

The corresponding resource gate must cover the whole orchestration interval. Pass remaining total time to each child and check the total again after the final stage, including output flush and final receipt publication. A pre-publication reserve does not measure the memory peak of serialization. Individually successful children can still produce an over-budget panel. Numerical replay and process-lifetime checks establish different facts; neither substitutes for the other.

Include the outer shell launcher in the evidence boundary. A guard can return and leave complete-looking output, yet a later shell bookkeeping error can discard its actual exit status. Keep a simple guard command last so the command runner observes its status directly. If more commands must follow, capture the status immediately in an ordinary task-specific variable; do not reuse shell special variables, some of which are read-only. Check the launcher with both zero-exit and nonzero-exit stubs under the actual shell before a one-shot experiment. A later wrapper failure proves neither that the guarded computation failed nor that it exited zero. Preserve the output and mark the missing status incomplete rather than rerunning or inferring success.

Distinguish the requested launch environment from the environment the interpreter actually observes. Even a cleared environment can acquire platform-generated variables during startup. Test that boundary with a tiny runtime-only probe before committing a one-shot scientific panel; record declared inputs and the observed environment, and freeze any permitted normalization explicitly. Otherwise an exact dictionary comparison may refuse before the method or fixtures run. Such a failure supplies no evidence about the mathematical method, and a later diagnosis does not authorize a retry of the consumed panel.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function VERIFY_PROCESS_DAG(public, bundle, protocol):
    expected = DERIVE_EXPECTED_DAG(public, bundle.public_stage_results,
            protocol)
    observed = PARSE_ALL_PROCESS_RECORDS(bundle)
    require CANONICAL_VERTEX_MULTISET(observed) == expected.vertices
    for process in observed:
        require HASH(process.executable) == process.executable_hash
        require HASH(process.stdin) == process.stdin_hash
        require HASH(process.stdout) == process.stdout_hash
        require HASH(process.stderr) == process.stderr_hash
        require process.exit_status == protocol.expected_exit(process)
        require INDEPENDENTLY_REPLAY(process.stdout, process.stage)
    for edge in expected.edges:
        require OUTPUT_HASH(edge.parent) == INPUT_HASH(edge.child)
    require NO_PROCESS_EXISTS_AFTER_WITHHELD_BRANCH(expected, observed)
    return COMPLETE_PROCESS_CENSUS
```
'''

[[blocks]]
kind = "complexity"
body = '''
Graph construction is $O(|V|+|E|)$. Hashing and semantic replay dominate and are linear in committed stream size plus the cost of stage-specific checks. The method records more data than a final-summary receipt, because completeness cannot be reconstructed from a summary alone.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Count-only reconciliation.** Two wrong invocations replace two expected ones while the total remains unchanged.
- **Self-reported authentication.** The orchestrator says a child was verified, but no independent raw record supports it.
- **Uncommitted losing outputs.** Nonselected model scores or aliases disappear, making selection impossible to replay.
- **Unsolicited batch.** An undeclared child explores another seed or branch and only its best result reaches the summary.
- **Missing conditional child.** A branch predicate required work, but the absence is mislabelled as a support miss.
- **Replay presented as execution.** Frozen results are described as a fresh run and incorrectly counted as new power evidence.
- **Process success presented as method success.** A complete DAG proves orchestration, not that the search family is useful.
'''

[[blocks]]
kind = "controls"
body = '''
Use a small deterministic DAG and mutate each vertex and edge class: change a command, executable, input hash, output hash, standard error, exit status, stage order, or branch predicate; drop one expected process; add one unsolicited process; and retain a process after a declared withholding terminal. Require exact refusal. Then run the actual single-child and short-chain boundaries before attempting a large conditional graph.
'''

[[blocks]]
kind = "example"
title = "Conditional three-stage graph"
body = '''
A proposal process always runs. Its authenticated output either contains no support, ending the graph, or requires a scoring child. Only a certified scoring winner may trigger an expansion child. If support exists, the expected graph is `proposal -> score -> expand`; a bundle containing only `proposal -> score` is incomplete. If support is empty, a committed `expand.process.json` is unsolicited and also fails. The final process count alone cannot distinguish these cases.
'''

[[blocks]]
kind = "notes"
body = '''
Workflow provenance and execution graphs are established engineering ideas. This entry captures the stricter cryptanalytic use: exact process-file census, branch derivation from authenticated public state, and independent semantic replay before any hidden evaluation.
'''

