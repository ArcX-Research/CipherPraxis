id = "wasm-site-engineering"
section = "engineering"
title = "WASM site engineering"
subtitle = "How this knowledge base is built: Rust and Leptos compiled to WebAssembly, with TOML content validated at build time"
status = "UNTESTED"
status_note = "The stack, pipeline and content schema are specified in the architecture note and the workspace skeleton exists, but at the time of writing the build script and content model are placeholders and no build has been verified; this entry describes the design and will be updated when the build passes."
family = "Tooling"
tags = ["wasm", "rust", "leptos", "toml", "static site"]
related = ["reproducibility-receipts", "kat-harness", "build-manifests-and-release-json", "vigenere-lab", "null-lab"]
summary = "The atlas is a client-side web application: content lives in one TOML file per entry, a build step validates every file against a fixed schema, lints public fields for forbidden tokens and bundles the result into JSON that the Rust application embeds; the UI, the search index, the Markdown and math renderer and the interactive cipher labs all run in the browser as WebAssembly. The design applies the program's own rules to itself: pinned toolchain versions, native unit tests for the cipher code, and a lint that fails the build rather than a review that might not happen."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
**Stack.** Rust with Leptos 0.8 (client-side rendering) compiled to `wasm32-unknown-unknown`, built with `cargo build` and the `wasm-bindgen` CLI at a version pinned to the `Cargo.toml` dependency (0.2.127); no bundler dependency, one shell script to build and one to serve. Checked toolchain: `rustc`/`cargo` 1.95, `wasm-pack` 0.13.1, Node 22.

**Workspace.** Two crates: `core` (content model, Markdown and math rendering, search, and the cipher and statistics code with native `cargo test`) and `web` (the Leptos application and the build script). Release profile: `opt-level = "s"`, `lto = true`, `codegen-units = 1`, `panic = "abort"`, `strip = true`, with `opt-level = 3` for the core crate.

**Pipeline.** `content/<section>/<id>.toml` → build script (validate schema, lint public fields, check `related` ids, bundle to JSON) → `include_str!` → `serde_json` at start-up → in-memory indexes → views. Markdown is rendered with `pulldown-cmark` (math extension) and `$…$` / `$$…$$` spans become MathML through `pulldown-latex`, rendered natively by the browser with no external script.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Each entry is a single TOML document with the fixed fields (`id`, `section`, `title`, `status`, `family`, `tags`, `related`, `summary`, `updated`, ordered `[[blocks]]`, `[[provenance]]`, `[[references]]`) and the fixed vocabularies for `status`, block `kind` and provenance `kind`.
- Public fields contain general cryptography only; the lint rejects a fixed list of forbidden tokens, case-insensitively and word-bounded, and exempts provenance paths and notes so that internal file names remain citable.
- The browser supports MathML and WebAssembly; there is no server-side rendering and no dark theme.
'''

[[blocks]]
kind = "attack"
title = "Why validate at build time"
body = '''
The knowledge base makes the same claim about itself that it makes about the research program: numbers trace to receipts and negatives state their scope. A build-time validator is the mechanical version of that claim. A missing `[[provenance]]` for a quoted figure, an unknown `related` id, an invalid status word or a forbidden token fails the build; a reviewer who might be tired does not.
'''

[[blocks]]
kind = "complexity"
body = '''
The whole application is one WebAssembly binary plus one JSON bundle; the content bundle grows linearly with entries. Native tests for the cipher code run without the web layer, so the labs' correctness (encrypt then decrypt identity, known-answer vectors) is checked in seconds by `cargo test`.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Specification ahead of implementation.** At the time of writing the workspace's build script and content model are one-line placeholders; the lint and validation described here are design, not yet receipts, which is why the status is `UNTESTED`.
- **Lint scope.** A token list catches names; it does not catch a quoted ciphertext or a paraphrased hint, which remain editorial rules enforced by review.
- **Renderer subset.** The math renderer supports a standard LaTeX subset; entries keep to fractions, subscripts, sums, modular notation and Greek letters so that no formula silently renders as text.
'''

[[blocks]]
kind = "controls"
body = '''
Planned controls, to be recorded as receipts once the build runs: a TOML fixture that must fail each lint rule (forbidden token in a public field, unknown related id, invalid status) and one that must pass; native known-answer tests for every lab cipher; a check that every `[[provenance]]` path exists in the repository.
'''

[[blocks]]
kind = "example"
title = "Build steps"
body = '''
```
cargo test -p praxis-core                                   # native cipher and statistics tests
cargo build --release --target wasm32-unknown-unknown -p praxis-web
wasm-bindgen --target web --out-dir dist target/wasm32-unknown-unknown/release/praxis_web.wasm
python3 scripts/serve.py dist                               # static serve
```
'''

