title = "Drainability and throughput"
subtitle = "Measure whether a complete search can finish within its time and memory budget"
status = "VERIFIED"
status_note = "Complete runs print full counters, such as 248,405 of 248,405 pairs in 307.5 s with complete=1. Runs that cannot finish report measured rates and estimated thread-days. An exact zero additionally requires a validated gap-free enumerator and sound pruning; caps make the result inconclusive within its stated scope."
family = "Compute and throughput"
