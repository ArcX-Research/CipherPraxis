id = "drainability-and-throughput"
section = "engineering"
title = "Drainability and throughput"
subtitle = "Measure whether a complete search can finish within its time and memory budget"
status = "VERIFIED"
status_note = "Complete runs print full counters, such as 248,405 of 248,405 pairs in 307.5 s with complete=1. Runs that cannot finish report measured rates and estimated thread-days. Only a naturally finished search may claim an exact zero; any capped result is inconclusive within its scope."
family = "Compute and throughput"
tags = ["throughput", "exhaustive search", "budget", "memory"]
related = ["throughput-fail", "state-checkpoints", "compiled-hot-cores", "power-measurement", "exhaustive-enumeration", "rank-sharding", "bound-benchmarks-and-certificates", "g-throughput"]
summary = "A complete-search negative is valid only if the search really finished. A search is drainable when every task completes naturally and all counters reach their totals. Throughput is the measured work rate used to predict whether that will happen within budget. Every final record reports both. A capped run is not negative. Memory estimates also reject designs that cannot fit before they are built."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A search **drains naturally** when it reports `complete=1`, `queued=0`, `active=0`, `tasks_complete=1`, `endpoint_overcap=0` and every `done/total` counter equal, so that the terminal `EXACT_ZERO` (no solution in the family) is a statement about the whole family. Any run stopped by a wall cap, a node budget or a resource ceiling reports `SCOPED_INCONCLUSIVE` with its exact processed prefix.

**Throughput** is measured per work unit in the live task order: pairs per second, nodes per pair, and the fraction of the frontier covered at the cap.
'''

[[blocks]]
kind = "equations"
title = "Capacity arithmetic"
body = '''
Before implementing a persistent-lineage beam, the program computed its state capacity exactly. With $G$ retained roots, $R$ descendants per root, packed states of 248 bytes and $B(f, n)$ live bins for a first-word length $f$ and text length $n$,

$$\text{bytes} = B(f, n) \cdot G \cdot R \cdot 248, \qquad B(f,n) = \max_s \sum_{d = s}^{\min(n, s+11)} \Big(d - f - \big\lceil \tfrac{d - f}{12} \big\rceil + 1\Big).$$

For $f = 8, n = 61, G = 4{,}096$: 2.0 GiB at $R = 4$, 49 GiB at $R = 98$ and 17 TiB at the measured requirement $R = 35{,}639$, so the declared 2 GiB gate was infeasible and the lane was closed as a control/power feasibility blocker without running a target.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Rates are measured in the live cell, not in an easier sibling; a three-shift cell at about 800 pairs/s said nothing about the two-extra-shift cell at 0.5 pairs/s.
- Memory ceilings are enforced by the launcher (`ulimit`, an RSS guard between fixtures, a hard process stop) and a ceiling hit is a resource terminal, never a null win or a rejection.
'''

[[blocks]]
kind = "attack"
body = '''
Throughput measurement decided three lanes. A shared-cycle full-spelling cell drained in 307.5 s and produced a genuine exhaustive negative for exactly that cell (one of 456,976 shift vectors, one relation). Its two-extra-shift sibling measured 740,000 nodes per pair against 80, a 6.9-times larger frontier and about 40 thread-days per relation, and was run only as a declared 24-hour scoped job. A seven-free-shift cell was identifiable ($\approx 2^{-291}$ spurious rate) but had weaker prunes still, and was declared computationally non-viable, not run and not a negative. The remaining option, an inhomogeneous-row core restoring the pruning strength at an estimated 2.4 days on 12 threads, was recorded as a decision for the release authority.
'''

[[blocks]]
kind = "complexity"
body = '''
Time to drain is frontier size over rate; the program's frontiers ranged from 55,497 to 1,825,380 pairs across random plants at 0.17 to 16.1 pairs/s on two threads (median 1.21), so drain times spanned minutes to weeks for the same code on different inputs.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Memory ceilings mid-run.** A general-cell lane was stopped by an RSS ceiling and filed as `RESOURCE_BLOCKED-rss-ceiling`; a superseding slice design followed.
- **Wall measured as CPU.** A bound benchmark that reported wall time as CPU time was filed as invalid.
- **Partial results read as exclusions.** Runs stopped after 2,000 of 489,600 or 160,000 of 1,958,400 placements are exploratory only in the ledger.
'''

[[blocks]]
kind = "controls"
body = '''
Blind controls must drain and find exactly the planted truth with zero false-valid candidates before a live cell is released; the recorded controls drained 149,572/149,572 and 18,346/18,346 tasks. Segment KATs prove that partial drains compose exactly.
'''

[[blocks]]
kind = "example"
title = "Drain report"
body = '''
```
DRAIN relation=A cell=three-shift threads=12 wall=307.522s
  pairs=248405/248405 triples=494577/494577 queued=0 active=0 tasks_complete=1 complete=1
  endpoint_overcap=0 endpoints=0 solutions=0
TERMINAL EXACT_ZERO (this cell only: 1/456,976 shift vectors, one relation)
```
'''

