related = ["throughput-fail", "compiled-hot-cores", "power-measurement", "exhaustive-enumeration", "rank-sharding", "bound-benchmarks-and-certificates", "reproducibility-receipts", "transitive-process-census", "g-throughput"]
summary = "A complete-search negative requires a validated partition and pruning rules, no active cap, natural worker termination, and counters that cover the declared family. Throughput can project completion only for a specified task mix and sufficiently stable measured rate. Sampled memory monitoring is an empirical guard, not a hard peak bound."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
A search **drains naturally** when it reports `complete=1`, `queued=0`, `active=0`, `tasks_complete=1`, `endpoint_overcap=0` and every `done/total` counter equal. Those tokens support `EXACT_ZERO` for the declared family only after the task partition, enumerator, pruning rules, and counters have been validated. Any run stopped by a wall cap, a node budget or a resource ceiling reports `SCOPED_INCONCLUSIVE` with its recorded processed subset.

**Throughput** is measured per work unit in the live task order: pairs per second, nodes per pair, and the fraction of the frontier covered at the cap.
'''

[[blocks]]
kind = "equations"
title = "Capacity arithmetic"
body = '''
Before implementing a persistent-lineage beam, the program computed its state capacity exactly. With $G$ retained roots, $R$ descendants per root, packed states of 248 bytes and $B(f, n)$ live bins for a first-word length $f$ and text length $n$,

$$\text{bytes} = B(f, n) \cdot G \cdot R \cdot 248, \qquad B(f,n) = \max_s \sum_{d = s}^{\min(n, s+11)} \Big(d - f - \big\lceil \tfrac{d - f}{12} \big\rceil + 1\Big).$$

For $f = 8, n = 61, G = 4{,}096$: 2.0 GiB at $R = 4$, 49 GiB at $R = 98$ and 17 TiB at the measured requirement $R = 35{,}639$, so the declared 2 GiB gate was infeasible and the lane was closed as a control/power feasibility blocker without running a target.
'''

[[blocks]]
kind = "assumptions"
body = '''
- Rates are measured in the live cell, not in an easier sibling. A three-shift cell at about 800 pairs/s did not determine the two-extra-shift cell's measured 0.5 pairs/s.
- A projection assumes that the measured task mix and per-task cost remain representative of the unprocessed frontier. Report stratified rates or uncertainty when they do not.
- State what a resource mechanism actually enforces. An operating-system limit, a sampled external RSS stop and a post-exit admission check are different mechanisms. A check between fixtures cannot bound a single fixture's peak. A ceiling hit is a resource terminal, never a null win or a rejection.
'''

[[blocks]]
kind = "assumptions"
title = "Bound storage before relying on a monitor"
body = '''
Keep three quantities separate: a static allocation bound, the external monitor's trigger, and the measured peak used for admission. A fixed-size packed table can give an exact payload bound. A guessed number of bytes per Python dictionary state cannot: keys, values, table over-allocation, live recursion frames, cached predecessors and allocator overhead also matter. Validate dimensions before allocating factorial lists, and refuse before exceeding an explicit capacity.

Use a watchdog outside the searched process for wall time and sampled RSS. Trigger below the admission limit, record its sampling interval and measured overshoot, and test it on a small bounded helper before a combinatorial search. A poller can miss a rapid peak or be delayed; it is not an instantaneous kernel-enforced ceiling. Checks in a search callback also miss time spent in other phases or blocked native calls.

An interrupted run remains incomplete even if every finished case passed. Preserve all attempts and their peak measurements. A smaller or packed successor needs its own reviewed source and resource contract; it does not turn earlier over-cap runs into valid controls.
'''

[[blocks]]
kind = "attack"
body = '''
Throughput measurement decided three lanes. A shared-cycle full-spelling cell drained in 307.5 s and supported an exhaustive negative for exactly that validated cell (one of 456,976 shift vectors, one relation). Its two-extra-shift sibling measured 740,000 nodes per pair against 80, a 6.9-times larger frontier and about 40 thread-days per relation, and was run only as a declared 24-hour scoped job. Under the recorded random-map model, a seven-free-shift cell had an estimated spurious-match probability of about $2^{-291}$; this was not an identifiability proof. Its weaker pruning made it computationally non-viable, so it was not run and yielded no negative. The estimated 2.4 days on 12 threads for an inhomogeneous-row core was a planning projection, not a completed measurement.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function RUN_WITH_CAP(frontier, wall_cap, node_budget, rss_ceiling, threads):
    done = 0; nodes = 0; start = now()
    for each task in frontier, in the live task order, over threads:
        if now() - start > wall_cap or nodes >= node_budget:
            return SCOPED_INCONCLUSIVE(done, |frontier|)
        if external watchdog reports sampled RSS trigger:
            return RESOURCE_BLOCKED(done, |frontier|)
        process task; done = done + 1; nodes = nodes + nodes of this task
    join all workers
    if complete == 1 and queued == 0 and active == 0 and tasks_complete == 1
       and endpoint_overcap == 0 and every done/total counter is equal:
        print DRAIN counters and wall time
        return EXACT_ZERO if solutions == 0 else solutions
    return SCOPED_INCONCLUSIVE(done, |frontier|)

function THROUGHPUT(done, nodes, elapsed, frontier):
    require done > 0 and elapsed > 0
    rate = done / elapsed
    nodes_per_pair = nodes / done
    coverage = done / |frontier|
    projected_total = |frontier| / rate
    projected_remaining = (|frontier| - done) / rate
    return rate, nodes_per_pair, coverage, projected_total, projected_remaining

function CAPACITY_BYTES(f, n, G, R):
    return B(f, n) * G * R * 248
```
'''

[[blocks]]
kind = "complexity"
body = '''
The estimate $|F|/\hat r$ treats the observed rate $\hat r$ as representative of the remaining frontier. That assumption can fail when task costs vary. In the recorded panel, frontiers ranged from 55,497 to 1,825,380 pairs and measured rates from 0.17 to 16.1 pairs/s on two threads (median 1.21), demonstrating that a rate from one input is not automatically transferable to another.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Memory ceilings mid-run.** A general-cell lane was stopped by an RSS ceiling and filed as `RESOURCE_BLOCKED-rss-ceiling`. A superseding slice design followed.
- **Wall measured as CPU.** A bound benchmark that reported wall time as CPU time was filed as invalid.
- **Partial results read as exclusions.** Runs stopped after 2,000 of 489,600 or 160,000 of 1,958,400 placements are exploratory only in the ledger.
'''

[[blocks]]
kind = "controls"
body = '''
Blind controls must drain and find exactly the planted truth with zero false-valid candidates before a live cell is released. The recorded controls drained 149,572/149,572 and 18,346/18,346 tasks. Segment KATs check the declared partition and reducer against an unsegmented run; their coverage is limited to the tested cases.
'''

[[blocks]]
kind = "example"
title = "Drain report"
body = '''
```
DRAIN relation=A cell=three-shift threads=12 wall=307.522s
