summary = "A linear congruential generator (LCG) follows k_i = a k_(i−1) + b modulo M from a seed. A recurrence using k_(i−L) for L > 1 is a related lagged affine generator, not the standard one-step LCG. If an additive cipher uses either recurrence in the same modulus, then c_i − a c_(i−L) = p_i − a p_(i−L) + b where the recurrence applies. This exact cancellation depends on the indexing, modulus, and encryption convention; recognizing the remaining plaintext expression is a separate statistical problem."
