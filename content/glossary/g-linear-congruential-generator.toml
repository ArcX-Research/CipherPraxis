summary = "A linear congruential generator (LCG) starts with seed k_0 and follows k_i = a k_(i-1) + b modulo M. A wider version may use lag L. When this sequence becomes a running key, it leaves a mathematical trace. Subtracting a times the ciphertext at lag L removes the key. What remains is a scaled difference of the plaintext plus a constant, which can be compared with the expected language pattern."
