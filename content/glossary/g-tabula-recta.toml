summary = "A tabula recta is a square tableau whose rows are cyclic shifts of an alphabet. With A = 0 on a 26-letter straight alphabet, row k and column p give p + k modulo 26 for Vigenère; related reading conventions give Beaufort and Variant Beaufort. A periodic additive cipher selects a row by its key schedule. Keyed-alphabet variants may replace the plaintext axis, ciphertext rows, or both, and their alignment convention must be stated explicitly."
