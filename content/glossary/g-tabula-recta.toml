summary = "A tabula recta is a 26 x 26 table whose row k is the alphabet shifted by k. Row k at column p gives p + k for Vigenère. Reading backwards gives k - p for Beaufort, while p - k gives Variant Beaufort. Every additive periodic cipher moves through this table one row per coset. A keyed version replaces the straight alphabet on both axes."
