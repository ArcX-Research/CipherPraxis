summary = "Two permutations w and t are conjugate when w = z^-1 t z for some bijection z. Conjugation changes the labels but keeps the cycle type. A keyed additive substitution is a plain rotation relabelled by its mixed alphabet. When its shift is a unit, it is one 26-cycle. This view lets a solver extend a partial decryption map one edge at a time, then join its paths into a full cycle."
