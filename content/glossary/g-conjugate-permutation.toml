summary = "Two permutations w and t are conjugate when w = z^-1 t z for some bijection z; conjugation relabels the elements and preserves the cycle type. A keyed additive substitution is the conjugate of a plain rotation by the coordinate map of its mixed alphabet, so when the shift is a unit it is itself a single 26-cycle. This representation lets a partial decryption map be extended edge by edge and completed to a full cycle by joining its path components."
