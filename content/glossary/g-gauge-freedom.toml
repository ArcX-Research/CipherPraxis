summary = "A transformation of a model's unknown parameters that leaves every observable unchanged, so the parameters are identifiable only up to a group of such transformations. For a keyed additive cipher the gauge group is generated by translating the alphabet coordinates (with the key shifting along) and multiplying them by a unit modulo 26. A gauge is fixed by pinning one coordinate or removed by canonicalising after enumeration; comparing a recovered object in one gauge while scoring it in another is a defect that fails correct solutions."
updated = "2026-09-04"
