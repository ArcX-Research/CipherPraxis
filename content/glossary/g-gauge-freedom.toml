summary = "Gauge freedom means that specified parameter transformations leave every observable result of a model unchanged. The raw parameters are then not identifiable within each equivalence class. Some keyed additive models permit a common coordinate shift, or multiplication by a unit modulo 26 together with the corresponding key transformation; this must be proved from the model equations. A solver may choose a canonical representative, but recovery, scoring, and comparison must use the same declared gauge action."
