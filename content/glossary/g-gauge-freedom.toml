summary = "Gauge freedom means that some parameter changes leave every observable result unchanged. Those parameters cannot be recovered as one unique raw value. For a keyed additive cipher, the alphabet coordinates may be shifted with the key, or multiplied by a unit modulo 26. A solver can fix one coordinate or choose one standard form after enumeration. It must not recover in one gauge and score in another."
