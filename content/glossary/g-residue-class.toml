summary = "A residue class contains all integers with the same remainder modulo n. The classes modulo n form the ring Z_n. In cipher analysis, letters are residues modulo 26. Positions can also be residues modulo a key period, so positions congruent to b modulo m use one key element. If two periods are coprime, each position gives one pair of residues, and every pair appears once during a full cycle."
