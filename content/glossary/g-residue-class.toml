summary = "The set of integers congruent to a given value modulo n; the residue classes modulo n form the ring Z_n. In cipher analysis residue classes appear twice: letters are residues modulo 26, and positions are residues modulo a key period, so that the positions congruent to b modulo m share one key element. When two periods are coprime, a position determines a pair of residues and, over one full cycle of length equal to their product, every pair occurs exactly once."
