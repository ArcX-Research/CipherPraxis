summary = "An independent audit reviews the exact sealed files and is done by someone who did not write them. The auditor recomputes hashes, reruns public modes, changes parser inputs, and tests tamper and refusal cases on copies. The result is PASS or BLOCK, with each blocker named. A PASS covers only the tested files and checks. It does not approve other work or say anything about a target."
updated = "2026-09-04"
