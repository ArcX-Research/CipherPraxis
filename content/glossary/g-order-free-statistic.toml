summary = "An order-free statistic uses which letters fall into each coset, but ignores their order. A transposition below the layer being tested cannot change it. Coset histograms, exact-alignment scores, shift-averaged single-letter evidence, and class patterns are order-free; quadgram rates are not. While a transposition remains, the project uses only order-free scores. Quadgrams become useful after every transposition has been undone."
