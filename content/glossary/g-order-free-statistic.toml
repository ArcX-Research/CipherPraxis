summary = "An order-free statistic depends only on which letters fall into which cosets, never on their sequence, so it is unchanged by any transposition applied beneath the layer being fitted: coset histograms, the exact alignment objective, shift-marginalised monogram evidence and class-posterior block patterns are order-free; quadgram rates are not. The corpus's rule is that while any transposition remains unstripped a candidate must be scored order-free, because the correct configuration then has a language-exact monogram distribution and a noise-level quadgram rate; quadgrams are used only after every transposition has been undone."
