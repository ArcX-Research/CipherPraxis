summary = "An order-free statistic is invariant under a declared set of reorderings. A coset histogram, for example, is unchanged by permutations within that coset, but an arbitrary transposition may move symbols between cosets and change it. Single-letter histogram scores and their shift averages ignore within-group order; n-gram scores do not. Every use must name the groups and transformations under which invariance is proved. Ordered scores can still be used to search candidate transpositions, but not as invariants of an unresolved arbitrary transposition."
