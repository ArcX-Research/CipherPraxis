summary = "A shard is one declared subset of a larger search, often represented by a half-open rank or index range. A complete shard schedule must prove that its subsets cover the intended space without gaps and handle overlap according to a fixed deduplication rule. Each shard records its completion and all results required by the reducer's decision rule, including declared boundary ties. Only a validated reducer over completed required shards reproduces the monolithic result; an unfinished shard supports at most a scoped partial-coverage statement."
updated = "2026-09-07"
