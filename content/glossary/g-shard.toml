summary = "A shard is one declared half-open range of an exact search. It may cover ranks in a k-best list, key-permutation indices, or part of a hash-ordered task list. Adjacent shards divide the full space with no gaps or overlap. Each runs on its own and saves its best score plus every near tie. A reducer combines the results exactly. An unfinished shard cannot support a conclusion."
