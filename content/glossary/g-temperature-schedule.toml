family = "Search and optimisation"
tags = ["annealing", "metropolis"]
related = ["simulated-annealing", "parallel-tempering"]
summary = "A temperature schedule controls how a Metropolis search becomes less willing to accept worse moves. The geometric schedule T_t = T_0 (T_1/T_0)^(t/N) lowers log T evenly from T_0 to T_1 over N steps. A move that loses one score unit is accepted with probability exp(-1/T_t), often early and rarely late. Parallel tempering instead runs chains at a fixed ladder of temperatures and swaps states between nearby levels."
updated = "2026-09-04"
