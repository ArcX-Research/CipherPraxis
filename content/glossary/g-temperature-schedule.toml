title = "Temperature schedule"
status = "VERIFIED"
status_note = "Standard term."
family = "Search and optimisation"
tags = ["annealing", "metropolis"]
related = ["simulated-annealing", "parallel-tempering"]
summary = "The rule by which the temperature of a Metropolis search decays. A geometric schedule T_t = T_0 (T_1/T_0)^(t/N) lowers log T linearly from T_0 to T_1 over N steps, so a move that worsens the score by one unit is accepted with probability exp(-1/T_t), high early and negligible late. In parallel tempering the schedule is replaced by a fixed geometric ladder of temperatures across chains, with exchange moves between adjacent levels."
updated = "2026-09-04"
