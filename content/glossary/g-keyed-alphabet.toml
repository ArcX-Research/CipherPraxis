summary = "A keyed alphabet is a rearranged alphabet built from a keyword. Write each distinct keyword letter once, then add the unused letters in a chosen order. That order may be straight, reversed, continued from the keyword's last letter, or read by columns. Analysts can list every keyed alphabet from a word list or text. They cannot list all 26! arbitrary alphabets in practice."
