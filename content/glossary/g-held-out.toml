id = "g-held-out"
section = "glossary"
title = "Held-out (data, controls, gates)"
status = "VERIFIED"
status_note = "Standard evaluation term; what was held out must be stated relative to every adaptive fitting and selection stage."
family = "Validation"
tags = ["calibration", "contamination", "corpus"]
related = ["english-gate-calibration", "power-analysis", "local-language-model-prior", "held-out-gates", "g-power"]
summary = "Held-out data were excluded from the model fitting or tuning steps named in the evaluation contract. Training, threshold selection, and final power evaluation should use disjoint data when those stages can adapt to examples. Overlap can bias measured performance upward; a training example is not an independent estimate of generalization. A control may also be committed in advance and concealed until development checks pass."
updated = "2026-09-07"
