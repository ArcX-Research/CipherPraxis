related = ["english-gate-calibration", "power-analysis", "local-language-model-prior", "held-out-gates", "g-power"]
summary = "Held-out text was not used to build the model being tested. A language table should train on one part of a corpus, set its thresholds on a separate part, and draw planted controls from a third part. Overlap makes the results look better than they are. A control copied from the training data says nothing about decoding power. A held-out control can also be declared in advance and kept hidden until development checks pass."
updated = "2026-09-04"
