summary = "A transposition grid is the declared layout used to rearrange a message; examples include rectangles, triangles, squares, and zigzags. Under conventional left-to-right row filling, a width-w, length-n rectangle has ceil(n/w) rows, and when the final row is short its first n mod w columns have one extra symbol. Other fill conventions give different column lengths. A later periodic layer links the grid to coset membership, which can supply a width diagnostic but not guaranteed identification."
