summary = "A transposition grid is the shape used to rearrange a message. It may be a rectangle, triangle, square, or zigzag. For width w and length n, a rectangular grid has ceil(n / w) rows. If the last row is short, its first n mod w columns have one extra letter. When a periodic layer comes after the readout, the grid decides which plaintext positions share a coset. This can reveal the width before the column order is known."
