summary = "A build manifest records the inputs and fixed configuration of a run before outputs exist. In this project it is a canonical one-line JSON record listing input paths and SHA-256 hashes, fixed parameters, and permitted output paths. It cannot precommit the unknown hashes of later outputs; a separate release record can bind those outputs to the manifest and audit records. Other reproducibility systems may use different serializations with the same role."
