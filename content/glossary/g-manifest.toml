summary = "A detached, canonical one-line JSON record written after an implementation is frozen and before it is audited, naming every input by path and SHA-256, every constant the run depends on, and every path the run may create, and containing no hash of anything written later. A release record, written by the release authority after the audits, binds the manifest, the audits and an authorisation token."
