title = "Power (of an instrument or selector)"
status = "VERIFIED"
status_note = "Standard term; measured on planted fixtures for every lane that cites a negative."
family = "Statistics"
tags = ["false negative", "planted controls", "gate"]
related = ["power-analysis", "power-measurement", "planted-controls", "permutation-test", "g-held-out"]
summary = "Power is the chance that a full pipeline finds the truth when the tested cipher is present. It is estimated from the share of planted cases the frozen pipeline solves, with a separate forward check and a confidence interval. A miss rules out a family only with that measured power. At 0.92 power, there is still an 8% chance of missing a real answer. Power belongs to the whole pipeline at the tested settings and text length, not to one step or a coverage estimate."
updated = "2026-09-04"
