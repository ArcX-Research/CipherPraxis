title = "Power (of an instrument or selector)"
status = "VERIFIED"
status_note = "Standard statistical term; the analogous recovery rate is explicitly limited to the tested pipeline and plant distribution."
family = "Statistics"
tags = ["false negative", "planted controls", "gate"]
related = ["power-analysis", "power-measurement", "planted-controls", "permutation-test", "g-held-out"]
summary = "Statistical power is the probability that a specified decision rule rejects its null under a specified alternative and parameter setting. For a recovery pipeline, an analogous success probability can be estimated on planted cases drawn from a declared distribution, with uncertainty intervals and independent forward checks. That estimate applies to the complete frozen pipeline, input distribution, text length, and resource budget tested. Search-space coverage is not power unless an explicit model links truth location to the search order."
