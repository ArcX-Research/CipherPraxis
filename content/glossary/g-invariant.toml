title = "Invariant (necessary condition)"
status = "VERIFIED"
status_note = "Standard term; the corpus distinguishes invariants proved for a whole family from statistics that are merely typical of it."
family = "Algebra"
tags = ["necessary condition", "structural test"]
related = ["residue-class-graphs", "difference-operators", "dihedral-group", "tautological-gate-rule", "valid-model-nulls"]
summary = "An invariant is a quantity or relation unchanged by a specified transformation, or a necessary condition implied by a precisely stated model. Its assumptions include the allowed keys, data representation, and any treatment of plaintext variables. Failure of a proved necessary condition excludes that model instance; satisfaction establishes only compatibility, not positive evidence or sufficiency. A pattern with model-valid exceptions is a heuristic clue, not an invariant."
