title = "Invariant (necessary condition)"
status = "VERIFIED"
status_note = "Standard term; the corpus distinguishes invariants proved for a whole family from statistics that are merely typical of it."
family = "Algebra"
tags = ["necessary condition", "structural test"]
related = ["residue-class-graphs", "difference-operators", "dihedral-group", "tautological-gate-rule", "valid-model-nulls"]
summary = "An invariant is a rule that every member of a cipher family must obey, whatever its key, alphabet, or plaintext. Examples include matching equality patterns within a key class and cycle sums of zero on a residue graph. If an invariant fails, the family is impossible. If it holds, the family is only still possible; that alone is not supporting evidence. A pattern that has legal exceptions is a useful clue, not an invariant."
