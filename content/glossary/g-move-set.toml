summary = "A move set lists the small changes a local search may make. For an alphabet, these may be two-letter swaps or moving one letter to another slot: 325 + 600 = 925 neighbours. A 5x5 square may also swap rows or columns or transpose the grid. A column order may reverse or rotate a segment. Every move must keep the key valid. These moves also define how search distance is measured."
