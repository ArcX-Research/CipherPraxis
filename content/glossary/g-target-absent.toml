summary = "Target-absent code is designed and audited without access to the evaluated ciphertext. Its declared dependencies contain no target loader, embedded target value, or target execution mode, and its records mark that boundary explicitly. This reduces one route for outcome-dependent tuning, but it is an engineering claim about inspected code and inputs rather than proof of isolation from every possible external channel."
