summary = "Forward checking is a form of constraint propagation used during backtracking. After assigning a variable, it removes inconsistent values from the domains of unassigned variables connected by a constraint. If any domain becomes empty, the branch fails immediately. Selecting a smallest remaining domain is a separate variable-ordering heuristic; it often reduces search but does not change the solution set."
