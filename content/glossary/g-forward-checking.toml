summary = "Forward checking is a step in backtracking search. After assigning one variable, it removes values that can no longer work from nearby unassigned variables. If a variable has no values left, the solver backs up at once instead of exploring a dead branch. Choosing the variable with the fewest options next makes this even faster. One planted nine-row word puzzle needed only 244 search nodes."
