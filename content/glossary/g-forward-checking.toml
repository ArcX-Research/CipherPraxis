summary = "In backtracking search over a constraint satisfaction problem, the step that, immediately after assigning a value to one variable, removes from every unassigned neighbouring variable the values that are now inconsistent with it. An emptied domain triggers an immediate backtrack, so dead branches are abandoned before deeper assignments are tried. Combined with choosing the variable with the fewest remaining values, it keeps the search tree small: a planted nine-row word puzzle solved in 244 nodes."
