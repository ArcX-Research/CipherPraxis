summary = "A gauge is a way to change a key without changing any plaintext-ciphertext pair. Examples include rotating a Quagmire alphabet while adjusting its shifts, relabelling a Trifid cube's coordinates, or rotating and reflecting an Alberti disc. These keys look different but act the same. A control must treat them as equal under the gauge. Requiring the raw keys to match would reject correct answers."
