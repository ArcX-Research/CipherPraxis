summary = "A gauge class is an equivalence class of parameter values that induce the same observables under a specified model. Examples can include rotating a Quagmire alphabet while compensating its shifts, relabelling a coordinate square or cube with corresponding parameter changes, or applying proved disc symmetries. These transformations are not automatic for every variant. Recovery controls should compare the induced transform or a model-specific canonical representative, rather than require one arbitrary raw parameterization."
