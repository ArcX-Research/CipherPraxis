summary = "Beam width W is the number of partial answers kept after each step of a beam search. Any prefix ranked below W is discarded for good. The needed width depends on the true prefix's worst rank at any step, not its final rank. In a planted 63-letter check, the true English prefix fell to rank 81,978 at character 5, beyond every beam that was tried. An exact solver can screen a larger ranked pool before this cut."
