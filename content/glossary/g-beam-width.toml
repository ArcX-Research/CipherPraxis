summary = "The number W of partial solutions retained after each extension step of a beam search. A prefix ranked below W at any position is discarded permanently, so the width needed is set by the worst rank the true prefix ever takes, not by its final rank; on planted 63-letter controls the true English prefix sat at rank 81,978 at character 5, beyond any beam that was run. Ranked pools larger than the beam can be screened by an exact solver before the cut."
updated = "2026-09-04"
