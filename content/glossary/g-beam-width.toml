summary = "Beam width W is the maximum number of partial answers retained after a beam-search step. Subject to the declared tie rule, a prefix whose rank exceeds W is discarded and cannot return. On a planted control, the minimum width needed to preserve the true path is governed by that path's worst intermediate rank, not its final rank. An exact filter can help only if it becomes selective before the proposal beam discards the path."
