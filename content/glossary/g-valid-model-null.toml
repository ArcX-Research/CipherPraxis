related = ["valid-model-nulls", "tautological-gate-rule", "planted-controls"]
summary = "A valid-model null is a negative control that follows every algebraic rule of the cipher but contains no real language signal. It uses a legal key and construction and may draw independent letters with English single-letter frequencies. A useful language gate must reject it. If the gate passes it, the gate is detecting only the cipher's algebra. This is stricter than a negative that breaks the model, such as an illegal random key stream."
updated = "2026-09-04"
