summary = "A valid-model null is a negative control that obeys the tested cipher's algebra while omitting the semantic or sequential language signal of interest. It may use a legal key with independently sampled letters that preserve chosen marginal frequencies. Such controls estimate how often a gate passes algebraic structure alone; an individual null can still pass by chance, so rejection rates and uncertainty matter. A null that violates the model tests a different and usually easier distinction."
