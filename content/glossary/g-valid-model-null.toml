summary = "A negative control that satisfies every algebraic assumption of the cipher model (legal key, correct construction, English letter frequencies) but carries no signal, typically independent letters drawn from the monogram distribution. A gate must reject it; a gate that passes it is testing the algebra rather than the language. Contrasted with model-violating negatives such as an independent random key stream."
