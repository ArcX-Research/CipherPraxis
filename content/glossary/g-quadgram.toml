summary = "A sequence of four consecutive letters. A quadgram language model stores, for each of the 26^4 = 456,976 possible quadgrams, the log-probability of that quadgram in a reference corpus (with a small additive smoothing so that unseen quadgrams are not impossible). A text's quadgram score is the sum over its n - 3 overlapping windows; divided by n - 3 it is the quadgram rate, about -4.3 log10 per letter for English and about -7 for random letters. Quadgrams see letter order, so they are the right score only once every transposition has been removed."
updated = "2026-09-04"
