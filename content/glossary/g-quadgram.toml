summary = "A quadgram is a run of four letters. A quadgram language model stores the log-probability of each of the 26^4 = 456,976 possible runs. Small smoothing gives unseen runs a nonzero probability. A text's score sums its n - 3 overlapping quadgrams. Dividing by n - 3 gives a rate of about -4.3 log10 per letter for English and about -7 for random text. Because quadgrams depend on letter order, use them only after removing every transposition."
updated = "2026-09-04"
