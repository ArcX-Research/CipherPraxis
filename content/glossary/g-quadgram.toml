summary = "A quadgram is a sequence of four consecutive symbols. A dense 26-letter table has 26^4 possible entries; smoothing assigns nonzero mass to unseen training events. A length-n text contains n - 3 overlapping quadgrams when n is at least four. Score magnitudes depend on the corpus, smoothing, logarithm base, and denominator. Because quadgrams depend on order, they are not invariant under transposition, though they can be used to rank fully ordered candidate decryptions during a transposition search."
