title = "Change point"
status = "VERIFIED"
status_note = "Standard term from sequential statistics, applied to key or regime boundaries inside a ciphertext."
family = "Cryptanalysis technique"
tags = ["segmentation", "zone"]
related = ["change-point-zone-detection", "segment-chain-analysis", "g-zone", "within-coset-null"]
summary = "A change point is where a ciphertext starts behaving differently. The key, alphabet, period, or kind of plaintext may differ on the two sides. For a periodic substitution, an exact dynamic program finds these points from matches within each coset and compares them with shuffled cosets. A change point shows that a boundary exists, but not why. A change in plaintext, a transposition boundary, and a new substitution can all leave the same pattern."
updated = "2026-09-04"
