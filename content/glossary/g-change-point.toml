id = "g-change-point"
section = "glossary"
title = "Change point"
status = "VERIFIED"
status_note = "Standard term from sequential statistics, applied to key or regime boundaries inside a ciphertext."
family = "Cryptanalysis technique"
tags = ["segmentation", "zone"]
related = ["change-point-zone-detection", "segment-chain-analysis", "g-zone", "within-coset-null"]
summary = "A change point is a position at which the parameters or distribution of a specified sequence model change. In ciphertext, the cause might be a new key, alphabet, period, plaintext regime, or preprocessing rule. A dynamic program can exactly optimize a declared additive segmentation objective, but it does not thereby prove that a physical boundary exists. Significance and location uncertainty require calibration that repeats the boundary search; even a supported boundary does not identify its cause."
updated = "2026-09-07"
