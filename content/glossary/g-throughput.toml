summary = "Search throughput is an observed work rate, such as tasks per second, together with task-cost diagnostics such as nodes per task. Projecting completion time from it assumes the measured interval represents the remaining task mix; heterogeneous frontiers need stratified or conservative estimates. Failure to recover a planted control within budget establishes a pipeline power limit, which may reflect speed, ranking, or search geometry. A capped run reports exact coverage only for a validated, gap-free task enumeration."
