summary = "Search throughput is the measured rate of work in the real task order, such as pairs per second or nodes per pair. Combined with the number of tasks left, it estimates the time needed to finish. If a control cannot reach its planted answer within budget, that shows a speed limit. A capped live run reports the share it covered. Neither result rules out the cipher."
