summary = "The measured rate at which a search processes its work units in the live task order (pairs per second, nodes per pair), together with the frontier size it implies a time to drain. A control that cannot reach its planted truth within budget is a throughput statement, and a capped live run's coverage is the fraction of the frontier its budget reached; neither is a negative."
