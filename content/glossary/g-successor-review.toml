summary = "A successor review is written after a sound negative result and before work starts on another cipher family. It shows what earlier tests covered and why the new idea is different. It also gives the exact algebra, maps it to a tested solver, groups equivalent cases, lists costs and priorities, defines controls from inside and outside the family, and sets a stop rule. A failed control blocks the test. An unfinished selector reports INCOMPLETE. Only a new, independently audited tool may test the target."
