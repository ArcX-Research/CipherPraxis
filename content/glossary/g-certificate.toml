summary = "A record that lets a reader verify an exact search's conclusion without re-running it: pinned input hashes, the declared space and its census, the winning state written literally, its score recomputed by an independent scalar routine, the tie count within tolerance, an independent forward re-encryption, and the outcome token (complete, incomplete, structural zero, tied best). A transcript that ends without its terminal line, or whose replay disagrees, certifies nothing and is retained as a failed attempt."
