summary = "A certificate is auxiliary information that lets a checker verify a precisely stated claim, often more cheaply than repeating the original computation. In this project's exact-search protocol it includes fixed inputs, declared search scope, completion counters, candidates and ties relevant to the decision, and independently checkable score and forward-transform data. Certificate validity depends on the checker and claim; a truncated transcript or failed replay does not support the advertised completeness result."
