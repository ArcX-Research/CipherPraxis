related = ["bound-benchmarks-and-certificates", "known-answer-tests", "rank-sharding", "reproducibility-receipts", "hash-chained-transcripts"]
summary = "A certificate records enough detail to check an exact search without running it again. It includes fixed input hashes, the search space and its size, the winning state, a separately recomputed score, the number of near ties, a separate forward encryption, and the final outcome token (complete, incomplete, structural zero, or tied best). A transcript with no final line, or one that fails replay, proves nothing and stays marked as a failed attempt."
updated = "2026-09-04"
