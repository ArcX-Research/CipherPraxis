summary = "A period m is the number of letters before a key repeats, as in Vigenère, Quagmire, Porta, and Slidefair. For Bifid or Trifid, it is the block length used to regroup coordinates. A periodic key makes positions i and i + m behave alike, causing extra matches at lag m and its multiples. Two periodic layers in one alphabet combine to period lcm(m, q). Autokeys and running keys do not repeat this way."
