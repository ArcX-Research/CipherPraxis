summary = "A period m is a positive shift after which a key stream or position rule repeats; the fundamental period is the smallest such m. In Bifid or Trifid, 'period' instead commonly denotes the coordinate-regrouping block length. A periodic substitution can create excess coincidences at its period and harmonics, but finite samples need not show a clear peak. Two layers with periods m and q have a combined period dividing lcm(m, q), with equality only when no additional symmetry or cancellation shortens it."
