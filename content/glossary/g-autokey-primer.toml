summary = "A primer is the short secret that starts a self-extending key stream. It may be the first letters of an autokey, the first digits of a Gromark chain, or Condi's starting value. In a plaintext autokey, each primer element controls positions spaced by the primer length. In a ciphertext autokey, the primer affects only the first m letters and disappears from the lag-m difference text."
updated = "2026-09-04"
