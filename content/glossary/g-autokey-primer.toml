summary = "The short secret that seeds a self-extending key stream: the initial letters of an autokey before the plaintext or ciphertext takes over, the starting digits of a Gromark chain, or the starter value of Condi. Each primer element governs one chain of positions spaced by the primer length in a plaintext autokey; in a ciphertext autokey the primer affects only the first m letters and drops out of the lag-m difference text entirely."
updated = "2026-09-04"
