summary = "A primer is the finite secret that initializes a self-extending key stream. It may be the initial letters of an autokey, the initial digits of a Gromark chain, or Condi's starting value. In the usual plaintext-autokey schedule, primer positions seed interleaved dependency chains. In the additive ciphertext-autokey convention, the primer is used directly only for the first m letters; for later positions, subtracting ciphertext at lag m cancels the feedback term. Other autokey conventions require their own recurrence."
updated = "2026-09-07"
