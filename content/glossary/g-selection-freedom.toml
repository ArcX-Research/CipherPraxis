summary = "Selection freedom is the score gained simply by choosing the best settings. On a 153-letter text, fitting seven free shifts adds about 0.15 nats per letter even for wrong models. Free sub-coset shifts can make shuffled text reach quadgram rates near -5.8. The best of thousands of crib positions or 256 cycle endings will also beat a typical wrong answer. To judge that best score fairly, repeat the full selection on null data and compare maxima with maxima."
updated = "2026-09-04"
