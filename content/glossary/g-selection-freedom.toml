title = "Selection freedom"
status = "VERIFIED"
status_note = "Project term for a standard multiple-selection effect; its magnitude is procedure- and dependence-specific."
family = "Method governance"
tags = ["overfitting", "null", "multiplicity"]
related = ["selection-overfit-diagnostic", "family-wise-null", "shuffled-null-z-score", "coset-shift-recovery", "shared-cycle-attack", "crib-dragging", "g-family-sweep"]
summary = "Selection freedom is the opportunity to improve a reported score by choosing among parameters, keys, placements, models, stopping times, or preprocessing rules. Even when every candidate is null, the selected maximum tends to exceed a typical single-candidate score. Calibration must repeat the same complete selection procedure on null data and compare selected results with selected results. The size of the bias depends on candidate dependence, sample length, score, and search procedure; it is not determined by the nominal number of choices alone."
updated = "2026-09-07"
