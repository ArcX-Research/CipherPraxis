summary = "Marginal likelihood is the likelihood of the data integrated or summed over a parameter's prior. For coset counts F and an unknown shift s with a uniform prior, Z = (1/26) sum over s of the product over letters of f(x - s)^F(x). This shift average is invariant to a common rotation of the observed histogram. Comparisons across families are meaningful only with explicit, defensible priors and the same observation model; the difference from a maximized likelihood is data-dependent, not invariably ln M for a family of M choices."
