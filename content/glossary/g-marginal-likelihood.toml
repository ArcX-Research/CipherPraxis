summary = "Marginal likelihood is the likelihood of the data averaged over a parameter's prior. For a coset with counts F and unknown shift s under a uniform prior, Z = (1/26) sum over s of the product over letters of f(x - s)^F(x). Averaging over the shift instead of choosing the best one makes the score depend on the histogram's shape, not its rotation. This makes it order-free and fair across families of different sizes. A family with M members pays ln M nats for that choice."
