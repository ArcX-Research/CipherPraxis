id = "g-zone"
section = "glossary"
title = "Zone (of a ciphertext)"
status = "VERIFIED"
status_note = "Project usage for a contiguous analysis interval; its boundaries may be externally fixed or estimated with uncertainty."
family = "Cryptanalysis technique"
tags = ["segmentation"]
related = ["change-point-zone-detection", "g-change-point", "assumption-review-protocol", "exact-period-alignment"]
summary = "A zone is a contiguous interval analyzed under one locally stable statistical or cipher regime. Its boundaries may be fixed externally or estimated as change points. A changed statistic does not identify the cause: plaintext style, key schedule, cipher mechanism, or preprocessing can produce similar boundaries. Because data-driven segmentation adds selection, downstream tests and controls must repeat the same boundary-selection procedure or use held-out intervals."
updated = "2026-09-07"
