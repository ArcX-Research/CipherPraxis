id = "g-zone"
section = "glossary"
title = "Zone (of a ciphertext)"
status = "VERIFIED"
status_note = "Corpus usage: a contiguous stretch of a ciphertext with its own statistical regime, delimited by change points."
family = "Cryptanalysis technique"
tags = ["segmentation"]
related = ["change-point-zone-detection", "g-change-point", "assumption-review-protocol", "exact-period-alignment"]
summary = "A zone is a contiguous part of a ciphertext that behaves as one cipher: for example a 63-letter stretch of a 153-letter text whose period-7 cosets look monoalphabetic, flanked by ends whose letters are flat at every lag. Statistics computed on the whole text pool the zones and can mimic a construction that is not there (a monoalphabetic-coset zone plus flat ends pools to the coset index of coincidence of a mixed inner). Once zones are found, every instrument is re-run per zone, and controls are planted at the zone's own length and geometry."
updated = "2026-09-04"
