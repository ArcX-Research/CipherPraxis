id = "g-zone"
section = "glossary"
title = "Zone (of a ciphertext)"
status = "VERIFIED"
status_note = "Corpus usage: a contiguous stretch of a ciphertext with its own statistical regime, delimited by change points."
family = "Cryptanalysis technique"
tags = ["segmentation"]
related = ["change-point-zone-detection", "g-change-point", "assumption-review-protocol", "exact-period-alignment"]
summary = "A zone is one continuous part of a ciphertext that behaves like a single cipher. For example, 63 letters of a 153-letter text may have period-7 cosets that look monoalphabetic while both ends look flat. Whole-text statistics mix these zones and can suggest a cipher that is not present. After finding the zones, analysts rerun every test on each one and build controls with the same length and shape."
updated = "2026-09-04"
