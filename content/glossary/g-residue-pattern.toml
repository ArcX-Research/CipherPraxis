summary = "For a declared width-w columnar transposition composed with a period-k substitution, some layouts make an output position's inner class depend only on the column indices modulo k rather than their full order. The resulting residue sequence is a residue pattern. When residue multiplicities are fixed, the number of distinct patterns is w! divided by the product of their factorials: 126 for width 9 and period 2, 1,680 for width 9 and period 3, and 24,310 for width 17 and period 2. The reduction is exact only for the stated composition; language scores rank surviving orders heuristically."
