summary = "Suppose a width-w columnar transposition sits over a period-k substitution. An output position's inner class depends only on each column index modulo k, not on the full column order. This sequence of remainders is the residue pattern. There are w!/prod(mult!) patterns: 126 for width 9 and period 2, 1,680 for period 3, and 24,310 for width 17 and period 2. Testing patterns first makes a full search practical; language scores can choose among the surviving orders."
