summary = "Nats per letter are natural-log scores divided by a declared letter count. One base-10 logarithm unit equals ln(10) nats, and one bit equals ln(2) nats. A uniform distribution on 26 symbols has entropy ln(26) nats per symbol. Before comparing scores, check the logarithm base, denominator, smoothing, conditioning context, and whether the quantity is a likelihood, likelihood ratio, or marginal likelihood; equal units alone do not make different models comparable."
updated = "2026-09-07"
