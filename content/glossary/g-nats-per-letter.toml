title = "Nats per letter"
status = "VERIFIED"
status_note = "Standard unit; used for all evidence readings in the toolkit."
family = "Information theory"
tags = ["unit", "evidence", "log-likelihood"]
related = ["bayesian-evidence-model-selection", "quadgram-log-likelihood", "g-evidence", "g-quadgram"]
summary = "Nats per letter measure log-likelihood or evidence with natural logarithms, divided by the number of letters. One nat is ln(e) = 1, one log10 unit is 2.303 nats, and one bit is 0.693 nats. Tests report gains over the uniform model, whose entropy is ln 26 = 3.258 nats per letter. English single-letter frequencies carry about 2.89, so their largest gain is about 0.36. Quadgram rates use log10 per letter and must be converted before comparison."
updated = "2026-09-04"
