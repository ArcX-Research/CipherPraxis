summary = "Key cancellation is the subtraction of one ciphertext from another, or of a ciphertext from a lagged copy of itself, so that a stream common to both disappears: two texts under one running key leave the difference of their plaintexts, a text keyed by another text's plaintext leaves that text's own key, and a ciphertext autokey leaves the plaintext. It is exact only in a common index space (a straight and a keyword-mixed order admit no affine conversion), it leaves an additive gauge of 26 states, and the cipher it exposes still has to be solved and validated against nulls that destroy the cross-text pairing."
