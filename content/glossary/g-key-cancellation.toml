summary = "Key cancellation subtracts one ciphertext from another, or from a shifted copy of itself, so a shared stream disappears. Two texts using one running key leave the difference between their plaintexts. A ciphertext autokey can leave the plaintext. The cancellation is exact only when both texts use the same index system; a straight and a keyword-mixed alphabet do not. The result still has 26 equivalent shifts, and the exposed cipher must still be solved and checked against null data."
