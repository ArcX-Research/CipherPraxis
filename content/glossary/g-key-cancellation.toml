summary = "Key cancellation combines ciphertext coordinates so that a shared additive or otherwise invertible key term disappears. For two additive encryptions aligned under the same coordinate system and key stream, subtraction exposes the plaintext-coordinate difference. Certain ciphertext-autokey recurrences similarly cancel at their feedback lag. The operation is exact only under the stated algebra, alignment, and alphabet coordinates. Any residual global ambiguity depends on that model; the derived text still requires its own solution and null calibration."
