summary = "In a layered construction the outer layer is the last operation applied in encryption and the first to be removed in analysis; the inner layer is what sits beneath it. Which statistics survive depends on the order of layers: a periodic substitution applied after a transposition keeps its coset structure while the text beneath is scrambled, a transposition applied after a periodic substitution scrambles the cosets, and a transposition applied anywhere leaves every letter multiset untouched. The last fact is what lets an outer periodic layer be fitted and the inner distribution inferred without knowing the transposition at all."
updated = "2026-09-04"
