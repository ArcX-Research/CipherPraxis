summary = "A layered cipher composes two or more transforms. The outer layer is applied last during encryption and normally inverted first; the inner layer is applied earlier. Layer order controls which statistics remain usable. A transposition preserves the global multiset of symbols but generally changes adjacency and may change membership in position classes. An outer periodic substitution still has cosets in its own output-position coordinates, so order-free statistics on those declared cosets can sometimes be fitted before the inner transposition is recovered."
updated = "2026-09-07"
