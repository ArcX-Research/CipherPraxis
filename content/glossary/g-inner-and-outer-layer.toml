summary = "A layered cipher applies two or more operations. The outer layer is applied last during encryption and removed first during analysis. The inner layer sits beneath it. Layer order changes which patterns survive. A periodic substitution after a transposition keeps its cosets, while a later transposition scrambles them. Any transposition keeps the same letter counts. That lets analysts fit an outer periodic layer before they know the transposition."
