summary = "A z-score is the observed statistic minus the null mean, divided by the null standard deviation: z = (T - mean)/sd. A value of +2 is two null standard deviations above the shuffled or simulated results. It is useful only when the null is roughly symmetric and uses the same full calculation. Searching many cases raises the best score by chance, so a best-of-many z-score must be reported with its empirical rank."
