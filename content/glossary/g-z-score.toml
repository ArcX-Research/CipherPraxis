summary = "A z-score standardizes a statistic as z = (T - null mean)/(null standard deviation), provided the null standard deviation is positive. It measures displacement in standard-deviation units; converting it to a normal-theory tail probability additionally requires an appropriate distributional approximation. Skewed, discrete, or selected maxima are better accompanied by their empirical null rank. When many cases are searched, the null calculation must repeat that same maximization."
