summary = "A ledger is a dated record that is only appended to. Before work starts, it reserves log numbers and file names. It later records file hashes, seals, audit results, and the exact scope of each outcome. Errors are corrected in new entries instead of rewriting old ones. A separate negative-results ledger marks each transcript as complete, failed, interrupted, or exploratory."
