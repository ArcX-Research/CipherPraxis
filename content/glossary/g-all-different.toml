title = "AllDifferent constraint"
status = "VERIFIED"
status_note = "The definition is standard; the stated modulo-26 CRT condition follows exactly from a complete permutation's parity and modulo-13 residues."
family = "Algebra"
tags = ["CSP", "bijection"]
related = ["all-different-constraints", "modular-inverse-and-crt", "all-different-enumeration", "g-nullity"]
summary = "An AllDifferent constraint requires pairwise-distinct values. For a complete unknown 26-letter alphabet, the coordinate variables must therefore be a permutation of 0 through 25. Linear equations alone can admit solutions with repeated coordinates; AllDifferent rejects those solutions. Under the Chinese-remainder representation of a complete permutation modulo 26, each residue modulo 13 occurs twice, once with each parity."
updated = "2026-09-07"
