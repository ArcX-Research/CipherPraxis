summary = "An AllDifferent constraint requires every variable to have a different value. For an unknown cipher alphabet, the 26 letter positions must be a permutation of 0 to 25. Linear cipher equations rarely reject a wrong guess by themselves. Requiring their answers to form a permutation exposes the conflict. Over Z26, each residue modulo 13 must appear exactly twice, once at each parity."
