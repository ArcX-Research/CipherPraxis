summary = "The set of states from which a deterministic descent (polish) reaches the true key; its radius is the largest number of random moves away from the truth that is still reliably recovered. For a keyed substitution whose unknown alphabet acts on both sides, the measured radius is about three swaps (3/4 recovered at three swaps, 0/4 at five or more), while stochastic searches plateau about ten swaps away; when the search's reach and the basin's radius do not meet, extra budget cannot help and an exact method is required."
updated = "2026-09-04"
