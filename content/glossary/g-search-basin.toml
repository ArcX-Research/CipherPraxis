summary = "A search basin is the set of starting states from which a fixed local search, or polish, reaches the true key. Its radius is the greatest number of random moves away from the truth that still gives reliable recovery. For one keyed substitution, the radius was about three swaps: 3/4 recovered at three swaps and 0/4 at five or more. Broader random searches stopped about ten swaps away. When the search cannot reach the basin, more runs will not help; an exact method is needed."
updated = "2026-09-04"
