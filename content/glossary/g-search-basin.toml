id = "g-search-basin"
section = "glossary"
title = "Basin of attraction (of a polish)"
status = "VERIFIED"
status_note = "Standard dynamical-systems usage applied to a fixed deterministic optimizer; finite perturbation panels estimate rather than prove basin geometry."
family = "Search and optimisation"
tags = ["landscape", "local search"]
related = ["polish-basin-measurement", "hill-climbing", "simulated-annealing", "parallel-tempering", "g-move-set"]
summary = "For a deterministic local optimizer and a fixed tie rule, the basin of an endpoint is the set of starting states that converge to that endpoint. Random perturbation experiments estimate a recovery curve by a declared distance or shell; they do not by themselves prove a sharp radius, monotonicity, or zero probability outside the sampled starts. If a broader search rarely enters the measured basin under its tested budget, that diagnoses a proposal-power limit. More runs may still help when entry probability is nonzero; exact search is needed for a completeness claim."
updated = "2026-09-07"
