summary = "A mixed alphabet is any rearrangement of the 26 letters used as a cipher's index order. A word or phrase may build it, or it may be arbitrary. In a Quagmire cipher, it can appear on the plaintext side, the ciphertext side, or both. When it appears on both, one letter swap changes about four mappings in every coset. Short texts then give too little guidance to search an arbitrary mixed alphabet."
