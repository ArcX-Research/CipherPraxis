related = ["keyword-mixed-alphabet", "quagmire-iii", "quagmire-iv", "g-keyed-alphabet", "g-gauge-class"]
summary = "A mixed alphabet is a permutation of the ordinary alphabet used as a cipher's symbol order. It may be generated by a keyword or treated as an arbitrary permutation. In Quagmire variants it can occur on the plaintext side, ciphertext side, or both. When the same unknown order occurs on both sides, a local change can alter several induced substitutions at once, producing a harder search landscape in recorded short-text controls; this is an empirical search limitation, not a theorem of identifiability."
updated = "2026-09-07"
