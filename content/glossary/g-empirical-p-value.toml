title = "Empirical p-value"
status = "VERIFIED"
status_note = "Standard term; the strict rank-1-of-100 rule is its one-shot form."
family = "Statistics"
tags = ["rank", "permutation", "resolution"]
related = ["permutation-test", "shuffled-null-z-score", "within-coset-null", "g-null-distribution"]
summary = "An empirical p-value is the share of null results at least as extreme as the observed result: p = (1 + number of nulls >= observed)/(N + 1). The observed result counts as one draw. With 99 nulls, the smallest possible p is 0.01; with nine, it is 0.10. Ties count against the observation. In audited runs, a candidate passes only when it ranks first against 99 matched nulls that each went through the full selection process."
updated = "2026-09-04"
