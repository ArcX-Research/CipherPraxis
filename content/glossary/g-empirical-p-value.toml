title = "Empirical p-value"
status = "VERIFIED"
status_note = "Standard resampling term. The stated plus-one formula is tied to an explicit valid without-replacement transformation design."
family = "Statistics"
tags = ["rank", "permutation", "resolution"]
related = ["permutation-test", "shuffled-null-z-score", "within-coset-null", "g-null-distribution"]
summary = "For a finite transformation group under an invariant null, one valid Monte Carlo design evaluates the identity and N transformations drawn uniformly without replacement from the nonidentity elements. Its upper-tail value is p = (1 + number of transformed statistics at least as large as the observation)/(N + 1), with ties included; the minimum is 1/(N + 1). Other sampling schemes require their own validity argument. Every transformed dataset must repeat any key, period, or model selection used for the reported statistic."
updated = "2026-09-07"
