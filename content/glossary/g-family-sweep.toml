related = ["phrase-keyed-alphabet-attack", "multiple-rounds-analysis", "family-identification", "dictionary-attack", "planted-controls", "g-successor-review", "g-selection-freedom"]
summary = "A family sweep evaluates every member of a declared finite candidate set, or a clearly labelled approximation to it. Exhaustive coverage can exclude candidates only when the model, enumeration, pruning, and decision predicate are sound; a heuristic sweep cannot. Planted controls estimate recovery for their generating distribution, while a null calibrated over the full sweep measures selection effects. The project's release gate may require exact control recovery, but finite control success is not a general power guarantee."
