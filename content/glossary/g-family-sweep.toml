related = ["phrase-keyed-alphabet-attack", "multiple-rounds-analysis", "family-identification", "dictionary-attack", "planted-controls", "g-successor-review", "g-selection-freedom"]
summary = "A family sweep checks every member of a stated cipher family against a ciphertext. It may try every phrase-keyed alphabet, every combination of several rounds, or every column order of one width. A planted control must rank first, and a null test sets the noise level. A negative result rules out only that family, text, length, search space, and measured power. Shared assumptions can make many sweeps fail in the same way, so the project reviews those assumptions between rounds of testing."
