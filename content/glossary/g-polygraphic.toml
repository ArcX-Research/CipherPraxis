summary = "A polygraphic substitution encrypts groups of letters together. Playfair, two-square, four-square, and slide ciphers use pairs; Hill ciphers use d-letter blocks. This hides single-letter frequencies, but patterns at the block level may remain. Linear polygraphic ciphers can also separate by matrix row, letting each output position be tested on its own sampled stream."
