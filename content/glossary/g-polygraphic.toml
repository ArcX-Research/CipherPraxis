summary = "A polygraphic substitution maps blocks of two or more symbols rather than each symbol independently. Playfair, two-square, four-square, and slide ciphers use pairs; an n-by-n Hill cipher acts on n-symbol vectors. Block mapping often weakens direct plaintext single-letter frequency signals, but does not guarantee uniform ciphertext or security. For a Hill cipher, each output coordinate is a linear combination of the whole input block; coordinate-wise analysis is valid only for a statistic or equation derived for that sampled stream."
