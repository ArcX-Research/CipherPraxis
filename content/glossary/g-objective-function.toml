title = "Objective function (search)"
status = "VERIFIED"
status_note = "Standard term; the corpus's objective is the smoothed quadgram log-likelihood rate."
family = "Search and optimisation"
tags = ["search", "scoring"]
related = ["simulated-annealing", "quadgram-log-likelihood", "hill-climbing", "viterbi-decoding"]
summary = "The function a search maximises or minimises over candidate keys. In classical cryptanalysis it is usually a language-model score of the trial decrypt, such as the mean log10 quadgram probability per letter (English near -4.3, random text near -6.5), sometimes with bigram or trigram terms to smooth the landscape. A search is only as meaningful as its objective: a score that a wrong key can maximise (coincidence counting, free refits on short text) must be calibrated on shuffled nulls."
updated = "2026-09-04"
