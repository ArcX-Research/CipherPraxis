id = "g-objective-function"
section = "glossary"
title = "Objective function (search)"
status = "VERIFIED"
status_note = "Standard optimization term; no particular objective is assumed to be calibrated evidence or an easier search landscape."
family = "Search and optimisation"
tags = ["search", "scoring"]
related = ["simulated-annealing", "quadgram-log-likelihood", "hill-climbing", "viterbi-decoding"]
summary = "An objective function is the quantity an optimization method raises or lowers. In classical cryptanalysis it is often a smoothed n-gram log score of a trial decryption. Adding lower-order terms can change the local landscape, but does not guarantee easier recovery or a valid probabilistic interpretation. An objective must be tested on held-out planted controls, and the complete best-of-many selection must be calibrated against an appropriate null before its score is treated as evidence."
updated = "2026-09-07"
