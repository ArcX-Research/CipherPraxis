title = "Objective function (search)"
status = "VERIFIED"
status_note = "Standard term; the corpus's objective is the smoothed quadgram log-likelihood rate."
family = "Search and optimisation"
tags = ["search", "scoring"]
related = ["simulated-annealing", "quadgram-log-likelihood", "hill-climbing", "viterbi-decoding"]
summary = "An objective function is the score that a search tries to raise or lower. In classical cryptanalysis, it is often a language score for a trial decryption. One example is mean log10 quadgram probability per letter: about -4.3 for English and -6.5 for random text. Bigram or trigram terms can make the search smoother. A useful objective must prefer correct keys. If wrong keys can also maximize it, the score needs calibration against shuffled null data."
updated = "2026-09-04"
