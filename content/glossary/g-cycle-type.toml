summary = "The multiset of cycle lengths in the disjoint-cycle decomposition of a permutation. Conjugate permutations have the same cycle type, and the k-th power of an n-cycle splits into gcd(n, k) cycles of length n divided by gcd(n, k). For a 26-letter alphabet the powers of a single 26-cycle have cycle lengths only among 26, 13, 2 and 1, a fact used to prune alphabet searches in which several substitution classes are powers of one cycle."
updated = "2026-09-04"
