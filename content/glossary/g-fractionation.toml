summary = "Fractionation replaces each letter with two or three coordinates, rearranges those coordinates, and groups them back into letters. One ciphertext letter then contains parts of several plaintext letters. This flattens single-letter frequencies and hides letter-pair patterns within a block, though the block edges may remain visible. Bifid, Trifid, and Compressocrat use fractionation."
