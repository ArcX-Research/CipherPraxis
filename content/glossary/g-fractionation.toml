summary = "Fractionation represents letters by coordinate symbols, rearranges the coordinate stream, and regroups it into output letters. One ciphertext letter can therefore depend on coordinates from several plaintext letters. For natural-language inputs, this often reduces simple single-letter and adjacent-letter signals, but the amount depends on the square or cube, block length, and plaintext; it is not guaranteed to flatten every sample. Bifid, Trifid, and Compressocrat use fractionation."
updated = "2026-09-07"
