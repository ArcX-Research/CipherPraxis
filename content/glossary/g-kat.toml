summary = "A known-answer test (KAT) gives a component a fixed input and compares its result with a value derived independently in advance. It can compare a fast score update with a full rescore, test a forward/inverse pair, or require exact parser and filter decisions on fixed fixtures. Passing establishes agreement only on the tested cases. In mutation panels, a no-op guard verifies that every intended mutation actually changes the input, and both accepted and rejected fixtures make the decision boundary exercisable."
updated = "2026-09-07"
