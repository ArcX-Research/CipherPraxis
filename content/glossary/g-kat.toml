related = ["kat-harness", "known-answer-tests", "compiled-hot-cores"]
summary = "A test that runs a component on a predetermined input and requires a predetermined output: a core's incremental score delta against a full rescore, a forward-then-inverse roundtrip over every parameter, a parser's rejection of each of hundreds of mutated transcripts, a filter's acceptance of every planted truth. A KAT that cannot fail is not a KAT; mutation panels carry a no-op guard for that reason."
