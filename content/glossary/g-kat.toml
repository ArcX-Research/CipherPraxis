summary = "A known-answer test (KAT) gives a component a fixed input and requires the known output. It can compare a fast score update with a full rescore, check a forward-and-back round trip, require a parser to reject damaged records, or require a filter to keep every planted truth. A KAT must be able to fail. Mutation tests include an unchanged case to prove that their checks are active."
