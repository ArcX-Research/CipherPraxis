summary = "The dimension of the null space of a homogeneous linear system, equal to the number of unknowns minus the rank. For alphabet-recovery systems over Z26 the solver reports two nullities, d2 over GF(2) and d13 over GF(13); the system has 2^d2 times 13^d13 linear solutions. Because a homogeneous system with a gauge row is always consistent, the nullity, not consistency, measures how much a crib constrains the alphabet, and d13 of about seven or less is the regime in which exact enumeration is feasible."
updated = "2026-09-04"
