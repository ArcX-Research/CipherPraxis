summary = "Nullity is the size, by dimension, of a homogeneous linear system's null space. It equals the number of unknowns minus the rank. For alphabet recovery over Z26, the solver reports d2 over GF(2) and d13 over GF(13). The system then has 2^d2 times 13^d13 linear solutions. Such a system is always consistent after adding a gauge row, so nullity shows how strongly a crib limits the alphabet. Exact enumeration is practical when d13 is about seven or less."
updated = "2026-09-04"
