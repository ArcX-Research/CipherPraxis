summary = "Nullity is the dimension of a linear map's kernel; for a homogeneous system with a fixed number of variables it equals the number of variables minus the rank. For equations modulo 26, reduction over GF(2) and GF(13) yields nullities d2 and d13, and the homogeneous system has 2^d2 times 13^d13 CRT-lifted linear solutions. Extra affine or gauge constraints must be checked for consistency, and AllDifferent may reject every linear solution. Enumeration feasibility depends on the algorithm, output count, caps, and hardware, not on nullity alone."
updated = "2026-09-07"
