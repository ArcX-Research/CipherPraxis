summary = "A crib is a hypothesized plaintext fragment. Trying it at a position can imply key values or algebraic constraints; an exact contradiction can reject that placement, while a low language score is only heuristic evidence. A calibrated crib search applies the complete placement-and-selection procedure to controls or matched null data. If the crib is absent, misspelled, or placed under the wrong cipher convention, a miss does not exclude the cipher family."
