summary = "A crib is a piece of plaintext that may appear in a message, such as a common phrase or a name. Trying it at one position reveals possible key values or equations. Positions that give an impossible or unreadable key can be dropped. A fair crib search must also test false placements. The true placement must beat the best of those false matches. If the crib is not in the message, a miss does not rule out the cipher."
