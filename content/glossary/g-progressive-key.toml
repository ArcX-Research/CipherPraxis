summary = "A progressive key changes according to a position-dependent schedule instead of repeating a fixed short key. A simplified additive schedule may increase its shift by a fixed increment, or by an increment that itself changes. If the schedule and alphabet coordinates are known and additive, subtracting the scheduled term reduces the problem to a fixed substitution. Disc ciphers and other nonadditive variants require their own state update and cannot always be reduced by subtraction."
