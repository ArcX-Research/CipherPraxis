summary = "A key that changes by a fixed rule as the message proceeds rather than repeating: a shift that grows by a constant d per letter (Alberti's turning disc), or by a constant acceleration. Because the schedule is a known function of position, subtracting it from the ciphertext index leaves one fixed substitution, so a progressive-key cipher reduces to a substitution problem per candidate schedule."
updated = "2026-09-04"
