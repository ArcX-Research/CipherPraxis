summary = "A progressive key changes by a fixed rule as the message continues instead of repeating. Its shift may grow by a fixed amount d per letter, as with Alberti's turning disc, or by a fixed acceleration. Because the change is a known function of position, subtracting it from the ciphertext leaves one fixed substitution. Each possible schedule can then be tested as a substitution problem."
