summary = "The act of freezing an implementation's exact bytes (source, parser, runner, manifest) by SHA-256 and recording them in the ledger together with the creator's own audit, so that a different agent can audit precisely those bytes. Sealed bytes are never edited; a defect produces a new-only successor under a fresh log number."
