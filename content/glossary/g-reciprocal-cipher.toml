summary = "A reciprocal cipher uses the same operation and key to encrypt and decrypt. Mathematically, its encryption map is an involution. Beaufort (c = k - p), Porta, Portax, and Slidefair are reciprocal. This is convenient but does not add security. It also means any fitted key can complete a round trip, so a round trip does not prove that the key is correct."
