family = "Cipher structure"
tags = ["involution"]
related = ["beaufort", "porta", "digraphic-slide", "chaocipher", "g-tabula-recta"]
summary = "A cipher whose encryption map is an involution, so the same operation with the same key decrypts: Beaufort (c = k - p), Porta, Portax and Slidefair are reciprocal. The property is convenient for the user and irrelevant to security, but it has one consequence for validation: any fitted key round-trips, so a round-trip can never be evidence that the key is right."
updated = "2026-09-04"
