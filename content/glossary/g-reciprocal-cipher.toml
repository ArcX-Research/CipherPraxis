summary = "A reciprocal cipher uses the same keyed operation to encrypt and decrypt, so each fixed-key transformation is an involution. Beaufort with c = k − p and the standard Porta convention are examples; Portax and Slidefair are reciprocal under their corresponding standard conventions. Reciprocity alone makes no security claim. Because any internally consistent fitted key completes its own round trip, that check verifies implementation consistency but not that the recovered key or plaintext is the historical one."
