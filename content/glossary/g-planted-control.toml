related = ["planted-controls", "blind-controls", "power-measurement"]
summary = "A planted control is a test ciphertext made with a known plaintext and key. It uses the exact cipher being tested and matches the target's length. The same pipeline must solve the control before it sees the target. The check passes only when it recovers the plaintext and key, allowing for stated gauge equivalents, and re-encrypts to the same ciphertext. If it fails, the test is not strong enough to rule out the target."
