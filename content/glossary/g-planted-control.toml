summary = "A planted control is a test ciphertext generated from a disclosed plaintext and key under the exact declared cipher conventions. Its length and other difficulty-relevant features should match the intended evaluation population. Under this project's preregistered gate, the frozen pipeline must recover the required plaintext and key equivalence class and pass an independent forward check before target evaluation. Success estimates performance only for the plant distribution; failure blocks the intended negative claim but does not show the cipher is unsolvable in general."
