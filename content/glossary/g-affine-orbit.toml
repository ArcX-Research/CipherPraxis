summary = "Start with one bijective alphabet coordinate map z. Apply every map z' = alpha z + beta, where alpha is a unit modulo 26 and beta is any residue. The 312 distinct coordinate maps form its orbit under the affine group. In cipher models whose equations and keys transform equivariantly under this action, the orbit members are observationally equivalent parameterizations. An exact solver may then choose one canonical representative, but only after proving that model-specific equivalence."
