summary = "Start with one cipher alphabet z. Apply every map z' = alpha z + beta, where alpha is a unit modulo 26 and beta is any residue. The resulting 12 times 26 = 312 alphabets form its affine orbit. They all describe the same substitution when the keys change with them. Exact solvers therefore count whole orbits and score one standard representative from each."
updated = "2026-09-04"
