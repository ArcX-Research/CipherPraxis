summary = "Drainability asks whether an exact search can finish with the stated computing budget. If tasks have a fixed order and the true answer could be anywhere, the chance of finding it before a time limit equals the fraction searched. At 0.148 pairs per second, a frontier of 1,706,348 pairs covers 0.75% in 24 hours and needs about 134 days to finish. An unfinished search is inconclusive. A fully searched shard gives an exact result for that shard."
updated = "2026-09-04"
