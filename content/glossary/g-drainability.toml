title = "Drainability"
status = "VERIFIED"
status_note = "Project engineering term. The definition separates exact task coverage from model-dependent recovery probability and empirical time projections."
family = "Exactness guarantees"
tags = ["throughput", "coverage", "power"]
related = ["rank-sharding", "drainability-and-throughput", "throughput-fail", "power-measurement", "g-shard"]
summary = "Drainability asks whether a declared finite search can complete within its time and memory budget. The processed fraction is an exact coverage statement only when the task partition has no gaps or duplication. It equals a recovery probability only under an explicit model in which the truth's task is uniformly distributed and independent of the frozen order. Throughput-based completion times are projections and must account for task-cost variation. An unfinished search is inconclusive outside any shards that completed exactly."
