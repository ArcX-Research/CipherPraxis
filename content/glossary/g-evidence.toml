summary = "Bayesian evidence is the probability of the data under a model after averaging over that model's free parameters and their prior probabilities. It is also called marginal likelihood. The ratio of two models' evidence is the Bayes factor, often reported as a logarithm in nats or nats per letter. Evidence penalizes needless freedom. On a 153-letter text, choosing the best seven key shifts adds about 0.15 nats per letter of false fit compared with averaging over them. That can make a wrong model look best."
updated = "2026-09-04"
