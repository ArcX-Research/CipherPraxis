summary = "Bayesian evidence, or marginal likelihood, is the probability mass or density of the observed data under a model after integrating over that model's parameters with their stated prior. The ratio of two marginal likelihoods is a Bayes factor, often reported on a logarithmic scale. Marginalization accounts for parameter volume, but it does not provide an automatic, prior-free penalty for complexity: conclusions can be sensitive to model specification and prior choice."
