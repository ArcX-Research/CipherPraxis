title = "Null distribution"
status = "VERIFIED"
status_note = "Standard statistical term; validity depends on the specified null-generating or randomization procedure."
family = "Statistics"
tags = ["null", "calibration"]
related = ["shuffled-null-z-score", "within-coset-null", "family-wise-null", "permutation-test", "g-z-score", "g-empirical-p-value"]
summary = "A null distribution describes a statistic under a specified data-generating or randomization model in which the tested signal is absent. Cryptanalytic nulls may preserve global letter counts, per-coset counts, or two texts' marginal contents while randomizing order or pairing. The preservation rule must match the nuisance structure relevant to the claim, and any selection step must be repeated. Without that specification, a tail probability or z-score is not calibrated to a clear hypothesis."
updated = "2026-09-07"
