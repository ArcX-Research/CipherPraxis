title = "Null distribution"
status = "VERIFIED"
status_note = "Standard term; the toolkit prints one with every reading."
family = "Statistics"
tags = ["null", "calibration"]
related = ["shuffled-null-z-score", "within-coset-null", "family-wise-null", "permutation-test", "g-z-score", "g-empirical-p-value"]
summary = "A null distribution shows how a statistic behaves when the tested signal is absent but other relevant structure remains. In cryptanalysis, it often comes from shuffled copies of the same ciphertext. Shuffles may keep total letter counts, each coset's counts, or the contents of two texts while changing their pairing. Results include the observed value, null mean and standard deviation, null maximum, and observed rank. A statistic without a matching null has no clear meaning."
updated = "2026-09-04"
