id = "cp-sat-and-smt-solvers"
section = "exact"
title = "CP-SAT and SMT solvers for cipher constraints"
subtitle = "Express alphabet, key, and language rules for general solvers and report SAT, UNSAT, or UNKNOWN"
status = "VERIFIED"
status_note = "Exact Z3 encodings use both CNF and bounded integers, and OR-Tools uses CP-SAT. Forced and blocked known-answer checks passed 4/4 in each system, taking at most 1.82 s and 1.32 s. Finite-word models at 91–95 letters made exact SAT or UNSAT decisions with separate forward checks, passing 8/8 controls. With 1,024 possible words at 95 letters, every solver returned UNKNOWN after 300 s. That is a solver limit, not a negative."
family = "Constraint programming"
tags = ["CP-SAT", "SMT", "Z3", "SAT", "automaton", "all-different", "table constraint", "timeout"]
related = ["constraint-satisfaction-forward-checking", "all-different-enumeration", "exact-chain-oracle", "known-answer-tests", "bound-benchmarks-and-certificates", "beam-search", "all-different-constraints", "units-mod-26", "quagmire-iii", "throughput-fail", "reproducibility-receipts", "g-certificate"]
summary = "CP-SAT and SMT solvers can ask whether one unknown alphabet, several key shifts, and plaintext from a fixed language explain a ciphertext together. The alphabet becomes 26 different positions. Modular equations become tables with 676 rows or Boolean carry rules. A small automaton represents the language. The solver may prove SAT, prove UNSAT, or return UNKNOWN. In tests, unforced 95-letter cases with 1,024 possible words reached the 300-second limit in every solver."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
Variables: $\text{pos}[L] \in 0..25$ for every letter $L$ (AllDifferent), shifts $k_m \in 0..25$, plaintext letters $U_i, V_i \in 0..25$, automaton states $E_i$, and per-position ranks $RU_i = \text{pos}[U_i]$ via Element constraints. Constraints:

```
AllDifferent(pos[A..Z]);  pos[A] in {0, 1, 2, 13}  # safe partial unit symmetry break
Element(U_i, pos, RU_i);  Element(V_i, pos, RV_i)                 # rank channels
Table_676(pos[C9_i], RU_i, k[m_i])   with rows (x, y, k): x = y + k mod 26     # QIII relation
Table_676(pos[C8_i], RU_i, RV_i)     with rows x = y + s*z mod 26              # chain relation, s = +/-1
Automaton(U, element-DFA);  Automaton(V, word-DFA)                # finite languages
redundant: same (map, cipher letter) => same U; within a map distinct cipher letters => distinct U
optional: Inverse(pos, ring); Element(RU_i, ring, U_i)            # rank-to-letter propagation, provably redundant
```

A forced model fixes the hidden plaintext literals and must be SAT. A forced-plus-blocked model adds one forbidden full tuple and must be UNSAT. The unforced model is the identification problem.
'''

[[blocks]]
kind = "equations"
body = '''
Bounded-integer form with Boolean carries (Z3):

$$\text{pos}[C_i] = RU_i + k_{m_i} - 26\,t_i, \qquad t_i \in \{0, 1\},$$

exact over ranks $0..25$. Multiplying every position and shift by a unit of $\mathbb{Z}_{26}$ preserves the equations. Restricting $\text{pos}[A]$ to $\{0,1,2,13\}$ keeps one representative value from each unit orbit of that single coordinate, so it is a safe partial symmetry break. It is not necessarily one representative of each full-coordinate orbit: the values 0 and 13 have nontrivial stabilizers. Exact orbit counts require canonicalizing the full coordinate vector or adding a separately proved gauge.

A regular language $\text{suffix}(t) \cdot t^\ast \cdot \text{prefix}(t)$ over a token bank is compiled to a DFA (element symbols: 26 states / 432 edges; 1,024 words: 345 states / 6,232 edges) and enforced as $E_{i+1} = \delta[26 E_i + U_i]$, with out-of-range transitions sent to a reject state.

Cardinality argument: a residue map is injective, so if one map sees 15 distinct ciphertext letters and the allowed plaintext alphabet of a bank has only 7, 5 or 13 letters, the instance is UNSAT before any search.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- A backend's `max_memory` parameter is not a whole-process bound: recorded peaks were 1,300,611,072 bytes and 3,382,280,192 bytes with the parameter set to 900 MB. An outer resource gate is required.
- UNKNOWN (timeout) carries no information either way. Only `unsat` may remove a candidate, and a forced/blocked panel must pass before an unforced instance is interpreted.
- Declaration counts do not predict solve time: a 207-variable forced Vigenère instance took 12.489 s where its Beaufort twin took 0.129 s.
- SAT is existence, not identification: blocking the first model and re-solving is mandatory.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Finite-vocabulary tiling, exact.** Compile a bank to a DFA, encode one shared cycle and five tied shifts as one-hot CNF with three-way channel clauses, decide each window: six bank/window cells UNSAT by cardinality, two cells SAT with an explicit second model after blocking the first (5,186 variables / 3,012,112 clauses, 13-16 s per solve).
- **Cross-chain with two finite languages.** Element-symbol DFA on one plaintext, top-1,024 generic-word DFA on the other, one cycle and five shifts; encodings from 301,760 CNF variables / 1,778,174 clauses down to 1,950 Z3 declarations / 2,841 assertions (154.75 times fewer) and 411-437 CP-SAT variables; incremental activation of word transitions in 13-character blocks.
- **Direct optimisation.** A CP-SAT model whose objective is an integer trigram sum over the plaintext under a two-transposition-plus-periodic-key geometry: the forced model proves OPTIMAL at the exact truth score 96,558,285 in 0.73 s. The unforced 36-letter instance returns UNKNOWN after 39.6 s with 3.15 GiB resident.
- **Earlier CP-SAT with quadgram feasibility tables**: cost 2,353 against the truth's 2,042 after 420 s; with top-60,000 quadgram feasibility no feasible point in 400 s.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Abstract interface: build a model, add constraints, solve under a time cap,
// and read a status in {SAT, UNSAT, UNKNOWN} together with a model when the
// status is SAT.
function BUILD_MODEL(ciphertext C, residue map m_i, automata):
    M = new model
    for each letter L: pos[L] = M.int_var(0, 25)
    // safe partial unit-domain symmetry break; not a full orbit count
    M.add(AllDifferent(pos[A..Z]));  M.add(pos[A] in {0, 1, 2, 13})
    for each residue r: k[r] = M.int_var(0, 25)
    for each position i:
        U[i] = M.int_var(0, 25); RU[i] = M.int_var(0, 25)
        // RU_i = pos[U_i]
        M.add(Element(U[i], pos, RU[i]))
        // 676 rows
        M.add(Table(pos[C[i]], RU[i], k[m_i]) in {(x, y, k) : x = y + k mod
                26})
    // finite language
    for each (word variables W, DFA) in automata: M.add(Automaton(W, DFA))
    return M

function SOLVE(M, time_cap):
    // (status, model); UNKNOWN carries no information
    return solver.solve(M, time_cap)

// Known-answer panel, required before any unforced instance is interpreted. S
// = hidden plaintext literals and full tuple
function KAT_PANEL(M, planted S, time_cap):
    // forced
    require SOLVE(M + force(S.plaintext), time_cap).status == SAT
    // blocked
    require SOLVE(M + force(S.plaintext) + forbid(S.full_tuple),
            time_cap).status == UNSAT
    return PASS

// SAT is existence, not identification: block the first model and re-solve.
function IDENTIFY(M, time_cap):
    (status, model) = SOLVE(M, time_cap)
    // only UNSAT removes a candidate
    if status != SAT: return status
    (status_2, _) = SOLVE(M + forbid(model), time_cap)
    return (model, unique = (status_2 == UNSAT))
```
'''

[[blocks]]
kind = "complexity"
body = '''
Model sizes at $n = 95$: one-hot CNF 301,760 variables; bounded-integer Z3 $33 + 8n + \text{arcs}(n)$ variables and $69 + 17n + \text{arcs}(n)$ assertions with $\text{arcs}(95) = 1{,}157$; CP-SAT 411 variables / 429 constraints / 385,320 flattened table values / 6,664 automaton transitions (437 / 613 with the redundant inverse channel). Solve times: light panels 0.03-1.82 s; finite-vocabulary decisions 13-16 s. Every unforced 95-letter cross-chain instance UNKNOWN at the 300 s cap.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Timeouts at target length.** Z3 CNF: UNKNOWN at 300.17 s and 300.14 s (2.4 GB resident, six threads); compact Z3: UNKNOWN at 300.073 s; incremental Z3: UNKNOWN at the first 13-character checkpoint after 300.047 s; CP-SAT: UNKNOWN at 300.067 s with 1.21 GiB resident. All four lanes stopped at the first failure by their frozen rule. No widening.
- **Non-identifiability.** Broad short-token banks (fourteen one-letter and 104 two-letter tokens) admit many strict tilings: blocking the first plaintext immediately yields another forward-valid one.
- **Missing backend.** One lane found no importable CP-SAT runtime and stopped at a static model with source-level counts. A later lane installed a pinned wheel into a task-only environment and validated every proto with zero solve calls before any control.
- **Fabricated power.** Treating `unknown` as `unsat` in a pruning loop would make a decoder look stronger. The audits forbid it.
'''

[[blocks]]
kind = "controls"
body = '''
Toy language equivalence: 254 strings, 207 accepted by both the old and the compact recogniser, 0 mismatches. Forced $n = 12$ Z3: SAT with literal pair, permutation and both forwards (12.489 s / 0.129 s), forced-plus-blocked UNSAT (0.000045 s / 0.000425 s). Incremental Z3 panel ($n = 12, 20$; both relations) 4/4, worst 1.822802 s. CP-SAT panel 4/4, worst 1.322267 s, forced-plus-blocked INFEASIBLE in 2-4 ms. Finite-vocabulary exact solver: 8/8 controls returned strict witnesses regenerating the hidden ciphertext (label recovery non-identifiable for broad banks, recorded rather than hidden). Direct-objective CP-SAT: forced OPTIMAL at the exact score; unforced UNKNOWN.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Variables $x, y, z \in \{0, 1, 2\}$, constraints $\text{AllDifferent}(x, y, z)$, $x + y \equiv 1 \pmod 3$, $z = 2$. Then $\{x, y\} = \{0, 1\}$ and both orders satisfy $x + y = 1$: solutions $(0, 1, 2)$ and $(1, 0, 2)$. A forced model (fix $x = 0$) is SAT; forced plus blocked (fix $x = 0$ and forbid the tuple $(0, 1, 2)$) is UNSAT, which is the known-answer pattern. The unforced model is SAT but not unique: blocking $(0, 1, 2)$ returns $(1, 0, 2)$, so the instance identifies the set $\{x, y\}$ but not the labels, exactly the situation recorded for the short-token banks.
'''

