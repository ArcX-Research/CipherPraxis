id = "word-lattice-segmentation"
section = "exact"
title = "Word-lattice segmentation of unspaced text"
subtitle = "Build every admitted token edge and use dynamic programming to choose the best path"
status = "VERIFIED"
status_note = "The max-score path is an exact dynamic program for a fixed acyclic lattice. It has been checked against scalar enumeration in the project and is supported by established word-lattice and Viterbi literature."
family = "Exact language decoding"
tags = ["word lattice", "segmentation", "Viterbi", "unspaced text"]
related = ["semi-markov-word-model", "viterbi-decoding", "exact-dynamic-programming", "word-prefix-csp", "combined-character-word-models", "lexical-reranking-and-oov-bias", "running-key-relation-test", "parameter-versus-plaintext-recovery", "running-key", "block-word-boundary-dp", "best-first-frontier-memory"]
summary = "Represent every admitted word or fallback fragment as an edge from its start to end position in an unspaced string. The best segmentation is the maximum-weight path through this directed acyclic graph. Viterbi dynamic programming finds that path exactly relative to the frozen lexicon and penalties."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
body = '''
For a string $y_0\ldots y_{n-1}$, make vertices $0,1,\ldots,n$. Add an edge $(i,j,w)$ when token $w=y_i\ldots y_{j-1}$ is admitted by the lexicon or fallback policy. Give it weight $\ell(i,j,w)$, commonly a log word probability plus declared length, boundary, or unknown-token penalties. A segmentation is a path from $0$ to $n$; its tokens concatenate exactly to the input.

Because every edge moves to a larger position, the lattice is a directed acyclic graph. The best path can therefore be computed exactly by a left-to-right Viterbi recurrence.
'''

[[blocks]]
kind = "equations"
title = "Max-score path"
body = '''
Let $V(j)$ be the best score of any path ending at position $j$. Then

$$V(0)=0,\qquad V(j)=\max_{(i,j,w)\in E}\{V(i)+\ell(i,j,w)\}.$$

Store the maximising predecessor to reconstruct the words. Retain every predecessor tied under the declared numerical rule when all optimum segmentations matter. If edge scores depend on the previous word, extend the state to $(j,w_{\rm prev})$; the same recurrence remains exact on the enlarged graph.
'''

[[blocks]]
kind = "equations"
title = "Two coupled word tries need not form a Cartesian square"
body = '''
Suppose two hidden strings obey a known letterwise bijection at each position, as in an additive cipher with fixed alphabet coordinates. At a fixed text layer, a pair of current trie nodes contains all future-relevant history for unigram token scores. Include explicit boundary-mode flags when the first token may be a fragment. This state is not sufficient for an unknown shared alphabet or word-history scores.

If the token depths are $a\ge b$, the longer first-string prefix determines its final $b$ letters. The ciphertext equation then determines the entire second-string prefix. There is at most one matching trie node. If $N_d$ counts ordinary prefix nodes at depth $d$, the number of possible ordinary state pairs is therefore at most

$$\sum_{d=1}^{L}(2d-1)N_d,$$

not the square of the trie size. Equal depths are counted once. This is an upper bound, not an observed reachable-state count or a timing result.

A first token still open after $i$ letters has depth exactly $i$. If $F_i$ is its allowed prefix set, including the declared leading fragments, then for $i\le L$ a corresponding bound is

$$\sum_{d<i}(2d-1)N_d+(2i-1)|F_i|.$$

After $L$ letters that first token cannot remain open. The ordinary-state bound assumes that prefixes productive only in leading-fragment mode are removed from ordinary traversal. Leaving such dead prefixes wastes states; permitting their fragment closure internally changes the language. Trie allocation, reachable states and retained traceback edges still need separate caps; even this reduced bound can be millions of states.
'''

[[blocks]]
kind = "equations"
title = "Aggregate word resets without dropping ties"
body = '''
Let $D(u,v)$ be a two-trie layer's best scores, with boundary flags included. Before consuming another letter, aggregate legal closing choices as

$$H_P(v)=\max_u[D(u,v)+c_P(u)],\qquad H_K(u)=\max_v[D(u,v)+c_K(v)],$$

and

$$H_B=\max_{u,v}[D(u,v)+c_P(u)+c_K(v)].$$

The double reset uses the same original state pair, not independently maximized marginals. A reset closes that side's first-token mode; the other side's flag is preserved. Nonterminal nodes have no closing choice.

When both destination token depths exceed one, their trie parents are the sole structural predecessor. If only the first depth is one, use $H_P$ at the second parent; use $H_K$ symmetrically. If both depths are one, use $H_B$. Handle the initial root consumption separately and check the ciphertext letter equation in every case. This is an exact maximum calculation, not a beam.

Shared argmax nodes can retain all tied reset parents without copying each parent list into every destination. Simultaneously closing both words is one boundary-pair parse, not two parses for the two possible epsilon-transition orders. Preserve tied ordinary/fragment labels as parse multiplicities. The unique-parent argument assumes a trie; a minimized word graph needs different predecessor handling.
'''

[[blocks]]
kind = "variants"
body = '''
- **Unigram lattice:** each edge score depends only on the token.
- **Word n-gram lattice:** the state includes preceding tokens.
- **Trie construction:** generate all lexicon edges beginning at a position without scanning the whole vocabulary.
- **Edge fragments:** permit bounded prefixes or suffixes where the candidate is known to cut through a word.
- **Unknown-token arcs:** guarantee coverage with an explicit penalty instead of making out-of-vocabulary text impossible.
- **Marginal lattice:** replace max with log-sum-exp to sum probability over segmentations.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions"
body = '''
- The lexicon, token probabilities, normalisation, maximum token length, and fallback penalties are frozen.
- Every edge consumes at least one character, so the graph is acyclic.
- Exactness is relative to the admitted lattice. Missing words and pruned edges remain outside the theorem.
- If input chunks may begin or end inside a word, the permitted edge-fragment policy is specified in advance.
'''

[[blocks]]
kind = "assumptions"
title = "Coupled-trie decoding with aggregated resets — scope"
body = '''
Aggregated terminal resets preserve a maximum-score path when future transitions depend only on the retained trie states and declared context. Retain tied predecessors if all optimal segmentations are required. A finite lexicon limits the language model; beam pruning additionally limits the search and cannot support an exhaustive exclusion.
'''

[[blocks]]
kind = "attack"
title = "Use as a decipherment component"
body = '''
Decode each retained complete candidate to an unspaced string, build its lattice from a hashed general lexicon, and run the exact recurrence. Store the best score, token path, and any ties. Use the lexical result as one declared component of ranking rather than a validity test. Include out-of-vocabulary controls and report whether a missing edge, not the structural search, caused a loss.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
function BUILD_LATTICE(text, trie, fallback_policy):
    edges = empty lists indexed by end position
    for start in 0..LENGTH(text)-1:
        for token, end in TRIE_MATCHES(text, start, trie):
            edges[end].append((start, token, TOKEN_SCORE(token)))
        add every fallback edge allowed at start by fallback_policy
    return edges

function VITERBI_SEGMENT(text, lattice):
    best[0] = 0; predecessor[0] = NONE
    for end in 1..LENGTH(text):
        best[end] = NEGATIVE_INFINITY
        for start, token, edge_score in lattice[end]:
            candidate = best[start] + edge_score
            if candidate improves best[end]:
                best[end] = candidate
                predecessor[end] = (start, token)
            else if candidate ties: retain the additional predecessor
    return best[last position], BACKTRACK_ALL_TIED_PATHS(predecessor)
```
'''

[[blocks]]
kind = "pseudocode"
title = "Coupled-trie decoding with aggregated resets"
body = '''
```text
function DUAL_TRIE_DECODE(cipher, plain_trie, key_trie, boundary_policy):
    layer = {(plain_root, key_root, initial_flags): score_zero}
    for position in cipher:
        if position is first:
            closure_sources = [layer]
        else:
            HP = MAXIMIZE_PLAIN_CLOSURE_PER_KEY_STATE(layer)
            HK = MAXIMIZE_KEY_CLOSURE_PER_PLAIN_STATE(layer)
            HB = MAXIMIZE_BOTH_CLOSURES_FROM_SAME_STATE(layer)
            closure_sources = [layer, HP, HK, HB]
        next = SPARSE_MAP_WITH_TIED_BACKPOINTER_DAG()
        for source in closure_sources:
            for legal plaintext child letter a:
                b = KEY_LETTER_FOR(cipher[position], a)
                if matching key-trie child exists:
                    RELAX_MAX_AND_RETAIN_TIES(next, both_children, source)
        if state or backpointer budget exceeded: return INCOMPLETE
        layer = next
    finals = APPLY_LEGAL_TERMINAL_CLOSURES_ONCE(layer, boundary_policy)
    return COMPLETE, MAX_SCORE_AND_ALL_REQUIRED_WITNESSES(finals)
```
'''

[[blocks]]
kind = "complexity"
body = '''
Topological Viterbi costs $O(|E|)$ time and $O(n)$ best-score storage for a unigram lattice, plus the space needed for edges and tied backpointers. With a trie and maximum admitted token length $L$, construction is typically $O(nL)$ character transitions. Word-history states increase both costs by the number of retained histories.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Lexicon incompleteness.** The correct path is absent because a name, spelling, or inflection is missing.
- **Unbounded fragments.** Cheap fallback arcs let arbitrary strings masquerade as words.
- **Greedy splitting.** Taking the best next word can miss the best complete path.
- **Silent pruning.** A token cap or beam turns an exact lattice calculation into a heuristic one.
- **Boundary leakage.** Fragments are allowed everywhere although only the ends of a chunk can cut words.
- **Tie loss.** One optimum segmentation is displayed as unique because equal predecessors were overwritten.
- **Parse ties called text ties.** Different optimal segmentations can produce the same unspaced physical string or coupled string pair. Deduplicate physical outputs before claiming recovery or uniqueness; a compact tie graph alone does not certify that every physical output has been enumerated.
- **Cheap states, expensive traces.** Two score layers may fit while cumulative predecessor edges, exact parse counts or exponentially many tied physical outputs exceed their caps. Report incomplete output, not a unique winner.
'''

[[blocks]]
kind = "controls"
body = '''
Compare the dynamic program with exhaustive segmentation on short strings. Include a unique optimum, multiple tied optima, a missing word served by fallback, a string with no legal path when fallback is disabled, and chunks that legitimately cut words only at their edges. Hash the lexicon order and effective token set so package drift cannot change the graph silently.
'''

[[blocks]]
kind = "example"
title = "Two paths through one string"
body = '''
For `THERAPIST`, a lattice might contain paths `THE | RAP | IST` and `THERAPIST`, along with other admitted splits. Each edge advances from one character boundary to another. The recurrence compares whole-path sums, so a locally frequent `THE` cannot force the first split if the single-token path has the better total. If `THERAPIST` is absent from the frozen lexicon, exact Viterbi cannot select that missing edge.
'''

[[blocks]]
kind = "notes"
body = '''
The algorithm is exact about segmentation, not about linguistic truth. The project's reusable contribution is the fail-closed boundary and provenance contract around a standard word-lattice dynamic program.
'''

