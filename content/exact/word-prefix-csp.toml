id = "word-prefix-csp"
section = "exact"
title = "Word-prefix and crib-pair constraint solving"
subtitle = "Let language suggest openings or crib pairs, then let exact algebra accept or reject them"
status = "VERIFIED"
status_note = "The crib-pair algebra passed two planted controls and the successor exhausted the admitted d13=5 tail: 8,851 systems with zero all-different reads. Systems with d13 at least 6 remained open, and full-key completion beyond seven unused coordinates used a greedy heuristic. The word-prefix form has a known-answer check but its full control panel was still in calibration."
family = "Constraint programming"
tags = ["crib pair", "word prefix", "null space", "particle filter", "decoy bank", "scoped closure"]
related = ["all-different-enumeration", "exact-chain-oracle", "constraint-satisfaction-forward-checking", "beam-search", "corpus-bank-screen", "crib-dragging", "crib-driven-alphabet-recovery", "quagmire-iii", "family-wise-null", "local-language-model-prior", "target-absent-controls", "g-forward-checking"]
summary = "A word-prefix solver uses language to propose short plaintext pieces, such as an 18- to 24-letter opening or two long cribs. Exact algebra can accept or reject a supplied proposal when its declared null-space enumeration completes. It retains every observed all-different read. Literal full-key completion and language ranking are exhaustive only when all unused-label assignments are enumerated; greedy completion is a heuristic and cannot support uniqueness or a full-family negative."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
```
proposals <- complete words / openings from a bank, a language model, or a corpus
for each proposal and each placement (offset, relation, key phase):
    rows <- one Z26 equation per fragment letter in the unknown positions (gauge z(X0) = 0)
    (d2, d13) <- null-space dimensions over GF(2), GF(13)
    if d13 > cap: mark unresolved (explicitly counted), continue           # honest boundary
    reads <- all-different enumeration; keep every distinct read
    for each read: complete the free letters (exhaustive if <= 7 unused positions;
                   otherwise mark the greedy ranking branch heuristic);
                   score by quadgrams; require forced-crib consistency and literal roundtrip
rank completions; compare with the frozen matched decoy panel as an empirical endpoint
```

Adaptive mode (particle filter): sample candidate openings, keep prefixes whose partial permutation is exactly feasible (and conservatively keep resource-unknown ones), ask the language model to continue each retained prefix; default stages 18, 21 and 24 clean letters.
'''

[[blocks]]
kind = "equations"
body = '''
Single-text keyed substitution with one alphabet on both sides and key $k_b$: a crib letter $p$ under ciphertext $c$ at coset $b$ gives $z(c) - z(p) - k_b \equiv 0 \pmod{26}$; with a key word $W$, $k_b = z(W_b)$. Two cribs of lengths $m_1, m_2$ give $m_1 + m_2$ rows; on a plant, $15 + 18$ letters left nullities $(3, 3)$ for the truth and $(2, 2)$ for wrong pairs, while a single 18-letter word left $(15, 15)$ for both: pairs decide, single words do not.

Decoy calibration: nine banks with the same equality pattern and lengths as the semantic bank are run through the identical pipeline. A real completion must beat the combined familywise decoy endpoint.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The cipher relation, period and key structure are fixed hypotheses. The CSP is exact under them and mute outside them.
- The unresolved tail is explicit: after the first 240 high-dimension pairs per bank and zone, the crib-pair run left 976 systems on one zone ($d_{13} = 5{:}781,\ 6{:}174,\ 7{:}19,\ 8{:}2$) and 261 on the other ($5{:}160,\ 6{:}95,\ 7{:}6$) unresolved. A successor processed the $d_{13} = 5$ tail at $13^7$ and left $d_{13} \ge 6$ explicitly open.
- A proposal bank is a proposal mechanism. A miss leaves the family open.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Crib-pair CSP on two zones.** Ten candidate instruction-like phrases placed pairwise at every offset under both relations; exact enumeration of consistent assignments, completion budget top 24 with 4 restarts, forced-crib and roundtrip gates, familywise decoy gate. Controls: one zone's plant recovered under the Vigenère relation with two phrases at offsets 0 and 72 (rate $-4.247$), the other under Beaufort with phrases at offsets 0 and 33 (rate $-4.503$), both reading as English with literal roundtrip and forced-crib PASS; none of the nine decoy banks produced a completed candidate. Live zones: zero completed rows in the finite slice.
- **Tail continuation.** Deterministic reconstruction of the 20 ordered large-system lists (23/23 lists verified against the frozen transcript with 0 mismatches), processing of every remaining $d_{13} = 5$ system: 8,851 systems, zero all-different reads, familywise endpoint $-\infty$.
- **Word-prefix chain CSP.** Complete English words proposed for the opening of a chained text; feasibility by GF(2)/GF(13) then a local all-different check; language selection only among feasible words; adaptive particles at 18/21/24 letters. Every endpoint finished on all 153 letters and re-encrypted.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Extension step: grow a feasible opening of the text by one proposed word,
// and let the exact algebra accept, reject, or mark it unresolved.
function EXTEND_PREFIX(prefix P, word w, C, placement, cap):
    // candidate opening
    P' = P + w
    rows = one Z26 equation per letter of P' in the unknown positions z,
            gauge z(X0) = 0
    (d2, d13) = null-space dimensions of rows over GF(2) and GF(13)
    // counted explicitly, never rejected
    if d13 > cap: return (P', UNRESOLVED, none)
    // every distinct read kept
    reads = all-different enumeration of the null spaces
    // exact rejection
    if reads is empty: return (P', INFEASIBLE, none)
    return (P', FEASIBLE, reads)

// Adaptive mode (particle filter) over clean-letter checkpoints.
function ADAPTIVE_SEARCH(C, stages, language_model, bank, cap):
    particles = [empty prefix]
    for L in stages:
        while some P in particles has fewer than L clean letters:
            replace each such P by the openings P' with (P', status, _) =
                    EXTEND_PREFIX(P, w, ...)
                for w in language_model.continuations(P, bank) and status !=
                        INFEASIBLE
    // feasible (or resource-unknown) prefixes
    return particles

// Finishing every surviving read: complete the free letters (exhaustive if at
// most 7 unused positions, else greedy); score by quadgrams; require
// forced-crib consistency and a literal roundtrip; rank completions against
// the familywise endpoint of the matched decoy banks.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Cost is dominated by the all-different enumeration of systems with $d_{13}$ near the cap: $13^5$ combinations at about 44-94 ms each, $13^7$ for the tail budget. The crib-pair run produced a 1,451-line transcript. The tail continuation a 511-line one after a 201-line KAT transcript. The corpus front end handled 39,528 unique prefixes under four sign pairs in one session.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Best-read-only rule.** The frozen rule kept one partial read per system and lost a planted pair whose true read ranked second of six. The continuation keeps every read and was re-KAT'd (planted pair recovered at index 1,459 of 3,482 systems, rate $-4.429$).
- **Boundary ties.** The system sort key omitted the relation flag, so ties straddled the declared index 240. The continuation processes the whole straddling group (a superset).
- **Gauge on the second text.** In the chain variant a fixed translation gauge made the first text's decrypt a rotation of the truth in about 25 of 26 plants; scores must be maximised over the 26 translations.
- **Homogeneity.** Single words never fail linear consistency. Only pairs or long openings with small $d_{13}$ are decidable.
- **Language-model lineage loss.** Word-level beams that fed this CSP lost every true lineage within 25-27 letters. The CSP cannot rescue a proposal that was never made.
'''

[[blocks]]
kind = "controls"
body = '''
Crib-pair: 2/2 every-offset planted controls PASS (rates $-4.247$, $-4.503$; ENGLISH; roundtrip PASS; forced-crib PASS); decoy banks 0/9 completions. Tail continuation: KAT PASS on a synthetic 90-letter tail zone with 3,482 large systems; decoy banks regenerated identical to the frozen transcript (9/9); 23/23 list reconstructions exact. Word-prefix chain: KAT 144 all-different solutions containing the planted cycle (nullity $(5, 5)$); pre-filter 0/27,544 violations; corpus deployment control gate 1/1.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Alphabet positions $z(\cdot)$ unknown, key word letters $W_0, W_1$ at cosets 0 and 1, relation $z(c) = z(p) + z(W_b)$. A two-letter crib `AB` under ciphertext `CD` at cosets 0, 1 gives $z(C) - z(A) - z(W_0) \equiv 0$ and $z(D) - z(B) - z(W_1) \equiv 0$. Two rows in six unknowns leave a four-dimensional null space per field: nothing is decided. Add a second crib `BA` under `EC` at the same cosets: $z(E) - z(B) - z(W_0) \equiv 0$ and $z(C) - z(A) - z(W_1) \equiv 0$. Subtracting the first and fourth rows gives $z(W_0) \equiv z(W_1)$; with $W_0 \ne W_1$ as letters, injectivity of $z$ makes the pair infeasible. The single crib could not be refuted. The pair is rejected exactly, and that asymmetry is the whole design.
'''

