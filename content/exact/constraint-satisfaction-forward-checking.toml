id = "constraint-satisfaction-forward-checking"
section = "exact"
title = "Constraint satisfaction with forward checking"
subtitle = "Assign one value at a time, remove impossible choices early, and backtrack when none remain"
status = "VERIFIED"
status_note = "The method assigns word rows under fixed column substitutions, solving a planted control in 244 nodes. It also solves crib-plus-keyword equations over alphabet positions, recovering planted answers at 100% from 13- to 20-letter cribs with scores -4.12 to -4.27. A third form tiles finite word lists. Every tool prints its control before target results."
family = "Constraint programming"
tags = ["CSP", "forward checking", "backtracking", "MRV", "node budget", "all-different"]
related = ["word-prefix-csp", "all-different-enumeration", "cp-sat-and-smt-solvers", "exhaustive-enumeration", "all-different-constraints", "crib-driven-alphabet-recovery", "crib-dragging", "quagmire-iii", "dictionary-attack", "planted-controls", "g-forward-checking"]
summary = "A constraint satisfaction problem gives each variable one value from a fixed set while obeying every rule. Forward checking removes newly impossible choices from unassigned variables after each step. If any variable has no choices left, the solver backs up at once. Choosing the variable with the fewest options next keeps the search small. In cryptanalysis, variables may be row words, positions in an unknown alphabet, or tiles. Cipher equalities and one-to-one mappings supply the rules."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Variables $X_1 \dots X_n$ with domains $D_i$, constraints $C_{ij}$ between pairs (and the global all-different where the values are alphabet positions).

```
solve(assignment, domains):
    if all assigned: record solution; return
    pick unassigned X with the smallest |D_X|               # minimum remaining values
    for v in D_X:
        nodes += 1; if nodes > budget: return                 # honest cap: "none within budget"
        assignment[X] <- v
        for each unassigned Y sharing a constraint with X:    # forward checking
            D'_Y <- { u in D_Y : C_XY(v, u) holds }
            if D'_Y is empty: dead; break
        if not dead: solve(assignment, domains with D'_Y)
        unassign X
```

For linear systems over $\mathbb{Z}_{26}$ (crib letters give $\text{idx}(c) - \text{idx}(p) - k_b \equiv 0$), unit equations are propagated first, the branch is on the most constrained letter, and the all-different constraint on positions is enforced at every assignment.
'''

[[blocks]]
kind = "equations"
body = '''
Row-word CSP under seven fixed column substitutions. For rows $r, q$ with ciphertext rows $c_r, c_q$ and candidate words $w_r, w_q$, for every column $b$:

$$[\,c_r[b] = c_q[b]\,] \iff [\,w_r[b] = w_q[b]\,],$$

which is injectivity of each column map expressed pairwise. The same test filters a row's domain against every assigned row in one vectorised comparison.

Crib CSP. With one alphabet $A$ acting on both sides and key shifts $k_b$, a crib letter $p$ at position $i$ under ciphertext $c$ gives the linear equation $\operatorname{idx}_A(c) - \operatorname{idx}_A(p) - k_{i \bmod 7} \equiv 0 \pmod{26}$; with a key word $W$, $k_b = \operatorname{idx}_A(W_b)$ makes it an equation in three letter positions.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The constraints are exact consequences of the cipher model. A solution is a proof of consistency, not of correctness, and is finished (completion of free letters) and read.
- A node budget converts an open search into an honest "none within budget". Only an exhausted search supports a negative.
- Spurious solutions scale with the bank: a 704-word bank has an expected spurious count near $10^{-28}$ for nine rows, while an unconstrained dictionary bank finds spurious assignments within a few nodes and is uninformative by design.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Rows of words.** A period-7 zone read as a list of 7-letter words under seven fixed substitutions; families of 704 (four words with one-letter variations), about 52,000 (two-letter variations) and about 25,000 (all 7-letter dictionary words). Every phase of the period; budgets of 2,000,000 and 150,000 nodes; solutions capped at three.
- **Crib plus key word.** Cribs of 7-20 letters at every offset for each candidate key word; consistent assignments are ranked by the quadgrams of their pinned letters and completed by a quadgram climb over the free letters; wrong placements die in tens to hundreds of nodes when the key word is right.
- **Token tilings.** A window is parsed left to right into tokens of a frozen vocabulary while five partial maps (with tied residues) stay consistent. Each complete tiling is then checked against the modular position system with all-different positions.
- **Direct letter-guess CSP.** In a chain without a free constant, every guessed plaintext letter is one homogeneous equation; GF(2) and GF(13) null spaces plus the CRT all-different factorisation decide feasibility in about 0.01 s per solve at crib length 26.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Variables X_1..X_n with domains D_i and pairwise constraints C_XY; the
// values are row words, alphabet positions (with a global all-different), or
// tokens.
function SOLVE(assignment, domains, budget):
    if every variable is assigned: RECORD(assignment); return
    // minimum remaining values
    X = unassigned variable with the smallest |domains[X]|
    for v in domains[X]:
        nodes = nodes + 1
        // honest cap, not a negative
        if nodes > budget: status = NONE_WITHIN_BUDGET; return
        assignment[X] = v
        new_domains = copy of domains; dead = false
        // forward checking
        for each unassigned Y that shares a constraint with X:
            new_domains[Y] = { u in domains[Y] : C_XY(v, u) holds }
            if new_domains[Y] is empty: dead = true; break
        if not dead: SOLVE(assignment, new_domains, budget)
        unassign X
    // every value tried without reaching the budget: this subtree has no
    // solution

// Row-word constraint under fixed column substitutions: for rows r, q and
// every column b, c_r[b] = c_q[b] iff w_r[b] = w_q[b] (injectivity of each
// column map, pairwise).
function ROW_PAIR_OK(c_r, c_q, w_r, w_q):
    for b in 0..len-1:
        if (c_r[b] == c_q[b]) != (w_r[b] == w_q[b]): return false
    return true

// Crib CSP over alphabet positions: a crib letter p under ciphertext c at
// position i gives idx_A(c) - idx_A(p) - k_{i mod 7} = 0 mod 26; propagate
// unit equations first, branch on the most constrained letter, and re-check
// all-different on positions after every assignment.
```
'''

[[blocks]]
kind = "complexity"
body = '''
Worst case exponential in the number of variables; forward checking and MRV make the recorded instances small: control 244 nodes (nine rows, 704 candidates), wrong phases exhausted in 704-705 nodes; crib CSP wrong placements typically 27-677 nodes with the key word; exhaustive object tilings of a 95-letter window from 1,453 nodes (32 compass names) to 1,668,079 (note names), with short-token banks hitting a 2,000,001-node cap.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Underdetermined systems.** Without the key word ("free" shifts) the crib CSP never pins the alphabet: completion reads 0% at every crib length 7-20. With the key word, 13- and 15-letter cribs pinned it in 1 of 3 seeds, 17 letters in 2 of 3, and 20 letters read 100% even where the enumeration hit its 300,000-node cap.
- **Caps hit by short tokens.** Banks of one- and two-letter tokens (element symbols, note names, compass abbreviations, glyph strings) exceeded 2,000,001 nodes because every ambiguous tokenisation is visited separately. The exact closure came from compiling the bank to a DFA and using SAT (see [CP-SAT and SMT solvers](/exact/cp-sat-and-smt-solvers)).
- **Homogeneous systems.** A single word guess is always linearly consistent; rejection comes only from the all-different constraint once the null space is small, so single short cribs cannot be refuted exactly.
- **Spurious solutions.** Large banks produce consistent assignments that are not the plaintext. The solution count within budget is the statistic, and any hit is a candidate until read and reproduced.
'''

[[blocks]]
kind = "controls"
body = '''
Word rows: planted nine rows (four words with one-letter variations) under seven random substitutions solved in 244 nodes (3 solutions found at the cap of 3, the truth among them); wrong phases of the same control exhausted with no solution in 704-705 nodes. Crib plus key word (96-letter planted zone, random alphabet, node cap 300,000): completions at $-4.12$, $-4.12$, $-4.27$ and $-4.10$ with 100% match for the solving seeds at 13, 15, 17 and 20 letters; wrong offsets 0 solutions in 27-677 nodes in most rows. Direct letter-guess CSP: 32/32 exact plaintext recovery at crib length 26 (power 1.000).
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Three ciphertext rows of length 3 under three unknown column substitutions: `XYZ`, `XQZ`, `PYW`. Word bank $\{$CAT, COT, DOG, CAR, BAT, BAR, RAT$\}$. Pairwise constraints: rows 1,2 must agree in columns 0 and 2 and differ in column 1; rows 1,3 must agree only in column 1; rows 2,3 must differ everywhere.

Assign row 1 = CAT. Forward check row 2: needs $w[0] = $ C, $w[1] \ne$ A, $w[2] = $ T, leaving $\{$COT$\}$. Row 3: needs $w[0] \ne$ C, $w[1] = $ A, $w[2] \ne$ T, leaving $\{$BAR$\}$. Assign COT, check BAR against it: C$\ne$B, O$\ne$A, T$\ne$R, all required inequalities hold. Solution CAT / COT / BAR with column maps C$\to$X, B$\to$P; A$\to$Y, O$\to$Q; T$\to$Z, R$\to$W, each injective.

Had row 1 been CAR, forward checking of row 2 (needs C, $\ne$A, R) empties its domain at once and the branch is abandoned without touching row 3. The mirrored solution COT / CAT / DOG also exists, which is why solution counts, not existence, are the statistic for large banks.
'''

