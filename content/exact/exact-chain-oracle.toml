id = "exact-chain-oracle"
section = "exact"
title = "Exact chain oracle"
subtitle = "Give it a possible plaintext opening; it rejects it or returns every matching alphabet"
status = "VERIFIED"
status_note = "The exact algebra removes the middle text, handles gauge equivalents, and checks all-different answers over GF(2) x GF(13). It passed 50/50 random planted cases and matched brute force. Its alphabet-free filter passed 256 synthetic chains and rejected 256/256 mutations. Used unchanged on a 2.34-million-letter corpus bank, it passed its 1/1 control and found zero answers. The full word-prefix control panel was still being calibrated."
family = "Exactness guarantees"
tags = ["oracle", "chain", "shared cycle", "gauge", "pre-filter", "black box"]
related = ["all-different-enumeration", "word-prefix-csp", "corpus-bank-screen", "segment-chain-analysis", "shared-cycle-attack", "conjugacy-and-gauge", "modular-inverse-and-crt", "running-key", "gauge-defect-invalidation", "target-absent-controls", "g-certificate"]
summary = "In this chain, the first text uses a keyed substitution. Its plaintext then acts as a running key for the second text under the same unknown alphabet. Removing that middle plaintext leaves one homogeneous equation per position in the alphabet map. The exact oracle takes a proposed opening of the second plaintext, runs fast alphabet-free collision checks, and solves the remaining CRT null spaces under an all-different rule. It returns every matching alphabet and key class. Each answer must re-encrypt both ciphertexts byte for byte."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Generating relations for position $i$ of the second text and $j = i \bmod 144$ of the first (a 144-letter first text; positions beyond it wrap to the first class):

$$z(C'_j) = e_B\, z(P'_j) + \kappa_j, \qquad z(C_i) = e_A\, z(P_i) + z(P'_j),$$

with $e_A, e_B \in \{\pm 1\}$, $z$ an unknown bijection of the 26 letters onto $\mathbb{Z}_{26}$, and $\kappa_j$ a key class that is constant on the first segment and periodic afterwards.

```
oracle(prefix P[0..L-1], signs):
    pre-filter: (C_i, C'_i) = (C_j, C'_j) => P_i = P_j;  exactly one equal component => P_i != P_j   # reject cheaply
    rows: z(P_i) - e8 z(C_i) + e8 e9 z(C'_j) - e8 e9 kappa_j = 0 over the observed letters; gauge z(X0) = 0
    null spaces over GF(2) and GF(13); enumerate all-different reads (2^d2 + 13^d13)
    for each read: complete unused positions; derive kappa classes from the prefix; fit the periodic classes on the full text
                   decrypt both texts; require literal re-encryption of both ciphertexts
    return the finished candidates (possibly none)
```
'''

[[blocks]]
kind = "equations"
body = '''
Elimination: $z(P'_j) = e_B (z(C'_j) - \kappa_j)$ and $z(P_i) = e_A (z(C_i) - z(P'_j))$ give

$$z(P_i) - e_A\, z(C_i) + e_A e_B\, z(C'_j) - e_A e_B\, \kappa_j = 0 \pmod{26}.$$

Subtracting two positions $i, r$ of the same $\kappa$ class removes $\kappa$ exactly. Translation $z \mapsto z + b$ is a symmetry with $\kappa \mapsto \kappa + b(1 + e_A e_B - e_B)$. The second text's decrypt is invariant only up to that translation, so any score of it must be maximised over the 26 translations of each candidate, and the first text's positions are ranked invariantly.

Collision invariants: $z$ injective and the equation linear in $z(P_i)$ imply that equal $(C_i, C'_j)$ pairs force equal $P_i$, and exactly one equal component forces unequal $P_i$, for every $z$, $\kappa$ and sign pair.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The chain relation, the class boundary of $\kappa$ and the wrap rule are hypotheses of the family. The oracle is exact given them and silent about them.
- A roundtrip after fitting is necessary but tautological: any invertible fitted key reproduces its ciphertext. Readability of the full text, an independent implementation, and null or uniqueness evidence are separate gates.
- The oracle returns all reads, so a proposal generator (a language model, a particle filter, a corpus screen) can be arbitrarily heuristic without compromising the exactness of the decision.
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
- **Word-prefix front end.** Complete English words are proposed for the opening of the second text; cheap GF(2)/GF(13) consistency precedes a local all-different check; language-model selection happens only among algebraically feasible complete words. An adaptive mode keeps feasible prefixes as particles at 18, 21 and 24 clean letters and asks the model to continue them.
- **Word-pair front end.** Two words of at least 18 letters placed anywhere in the constant-$\kappa$ class. Each surviving cycle decrypts all 62 class positions of the second text and the 53-letter prefix of the first directly, with no shift search, which is the selection statistic. The completion of unobserved letters is exhaustive over at most 7 unused positions, else greedy.
- **Corpus front end.** Every 24-letter window of a 2,344,368-letter corpus through the pre-filter (39,528 unique survivors) and then the oracle under all four sign pairs: zero endpoints.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Inputs: second-text ciphertext C, first-text ciphertext C' (length 144, j =
// i mod 144), signs e_A, e_B, and a proposed opening P[0..L-1] of the second
// text. alphabet-free collision implications
function PREFILTER(P, C, C'):
    for i in 0..L-1, r in i+1..L-1:
        j = i mod 144; s = r mod 144
        both = (C[i] == C[r]) and (C'[j] == C'[s])
        // exactly one equal component
        one  = (C[i] == C[r]) != (C'[j] == C'[s])
        if both and P[i] != P[r]: return REJECT
        if one  and P[i] == P[r]: return REJECT
    return PASS

function ORACLE(P, C, C', e_A, e_B):
    if PREFILTER(P, C, C') == REJECT: return []
    rows = []
    // kappa cancels
    for each pair (i, r) with i, r < L in the same kappa class:
        rows.append( [z(P_i) - z(P_r)] - e_A [z(C_i) - z(C_r)] + e_A e_B
                [z(C'_j) - z(C'_s)] = 0 )
    add the gauge row z(X0) = 0; unknowns = the letters that occur
    // GF(2) x GF(13) null spaces, 2^d2 + 13^d13
    reads = ALL_DIFFERENT_READS(rows)
    out = []
    for z in reads:
        complete z on the unused positions
        derive kappa on the prefix classes
        fit the periodic classes
        P_full = DECRYPT(C, C', z, kappa, e_A, e_B)
        if ENCRYPT(P_full, z, kappa, e_A, e_B) reproduces both C and C'
                literally:
            out.append((z, kappa, P_full))
    // possibly empty: an exact decision
    return out
```
'''

[[blocks]]
kind = "complexity"
body = '''
Pre-filter $O(L^2)$ per proposal, vectorised over a corpus. Oracle cost is the all-different enumeration: 0.4-10 ms for $d_{13} \le 4$, 44-94 ms at $d_{13} = 5$. A full word-pair selector run (4 sign cells, 299,563 pairs) was estimated at about 41 minutes on 6 workers at 12.4 ms per pair, then sped up by cached digit matrices and int16 GF(13) collision rejection before the CRT cross product.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Gauge defect.** The first word-pair selector fixed $z(C_0) = 0$ and scored the first text's decrypt in that gauge. The true cycle then failed the exact first-text check in about 25 of 26 plants and could be discarded. The run was terminated, its header retained under a failed-run name, and the successor maximises over the 26 translations.
- **Rank never rejects.** A single word gives a consistent system with an enormous null space. The oracle is only decisive once two long cribs or a long prefix (about 18-24 letters) bring $d_{13}$ to 5 or below.
- **Scoped negatives.** A miss closes only the tested proposal bank: verbatim corpus windows, pairs from a 105-word list, or sampled openings. The wider family stays open.
- **Pattern is not an identifier.** The collision mask on the first 53 positions (4 equalities, 108 inequalities) admits vast numbers of English strings. It speeds the oracle up and identifies nothing by itself.
'''

[[blocks]]
kind = "controls"
body = '''
Equation and gauges: 50/50 random plants across all four sign cells with the cycled tail; translation symmetry at $b = 1, 5, 13$, unit symmetry at $u = 3, 5, 25$. Pre-filter: 0/27,544 violations on a plant; standalone 256 synthetic chains, 256/256 mutations rejected, 4,096-window scalar/vector agreement. Word-pair KAT: a planted 18-letter pair gives nullity $(5, 5)$ and 144 all-different solutions containing the planted cycle; in the fixed gauge the first text was wrong and in the best gauge exact at shift 4. Corpus deployment: control gate 1/1, zero endpoints from 39,528 survivors. The word-prefix front end's full target-absent control panel was in progress when these notes were frozen.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
Take $e_A = e_B = +1$ and two positions $i, r$ in the same $\kappa$ class. From the eliminated equation,

$$z(P_i) - z(P_r) = \big[z(C_i) - z(C_r)\big] - \big[z(C'_i) - z(C'_r)\big] \pmod{26}.$$

Suppose the ciphertexts show $C_i = C_r$ but $C'_i \ne C'_r$. The right-hand side is $-[z(C'_i) - z(C'_r)] \ne 0$ because $z$ is injective, so $P_i \ne P_r$ for every alphabet and key: a proposed opening with $P_i = P_r$ is rejected before any algebra. If instead both components agree, the right-hand side is $0$ and the opening must have $P_i = P_r$. These two implications are the whole pre-filter. The oracle proper handles everything the pattern leaves open.
'''

