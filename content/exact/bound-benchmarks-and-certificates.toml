title = "Bound benchmarks and certificates"
subtitle = "Prove safe pruning, measure cost before a full run, and save results that others can replay"
status = "VERIFIED"
status_note = "A branch-and-bound core proved global maxima over 26^7 keys, including tie counts. It passed 6/6 planted cases with one tie each in about 50 ms. A compiled whole-cell bound passed all algebra and parity gates and used 2.506529 and 5.837933 CPU-hours against limits of 4.0 and 12.0. A useless always-zero bound was rejected. Three invalid benchmarks remain recorded with their defects. Read-only certificate replay reproduced a no-candidate result and rejected 8/8 and 4/4 mutations."
