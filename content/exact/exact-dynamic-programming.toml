id = "exact-dynamic-programming"
section = "exact"
title = "Exact dynamic programming"
subtitle = "Reuse smaller exact answers to solve column layouts, key chains, and assignments"
status = "VERIFIED"
status_note = "Four dynamic programs are checked. A long/short column-layout solver recovered four planted layered ciphers at 100%. A cyclic three-step key solver passed three blind controls at 100% and matched full width-2 search in 8/8 known-answer checks. A 9x9 assignment solver covered 126 cases. A two-transposition subset solver ranked its development control 1 of 4,096."
family = "Dynamic programming"
tags = ["dynamic programming", "optimal substructure", "column layout", "chain objective", "assignment"]
related = ["viterbi-decoding", "periodic-substitution-dp", "order-free-width-statistic", "mixture-inference-under-transposition", "expectation-maximisation", "k-best-lists", "columnar-transposition", "sandwich-construction", "transposition-width-recovery", "known-answer-tests", "g-objective-function"]
summary = "Dynamic programming finds an exact best answer by reusing solutions to smaller parts. It can choose the layout of long and short columns in an uneven grid, find a repeating key under overlapping quadgram scores, or assign column chunks to labels. It works when a large problem splits cleanly into linked smaller ones. Every dynamic program here is compared with brute force on a small case where checking every answer is practical."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
**Long/short column layout.** A text of $n$ letters written in $w$ columns has $\text{rows} = \lceil n/w \rceil$ and $\text{extra} = n \bmod w$ long columns; in the unpadded convention the first $\text{extra}$ column indices are long. A block score $B(\text{start}, \text{len})$ is the best class-pattern score of a contiguous block of positions (best over the pattern phase). The best total over all $\binom{w}{\text{extra}}$ placements of long columns:

```
dp[0][0] <- 0
for j in 0 .. w-1:                       # columns in read-out order
    for l in 0 .. extra:                 # long columns used so far
        pos <- l*rows + (j-l)*(rows-1)   # start of column j
        if l < extra:            dp[j+1][l+1] <- max(dp[j+1][l+1], dp[j][l] + B(pos, rows))
        if j-l < w-extra:        dp[j+1][l]   <- max(dp[j+1][l],   dp[j][l] + B(pos, rows-1))
answer dp[w][extra]; trace back the long/short choices
```

**Order-three key chain.** See [Viterbi decoding](/search/viterbi-decoding): $V_t(b,c,d) = \max_a [V_{t-1}(a,b,c) + \Phi_{t-3}(a,b,c,d)]$ with cyclic closure by enumerating the first three states.

**Assignment DP.** For a fixed source column, the best matching of nine endpoint chunks to nine literal labels with a capacity multiset is solved exactly by a mixed-radix state over the label counts (288 states for the capacities $\{0,0,1,1,2,3,4,5,6\}$ used in the bound proofs).
'''

[[blocks]]
kind = "equations"
body = '''
Class prefix sums make block scores $O(1)$: with $Q_t[i] = \sum_{j < i} P_c[j, (t + \text{step}\cdot j) \bmod k]$ for centred posteriors $P_c$, the score of a block starting at $a$ of length $L$ under phase $t$ is $Q_t[a + L] - Q_t[a]$, and $B(a, L) = \max_t (Q_t[a+L] - Q_t[a])$. Centring per class is what makes the all-one-class configuration score zero. Complexity of the layout DP: $O(w \cdot \text{extra})$ block evaluations after $O(k n)$ prefix sums.
'''

[[blocks]]
kind = "assumptions"
title = "Assumptions and invariants"
body = '''
- The objective decomposes over the DP's stages (blocks, consecutive key positions, chunks); cross terms that violate this must be enumerated outside the DP (the three cyclic closure terms).
- A DP is exact only inside its stated family and shortlist; its optimum under a wrong model is a confident wrong answer that only a null or a readability verdict exposes.
- Every DP in the corpus has a brute-force twin at small size: cyclic DP versus exhaustive width-2 enumeration (8/8), layout DP versus all $\binom{w}{\text{extra}}$ layouts (the top-$k$ layouts routine enumerates them when there are at most 2,000).
'''

[[blocks]]
kind = "attack"
title = "How to attack it"
body = '''
The layout DP measures, for every width $w$, how well the class posteriors of a mixture form the block pattern a columnar transposition would imprint (constant per column for even $w$, alternating for odd $w$) without knowing the column order; the resulting $z$ against shuffled ciphertexts pushed through the same DP selects the widths to hand to the order solver. The key-chain DP finishes periodic keys exactly inside a shortlist. The assignment DP proves properties of relaxations (that a proposed bound is identically zero) by exhausting all $2 \times 9 \times 7 = 126$ geometry cases.
'''

[[blocks]]
kind = "complexity"
body = '''
Layout DP: $O(w \cdot \text{extra})$ per width and phase, negligible next to the 60 shuffled nulls that calibrate it. Key chain: $O(p \cdot W^4)$ per starting triple. Assignment DP: 288 states joined with per-block enumerations; the compiled bound kernel that uses it evaluates 81 edges per cell with a median projection of 2.506529 CPU-hours over 185,088 cells for one partition ensemble.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Degenerate objective.** Without per-class centring, every even width is maximised by calling all letters one class; the DP faithfully returns that useless optimum.
- **Wrong convention.** A DP over long/short columns assumes the unpadded convention (long columns first); an exact grid has no long columns and a padded grid has none either, so the model of the grid must be stated.
- **Stage boundaries.** The open-chain key DP ignores the three closing quadgrams; the polish repairs them but does not guarantee the global optimum, which is why the cyclic variant enumerates starts.
- **Optimum under the wrong family.** Measured zones finished at $-6.037$, $-6.290$ and $-5.107$ by the exact key DP, at or below their conditional null maxima: exact, and meaningless.
'''

[[blocks]]
kind = "controls"
body = '''
Layout DP inside the mixture pipeline: planted sandwiches at width 9 ($z = +12.8$), width 8 ($z = +11.3$) and width 12 ($z = +4.3$) all polish to $-4.34$ with 100% match; a planted Bifid, a plain periodic layer and a double columnar show no width. Key-chain DP: three blind controls 100% (63 and 95 letters at period 7, 126 at period 26), KAT 8/8 against brute force. Inner-subset DP in the sandwich selector: development control D8 at exact tuple rank 1 of 4,096 starts after the k-best repair.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
$n = 8$, $w = 3$: rows $= 3$, extra $= 2$, so two columns are long (length 3) and one short (length 2); the three layouts are LLS, LSL, SLL with blocks starting at $0, 3, 6$ / $0, 3, 5$ / $0, 2, 5$. Toy block scores: $B(0,3) = 2.0$, $B(3,3) = 1.5$, $B(2,3) = 0.5$, $B(5,3) = 1.0$, $B(6,2) = 0.8$, $B(3,2) = 0.2$, $B(0,2) = 0.3$.

DP: $dp[1][1] = 2.0$ (long at 0), $dp[1][0] = 0.3$ (short at 0); $dp[2][2] = 2.0 + 1.5 = 3.5$, $dp[2][1] = \max(2.0 + 0.2,\ 0.3 + 0.5) = 2.2$; $dp[3][2] = \max(3.5 + 0.8,\ 2.2 + 1.0) = 4.3$. The optimum $4.3$ is layout LLS, and the direct sums confirm it: LLS $= 4.3$, LSL $= 3.2$, SLL $= 1.8$.
'''

