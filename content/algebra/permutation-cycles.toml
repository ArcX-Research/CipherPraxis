title = "Permutation cycles"
subtitle = "Use cycle shapes to complete a partial alphabet map"
status = "VERIFIED"
status_note = "Given the true partial map, the one-cycle test and 720-way completion recovered 64/64 planted cycles, with 63/64 ranked first. The earlier language beam kept that true map in only 32/64 cases. The full attack is therefore power-limited, and its one live run was inconclusive."
family = "Group theory"
