summary = "A feedback cipher may have many written keys that describe the same transform. Translating the hidden state or relabelling the outer coordinates by an invertible affine map changes the parameters and substitution together while preserving every output. Quotient these proved gauges when counting formal model cells. If two cells merely give the same equality pattern on one ciphertext, record a sample collision rather than declaring the models equivalent."
