title = "Units modulo 26"
subtitle = "The 12 invertible values modulo 26 and why cipher solvers need them"
status = "VERIFIED"
status_note = "The unit group, all 144 ordered coefficient pairs, and its gauge role are implemented exactly. Independent controls recovered three hidden multiplier tuples and each ranked 1/100 against matched nulls. Target tests found a structural zero in all 144 cases for the stated aligned unit-ratio family, ruling out only that family and scope."
