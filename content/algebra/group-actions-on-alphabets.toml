summary = "Several groups can change a keyed cipher's settings. One relabels letters, another changes cycle coordinates, another rescales shifts, and a dihedral group rereads positions. If such a change leaves the ciphertext unchanged, all settings in that orbit are equivalent. A solver should search one representative from each orbit, use a score that does not depend on the gauge, and compare answers by orbit. Counting orbits also shows how large the search is."
updated = "2026-09-07"

[[blocks]]
kind = "definition"
body = '''
A group $G$ **acts** on a set $X$ when each $g \in G$ is a bijection of $X$ compatible with composition. The **orbit** of $x$ is $Gx = \{gx : g \in G\}$, the **stabiliser** $G_x = \{g : gx = x\}$, and $|Gx| \cdot |G_x| = |G|$ (orbit-stabiliser). The action is **free** when every stabiliser is trivial, so every orbit has $|G|$ elements. A **canonical representative** is a distinguished member of each orbit, typically the lexicographic minimum.

Actions relevant to keyed ciphers: $S_{26}$ on letters (substitution); $\mathrm{AGL}(1, \mathbb{Z}_{26})$ on the coordinates of a cycle; $U(\mathbb{Z}_{26})$ on shift vectors; and $D_n$ on block positions. For the convention $C_t[g_t(j)]$ and the latent reindexing $L'(j)=L(h(j))$, position maps transform by right composition, $g_t\mapsto g_t\circ h$.
'''

[[blocks]]
kind = "equations"
body = '''
- **Affine action on cycle solutions.** $z' = \alpha z + \beta$, $\alpha \in U(\mathbb{Z}_{26})$, $\beta \in \mathbb{Z}_{26}$, with keys $k' = \alpha k + (1 - a_t)\beta$. The action on bijective cycles is free, orbits have $12 \cdot 26 = 312$ members.
- **Units on shift triples.** Ordered triples of distinct shifts number $26 \cdot 25 \cdot 24 = 15{,}600$. Under $k \mapsto uk$ (Vigenère-type: $z \to uz$ gives $k \to uk$) the action is free, so there are $15{,}600 / 12 = 1{,}300$ canonical cells (1,157 with a unit shift, 143 with all shifts even). Under units combined with the 13 even translations (Beaufort-type: $k \to uk + 2\beta$) the group has order $12 \cdot 13 = 156$ and there are $15{,}600 / 156 = 100$ cells (78 mixed parity, 11 all even, 11 all odd).
- **Larger equivalence in one degenerate regime.** In the cited all-even or all-odd distinct-shift regime, the generated translation subgroup has order 13 and its normalizer has order 4,056 rather than 312. Other proper subgroups can have different normalizers and stabilizers; failure to generate the full rotation group alone does not determine the number 4,056.
- **Dihedral relabelling.** Choosing $h=g_0^{-1}$ first sets $g_0=\mathrm{id}$. Any later reindexing that preserves $g_0=\mathrm{id}$ has $h=\mathrm{id}$, so the $96^2=9{,}216$ ordered pairs are representatives with no residual quotient.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The group must act on the parameters *and* leave the observable invariant. Otherwise it is a family axis, not a symmetry.
- Freeness must be proved, not assumed: non-free actions give orbits of varying size, and canonical counts change.
'''

[[blocks]]
kind = "attack"
body = '''
1. List one representative from each orbit instead of all parameters: 1,300 or 100 cells instead of 15,600 triples, and one cycle from each 312-member orbit.
2. Score with gauge-invariant statistics; verify invariance by scoring full orbits in a KAT.
3. In controls, compare recovered parameters modulo the orbit and report the witness $(\alpha, \beta)$; require the control truth to lie in the retained orbit.
4. Use orbit sizes to convert raw description counts into effective search sizes ($26!/312 \approx 2^{80}$ cycle classes).
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// A group G acts on a set X through ACT(g, x); orbits partition X.
function ORBIT(x, G):
    return { ACT(g, x) : g in G }

// distinguished member of the orbit
function CANONICAL(x, G):
    return min over g in G of ACT(g, x)             // lexicographic minimum

function STABILISER_ORDER(x, G):
    // |orbit| * |stabiliser| = |G|
    return |{ g in G : ACT(g, x) == x }|

// One representative per orbit, and a check that the action is free.
function ORBIT_REPRESENTATIVES(X, G):
    reps = []; seen = empty set; free = true
    for x in X (in lexicographic order):
        if x in seen: continue
        orb = ORBIT(x, G)
        if |orb| != |G|: free = false                // non-trivial stabiliser
        reps.append(x); seen = seen union orb
    // |reps| = number of orbits
    return (reps, free)

// Actions used for keyed additive ciphers (all arithmetic mod 26): affine on
// a cycle:        ACT((alpha, beta), z) = alpha*z + beta, keys k' = alpha*k +
// (1 - a_t)*beta units on shift vectors:   ACT(u, k) = u*k (Vigenère-type)
// units and even shifts:    ACT((u, beta), k) = u*k + 2*beta (Beaufort-type)
// With C_t[g_t(j)] and L'(j)=L(h(j)), latent reindexing acts by right
// composition: ACT(h, g_t) = g_t o h. Choose h=g_0^{-1} to set g_0=id.
```
'''

[[blocks]]
kind = "complexity"
body = '''
$|\mathrm{AGL}(1, \mathbb{Z}_{26})| = 312$; $15{,}600 \to 1{,}300$ or $100$; $9{,}216$ dihedral pairs; $26!/312 \approx 2^{80}$. Orbit partitioning of a solution set costs one canonicalisation per cycle. The controls verified $\text{cycles} = 312 \times \text{orbits}$ in every one of 1,728 cells.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- Quotienting a transformation that is not a symmetry (the translation-gauge defect: the decrypt of a second text is not invariant under a coordinate translation, and comparing it in a fixed gauge failed correct solutions).
- Grouping solutions by a canonical key without proving that each group is a full orbit inside the solution set and that the groups partition it.
- Confusing parameter aliases (same plaintext, different parameters) with ties between distinct plaintexts. The degenerate small-modulus fixture produced four multiplier aliases of one latent.
- A ranker built on pooled marginal edges failed to separate the true canonical cell (rank 1 in 0/20 plants; max rank 1,268): a scorer failure, not an orbit failure, and recorded as such.
'''

[[blocks]]
kind = "controls"
body = '''
Canonical cell enumeration proved by exhaustive KAT (15,600 triples to 1,300 and 100 orbits; sampled key-orbit sizes 12 and 156); score gauge-invariance over full orbits on 20 random triples in both relations. An exact one-hot prior ranked the true canonical cell uniquely first on 6 plants. Dihedral controls: all solution sets partitioned into complete, disjoint 312-orbits in 1,728 unit cells, and 300 matched-null selections with constant one-orbit geometry; small-modulus analogue orbits of size 12 verified complete and disjoint. Bank deduplication: 312 descriptions of one alphabet reduced to one class.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
$U(\mathbb{Z}_{26})$ acting on $\mathbb{Z}_{26}$ by multiplication has four orbits: $\{0\}$, $\{13\}$ (since $u \cdot 13 = 13$ for every odd $u$), the 12 units, and the 12 non-zero even residues ($2 \cdot \{1, 3, \dots, 25\} = \{2, 6, 10, 14, 18, 22, 4, 8, 12, 16, 20, 24\}$). Stabilisers have orders 12, 12, 1, 1, and $1 + 1 + 12 + 12 = 26$.

Ordered distinct shift triples under units: a unit $u \ne 1$ fixes $(k_a, k_b, k_c)$ only if every entry lies in $\{0, 13\}$, impossible for three distinct values, so the action is free and there are exactly $15{,}600 / 12 = 1{,}300$ orbits.
'''

[[blocks]]
kind = "notes"
body = '''
Orbit counting is the quantitative side of [Conjugacy and gauge](/algebra/conjugacy-and-gauge). The specific groups are described under [Units mod 26](/algebra/units-mod-26), [Affine maps](/algebra/affine-maps-mod-26) and [Dihedral group](/algebra/dihedral-group).
'''

