title = "Group actions on alphabets and keys"
subtitle = "Group equivalent cipher settings and keep one standard representative"
status = "VERIFIED"
status_note = "Exact enumeration reduces 15,600 ordered shift triples to 1,300 unit-orbit classes, or to 100 classes under units plus the 13 even translations in the stated Beaufort-type action. In the cited dihedral controls, every solution set split into complete 312-member affine orbits. Checks covered all 1,728 unit cells and 300 matched-null selections."
family = "Group theory"
