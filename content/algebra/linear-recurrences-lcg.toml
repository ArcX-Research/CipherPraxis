id = "linear-recurrences-lcg"
section = "algebra"
title = "Linear recurrences and LCG keys"
subtitle = "Running keys generated by affine, lagged-Fibonacci and polynomial recurrences"
status = "CLOSED"
status_note = "Order-one affine recurrences (LCG-type, progressive and drifting keys) were screened by affine-lag filters with a family-wise shuffled null and showed no excess on any of the three texts. Lagged-Fibonacci digit keys (periods 6 and 7) and constant-acceleration schedules were tested with passing planted controls and gave non-language endpoints on the 504-letter text. Scope: those recurrences, lags and periods only."
family = "Modular arithmetic"
tags = ["recurrence", "LCG", "lagged Fibonacci", "progressive key", "meet-in-the-middle"]
related = ["affine-maps-mod-26", "modular-inverse-and-crt", "difference-operators", "lcm-of-periods", "gromark", "alberti-progressive", "running-key", "meet-in-the-middle", "family-wise-null", "g-linear-congruential-generator"]
summary = "A key stream produced by a linear recurrence has a lot of apparent entropy and a small description: a primer and a rule. The rule leaves algebraic fingerprints. An affine recurrence is removed by an affine-lag filter that turns ciphertext into a scaled self-difference of plaintext; a lagged-Fibonacci digit chain is linear in its primer, so its digits are a public matrix times the primer and can be met in the middle; a polynomial schedule has a constant second difference. Each fingerprint was turned into an instrument and tested."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
A **linear recurrence** of order $d$ over $\mathbb{Z}_M$ is $k_i = \sum_{j=1}^{d} a_j k_{i-j} + b \pmod M$. Order one with lag $L$ is the **affine** (LCG-type) recurrence $k_i = a\,k_{i-L} + b$; with $a = 1$ it is a progressive key, with $b = 0$ a geometric one. The **lagged-Fibonacci** digit recurrence used by Gromark-type ciphers is $d_i = d_{i-P} + d_{i-P+1} \pmod{10}$ from a $P$-digit primer. A **polynomial schedule** $a_i = \beta i + \alpha\, i(i-1)/2 \pmod{26}$ has constant second difference $\alpha$ (constant acceleration).
'''

[[blocks]]
kind = "equations"
body = '''
- Affine-lag filter: if $k_i = a\,k_{i-L} + b$ then $c_i - a\,c_{i-L} = (p_i - a\,p_{i-L}) + b$. The filtered text has the distribution $R_a(d) = \sum_{x,y : x - ay \equiv d} E(x)E(y)$, the $a$-scaled self-convolution of the language, shifted by $b$.
- Lagged Fibonacci is linear in the primer: $d_i = \sum_j A_{i,j} r_j \pmod{10}$ with $A_{i,j} = A_{i-P,j} + A_{i-P+1,j}$; under $\mathbb{Z}_{10} \cong \mathbb{Z}_2 \times \mathbb{Z}_5$ the primer splits into halves whose contribution vectors are met by addition.
- Substitution-invariant selector: with $C_i = \sigma[(P_i + d_i) \bmod 26]$, equal ciphertext letters give $P_j - P_i \equiv d_i - d_j \pmod{26}$ regardless of the unknown alphabet $\sigma$; consecutive occurrences of every letter form a spanning forest of $n - (\text{observed letters})$ edges.
- Polynomial schedule: $a_{i+1} - 2a_i + a_{i-1} \equiv \alpha$.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The recurrence, its lag and its coefficients are the same over the whole text; a change point breaks every identity above.
- For the filter the plaintext is natural language, so that $R_a$ is distinguishable from uniform.
- For lagged-Fibonacci recovery the period $P$ is enumerated; the alphabet may be an arbitrary permutation.
'''

[[blocks]]
kind = "attack"
body = '''
1. **Affine-lag screen.** For each unit $a$ and lag $L = 1..40$ compute the filtered text, score it against $R_a$ by a log-likelihood ratio with $b$ maximised out, and compare the family-wise maximum with shuffles.
2. **Primer meet-in-the-middle.** Enumerate all $10^P$ primers by half-chain vectors, score each with the invariant selector using a generic lag/difference model, pass the top 32,768 ($P = 6$) or 131,072 ($P = 7$) cells to a one-to-one monogram assignment and quadgram scoring, and anneal the alphabet for the best 32.
3. **Schedule deprogression.** For every $(\alpha, \beta)$ and both alphabet orders, undo the schedule exactly and hand the residue to a substitution engine.
'''

[[blocks]]
kind = "complexity"
body = '''
480 filters per text and order. Exactly $10^6$ and $10^7$ meet-in-the-middle cells at $P = 6, 7$ without recomputing the chain per cell. The schedule family has 1,352 raw descriptions in 1,351 equality classes; its core passed 112,216 arbitrary-acceleration checks.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- A maximum over 480 correlated filters reaches $z \approx +4$ per cell by chance; only the family-wise null (observed maximum LLR against the shuffled maximum) is interpretable, and it was flat: $z$ between $-0.7$ and $+0.3$ over the six text-and-order cells.
- The invariant rank of a true primer can be as low as 72,008 of $10^7$; a shortlist narrower than that (an earlier lane retained far fewer) silently loses the truth. Raising an exhaustive loop bound without a new constraint repeats the old method.
- Any invertible guess round-trips; readability, controls and family-wise nulls are separate mandatory gates.
'''

[[blocks]]
kind = "controls"
body = '''
Lagged Fibonacci, four 504-letter controls held out beyond the lag-model training prefix with arbitrary alphabets: primers 415511 and 638930 ($P = 6$) ranked 8,319 and 6,499 of $10^6$ by the invariant and 1 after refinement; primers 0691650 (leading zero retained) and 9783807 ($P = 7$) ranked 72,008 and 13,812 of $10^7$ then 1; all four recovered 504/504 letters, 26/26 observed alphabet ranks and passed core and independent forwards. Target at $P = 6$ and $7$: rates $-6.6653$ and $-6.6677$ (project rate $-7.2025$, $-7.1125$), non-language, forwards pass, no candidate.

Schedules: four controls (accelerations 2, 7, 12, 24) exact at rank one with rates $-9.62$ to $-10.06$; three live seeds round-tripped at $-14.968$, $-14.932$, $-14.931$ against a gate of $-12.5$, non-English.
'''

[[blocks]]
kind = "example"
title = "Reproducible example"
body = '''
LCG $k_i = 3k_{i-1} + 5 \pmod{26}$ from $k_0 = 1$: $1, 8, 3, 14, 21, 16, 1, \dots$ — period 6. For any plaintext, $c_i - 3c_{i-1} = p_i - 3p_{i-1} + 5$: the filtered ciphertext equals the filtered plaintext plus the constant 5 at every position.

Lagged Fibonacci with primer $3\,1\,4\,1\,5$ ($P = 5$): $d_5 = 3 + 1 = 4$, $d_6 = 1 + 4 = 5$, $d_7 = 4 + 1 = 5$, $d_8 = 1 + 5 = 6$, $d_9 = 5 + 4 = 9$, $d_{10} = 4 + 5 = 9$, $d_{11} = 5 + 5 = 10 \equiv 0$; the stream begins $3\,1\,4\,1\,5\,4\,5\,5\,6\,9\,9\,0$.

Polynomial schedule with $\beta = 2$, $\alpha = 3$: $a_0, a_1, a_2, a_3 = 0, 2, 7, 15$ and the second differences are $7 - 4 + 0 = 3$, $15 - 14 + 2 = 3$.
'''

[[blocks]]
kind = "notes"
body = '''
Recurrence keys are a "lot of entropy, small structure" family: the LCG has $26 \cdot 12 \cdot 26$ states of $(k_0, a, b)$, a 7-digit primer $10^7$. Compound periodic keys, whose period is an lcm rather than a recurrence, are treated under [lcm of periods](/algebra/lcm-of-periods).
'''

