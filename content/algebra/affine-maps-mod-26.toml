id = "affine-maps-mod-26"
section = "algebra"
title = "Affine maps modulo 26"
subtitle = "How x ↦ ux + b describes cipher keys, changing keys, reading routes, and equivalent forms"
status = "VERIFIED"
status_note = "Affine maps with unit multipliers are exact and reversible. Tests passed for affine position routes (3/3 held-out texts) and polynomial key schedules (4/4). The matching target tests were negative only within their stated scopes. The affine-lag key screen found no family-wide excess in any of the three texts."
family = "Modular arithmetic"
tags = ["affine", "AGL", "route", "recurrence", "gauge"]
related = ["units-mod-26", "modular-arithmetic-z26", "linear-recurrences-lcg", "conjugacy-and-gauge", "group-actions-on-alphabets", "affine-cipher", "route-transposition", "alberti-progressive", "selection-overfit-diagnostic", "affine-lab", "g-affine-orbit"]
summary = "An affine map multiplies by a unit and then adds a constant. The same rule appears in affine ciphers, LCG-style running keys, text routes of the form ui + d, and equivalent views of a keyed alphabet. There are 312 such maps modulo 26. Before comparing recovered settings, a solver must account for maps that describe the same result, called a gauge."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
$$f_{u,b}(x) = u x + b \pmod{26}, \qquad u \in U(\mathbb{Z}_{26}),\; b \in \mathbb{Z}_{26}.$$
$f_{u,b}$ is a bijection exactly when $u$ is a unit, with inverse $f^{-1}(y) = u^{-1}(y - b)$. Under composition the maps form the affine group $\mathrm{AGL}(1, \mathbb{Z}_{26})$ of order $12 \cdot 26 = 312$:
$$(u_1, b_1) \circ (u_2, b_2) = (u_1 u_2,\; u_1 b_2 + b_1).$$
'''

[[blocks]]
kind = "equations"
title = "Four appearances of the same map"
body = '''
- **Affine cipher**: $c = u p + b$ on letters; see [Affine cipher](/ciphers/affine-cipher).
- **Affine recurrence keys**: $k_i = a\,k_{i-L} + b$ (LCG, progressive and drifting keys). Then $c_i - a\,c_{i-L} = (p_i - a\,p_{i-L}) + b$: the filtered ciphertext is the $a$-scaled self-difference of the plaintext plus a constant, whose distribution is the $a$-scaled self-convolution of the language.
- **Affine position routes**: $X_i = C_{(u i + d) \bmod n}$ with $\gcd(u, n) = 1$. When every admitted period $p$ divides $n$ the cut is a gauge: $P'_i = P_{i+s}$, $k'_b = k_{b+s}$, $d' = d + u s$ give the same ciphertext.
- **Affine gauge on cycles**: $z' = \alpha z + \beta$ leaves a keyed additive cipher equivalent, with keys $k' = \alpha k + (1 - a_t)\beta$ (Vigenère-type, row multiplier $a_t$) or $k' = \alpha k + 2\beta$ (Beaufort-type).

A second-order relative is the polynomial key schedule $a_i = \beta i + \alpha\, i(i-1)/2$, whose second difference is the constant $\alpha$; over both alphabet orders and all $\alpha, \beta$ it has 1,352 raw descriptions falling into 1,351 equality classes.
'''

[[blocks]]
kind = "assumptions"
body = '''
- The multiplier is a unit; for routes it must also be coprime to the text length $n$.
- Recurrence coefficients $(a, L, b)$ are the same at every position. A change point breaks the filter identity.
- A route gauge exists only when the period divides $n$. Otherwise the absolute cut is identifiable and must be compared literally.
'''

[[blocks]]
kind = "attack"
body = '''
- **Affine-lag filters.** For each unit $a$ and lag $L = 1..40$ form $c_i - a\,c_{i-L}$, score it by log-likelihood ratio against the $a$-scaled self-convolution of English with the additive constant maximised out, and compare the family-wise maximum with the same scan on shuffled texts.
- **Affine routes.** Exhaust every unit $u$, every offset $d$ evaluated as a cyclic cut, every divisor period $p \le 42$, both alphabet orders and both relations. The 96 best endpoints receive the quadgram periodic finish. An independent forward rebuilds $X$ and writes it back through $C_{(ui+d) \bmod n} = X_i$.
- **Polynomial schedules.** Exact deprogression of the schedule followed by a substitution engine.
'''

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Affine map f_{u,b}(x) = u x + b mod 26 with u a unit of Z26 and b in 0..25.
function AFFINE(u, b, x):
    return (u*x + b) mod 26

function AFFINE_INVERSE(u, b, y):               // requires gcd(u, 26) = 1
    uinv = INVERSE_MOD(u, 26)                   // extended Euclid
    return (uinv * (y - b)) mod 26              // f^{-1}(y) = u^{-1}(y - b)

// apply (u2, b2) first, then (u1, b1)
function COMPOSE((u1, b1), (u2, b2)):
    return ((u1*u2) mod 26, (u1*b2 + b1) mod 26)

// Affine position route: X_i = C_{(u i + d) mod n}, valid when gcd(u, n) = 1.
function ROUTE_READ(C[0..n-1], u, d):
    for i in 0..n-1:
        X[i] = C[(u*i + d) mod n]
    return X

// Affine-lag filter: if k_i = a k_{i-L} + b then c_i - a c_{i-L} = (p_i - a
// p_{i-L}) + b.
function LAG_FILTER(c[0..n-1], a, L):
    for i in L..n-1:
        f[i-L] = (c[i] - a*c[i-L]) mod 26
    return f
```
'''

[[blocks]]
kind = "complexity"
body = '''
$|\mathrm{AGL}(1, \mathbb{Z}_{26})| = 312$. The lag screen runs $12 \times 40 = 480$ filters per text and alphabet order. The route family's cheap stage exhausts all units and cuts before polishing 96 endpoints. The schedule engine passed 112,216 arbitrary-acceleration recurrence checks in its known-answer test.
'''

[[blocks]]
kind = "failure_modes"
body = '''
- **Selection overfit in a high-parameter route family.** On the 144-letter text the best route endpoint scored $-4.8163$, above the nominal language threshold, yet all three complete-pipeline shuffled maxima beat it ($-4.7400$, $-4.9034$, $-4.8844$). Readability plus an invertible round trip is not evidence.
- The lag screen is a maximum over 480 correlated cells; individual cells reach $z \approx +4$ by chance. Only the family-wise comparison is meaningful (for one text and order: observed maximum LLR $5.0$ against shuffled $5.1 \pm 0.6$).
- A non-unit multiplier is neither a cipher nor a route; enumerations must skip it explicitly.
'''

[[blocks]]
kind = "controls"
body = '''
Routes: 36 route inversions, three exhaustive cyclic-cut score comparisons and three algebraic rotation-gauge identities passed; held-out controls of 153, 144 and 504 letters (route plus periodic layer at periods 17, 16 and 28) recovered the exact cyclic plaintext class and round-tripped. Targets then gave no candidate: $-6.0616$ (153 letters) and $-6.4356$ (504 letters) failed the language gate, and the 144-letter endpoint lost to its nulls as above.

Polynomial schedules: four full-length controls with accelerations 2, 7, 12 and 24 recovered the hidden plaintext at rank one with independent forwards (rates $-9.62$ to $-10.06$). Three live seeds round-tripped but scored $-14.968$, $-14.932$, $-14.931$ against a frozen gate of $-12.5$ and disagreed on the best cell.
'''

[[blocks]]
kind = "example"
title = "Worked example"
body = '''
$f(x) = 3x + 5$. Since $3^{-1} = 9$ and $-45 \equiv 7$, the inverse is $f^{-1}(y) = 9y + 7$: $x = 2 \mapsto 11 \mapsto 9 \cdot 11 + 7 = 106 \equiv 2$.

Composition: $(3, 5) \circ (5, 2) = (15, 3 \cdot 2 + 5) = (15, 11)$. Check on $x = 1$: inner $5 + 2 = 7$, outer $3 \cdot 7 + 5 = 26 \equiv 0$; directly $15 + 11 = 26 \equiv 0$.

Route with $n = 7$, $u = 3$, $d = 1$: positions $3i + 1 \bmod 7$ for $i = 0..6$ are $1, 4, 0, 3, 6, 2, 5$, a permutation because $\gcd(3, 7) = 1$.

Filter identity with the recurrence $k_i = 3k_{i-1} + 5$: $c_i - 3c_{i-1} = p_i - 3p_{i-1} + 5$ for every $i$, so the constant 5 is common to all filtered positions.
'''

[[blocks]]
kind = "notes"
body = '''
The order 312 recurs as the size of the affine orbit of a cycle solution; see [Group actions on alphabets](/algebra/group-actions-on-alphabets). The recurrence use is developed under [Linear recurrences and LCG keys](/algebra/linear-recurrences-lcg).
'''

