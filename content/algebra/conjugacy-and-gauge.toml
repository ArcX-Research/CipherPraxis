id = "conjugacy-and-gauge"
section = "algebra"
title = "Conjugacy and gauge freedom"
subtitle = "Which transformations of the unknowns leave a cipher model's observables unchanged, and how to fix them validly"
status = "VERIFIED"
status_note = "The gauge symmetries of the shared-cycle chain (translation with a coupled key shift, unit multiplication, free unobserved letters) are proven and tested: unit gauge 48/48, translation gauge 16/16, orbit canonicalisation 312 descriptions to 1 class. The one controls run that compared a recovered text in a fixed gauge while scoring in another was invalidated and superseded."
family = "Group theory"
tags = ["gauge", "symmetry", "canonicalisation", "identifiability", "conjugacy"]
related = ["permutation-cycles", "group-actions-on-alphabets", "units-mod-26", "affine-maps-mod-26", "modular-arithmetic-z26", "gauge-defect-invalidation", "planted-controls", "shared-cycle-attack", "segment-chain-analysis", "key-cancellation", "quagmire-iii", "g-gauge-freedom", "g-affine-orbit", "g-conjugate-permutation"]
summary = "A gauge freedom is a transformation of the unknown parameters that leaves every observable of the model unchanged, so the parameters are identifiable only up to the gauge group. For keyed additive ciphers the gauge is generated by translating the alphabet coordinates and multiplying them by a unit, with the key shifting along. Fixing the gauge wrongly, or comparing a recovered object in one gauge while scoring it in another, produces controls that fail on correct solutions; the corpus records one such invalidated run."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
body = '''
Two permutations are **conjugate** when $w = z^{-1} \tau z$ for some bijection $z$: the keyed additive alphabet is the conjugate of a plain rotation by the coordinate map. A **gauge freedom** of a model with unknowns $\theta$ is a group $G$ acting on $\theta$ such that every observable (ciphertext, and any statistic computed from it) is invariant: $\mathrm{obs}(g\theta) = \mathrm{obs}(\theta)$. Solutions therefore come in $G$-orbits; **gauge fixing** picks one representative per orbit by adding constraints, and **canonicalisation** picks a distinguished member (for example the lexicographic minimum) after enumeration.
'''

[[blocks]]
kind = "equations"
title = "The two-text chain and its gauges"
body = '''
Let text A (153 letters) be enciphered with the plaintext of text B (144 letters) as a cycled running key, both under one unknown cycle $z$, signs $e_A, e_B \in \{\pm 1\}$, and a segmented key $\kappa_j$ on text B:
$$z(C^B_j) \equiv e_B\, z(P^B_j) + \kappa_j, \qquad z(C^A_i) \equiv e_A\, z(P^A_i) + z(P^B_{j}), \quad j = i \bmod 144.$$
Eliminating $P^B$:
$$z(P^A_i) - e_A\, z(C^A_i) + e_A e_B\, z(C^B_j) - e_A e_B\, \kappa_j \equiv 0 \pmod{26}.$$
Gauges of this system:
- **(G1) translation** $z \to z + b$, together with $z(P^{B\prime}) = z(P^B) - e_A b$ and $\kappa \to \kappa + b\,(1 + e_A e_B - e_B)$: both ciphertexts and $P^A$ unchanged, 26-fold.
- **(G2) unit multiplication** $(z, \kappa) \to (u z, u \kappa)$: literally identical ciphertexts, 12-fold.
- **(G3) unobserved letters** of $z$ are free until they occur.

Valid fix: one linear row $z(X_0) = 0$ for any single letter $X_0$, with $\kappa$ left free (it absorbs the shift). Fixing $\kappa$ instead (for example $c = 0$) is invalid because $\kappa$ is a genuine unknown. Unit multiplication cannot be fixed by a linear row such as $z(X_1) = 1$, since the true position may be even, $0$ or $13$; it is removed after enumeration by canonicalising, $\min_u u\,(z - z(A))$, one representative per orbit $\{u z + b\}$ of size $312$.

In a same-alphabet chain cell the additive gauge $(c + d, k + d)$ on the segmented key is a symmetry; in mixed-order cells it is not.
'''

[[blocks]]
kind = "assumptions"
body = '''
- A gauge is a symmetry of the *whole* observable model, including the comparison used in controls. If a score is not gauge-invariant (English quadgrams of a decrypt whose cycle coordinates are rotated are not), the score must be maximised over the gauge, or the comparison must be made modulo the orbit.
- The gauge group depends on the model: with a shift-free key stream taken from another text's letters, translation is no longer a symmetry and only the 12 units remain.
- Route models have their own gauge: when every admitted period divides the text length, the cyclic cut of an affine route is unidentifiable.
'''

[[blocks]]
kind = "attack"
body = '''
- Count effective unknowns: the cycle modulo (G1)/(G2) has $26!/(26 \cdot 12) \approx 2^{80}$ classes; with seven key differences (about 33 bits) the chain has roughly $2^{113}$ effective states, against about 460 bits of English redundancy in 153 letters — identifiability is not the obstacle, search is.
- Deduplicate candidate banks by orbit before scoring (312 descriptions of one alphabet collapse to 1 class) and score once per orbit.
- In controls, compare the recovered cycle on observed letters modulo the orbit, compare the second text modulo its induced coordinate rotation, and report the recovered shift; require exact recovery of the first text and both scalar forwards.
'''

[[blocks]]
kind = "complexity"
body = '''
Orbit size $12 \cdot 26 = 312$ (free action). The translation gauge reduces the shift-vector search of a period-$m$ layer from $26^m$ to $26^{m-1}$. Effective chain states $\approx 2^{113}$ as above.
'''

[[blocks]]
kind = "failure_modes"
title = "The translation-gauge defect"
body = '''
A word-pair solver fixed the gauge $z(C^A_0) = 0$, decrypted text B's prefix in that gauge and, in its controls, demanded the planted prefix exactly. Under $z' = u z + b$ the class decrypt of text A is invariant, but $z(P^{B\prime}) = z(P^B) - u^{-1} b\, e_A$ and $c' = u c + b(1 + e_A e_B - e_B)$: the fixed-gauge decrypt of text B is a coordinate-space Caesar rotation of the physical text, so the true cycle misses "exact prefix" in about 25 of 26 plants and its combined score is depressed. A plant proof showed, for all four sign cells, text A match $1.0$ and text B match $0.0$, with single translations $[19, 5, 10, 16]$ recovering text B uniquely; an independent confirmation found shifts 4 and 18 on another plant. The run was killed, its header-only transcript kept under the failed-runs directory, never used as a gate, and the successor maximises the prefix rate over the 26 translation gauges and compares text B modulo the orbit.

Other defects: fixing $\kappa$ instead of a letter; applying the same-order additive gauge in a mixed-order cell (KAT: symmetry in 8/8 same-order cells, not a symmetry in 8/8 mixed cells); quotienting aliases that are not symmetries (a repeated 24-letter half of a latent stream makes two position maps indistinguishable — an alias to retain, not a gauge to remove).
'''

[[blocks]]
kind = "controls"
body = '''
Static known-answer tests: unit gauge produces identical ciphertexts 48/48 (12 units times 4 sign cells); translation gauge reproduces both ciphertexts with text A unchanged and the predicted key shift 16/16; orbit canonicalisation 312 to 1; in a later successor the exact translation gauge was tested 20/20. Chain plants: a bank member that is a rotation of the true cycle recovers text A exactly and text B up to the predicted shift (rotation $b = 5$ gives shift 5; $b = 9$ with $e_A = -1$ gives shift 17; a unit alias gives exact recovery), and the truth gate is defined accordingly.
'''

[[blocks]]
kind = "example"
title = "Reproducible example"
body = '''
Take $e_A = e_B = +1$, so $\kappa' = \kappa + b$ and $z(P^{B\prime}) = z(P^B) - b$. With $z(P^B) = 3$, $\kappa = 2$, $z(P^A) = 4$: $z(C^B) = 5$ and $z(C^A) = 7$. Translate by $b = 5$: $z'(C^B) = 10$, $z'(C^A) = 12$, $z'(P^A) = 9$, $z(P^{B\prime}) = -2 \equiv 24$ so $z'(P^{B\prime}) = 29 \equiv 3$, and $\kappa' = 7$. Check: $z'(P^{B\prime}) + \kappa' = 3 + 7 = 10 = z'(C^B)$ and $z'(P^A) + z'(P^{B\prime}) = 9 + 3 = 12 = z'(C^A)$. Both ciphertexts and text A are unchanged; text B's letter moved by the coordinate shift $-b$.
'''

[[blocks]]
kind = "notes"
body = '''
Gauge bookkeeping is a validation matter as much as an algebraic one; the invalidation protocol is described under [Gauge-defect invalidation](/validation/gauge-defect-invalidation). See [Group actions on alphabets](/algebra/group-actions-on-alphabets) for orbit counting.
'''

