id = "literature-classical-ciphers"
section = "references"
title = "Classical cipher literature"
subtitle = "Original and standard later sources for the cipher types on this site"
status = "VERIFIED"
status_note = "These works are standard sources for the listed cipher types. This bibliography makes no experimental claim."
family = "Literature"
tags = ["bibliography", "classical ciphers", "history"]
related = ["vigenere", "beaufort", "porta", "quagmire-iii", "alberti-progressive", "chaocipher", "bifid", "trifid", "digrafid", "hill-cipher", "playfair", "gromark", "gronsfeld", "condi", "nihilist", "baconian", "ragbaby", "monome-dinome", "columnar-transposition", "literature-cryptanalysis-statistics"]
summary = "These sources cover Alberti's disc, early polyalphabetic ciphers, nineteenth-century field ciphers and later fractionation, Hill's matrix cipher, American Cryptogram Association types, and Chaocipher. Kahn and Bauer give broad histories. Friedman's Military Cryptanalysis explains the classic attacks. Original works document the constructions themselves."
updated = "2026-09-05"

[[blocks]]
kind = "notes"
body = '''
New readers can start with Kahn for history and basic terms. Friedman's four parts then explain monoalphabetic, periodic, aperiodic, transposition, and fractionation systems in a clear order. Use the ACA descriptions for the exact conventions followed by this site, including keyed alphabets, Quagmire numbering, and Gromark and Condi key streams. The original sources describe each construction. For Chaocipher, use Rubin's account of the mechanism; Byrne's book gives its history but not the algorithm.
'''

