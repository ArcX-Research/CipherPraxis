id = "literature-modern-schemes"
section = "references"
title = "Modern scheme literature"
subtitle = "Sources for textbook RSA, mnemonic word lists, one-time pads, and their attacks"
status = "VERIFIED"
status_note = "These are standard sources for the modern constructions tested as possibilities. This bibliography makes no experimental claim."
family = "Literature"
tags = ["bibliography", "rsa", "mnemonic encoding", "one-time pad"]
related = ["rsa-textbook", "mnemonic-wordlist-encoding", "one-time-pad", "modular-inverse-and-crt", "units-mod-26", "literature-search-and-exact-solvers"]
summary = "A puzzle text might use a modern construction such as textbook RSA on letter blocks, a checksummed mnemonic phrase, or a truly random pad. These sources define those ideas precisely enough to build fair tests. They include the original RSA paper and an attack survey, the BIP-39 checksum and 2,048-word list, Vernam and Shannon on pads, and two standard cryptography handbooks."
updated = "2026-09-04"

[[blocks]]
kind = "notes"
body = '''
When testing a modern scheme against a short, classical-looking text, build controls from the real specification. Planted cases must use its exact word list, checksum, and padding rules. Otherwise, a negative result rules out only an invented version of the scheme. Each entry states which conventions its controls used.
'''

