id = "literature-search-and-exact-solvers"
section = "references"
title = "Search and exact-solver literature"
subtitle = "Sources for heuristic search, dynamic programming, constraint solving, SAT/SMT, and complete search"
status = "VERIFIED"
status_note = "These are standard sources for the heuristic and exact methods used by the site's solvers. This bibliography makes no experimental claim."
family = "Literature"
tags = ["bibliography", "search", "optimisation", "constraint programming"]
related = ["simulated-annealing", "parallel-tempering", "hill-climbing", "beam-search", "viterbi-decoding", "expectation-maximisation", "constraint-satisfaction-forward-checking", "cp-sat-and-smt-solvers", "exact-dynamic-programming", "all-different-enumeration", "exhaustive-enumeration", "literature-methodology"]
summary = "Sources for heuristic search cover simulated annealing, parallel tempering, beam search, and expectation-maximization. Exact-method sources cover Bellman's dynamic programming, Viterbi decoding, forward checking, and all-different propagation. The list also includes the constraint-programming handbook, Google's OR-Tools CP-SAT solver, the Z3 SMT solver, and Knuth's dancing links method for complete enumeration."
updated = "2026-09-04"

[[blocks]]
kind = "notes"
body = '''
On this site, a failed heuristic search rules out nothing. It may simply have missed a candidate. An exact solver can support a narrow negative result only after it finishes every case naturally. The first group of sources covers methods that find candidates. The second covers methods that can produce proof certificates.
'''

