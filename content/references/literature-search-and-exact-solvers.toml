id = "literature-search-and-exact-solvers"
section = "references"
title = "Search and exact-solver literature"
subtitle = "Annealing, tempering, dynamic programming, constraint propagation, SAT/SMT and exhaustive enumeration"
status = "VERIFIED"
status_note = "Bibliographic entry: standard sources for the heuristic search and exact solving methods used by the solvers in this atlas; no experimental claim is made here."
family = "Literature"
tags = ["bibliography", "search", "optimisation", "constraint programming"]
related = ["simulated-annealing", "parallel-tempering", "hill-climbing", "beam-search", "viterbi-decoding", "expectation-maximisation", "constraint-satisfaction-forward-checking", "cp-sat-and-smt-solvers", "exact-dynamic-programming", "all-different-enumeration", "exhaustive-enumeration", "literature-methodology"]
summary = "The heuristic side: simulated annealing (Kirkpatrick, Gelatt and Vecchi), replica exchange or parallel tempering (Swendsen and Wang; Earl and Deem), beam search (Lowerre) and expectation-maximisation (Dempster, Laird and Rubin). The exact side: Bellman's dynamic programming and Viterbi's decoder, forward checking (Haralick and Elliott), all-different propagation (Régin), the constraint-programming handbook, Google's CP-SAT solver in OR-Tools, the Z3 SMT solver, and Knuth's dancing links for exhaustive enumeration."
updated = "2026-09-04"

[[blocks]]
kind = "notes"
body = '''
In this atlas, heuristic search results are never negatives (a failed search excludes nothing), while exact solvers that drain naturally give scoped exact negatives. The literature split above mirrors that rule: the first group produces candidates, the second produces certificates.
'''

