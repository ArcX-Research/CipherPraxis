summary = "These works explain the site's research rules. Feynman argues for reporting facts that could undermine a result. Gelman and Loken, and Simmons, Nelson, and Simonsohn, explain how flexible choices create false positives. Nosek covers preregistration. Peng and Sandve cover reproducible computation. NIST documents known-answer tests. Haber and Stornetta provide the basis for hash-chained records."
updated = "2026-09-04"

[[blocks]]
kind = "notes"
body = '''
Two ideas from this list are load-bearing for the whole atlas. Popper's falsifiability, in its operational form, is the tautological-gate rule: a check that cannot fail is not a check. Preregistration, in its operational form, is the seal: the design, the controls, the nulls, the gates and the terminal vocabulary are frozen and audited by a different agent before the one-shot resource is spent, so that nothing about the decision can be adjusted after the data are seen.
'''

