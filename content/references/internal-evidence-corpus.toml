id = "internal-evidence-corpus"
section = "references"
title = "Reading sources and research evidence"
subtitle = "Literature, derivations, experiments and reproducibility records"
status = "VERIFIED"
status_note = "This page documents the reference’s evidence conventions. It does not assign a common level of support to every cited result."
family = "Provenance"
tags = ["provenance", "sources", "scientific method"]
related = ["reproducibility-receipts", "evidence-scope-ladder", "correction-and-retraction", "literature-methodology"]
summary = "A useful cryptographic reference distinguishes established theory, explicit derivations, implementation checks and empirical recovery results. Public literature and archived records have complementary roles: one identifies the underlying method, while the other records exactly what was tested."
updated = "2026-09-08"

[[blocks]]
kind = "definition"
title = "What each source establishes"
body = '''
- **Literature and specifications** define established constructions and results. Prefer original papers, authors’ descriptions and official specifications.
- **Derivations** justify a statement from explicit assumptions. An independently checked derivation is not automatically a new result in the historical literature.
- **Implementation checks** compare software with independent examples or complete finite references. They establish the tested behavior, not general recovery power.
- **Experiments** measure a specified method on a declared data distribution and budget. A small control panel cannot support a universal success claim.
- **Designs** explain proposed procedures. A reviewed design remains distinct from a completed implementation or experiment.
'''

[[blocks]]
kind = "assumptions"
title = "Optimization and novelty"
body = '''
An optimized procedure must preserve the objective and the required feasible set. A smaller candidate count is not a measured speedup, and a faster incomplete search is not an exact replacement. State whether an optimization is implemented, checked against a reference, or still a derivation.

A technique first encountered in a research project may already be established elsewhere. This reference does not infer scientific priority from local discovery. New specializations are explained in their own mathematical terms and linked to the established methods they use.
'''

[[blocks]]
kind = "notes"
title = "Trace an individual claim"
body = '''
An entry’s status note defines the claim being assessed. Its Sources and evidence panel lists literature first and keeps supporting archival records in an expandable section. A record identifies a source path, its role and, where appropriate, a log reference. Paths are archival locators rather than names for cryptographic concepts.

The archive includes multiple source collections. Unprefixed paths refer to the primary analysis archive; `archive-a/` and `archive-b/` distinguish two additional collections, while `CipherPraxis/` identifies this reference’s own files. The maintainer inventory records their local locations and review scope. Requesting the supporting files preserves these identifiers so a record can be located precisely.

A path-existence check only establishes that a file can be found. A file hash binds the bytes read; it does not prove those bytes executed, authenticate an outcome, or replace an independent mathematical check. Superseded, incomplete and failed records remain useful when their limitations are explicit.
'''

