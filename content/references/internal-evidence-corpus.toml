id = "internal-evidence-corpus"
section = "references"
title = "Internal evidence corpus"
subtitle = "How to read the project paths, record types, and log names cited on this site"
status = "VERIFIED"
status_note = "The counts come from directory listings taken on 2026-09-04. This repository supplies the records cited elsewhere on the site; its directory listing is not an experimental claim."
family = "Provenance"
tags = ["provenance", "corpus", "ledger", "logs"]
related = ["ledger-reservations", "reproducibility-receipts", "run-script-log-convention", "seal-and-audit-protocol", "build-manifests-and-release-json", "state-checkpoints", "literature-methodology"]
summary = "Every `[[provenance]]` item on this site points into one research repository. This page explains its layout. The toolkit directory holds solvers, launchers, compiled cores, designs, audits, JSON manifests, and a shared ledger. The logs directory holds numbered transcripts, failed logs, attempt markers, and saved state. Other folders hold earlier key searches, archived public pages, and the general text corpus used to make controls."
updated = "2026-09-04"

[[blocks]]
kind = "definition"
title = "Layout"
body = '''
```
<repository>/
  ck_*.py                 38 earlier key-search scripts (dictionary keys, squares, column orders scored by quadgrams)
  ck_logs/                their transcripts
  <archive>/              109 archived public-page files: HTML, payload copies, scripts, images, a 2,344,368-letter
                          generic corpus (pure A-Z) and six NumPy arrays used as banks
  withmath/               the inference toolkit (the source of nearly every receipt)
    wm_*.py               469 solver, instrument, parser, build and audit scripts
    run_*.sh              325 launchers (one per lane; frozen no-argument gates for releases)
    *_core.cpp            50 single-file compiled cores with --self-kat
    *.md                  284 notes: 16 designs, 9 creator audits, 33 independent audits, 216 audit notes of all
                          kinds (including creator, independent, boundary, re-audit and design audits), 16 notes,
                          6 reviews, a README, a negative-results ledger and the coordination ledger
    *.json                13 build manifests, release records and vocabulary banks
    COORDINATION.md       the coordination ledger: 240 headed entries, 13,552 lines, 1.2 MB
    LOG_AUDIT.md          the negative-results ledger (200 logs classified at its snapshot)
    logs/                 1,334 entries: 1,284 numbered transcripts, state_*.json checkpoints, NumPy banks
      failed/             21 invalidated transcripts with defect suffixes
      *.attempt           9 durable one-shot attempt markers
```
'''

[[blocks]]
kind = "variants"
title = "Note types"
body = '''
- **Design** (`*_DESIGN.md`): predeclared family, algebra, controls, nulls, gates, terminals, resources and reserved paths; no implementation.
- **Creator audit / seal** (`*_CREATOR_AUDIT.md`, `*_AUDIT.md`): the implementer's frozen hashes, static KAT and disclosed evidence, residuals, release boundary.
- **Independent audit** (`*_INDEPENDENT_AUDIT*.md`): a different agent's exact-byte verdict, PASS or BLOCK, with recomputed hashes.
- **Review** (`*_REVIEW.md`): static assessment of an idea or a proposed successor without execution.
- **Note** (`*_NOTE.md`): a measurement or a closed question with its transcript.
- **Ledger** (`COORDINATION.md`, `LOG_AUDIT.md`): append-only reservations, seals, verdicts, terminals, corrections; the classification of every log.
- **Manifest / release** (`*.json`): one-line canonical records pinning bytes and authorisations.
- **Transcript** (`logs/NNN_*.log`): the machine record of a run; non-evidence variants are named `_smoke`, `_dev`, `_disclosed`; invalidated ones live under `failed/` with a defect suffix.
- **Attempt marker** (`logs/NNN_*.log.attempt`): proof that a one-shot resource was consumed.
- **State checkpoint** (`logs/state_*.json`): carried scan state with a control-pass flag.
'''

[[blocks]]
kind = "notes"
title = "How to read a provenance path"
body = '''
A `[[provenance]]` entry gives a repository-relative path, a kind (solver, library, audit, design, note, log, script, data, ledger) and, for ledger and log references, a `ref` such as `LOG503` or `logs/152_crosscycle_full.log`. A ledger reference means the number quoted is in the headed entry for that log number; a log reference means it is in that transcript. File names in the corpus contain internal identifiers; the public text of this atlas does not repeat them, and it refers to the texts only by length.
'''

