id = "literature-cryptanalysis-statistics"
section = "references"
title = "Cryptanalysis and statistics literature"
subtitle = "Coincidence, evidence, nulls, multiplicity and power"
status = "VERIFIED"
status_note = "Bibliographic entry: standard sources for the statistical instruments and the validation vocabulary; no experimental claim is made here."
family = "Literature"
tags = ["bibliography", "statistics", "cryptanalysis"]
related = ["index-of-coincidence", "kasiski-examination", "chi-squared-fit", "quadgram-log-likelihood", "bayesian-evidence-model-selection", "mahalanobis-family-distance", "family-wise-null", "permutation-test", "power-analysis", "selection-overfit-check", "literature-classical-ciphers"]
summary = "Friedman's index of coincidence and Kullback's statistical methods founded quantitative cryptanalysis; Shannon supplied the information-theoretic frame (unicity distance, redundancy). The evidence-based instruments in this atlas draw on Jaynes, MacKay and Kass and Raftery for marginal likelihood and model comparison, on Fisher and on Westfall and Young for permutation and family-wise nulls, on Mahalanobis for family distance, and on Cohen for the notion that a negative without power is not a result."
updated = "2026-09-04"

[[blocks]]
kind = "notes"
body = '''
The validation practices in this atlas (matched nulls that repeat the full selection, family-wise maxima, power measured on plants) are applications of standard resampling and multiple-testing theory to a setting where the "hypotheses" are keys, placements and cipher families. Readers who want the theory behind a specific instrument should pair the instrument's page with the entry here it names.
'''

