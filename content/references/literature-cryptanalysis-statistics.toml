id = "literature-cryptanalysis-statistics"
section = "references"
title = "Cryptanalysis and statistics literature"
subtitle = "Sources for coincidence tests, Bayesian evidence, nulls, repeated testing, and power"
status = "VERIFIED"
status_note = "These are standard sources for the statistical tests and validation terms used here. This bibliography makes no experimental claim."
family = "Literature"
tags = ["bibliography", "statistics", "cryptanalysis"]
related = ["index-of-coincidence", "kasiski-examination", "chi-squared-fit", "quadgram-log-likelihood", "bayesian-evidence-model-selection", "mahalanobis-family-distance", "family-wise-null", "permutation-test", "power-analysis", "selection-overfit-check", "literature-classical-ciphers"]
summary = "Friedman introduced the index of coincidence, Kullback developed statistical cryptanalysis, and Shannon analyzed secrecy, redundancy, and unicity distance. Jaynes, MacKay, Kass, and Raftery discuss Bayesian inference and model comparison, including the prior sensitivity of marginal likelihoods. Fisher and later resampling texts cover randomization or permutation tests; Westfall and Young cover multiplicity adjustment. Mahalanobis introduced the eponymous distance, while Cohen discusses statistical power."
updated = "2026-09-07"

[[blocks]]
kind = "notes"
body = '''
This site adapts resampling and multiple-testing methods to keys, placements, and cipher families. A valid randomization test still requires a null hypothesis under which the chosen transformations are exchangeable. A matched null must repeat all data-dependent selection being calibrated; a maximum-statistic test addresses the specified family; planted cases estimate power only for their generating distribution and recovery criterion.
'''

