id = "bifid-lab"
section = "labs"
title = "Bifid lab"
subtitle = "Write Polybius coordinates in blocks, rearrange them, and pair them into letters"
status = "VERIFIED"
status_note = "The lab matches Delastelle's published example: FLEEATONCE → UAEOLWRINS with square BGWKZQPNDSIOAXEFCLUMTHYVR. Periodic round trips also pass."
family = "Fractionation labs"
tags = ["bifid", "fractionation", "polybius"]
related = ["bifid", "trifid", "polybius-square", "family-identification"]
summary = "Bifid finds each letter's row and column in a 5×5 square. Within each block, it writes all row numbers, then all column numbers, and pairs the digits into new letters. One ciphertext letter can contain parts of two plaintext letters up to a period apart. This flattens single-letter patterns, so attacks usually find the period first."
updated = "2026-09-04"
lab = "bifid"

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Set the period to 0 (one block for the whole text) and to 1: with period 1 every letter maps to itself through its own coordinates, so the cipher degenerates.
- Change one plaintext letter and watch which two ciphertext letters change: that is the fractionation footprint an attack exploits.
- Compare the letter histogram of the ciphertext in the [coincidence lab](/labs/coincidence-lab) with the plaintext's: the index of coincidence drops toward the uniform value.
'''
