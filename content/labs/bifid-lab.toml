summary = "Bifid finds each letter's row and column in a 5×5 square. Within each block, it writes all row numbers, then all column numbers, and pairs the digits into new letters. One ciphertext letter can contain coordinates from two plaintext letters within the same block. Fractionation often weakens single-letter frequency signals, but its effect and the usefulness of period recovery depend on the text, square, and block length."
updated = "2026-09-07"
lab = "bifid"

[[blocks]]
kind = "pseudocode"
body = '''
```text
// 5 x 5 square: the keyed alphabet of the keyword with J merged into I; cell
// q = 0..24 has coordinates (row, col) = (q div 5 + 1, q mod 5 + 1). ROW(x),
// COL(x) look a letter up; LETTER(row, col) reads the square.
function ENCRYPT(p, square, period):
    t = LETTERS_ONLY(p) with J replaced by I
    // one block for the whole text
    if period == 0: period = length(t)
    for each block of up to period letters in t:
        rows = [ROW(x) for x in block]
        cols = [COL(x) for x in block]
        // all row digits, then all column digits
        seq = rows followed by cols
        for each consecutive pair (seq[2i], seq[2i+1]):
            append LETTER(seq[2i], seq[2i+1]) to the ciphertext
    return ciphertext

function DECRYPT(c, square, period):
    t = LETTERS_ONLY(c) with J replaced by I
    if period == 0: period = length(t)
    for each block of up to period letters in t:
        L = length(block)
        seq = ROW(x), COL(x) for each x in block, in order   // 2L digits
        for i in 0..L-1:
            append LETTER(seq[i], seq[L + i]) to the plaintext
    return plaintext
```
'''

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Set the period to 0 to use one block for all the text. Then set it to 1. At period 1, each letter keeps its own coordinates, so the cipher makes no useful change.
- Change one plaintext letter and inspect which ciphertext letters change. Within a block, its two coordinates can feed different output letters; boundary cases may place both in one output letter.
- Compare the ciphertext and plaintext letter counts in the [coincidence lab](/labs/coincidence-lab). Bifid often moves the index of coincidence toward the uniform reference on natural-language examples, but this is an empirical tendency rather than an invariant.
'''
