summary = "The Quagmire family keeps the coset structure of the Vigenère cipher but replaces the straight alphabet on the plaintext side, the ciphertext side, or both with keyword-mixed alphabets. This lab builds the alphabets from keywords, aligns the key letters under an indicator, and displays the tableau row that each coset actually uses."
updated = "2026-09-04"
lab = "quagmire"

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Empty both keywords: every type collapses to Vigenère and the top row of the tableau becomes the straight alphabet.
- Compare **type I** and **type II** with the same keyword: the coset shifts differ because the key letters are looked up in different alphabets.
- In **type III** set the key to a single letter equal to the indicator: the shift is zero and the cipher is the identity, which is the alignment convention made visible.
- In **type IV** change only the ciphertext keyword and watch the rows permute while the plaintext header stays fixed.
'''
