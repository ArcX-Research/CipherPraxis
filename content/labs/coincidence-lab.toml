[[blocks]]
kind = "pseudocode"
body = '''
```text
function COINCIDENCE_LAB(text, m_max, t_max, len_min, len_max):
    c = LETTERS_ONLY(text); n = length(c)
    require n >= 4, 2 <= m_max <= n / 2, and 1 <= t_max < n
    ic_whole = IC(c)
    sd_english = IC_SD(ENGLISH, n)
    for m in 1..m_max:
        scan[m] = mean over b in 0..m-1 of IC([c[i] for i in 0..n-1 if i mod
                m == b])
    best_period = argmax over m in 2..m_max of scan[m]
    for t in 1..t_max:
        gap[t] = #{ i in 0..n-t-1 : c[i] == c[i+t] } / (n - t)
    repeats = []
    for len in len_max down to len_min:
        for every group g of len letters occurring at positions pos[1..r]
                with r >= 2:
            if g is not part of an already listed longer repeat at the same
                    positions:
                repeats += (g, pos, distances pos[i+1] - pos[i])
    for q in 2..m_max:
        votes[q] = #{ distance d over all repeats : d mod q == 0 }
    return ic_whole, sd_english, scan, best_period, gap, repeats, votes
```
'''

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Paste natural-language text and compare its whole-text IC with the displayed language model. Finite samples need not sit close to the reference, and a period scan can have chance peaks without a repeating key.
- Encrypt text with a seven-letter key in the [Vigenère lab](/labs/vigenere-lab), then paste the result here. Periods 7 and some multiples may stand out; whether they do depends on length and plaintext statistics.
- Paste letters sampled uniformly and independently. The expected IC is $1/26 \approx 0.03846$, but a finite sample can show apparent peaks.
- Treat the displayed standard deviation as model-conditional. It quantifies sampling variation under the named letter model; it is not a universal cutoff or a family-wise significance correction.
'''
