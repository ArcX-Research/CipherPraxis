kind = "notes"
title = "What to try"
body = '''
- Paste plain English. Its whole-text IC should be near the English reference, while the period scan stays flat because there is no repeating key.
- Encrypt text with a seven-letter key in the [Vigenère lab](/labs/vigenere-lab), then paste the result here. Periods 7 and 14 should stand out.
- Paste random letters. The IC should move toward the uniform reference, 0.0385, and the tests should find no clear pattern.
- Check the standard deviation beside the English reference. At 150 letters, an IC difference of 0.005 is within one standard deviation.
'''
