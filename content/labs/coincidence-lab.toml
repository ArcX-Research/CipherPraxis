[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Paste plain English: the whole-text IC sits near the English reference and the periodic scan is flat, because there is no period to find.
- Paste the ciphertext from the [Vigenère lab](/labs/vigenere-lab) encrypted with a seven-letter key: period 7 (and 14) light up.
- Paste random letters: the IC falls to the uniform reference 0.0385 and no instrument shows structure.
- Note the exact standard deviation printed next to the English reference: at 150 letters a difference of 0.005 in IC is within one standard deviation.
'''
