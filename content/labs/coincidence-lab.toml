[[blocks]]
kind = "pseudocode"
body = '''
```text
// Letters only, indices 0..25. IC and IC_SD are as in the
// index-of-coincidence entry.
function COINCIDENCE_LAB(text, m_max, t_max, len_min, len_max):
    c = LETTERS_ONLY(text); n = length(c)
    // read against the English and uniform references
    ic_whole = IC(c)
    // exact standard deviation at this length
    sd_english = IC_SD(ENGLISH, n)

    // Periodic scan: the mean coset IC for each trial period.
    for m in 1..m_max:
        scan[m] = mean over b in 0..m-1 of IC([c[i] for i in 0..n-1 if i mod
                m == b])
    best_period = argmax over m in 2..m_max of scan[m]

    // Gap profile: the share of positions i with c[i] == c[i+t].
    for t in 1..t_max:
        gap[t] = #{ i in 0..n-t-1 : c[i] == c[i+t] } / (n - t)

    // Kasiski: repeated groups and the distances between their occurrences.
    repeats = []
    for len in len_max down to len_min:
        for every group g of len letters occurring at positions pos[1..r]
                with r >= 2:
            if g is not part of an already listed longer repeat at the same
                    positions:
                repeats += (g, pos, distances pos[i+1] - pos[i])
    for q in 2..m_max:
        votes[q] = #{ distance d over all repeats : d mod q == 0 }

    return ic_whole, sd_english, scan, best_period, gap, repeats, votes
```
'''

