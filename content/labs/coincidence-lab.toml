summary = "This lab puts three classic period diagnostics together. Whole-text index of coincidence summarizes letter concentration. A periodic scan can highlight lengths whose cosets have concentrated counts, while lag matches and Kasiski repeats can highlight recurring spacings. Peaks are heuristic candidates: multiples, divisors, chance repeats, and short samples can all mislead."
updated = "2026-09-07"
