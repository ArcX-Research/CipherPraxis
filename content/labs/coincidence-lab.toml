summary = "This lab puts three classic period tests together. Whole-text index of coincidence shows whether letter counts look language-like or flat. The periodic scan finds a key length whose cosets look monoalphabetic. The gap profile and Kasiski table look for the same period in matching letters and repeated fragments."
