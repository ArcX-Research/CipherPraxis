title = "Columnar transposition lab"
subtitle = "Arrange columns by a keyword and compare padded and unpadded grids"
status = "VERIFIED"
status_note = "The lab matches the standard unpadded example: keyword ZEBRAS turns WE ARE DISCOVERED FLEE AT ONCE into EVLNACDTESEAROFODEECWIREE. Padded round trips also pass."
family = "Transposition labs"
tags = ["transposition", "columnar", "grid"]
related = ["columnar-transposition", "transposition-width-recovery", "order-free-width-statistic", "myszkowski"]
summary = "A columnar transposition writes text in rows beneath a keyword, then reads columns in the keyword's alphabetical order. If the last row is not padded, the leftmost columns are one letter longer. Decryption must rebuild those lengths from the total text length. This lab shows the grid, readout order, and both padded and unpadded results."
updated = "2026-09-04"
lab = "columnar"

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Toggle padding: the ciphertext changes only by the padding letters, but the column lengths become uniform and the decryption ambiguity disappears.
- Use a keyword with repeated letters (`BANANA`): ties are broken left to right, and the small ranks under the keyword show the resulting order.
- Make the text length a multiple of the keyword length: the irregular and regular ciphertexts coincide.
'''
