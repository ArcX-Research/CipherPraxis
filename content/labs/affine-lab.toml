id = "affine-lab"
section = "labs"
title = "Affine cipher & units lab"
subtitle = "Try c = a·p + b (mod 26) and see which multipliers have inverses"
status = "VERIFIED"
status_note = "The lab matches the standard AFFINECIPHER → IHHWVCSWFRCP example for a = 5 and b = 8. It explains and rejects multipliers that have no inverse."
family = "Algebra labs"
tags = ["affine", "modular arithmetic", "unit group"]
related = ["affine-cipher", "caesar-shift", "units-mod-26", "modular-inverse-and-crt", "crt-lab"]
summary = "An affine substitution multiplies each letter number by a, then adds b modulo 26. Decryption needs an inverse for a. Only the twelve values that share no factor with 26 have one. This lab lists those values and their inverses and shows why the other choices cannot decrypt."
updated = "2026-09-04"
lab = "affine"

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Set a = 1 to obtain a Caesar shift by b.
- Set a = 25: since 25 ≡ −1, the cipher is a reflection of the alphabet followed by a shift (a = 25, b = 25 is Atbash).
- Set a = 13 or any even value to see the invertibility error: two plaintext letters would collide on the same ciphertext letter.
'''
