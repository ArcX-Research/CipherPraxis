id = "affine-lab"
section = "labs"
title = "Affine cipher & units lab"
subtitle = "Try c = a·p + b (mod 26) and see which multipliers have inverses"
status = "VERIFIED"
status_note = "The lab matches the standard AFFINECIPHER → IHHWVCSWFRCP example for a = 5 and b = 8. It explains and rejects multipliers that have no inverse."
family = "Algebra labs"
tags = ["affine", "modular arithmetic", "unit group"]
related = ["affine-cipher", "caesar-shift", "units-mod-26", "modular-inverse-and-crt", "crt-lab"]
summary = "An affine substitution multiplies each letter number by a, then adds b modulo 26. Decryption needs an inverse for a. Only the twelve values that share no factor with 26 have one. This lab lists those values and their inverses and shows why the other choices cannot decrypt."
updated = "2026-09-04"
lab = "affine"

[[blocks]]
kind = "pseudocode"
body = '''
```text
// Letters are indices 0..25 (A = 0). The key is (a, b) with 0 <= a, b <= 25.
function IS_UNIT(a):
    // true for exactly twelve values of a
    return gcd(a, 26) == 1

function ENCRYPT(p[0..n-1], a, b):
    if not IS_UNIT(a): report "a has no inverse modulo 26" and stop
    for i in 0..n-1: c[i] = (a * p[i] + b) mod 26
    return c

function DECRYPT(c[0..n-1], a, b):
    // extended Euclid; exists only when gcd(a, 26) = 1
    a_inv = MOD_INVERSE(a, 26)
    for i in 0..n-1: p[i] = (a_inv * (c[i] - b)) mod 26
    return p

// Unit table shown by the lab: every multiplier that has an inverse, with
// that inverse.
function UNITS():
    return [(a, MOD_INVERSE(a, 26)) for a in 1..25 if gcd(a, 26) == 1]
```
'''

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Set a = 1. The result is a Caesar shift by b.
- Set a = 25. Because 25 ≡ −1, this reverses the alphabet and then shifts it. With a = 25 and b = 25, you get Atbash.
- Set a = 13 or any even number. The lab reports that the key has no inverse because two plaintext letters map to the same ciphertext letter.
'''
