title = "Hill cipher lab"
subtitle = "Try 2×2 and 3×3 letter-block matrices and see whether they can be reversed"
status = "VERIFIED"
status_note = "The lab matches HELP → HIAT with key (3 3 / 2 5) and ACT → POH with the 3×3 key from Hill's 1929 example. It also detects matrices that have no inverse."
family = "Algebra labs"
tags = ["hill", "polygraphic", "linear algebra", "matrix"]
related = ["hill-cipher", "matrix-invertibility-mod-26", "finite-field-linear-algebra", "affine-lab"]
summary = "The Hill cipher turns each n-letter block into numbers and multiplies them by an n×n key matrix modulo 26. The key works only when its determinant has an inverse modulo 26. With n² known plaintext letters, linear equations can recover it. This lab calculates the determinant and inverse, then encrypts and decrypts."
updated = "2026-09-04"
lab = "hill"

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Enter the key `2 4 1 2`: the determinant is 0, so no inverse exists and decryption is impossible even though encryption still runs.
- Enter `1 1 0 1`: an upper-triangular key with determinant 1; the second letter of each block is unchanged, which a known-plaintext attack spots immediately.
- Switch to 3×3 and note that the inverse is still computed from cofactors; for larger n a solver would use elimination over Z26 with unit pivots.
'''
