[[blocks]]
kind = "pseudocode"
body = '''
```text
// Letters use indices 0..25 (A = 0).
function ENCIPHER_LETTER(p, k, rule):
    if rule == Vigenère:         return (p + k) mod 26
    if rule == Beaufort:         return (k - p) mod 26
    if rule == VariantBeaufort:  return (p - k) mod 26
    if rule == Porta:
        r = k div 2
        if p < 13: return 13 + (p + r) mod 13
        else:      return (p - 13 - r) mod 13
function DECIPHER_LETTER(c, k, rule):
    if rule == Vigenère:         return (c - k) mod 26
    if rule == Beaufort:         return (k - c) mod 26
    if rule == VariantBeaufort:  return (c + k) mod 26
    if rule == Porta:            return ENCIPHER_LETTER(c, k, Porta)
function ENCRYPT(p[0..n-1], k[0..m-1], rule):
    for i in 0..n-1: c[i] = ENCIPHER_LETTER(p[i], k[i mod m], rule)
    return c
// Vigenère-only heuristic key suggestion under the ENGLISH model.
function COSET_PANEL(c[0..n-1], m):
    for b in 0..m-1:
        coset = [c[i] for i in 0..n-1 if i mod m == b]
        show HISTOGRAM(coset) and IC(coset)
        s[b] = argmin over t in 0..25 of CHI2(HISTOGRAM(coset) rotated back
                by t, ENGLISH)
    return the key letters A + s[b]
```
'''

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Shorten the plaintext until blind recovery gets a key letter wrong. This is the "short coset" failure mode. The letter counts for that coset show why it failed.
- Switch to **Beaufort** and encrypt the ciphertext again with the same key. Beaufort is reciprocal, so this returns the plaintext.
- Use a key with repeated letters, such as `PAPAYA`. Cosets 0, 2, and 4 use the same shift, but their finite-sample counts need not be equal because they contain different plaintext positions.
- Switch to **Porta**. Each key letter selects one of 13 reciprocal half-alphabet tables, so the letter counts are no longer simple rotations of English.
'''
