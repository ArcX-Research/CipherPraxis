summary = "A periodic additive cipher splits its ciphertext into cosets, one per key letter, and each coset is a Caesar shift of the plaintext letters at those positions. This lab encrypts a text of your choice, shows every coset's letter histogram with its index of coincidence, and recovers the key blind by χ² fitting whenever the cosets carry enough language."
