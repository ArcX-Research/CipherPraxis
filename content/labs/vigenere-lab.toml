summary = "Vigenère, Beaufort, and Variant Beaufort split text into one coset per repeated key position and apply related modular substitutions; Porta instead selects one of 13 reciprocal half-alphabet tables. The lab shows each coset's counts and index of coincidence. Its χ² Vigenère key suggestion is a model-dependent heuristic, especially unreliable for short or nonrepresentative cosets."
