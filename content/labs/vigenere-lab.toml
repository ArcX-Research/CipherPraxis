[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Shorten the plaintext until the blind recovery returns a wrong key letter: that is the "short coset" failure mode, and the histogram of the failing coset shows why.
- Switch to **Beaufort** and encrypt the ciphertext again with the same key: the cipher is reciprocal, so the plaintext comes back.
- Use a key with repeated letters (for example `PAPAYA`): cosets 0, 2 and 4 share one shift, and their histograms line up.
- Under **Porta** the key letter selects one of thirteen reciprocal half-alphabet tables, so histograms are no longer plain rotations of English.
'''
