summary = "The Chinese remainder theorem rebuilds a number from its remainders under several moduli. The general form can handle shared factors and report when the equations disagree. The extended Euclidean algorithm also finds modular inverses. Cipher solvers use both when they recover key information modulo small factors and need to join it into one value."
updated = "2026-09-04"
