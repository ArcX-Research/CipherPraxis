title = "Chinese remainder & inverse lab"
subtitle = "Solve simultaneous congruences, including non-coprime moduli, and compute modular inverses"
status = "VERIFIED"
status_note = "Unit-tested: x ≡ 2 (3), 3 (5), 2 (7) → 23 (mod 105); the non-coprime system 1 (4), 3 (6) → 9 (mod 12); inconsistent systems are reported."
