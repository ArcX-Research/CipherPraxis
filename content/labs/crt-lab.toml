title = "Chinese remainder & inverse lab"
subtitle = "Solve several modular equations together and find modular inverses"
status = "VERIFIED"
status_note = "Tests give x ≡ 23 (mod 105) from x ≡ 2 (3), 3 (5), and 2 (7). The shared-factor system 1 (4), 3 (6) gives 9 (mod 12). The lab also reports systems with no solution."
family = "Algebra labs"
tags = ["crt", "number theory", "modular inverse"]
related = ["modular-inverse-and-crt", "lcm-of-periods", "units-mod-26", "affine-lab"]
summary = "The Chinese remainder theorem rebuilds a number from its remainders under several moduli. The general form can handle shared factors and report when the equations disagree. The extended Euclidean algorithm also finds modular inverses. Cipher solvers use both when they recover key information modulo small factors and need to join it into one value."
updated = "2026-09-04"
lab = "crt"

[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Enter `1 mod 4, 2 mod 6`: the moduli share the factor 2 and the residues disagree modulo 2, so the system is inconsistent.
- Enter `5 mod 7, 5 mod 9`: the answer is 5 modulo 63, the least common multiple.
- Ask for the inverse of 7 modulo 26 (15) and of 13 modulo 26 (none): the unit group of Z26 is the set of valid affine multipliers.
'''
