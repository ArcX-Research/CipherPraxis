related = ["modular-inverse-and-crt", "lcm-of-periods", "units-mod-26", "affine-lab"]
summary = "The Chinese remainder theorem reassembles an integer from its residues modulo several moduli; the general form handles shared factors and detects inconsistency. The same extended Euclidean algorithm gives modular inverses. Both operations appear whenever key information is recovered modulo small factors and must be lifted to a full residue."
updated = "2026-09-04"
