[[blocks]]
kind = "notes"
title = "What to try"
body = '''
- Two rotations commute: a ∘ b and b ∘ a agree. A rotation and a reflection do not.
- Every reflection has order 2; a rotation by k has order n / gcd(n, k). Set n = 48 and k = 12 to obtain an element of order 4.
- The cycle notation of a reflection shows its fixed points: for even n either two positions or none stay put.
'''
