tags = ["dihedral", "group theory", "permutation", "cycles"]
related = ["dihedral-group", "permutation-cycles", "group-actions-on-alphabets", "conjugacy-and-gauge"]
summary = "The dihedral group D_n contains the n rotations and n reflections of a ring of n positions. Its elements act on text positions as permutations, so a cipher that reads a text around a circle or in reverse lives inside D_n. The lab composes two elements in either order and shows the cycle structure of the result."
