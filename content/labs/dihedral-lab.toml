title = "Dihedral group lab"
subtitle = "Compose rotations and reflections of a ring of positions and read off the resulting permutation"
status = "VERIFIED"
status_note = "The group law is unit-tested by comparing composition in affine form (x ↦ ±x + k) with composition of the induced permutations for every pair of elements of D₈."
