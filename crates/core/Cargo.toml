[package]
name = "praxis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Content model, search index, Markdown+MathML renderer and cipher/statistics core for Cipher Praxis"

[features]
default = []
# Enables TOML loading and the `praxis-check` content linter (native only).
authoring = ["dep:toml"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
pulldown-latex.workspace = true
toml = { workspace = true, optional = true }

[[bin]]
name = "praxis-check"
path = "src/bin/check.rs"
required-features = ["authoring"]
