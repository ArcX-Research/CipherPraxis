[workspace]
resolver = "2"
members = ["crates/core", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Dilate Technologies"]
description = "Cipher Praxis — A Dilate Cryptography Knowledge Base"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
toml = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.praxis-core]
opt-level = 3
