# AWS Amplify Hosting custom headers. Bundle assets carry a content hash in their URLs, so they
# can be cached for a year; the HTML shell must always be revalidated.
customHeaders:
  - pattern: '/pkg/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
