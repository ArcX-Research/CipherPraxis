# AWS Amplify Hosting custom headers. Every file in /pkg has a content-hashed filename
# (WASM, matching JS loader, CSS). Only these immutable assets can be cached for a year.
# The HTML shell, including SPA rewrites to index.html, must always be revalidated.
customHeaders:
  - pattern: '/pkg/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
